定的，公共数据主管部门、提供公共数据的公共管理和服务机构应当按照各自职责，依法或者按照约定采取限制或者关闭其数据获取权限等措施并可以在公共数据平台公示。"},{"t":"h","x":"第六章 公共数据安全"},{"t":"a","x":"第四十一条 有关主管部门、公共数据运行管理机构、公共管理和服务机构开展公共数据处理活动应当依法建立健全全流程数据安全管理制度，落实公共数据安全保护责任，保障数据安全。"},{"t":"a","x":"第四十二条 公共数据依法实行分类分级保护。公共数据主管部门会同有关主管部门结合数据安全、个人信息保护和数据应用需求等因素，根据国家分类分级保护制度要求，推动制定本省公共数据分类分级具体规则。\n公共管理和服务机构按照分类分级规则，结合本行业、本区域特点，制定公共数据分类分级实施细则，确定相应的监管防护措施。制定公共数据分类分级具体规则、实施细则应当综合考虑数据汇聚、关联分析等因素，并征求公共数据专家委员会意见。"},{"t":"a","x":"第四十三条 各地区、各部门对本地区、本部门工作中收集和产生的公共数据以及数据安全负责。\n有关主管部门承担本行业、本领域公共数据安全监管职责。\n公安机关、国家安全机关等依法在各自职责范围内承担公共数据安全监管职责。"},{"t":"a","x":"第四十四条 网信部门会同有关主管部门按照国家有关规定建立健全公共数据安全风险评估、报告、信息共享、监测预警机制。\n公共管理和服务机构应当落实与数据安全防护级别相适应的监测预警措施，发现数据安全缺陷、漏洞等风险时应当立即采取补救、预防措施。"},{"t":"a","x":"第四十五条 网信部门会同有关主管部门建立公共数据管理安全应急处置机制，指导公共管理和服务机构制定安全处置应急预案，定期组织应急演练，保障公共数据管理工作安全有序。\n发生数据安全事件，公共管理和服务机构应当立即采取处置措施，按照规定及时告知用户并向有关主管部门报告。有关主管部门应当立即启动应急预案，采取相应的应急处置措施，消除安全隐患，防止危害扩大，并及时向社会发布与公众有关的警示信息。"},{"t":"a","x":"第四十六条 公共管理和服务机构应当监督受委托提供相关信息系统建设、维护和公共数据存储、加工等服务的主体履行相应的数据安全义务。受委托提供服务的主体应当依照法律、法规规定和安全保密协议等合同约定履行数据安全义务，不得擅自留存、使用、泄露或者向他人提供相关公共数据。\n公共管理和服务机构应当建立完善受委托提供服务的主体全流程数据安全监管机制，有效预防、发现、处置各类数据安全风险隐患，确保数据安全事件可追查、可追溯。"},{"t":"a","x":"第四十七条 公共数据利用主体应当依法完善数据安全保护制度，履行法律、法规规定和公共数据利用协议约定的数据安全保护义务，及时向提供公共数据的公共管理和服务机构报告利用过程中发现的各类数据安全问题。"},{"t":"h","x":"第七章 保障和监督"},{"t":"a","x":"第四十八条 公共数据提供按照谁主管谁负责、谁提供谁负责的原则，公共数据利用按照谁使用谁负责、谁管理谁负责的原则，实施公共数据全流程管理。公共数据主管部门统筹监管公共数据管理工作，公共数据运行管理机构负责具体实施公共数据管理工作。"},{"t":"a","x":"第四十九条 有关主管部门应当将公共数据管理相关项目纳入政府投资计划，按照公共数据资源目录核定公共数据建设和管理相关费用，将公共数据建设和管理相关经费纳入部门财政预算，并优先安排。"},{"t":"a","x":"第五十条 公共管理和服务机构申报使用财政性资金建设的信息化项目以及包含信息化建设内容的项目时，应当附具相关公共数据资源目录。公共管理和服务机构向公共数据主管部门完整、及时、规范提供公共数据资源目录，向公共数据平台汇聚公共数据，是确定项目建设投资、运行维护经费和验收的重要依据。"},{"t":"a","x":"第五十一条 公共数据主管部门应当建立健全公共数据资产登记管理制度和动态管理机制，汇总登记本级公共数据资产。\n公共管理和服务机构负责登记本机构公共数据资产，接受本级公共数据主管部门和国有资产监管等有关部门的指导。"},{"t":"a","x":"第五十二条 发生重大自然灾害事件、公共卫生事件等突发事件，造成或者可能造成严重社会危害，直接影响公民、法人和其他组织切身利益的，公共数据主管部门应当会同公共管理和服务机构根据需要，依法及时、准确共享开放相关公共数据，并动态更新。法律、法规另有规定的，从其规定。"},{"t":"a","x":"第五十三条 公共数据主管部门应当加强公共数据管理人才引进和培训，制定激励和培训计划，推动与教育和科研机构建立公共数据管理人才联合培养机制。"},{"t":"a","x":"第五十四条 县级以上地方人民政府应当将公共数据管理工作纳入绩效管理内容。组织开展考核评议工作可以委托第三方对公共数据共享开放的程度和效果进行评估，评估结果向社会公布。\n对在公共数据管理工作中做出突出贡献的单位和个人，按照有关规定给予表彰和奖励。"},{"t":"a","x":"第五十五条 公共数据主管部门应当实施公共数据日常监管，与有关主管部门双向推送、共享公共数据监管信息，综合开展互联网监管和信用监管，对公共数据共享开放、开发利用等过程中的失信行为依法实施失信约束。\n公共数据主管部门指导公共管理和服务机构建立公共数据管理各环节透明化、可审计、可追溯管理和风险研判机制。"},{"t":"a","x":"第五十六条 公共数据利用主体认为公共数据存在错误、遗漏等情形的，可以通过公共数据平台向提供公共数据的公共管理和服务机构反映；提供公共数据的公共管理和服务机构应当标注、核实，会同公共数据运行管理机构在各自职责范围内及时处理、反馈，通报相关机构。具体办法由省公共数据主管部门制定。"},{"t":"a","x":"第五十七条 任何单位和个人有权向提供公共数据的公共管理和服务机构以及有关主管部门举报违法利用公共数据行为，提供公共数据的公共管理和服务机构、有关主管部门应当依法及时处理，有关法律、法规、规章没有规定期限的，应当在10个工作日内处理。"},{"t":"a","x":"第五十八条 公共数据共享开放、开发利用等过程中产生争议的，可以提请公共数据主管部门协调解决。公共数据主管部门可以将有关争议问题交由公共数据专家委员会提出专业建议。"},{"t":"h","x":"第八章 法律责任"},{"t":"a","x":"第五十九条 对违反本办法规定的行为，《中华人民共和国数据安全法》等法律、法规已经规定法律责任的，适用其规定。"},{"t":"a","x":"第六十条 公共管理和服务机构及其工作人员违反本办法规定，有下列行为之一的，由公共数据主管部门或者公共管理和服务机构的上级主管部门责令限期改正；情节严重的，由有权机关对直接负责的主管人员和其他直接责任人员依法给予处分：\n（一）未按照规定做好本机构公共数据的收集获取、目录编制、共享开放、更新维护和安全保障等工作；\n（二）逾期未审核和办理公共数据共享、开放申请或者未按照规定完成数据汇聚、共享、开放；\n（三）无法定事由拒不提供符合质量标准的公共数据或者对提供的不符合数据质量标准的公共数据拒不进行整改、核实、更正；\n（四）未依法履行公共数据安全管理相关职责；\n（五）违反本办法规定的其他行为。"},{"t":"a","x":"第六十一条 公共数据利用主体违反本办法规定，有下列行为之一的，依法承担相应的法律责任：\n（一）利用公共数据获取非法利益；\n（二）滥用相关权益，或者损害国家利益、社会公共利益或者他人合法权益；\n（三）违反法律、法规规定或者公共数据利用协议约定使用公共数据；\n（四）违反法律、法规规定或者公共数据利用协议约定，未采取安全保障措施；\n（五）应当承担法律责任的其他行为。"},{"t":"a","x":"第六十二条 公共数据主管部门、公共数据运行管理机构、公共管理和服务机构及其工作人员泄露、出售或者非法向他人提供履行职责过程中知悉的隐私、个人信息、商业秘密或者其他应当保密的信息，或者玩忽职守、滥用职权、徇私舞弊，未构成犯罪的，依法给予处分；构成犯罪的，依法追究刑事责任。"},{"t":"h","x":"第九章 附 则"},{"t":"a","x":"第六十三条 对本省其他国家机关、中央国家机关派驻本省的机关或者派出机构为履行法定职责、提供公共服务收集、使用公共数据的管理，参照本办法执行。法律、法规另有规定的，从其规定。"},{"t":"a","x":"第六十四条 本办法自2022年2月1日起施行。"}]},{"title":"App违法违规收集使用个人信息行为认定方法","source":"中国网信网","date":"网信办、工信部、公安部、市场监管总局联合发布，2019年","url":"https://www.cac.gov.cn/2019-12/27/c_1578986455686625.htm","arts":[{"t":"p","x":"App违法违规收集使用个人信息行为认定方法\n根据《关于开展App违法违规收集使用个人信息专项治理的公告》，为监督管理部门认定App违法违规收集使用个人信息行为提供参考，为App运营者自查自纠和网民社会监督提供指引，落实《网络安全法》等法律法规，制定本方法。\n一、以下行为可被认定为“未公开收集使用规则”\n1.在App中没有隐私政策，或者隐私政策中没有收集使用个人信息规则；\n2.在App首次运行时未通过弹窗等明显方式提示用户阅读隐私政策等收集使用规则；\n3.隐私政策等收集使用规则难以访问，如进入App主界面后，需多于4次点击等操作才能访问到；\n4.隐私政策等收集使用规则难以阅读，如文字过小过密、颜色过淡、模糊不清，或未提供简体中文版等。\n二、以下行为可被认定为“未明示收集使用个人信息的目的、方式和范围”\n1.未逐一列出App(包括委托的第三方或嵌入的第三方代码、插件)收集使用个人信息的目的、方式、范围等；\n2.收集使用个人信息的目的、方式、范围发生变化时，未以适当方式通知用户，适当方式包括更新隐私政策等收集使用规则并提醒用户阅读等；\n3.在申请打开可收集个人信息的权限，或申请收集用户身份证号、银行账号、行踪轨迹等个人敏感信息时，未同步告知用户其目的，或者目的不明确、难以理解；\n4.有关收集使用规则的内容晦涩难懂、冗长繁琐，用户难以理解，如使用大量专业术语等。\n三、以下行为可被认定为“未经用户同意收集使用个人信息”\n1.征得用户同意前就开始收集个人信息或打开可收集个人信息的权限；\n2.用户明确表示不同意后，仍收集个人信息或打开可收集个人信息的权限，或频繁征求用户同意、干扰用户正常使用；\n3.实际收集的个人信息或打开的可收集个人信息权限超出用户授权范围；\n4.以默认选择同意隐私政策等非明示方式征求用户同意；\n5.未经用户同意更改其设置的可收集个人信息权限状态，如App更新时自动将用户设置的权限恢复到默认状态；\n6.利用用户个人信息和算法定向推送信息，未提供非定向推送信息的选项；\n7.以欺诈、诱骗等不正当方式误导用户同意收集个人信息或打开可收集个人信息的权限，如故意欺瞒、掩饰收集使用个人信息的真实目的；\n8.未向用户提供撤回同意收集个人信息的途径、方式；\n9.违反其所声明的收集使用规则，收集使用个人信息。\n四、以下行为可被认定为“违反必要原则，收集与其提供的服务无关的个人信息”\n1.收集的个人信息类型或打开的可收集个人信息权限与现有业务功能无关；\n2.因用户不同意收集非必要个人信息或打开非必要权限，拒绝提供业务功能；\n3.App新增业务功能申请收集的个人信息超出用户原有同意范围，若用户不同意，则拒绝提供原有业务功能，新增业务功能取代原有业务功能的除外；\n4.收集个人信息的频度等超出业务功能实际需要；\n5.仅以改善服务质量、提升用户体验、定向推送信息、研发新产品等为由，强制要求用户同意收集个人信息；\n6.要求用户一次性同意打开多个可收集个人信息的权限，用户不同意则无法使用。\n五、以下行为可被认定为“未经同意向他人提供个人信息”\n1.既未经用户同意，也未做匿名化处理，App客户端直接向第三方提供个人信息，包括通过客户端嵌入的第三方代码、插件等方式向第三方提供个人信息；\n2.既未经用户同意，也未做匿名化处理，数据传输至App后台服务器后，向第三方提供其收集的个人信息；\n3.App接入第三方应用，未经用户同意，向第三方应用提供个人信息。\n六、以下行为可被认定为“未按法律规定提供删除或更正个人信息功能”或“未公布投诉、举报方式等信息”\n1.未提供有效的更正、删除个人信息及注销用户账号功能；\n2.为更正、删除个人信息或注销用户账号设置不必要或不合理条件；\n3.虽提供了更正、删除个人信息及注销用户账号功能，但未及时响应用户相应操作，需人工处理的，未在承诺时限内（承诺时限不得超过15个工作日，无承诺时限的，以15个工作日为限）完成核查和处理；\n4.更正、删除个人信息或注销用户账号等用户操作已执行完毕，但App后台并未完成的；\n5.未建立并公布个人信息安全投诉、举报渠道，或未在承诺时限内（承诺时限不得超过15个工作日，无承诺时限的，以15个工作日为限）受理并处理的。\n关闭\n中央网络安全和信息化委员会办公室 中华人民共和国国家互联网信息办公室 © 版权所有 联系我们\n承办：国家互联网应急中心 技术支持：长安通信科技有限责任公司 京ICP备14042428号 京公网安备11040102700108号\n学习强国\n◆ ◆\n微信\n◆ ◆\n返回顶部\n中央网络安全和信息化委员会办公室\n中华人民共和国国家互联网信息办公室 ©"}]},{"title":"个人信息保护合规审计管理办法","source":"中国网信网","date":"国家网信办令第13号，2025年5月1日起施行","url":"https://www.cac.gov.cn/2025-02/14/c_1741233507681519.htm","arts":[{"t":"a","x":"第一条 为了规范个人信息保护合规审计活动，保护个人信息权益，根据《中华人民共和国个人信息保护法》、《网络数据安全管理条例》等法律、行政法规，制定本办法。"},{"t":"a","x":"第二条 在中华人民共和国境内开展个人信息保护合规审计，适用本办法。\n本办法所称个人信息保护合规审计，是指对个人信息处理者的个人信息处理活动是否遵守法律、行政法规的情况进行审查和评价的监督活动。"},{"t":"a","x":"第三条 个人信息处理者自行开展个人信息保护合规审计的，应当由个人信息处理者内部机构或者委托专业机构定期对其处理个人信息遵守法律、行政法规的情况进行合规审计。"},{"t":"a","x":"第四条 处理超过1000万人个人信息的个人信息处理者，应当每两年至少开展一次个人信息保护合规审计。"},{"t":"a","x":"第五条 个人信息处理者有以下情形之一的，国家网信部门和其他履行个人信息保护职责的部门（以下统称为保护部门），可以要求个人信息处理者委托专业机构对个人信息处理活动进行合规审计：\n（一）发现个人信息处理活动存在严重影响个人权益或者严重缺乏安全措施等较大风险的；\n（二）个人信息处理活动可能侵害众多个人的权益的；\n（三）发生个人信息安全事件，导致100万人以上个人信息或者10万人以上敏感个人信息泄露、篡改、丢失、毁损的。\n对同一个人信息安全事件或者风险，不得重复要求个人信息处理者委托专业机构开展个人信息保护合规审计。"},{"t":"a","x":"第六条 个人信息处理者自行开展或者按照保护部门要求委托专业机构开展个人信息保护合规审计的，应当参照本办法附件《个人信息保护合规审计指引》。"},{"t":"a","x":"第七条 专业机构应当具备开展个人信息保护合规审计的能力，有与服务相适应的审计人员、场所、设施和资金等。\n鼓励相关专业机构通过认证。专业机构的认证按照《中华人民共和国认证认可条例》的有关规定执行。"},{"t":"a","x":"第八条 个人信息处理者按照保护部门要求开展个人信息保护合规审计的，应当为专业机构正常开展个人信息保护合规审计工作提供必要支持，并承担审计费用。"},{"t":"a","x":"第九条 个人信息处理者按照保护部门要求开展个人信息保护合规审计的，应当按照保护部门要求选定专业机构，在限定时间内完成个人信息保护合规审计；情况复杂的，报保护部门批准后，可以适当延长。"},{"t":"a","x":"第十条 个人信息处理者按照保护部门要求开展个人信息保护合规审计的，在完成合规审计后，应当将专业机构出具的个人信息保护合规审计报告报送保护部门。\n个人信息保护合规审计报告应当由专业机构主要负责人、合规审计负责人签字并加盖专业机构公章。"},{"t":"a","x":"第十一条 个人信息处理者按照保护部门要求开展个人信息保护合规审计的，应当按照保护部门要求对合规审计中发现的问题进行整改。在整改完成后15个工作日内，向保护部门报送整改情况报告。"},{"t":"a","x":"第十二条 处理100万人以上个人信息的个人信息处理者应当指定个人信息保护负责人，负责个人信息处理者的个人信息保护合规审计工作。\n提供重要互联网平台服务、用户数量巨大、业务类型复杂的个人信息处理者，应当成立主要由外部成员组成的独立机构对个人信息保护合规审计情况进行监督。"},{"t":"a","x":"第十三条 专业机构在从事个人信息保护合规审计活动时，应当遵守法律法规，诚信正直，公正客观地作出合规审计职业判断，对在履行个人信息保护合规审计职责中获得的个人信息、商业秘密、保密商务信息等应当依法予以保密，不得泄露或者非法向他人提供，在合规审计工作结束后及时删除相关信息。"},{"t":"a","x":"第十四条 专业机构不得转委托其他机构开展个人信息保护合规审计。"},{"t":"a","x":"第十五条 同一专业机构及其关联机构、同一合规审计负责人不得连续三次以上对同一审计对象开展个人信息保护合规审计。"},{"t":"a","x":"第十六条 保护部门对个人信息处理者开展个人信息保护合规审计情况进行监督检查。"},{"t":"a","x":"第十七条 任何组织、个人有权对个人信息保护合规审计中的违法活动向保护部门进行投诉、举报。收到投诉、举报的部门应当依法及时处理，并将处理结果告知投诉、举报人。"},{"t":"a","x":"第十八条 个人信息处理者、专业机构违反本办法规定的，依照《中华人民共和国个人信息保护法》、《网络数据安全管理条例》等法律法规的规定处理；构成犯罪的，依法追究刑事责任。"},{"t":"a","x":"第十九条 对国家机关和法律、法规授权的具有管理公共事务职能的组织的个人信息保护合规审计，不适用本办法。"},{"t":"a","x":"第二十条 本办法自2025年5月1日起施行。"}]},{"title":"互联网信息服务深度合成管理规定","source":"中国网信网","date":"国家网信办等3部门令第12号，2023年1月10日起施行","url":"https://www.cac.gov.cn/2022-12/11/c_1672221949354811.htm","arts":[{"t":"a","x":"第一条 为了加强互联网信息服务深度合成管理，弘扬社会主义核心价值观，维护国家安全和社会公共利益，保护公民、法人和其他组织的合法权益，根据《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》、《互联网信息服务管理办法》等法律、行政法规，制定本规定。"},{"t":"a","x":"第二条 在中华人民共和国境内应用深度合成技术提供互联网信息服务（以下简称深度合成服务），适用本规定。法律、行政法规另有规定的，依照其规定。"},{"t":"a","x":"第三条 国家网信部门负责统筹协调全国深度合成服务的治理和相关监督管理工作。国务院电信主管部门、公安部门依据各自职责负责深度合成服务的监督管理工作。\n地方网信部门负责统筹协调本行政区域内的深度合成服务的治理和相关监督管理工作。地方电信主管部门、公安部门依据各自职责负责本行政区域内的深度合成服务的监督管理工作。"},{"t":"a","x":"第四条 提供深度合成服务，应当遵守法律法规，尊重社会公德和伦理道德，坚持正确政治方向、舆论导向、价值取向，促进深度合成服务向上向善。"},{"t":"a","x":"第五条 鼓励相关行业组织加强行业自律，建立健全行业标准、行业准则和自律管理制度，督促指导深度合成服务提供者和技术支持者制定完善业务规范、依法开展业务和接受社会监督。"},{"t":"h","x":"第二章 一般规定"},{"t":"a","x":"第六条 任何组织和个人不得利用深度合成服务制作、复制、发布、传播法律、行政法规禁止的信息，不得利用深度合成服务从事危害国家安全和利益、损害国家形象、侵害社会公共利益、扰乱经济和社会秩序、侵犯他人合法权益等法律、行政法规禁止的活动。\n深度合成服务提供者和使用者不得利用深度合成服务制作、复制、发布、传播虚假新闻信息。转载基于深度合成服务制作发布的新闻信息的，应当依法转载互联网新闻信息稿源单位发布的新闻信息。"},{"t":"a","x":"第七条 深度合成服务提供者应当落实信息安全主体责任，建立健全用户注册、算法机制机理审核、科技伦理审查、信息发布审核、数据安全、个人信息保护、反电信网络诈骗、应急处置等管理制度，具有安全可控的技术保障措施。"},{"t":"a","x":"第八条 深度合成服务提供者应当制定和公开管理规则、平台公约，完善服务协议，依法依约履行管理责任，以显著方式提示深度合成服务技术支持者和使用者承担信息安全义务。"},{"t":"a","x":"第九条 深度合成服务提供者应当基于移动电话号码、身份证件号码、统一社会信用代码或者国家网络身份认证公共服务等方式，依法对深度合成服务使用者进行真实身份信息认证，不得向未进行真实身份信息认证的深度合成服务使用者提供信息发布服务。"},{"t":"a","x":"第十条 深度合成服务提供者应当加强深度合成内容管理，采取技术或者人工方式对深度合成服务使用者的输入数据和合成结果进行审核。\n深度合成服务提供者应当建立健全用于识别违法和不良信息的特征库，完善入库标准、规则和程序，记录并留存相关网络日志。\n深度合成服务提供者发现违法和不良信息的，应当依法采取处置措施，保存有关记录，及时向网信部门和有关主管部门报告；对相关深度合成服务使用者依法依约采取警示、限制功能、暂停服务、关闭账号等处置措施。"},{"t":"a","x":"第十一条 深度合成服务提供者应当建立健全辟谣机制，发现利用深度合成服务制作、复制、发布、传播虚假信息的，应当及时采取辟谣措施，保存有关记录，并向网信部门和有关主管部门报告。"},{"t":"a","x":"第十二条 深度合成服务提供者应当设置便捷的用户申诉和公众投诉、举报入口，公布处理流程和反馈时限，及时受理、处理和反馈处理结果。"},{"t":"a","x":"第十三条 互联网应用商店等应用程序分发平台应当落实上架审核、日常管理、应急处置等安全管理责任，核验深度合成类应用程序的安全评估、备案等情况；对违反国家有关规定的，应当及时采取不予上架、警示、暂停服务或者下架等处置措施。"},{"t":"h","x":"第三章 数据和技术管理规范"},{"t":"a","x":"第十四条 深度合成服务提供者和技术支持者应当加强训练数据管理，采取必要措施保障训练数据安全；训练数据包含个人信息的，应当遵守个人信息保护的有关规定。\n深度合成服务提供者和技术支持者提供人脸、人声等生物识别信息编辑功能的，应当提示深度合成服务使用者依法告知被编辑的个人，并取得其单独同意。"},{"t":"a","x":"第十五条 深度合成服务提供者和技术支持者应当加强技术管理，定期审核、评估、验证生成合成类算法机制机理。\n深度合成服务提供者和技术支持者提供具有以下功能的模型、模板等工具的，应当依法自行或者委托专业机构开展安全评估：\n（一）生成或者编辑人脸、人声等生物识别信息的；\n（二）生成或者编辑可能涉及国家安全、国家形象、国家利益和社会公共利益的特殊物体、场景等非生物识别信息的。"},{"t":"a","x":"第十六条 深度合成服务提供者对使用其服务生成或者编辑的信息内容，应当采取技术措施添加不影响用户使用的标识，并依照法律、行政法规和国家有关规定保存日志信息。"},{"t":"a","x":"第十七条 深度合成服务提供者提供以下深度合成服务，可能导致公众混淆或者误认的，应当在生成或者编辑的信息内容的合理位置、区域进行显著标识，向公众提示深度合成情况：\n（一）智能对话、智能写作等模拟自然人进行文本的生成或者编辑服务；\n（二）合成人声、仿声等语音生成或者显著改变个人身份特征的编辑服务；\n（三）人脸生成、人脸替换、人脸操控、姿态操控等人物图像、视频生成或者显著改变个人身份特征的编辑服务；\n（四）沉浸式拟真场景等生成或者编辑服务；\n（五）其他具有生成或者显著改变信息内容功能的服务。\n深度合成服务提供者提供前款规定之外的深度合成服务的，应当提供显著标识功能，并提示深度合成服务使用者可以进行显著标识。"},{"t":"a","x":"第十八条 任何组织和个人不得采用技术手段删除、篡改、隐匿本规定第十六条和第十七条规定的深度合成标识。"},{"t":"h","x":"第四章 监督检查与法律责任"},{"t":"a","x":"第十九条 具有舆论属性或者社会动员能力的深度合成服务提供者，应当按照《互联网信息服务算法推荐管理规定》履行备案和变更、注销备案手续。\n深度合成服务技术支持者应当参照前款规定履行备案和变更、注销备案手续。\n完成备案的深度合成服务提供者和技术支持者应当在其对外提供服务的网站、应用程序等的显著位置标明其备案编号并提供公示信息链接。"},{"t":"a","x":"第二十条 深度合成服务提供者开发上线具有舆论属性或者社会动员能力的新产品、新应用、新功能的，应当按照国家有关规定开展安全评估。"},{"t":"a","x":"第二十一条 网信部门和电信主管部门、公安部门依据职责对深度合成服务开展监督检查。深度合成服务提供者和技术支持者应当依法予以配合，并提供必要的技术、数据等支持和协助。\n网信部门和有关主管部门发现深度合成服务存在较大信息安全风险的，可以按照职责依法要求深度合成服务提供者和技术支持者采取暂停信息更新、用户账号注册或者其他相关服务等措施。深度合成服务提供者和技术支持者应当按照要求采取措施，进行整改，消除隐患。"},{"t":"a","x":"第二十二条 深度合成服务提供者和技术支持者违反本规定的，依照有关法律、行政法规的规定处罚；造成严重后果的，依法从重处罚。\n构成违反治安管理行为的，由公安机关依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。"},{"t":"h","x":"第五章 附则"},{"t":"a","x":"第二十三条 本规定中下列用语的含义：\n深度合成技术，是指利用深度学习、虚拟现实等生成合成类算法制作文本、图像、音频、视频、虚拟场景等网络信息的技术，包括但不限于：\n（一）篇章生成、文本风格转换、问答对话等生成或者编辑文本内容的技术；\n（二）文本转语音、语音转换、语音属性编辑等生成或者编辑语音内容的技术；\n（三）音乐生成、场景声编辑等生成或者编辑非语音内容的技术；\n（四）人脸生成、人脸替换、人物属性编辑、人脸操控、姿态操控等生成或者编辑图像、视频内容中生物特征的技术；\n（五）图像生成、图像增强、图像修复等生成或者编辑图像、视频内容中非生物特征的技术；\n（六）三维重建、数字仿真等生成或者编辑数字人物、虚拟场景的技术。\n深度合成服务提供者，是指提供深度合成服务的组织、个人。\n深度合成服务技术支持者，是指为深度合成服务提供技术支持的组织、个人。\n深度合成服务使用者，是指使用深度合成服务制作、复制、发布、传播信息的组织、个人。\n训练数据，是指被用于训练机器学习模型的标注或者基准数据集。\n沉浸式拟真场景，是指应用深度合成技术生成或者编辑的、可供参与者体验或者互动的、具有高度真实感的虚拟场景。"},{"t":"a","x":"第二十四条 深度合成服务提供者和技术支持者从事网络出版服务、网络文化活动和网络视听节目服务的，应当同时符合新闻出版、文化和旅游、广播电视主管部门的规定。"},{"t":"a","x":"第二十五条 本规定自2023年1月10日起施行。"}]},{"title":"互联网政务应用安全管理规定","source":"中国网信网","date":"中央网信办等4部门印发，2024年7月1日起施行","url":"https://www.cac.gov.cn/2024-05/22/c_1718054910848588.htm","arts":[{"t":"a","x":"第一条 为保障互联网政务应用安全，根据《中华人民共和国网络安全法》《中华人民共和国数据安全法》《中华人民共和国个人信息保护法》《党委（党组）网络安全工作责任制实施办法》等，制定本规定。"},{"t":"a","x":"第二条 各级党政机关和事业单位（简称机关事业单位）建设运行互联网政务应用，应当遵守本规定。\n本规定所称互联网政务应用，是指机关事业单位在互联网上设立的门户网站，通过互联网提供公共服务的移动应用程序（含小程序）、公众账号等，以及互联网电子邮件系统。"},{"t":"a","x":"第三条 建设运行互联网政务应用应当依照有关法律、行政法规的规定以及国家标准的强制性要求，落实网络安全与互联网政务应用“同步规划、同步建设、同步使用”原则，采取技术措施和其他必要措施，防范内容篡改、攻击致瘫、数据窃取等风险，保障互联网政务应用安全稳定运行和数据安全。"},{"t":"h","x":"第二章 开办和建设"},{"t":"a","x":"第四条 机关事业单位开办网站应当按程序完成开办审核和备案工作。一个党政机关最多开设一个门户网站。\n中央机构编制管理部门、国务院电信部门、国务院公安部门加强数据共享，优化工作流程，减少填报材料，缩短开办周期。\n机关事业单位开办网站，应当将运维和安全保障经费纳入预算。"},{"t":"a","x":"第五条 一个党政机关网站原则上只注册一个中文域名和一个英文域名，域名应当以“.gov.cn”或“.政务”为后缀。非党政机关网站不得注册使用“.gov.cn”或“.政务”的域名。\n事业单位网站的域名应当以“.cn”或“.公益”为后缀。\n机关事业单位不得将已注册的网站域名擅自转让给其他单位或个人使用。"},{"t":"a","x":"第六条 机关事业单位移动应用程序应当在已备案的应用程序分发平台或机关事业单位网站分发。"},{"t":"a","x":"第七条 机构编制管理部门为机关事业单位制发专属电子证书或纸质证书。机关事业单位通过应用程序分发平台分发移动应用程序，应当向平台运营者提供电子证书或纸质证书用于身份核验；开办微博、公众号、视频号、直播号等公众账号，应当向平台运营者提供电子证书或纸质证书用于身份核验。"},{"t":"a","x":"第八条 互联网政务应用的名称优先使用实体机构名称、规范简称，使用其他名称的，原则上采取区域名加职责名的命名方式，并在显著位置标明实体机构名称。具体命名规范由中央机构编制管理部门制定。"},{"t":"a","x":"第九条 中央机构编制管理部门为机关事业单位设置专属网上标识，非机关事业单位不得使用。\n机关事业单位网站应当在首页底部中间位置加注网上标识。中央网络安全和信息化委员会办公室会同中央机构编制管理部门协调应用程序分发平台以及公众账号信息服务平台，在移动应用程序下载页面、公众账号显著位置加注网上标识。"},{"t":"a","x":"第十条 各地区、各部门应当对本地区、本部门党政机关网站建设进行整体规划，推进集约化建设。\n县级党政机关各部门以及乡镇党政机关原则上不单独建设网站，可利用上级党政机关网站平台开设网页、栏目、发布信息。"},{"t":"a","x":"第十一条 互联网政务应用应当支持开放标准，充分考虑对用户端的兼容性，不得要求用户使用特定浏览器、办公软件等用户端软硬件系统访问。\n机关事业单位通过互联网提供公共服务，不得绑定单一互联网平台，不得将用户下载安装、注册使用特定互联网平台作为获取服务的前提条件。"},{"t":"a","x":"第十二条 互联网政务应用因机构调整等原因需变更开办主体的，应当及时变更域名或注册备案信息。不再使用的，应当及时关闭服务，完成数据归档和删除，注销域名和注册备案信息。"},{"t":"h","x":"第三章 信息安全"},{"t":"a","x":"第十三条 机关事业单位通过互联网政务应用发布信息，应当健全信息发布审核制度，明确审核程序，指定机构和在编人员负责审核工作，建立审核记录档案；应当确保发布信息内容的权威性、真实性、准确性、及时性和严肃性，严禁发布违法和不良信息。"},{"t":"a","x":"第十四条 机关事业单位通过互联网政务应用转载信息，应当与政务等履行职能的活动相关，并评估内容的真实性和客观性。转载页面上要准确清晰标注转载来源网站、转载时间、转载链接等，充分考虑图片、内容等知识产权保护问题。"},{"t":"a","x":"第十五条 机关事业单位发布信息内容需要链接非互联网政务应用的，应当确认链接的资源与政务等履行职能的活动相关，或属于便民服务的范围；应当定期检查链接的有效性和适用性，及时处置异常链接。党政机关门户网站应当采取技术措施，做到在用户点击链接跳转到非党政机关网站时，予以明确提示。"},{"t":"a","x":"第十六条 机关事业单位应当采取安全保密防控措施，严禁发布国家秘密、工作秘密，防范互联网政务应用数据汇聚、关联引发的泄密风险。应当加强对互联网政务应用存储、处理、传输工作秘密的保密管理。"},{"t":"h","x":"第四章 网络和数据安全"},{"t":"a","x":"第十七条 建设互联网政务应用应当落实网络安全等级保护制度和国家密码应用管理要求，按照有关标准规范开展定级备案、等级测评工作，落实安全建设整改加固措施，防范网络和数据安全风险。\n中央和国家机关、地市级以上地方党政机关门户网站，以及承载重要业务应用的机关事业单位网站、互联网电子邮件系统等，应当符合网络安全等级保护第三级安全保护要求。"},{"t":"a","x":"第十八条 机关事业单位应当自行或者委托具有相应资质的第三方网络安全服务机构，对互联网政务应用网络和数据安全每年至少进行一次安全检测评估。\n互联网政务应用系统升级、新增功能以及引入新技术新应用，应当在上线前进行安全检测评估。"},{"t":"a","x":"第十九条 互联网政务应用应当设置访问控制策略。对于面向机关事业单位工作人员使用的功能和互联网电子邮箱系统，应当对接入的IP地址段或设备实施访问限制，确需境外访问的，按照白名单方式开通特定时段、特定设备或账号的访问权限。"},{"t":"a","x":"第二十条 机关事业单位应当留存互联网政务应用相关的防火墙、主机等设备的运行日志，以及应用系统的访问日志、数据库的操作日志，留存时间不少于1年，并定期对日志进行备份，确保日志的完整性、可用性。"},{"t":"a","x":"第二十一条 机关事业单位应当按照国家、行业领域有关数据安全和个人信息保护的要求，对互联网政务应用数据进行分类分级管理，对重要数据、个人信息、商业秘密进行重点保护。"},{"t":"a","x":"第二十二条 机关事业单位通过互联网政务应用收集的个人信息、商业秘密和其他未公开资料，未经信息提供方同意不得向第三方提供或公开，不得用于履行法定职责以外的目的。"},{"t":"a","x":"第二十三条 为互联网政务应用提供服务的数据中心、云计算服务平台等应当设在境内。"},{"t":"a","x":"第二十四条 党政机关建设互联网政务应用采购云计算服务，应当选取通过国家云计算服务安全评估的云平台，并加强对所采购云计算服务的使用管理。"},{"t":"a","x":"第二十五条 机关事业单位委托外包单位开展互联网政务应用开发和运维时，应当以合同等手段明确外包单位网络和数据安全责任，并加强日常监督管理和考核问责；督促外包单位严格按照约定使用、存储、处理数据。未经委托的机关事业单位同意，外包单位不得转包、分包合同任务，不得访问、修改、披露、利用、转让、销毁数据。\n机关事业单位应当建立严格的授权访问机制，操作系统、数据库、机房等最高管理员权限必须由本单位在编人员专人负责，不得擅自委托外包单位人员管理使用；应当按照最小必要原则对外包单位人员进行精细化授权，在授权期满后及时收回权限。"},{"t":"a","x":"第二十六条 机关事业单位应当合理建设或利用社会化专业灾备设施，对互联网政务应用重要数据和信息系统等进行容灾备份。"},{"t":"a","x":"第二十七条 机关事业单位应当加强互联网政务应用开发安全管理，使用外部代码应当经过安全检测。建立业务连续性计划，防范因供应商服务变更等对升级改造、运维保障等带来的风险。"},{"t":"a","x":"第二十八条 互联网政务应用使用内容分发网络(CDN)服务的，应当要求服务商将境内用户的域名解析地址指向其境内节点，不得指向境外节点。"},{"t":"a","x":"第二十九条 互联网政务应用应当使用安全连接方式访问，涉及的电子认证服务应当由依法设立的电子政务电子认证服务机构提供。"},{"t":"a","x":"第三十条 互联网政务应用应当对注册用户进行真实身份信息认证。国家鼓励互联网政务应用支持用户使用国家网络身份认证公共服务进行真实身份信息注册。\n对与人身财产安全、社会公共利益等相关的互联网政务应用和电子邮件系统，应当采取多因素鉴别提高安全性，采取超时退出、限制登录失败次数、账号与终端绑定等技术手段防范账号被盗用风险，鼓励采用电子证书等身份认证措施。"},{"t":"h","x":"第五章 电子邮件安全"},{"t":"a","x":"第三十一条 鼓励各地区、各部门通过统一建设、共享使用的模式，建设机关事业单位专用互联网电子邮件系统，作为工作邮箱，为本地区、本行业机关事业单位提供电子邮件服务。党政机关自建的互联网电子邮件系统的域名应当以“.gov.cn”或“.政务”为后缀，事业单位自建的互联网电子邮件系统的域名应当以“.cn”或“.公益”为后缀。\n机关事业单位工作人员不得使用工作邮箱违规存储、处理、传输、转发国家秘密。"},{"t":"a","x":"第三十二条 机关事业单位应当建立工作邮箱账号的申请、发放、变更、注销等流程，严格账号审批登记，定期开展账号清理。"},{"t":"a","x":"第三十三条 机关事业单位互联网电子邮件系统应当关闭邮件自动转发、自动下载附件功能。"},{"t":"a","x":"第三十四条 机关事业单位互联网电子邮件系统应当具备恶意邮件（含本单位内部发送的邮件）检测拦截功能，对恶意邮箱账号、恶意邮件服务器IP以及恶意邮件主题、正文、链接、附件等进行检测和拦截。应当支持钓鱼邮件威胁情报共享，将发现的钓鱼邮件信息报送至主管部门和属地网信部门，按照有关部门下发的钓鱼邮件威胁情报，配置相应防护策略预置拦截钓鱼邮件。"},{"t":"a","x":"第三十五条 鼓励机关事业单位基于商用密码技术对电子邮件数据的存储进行安全保护。"},{"t":"h","x":"第六章 监测预警和应急处置"},{"t":"a","x":"第三十六条 中央网络安全和信息化委员会办公室会同国务院电信主管部门、公安部门和其他有关部门，组织对地市级以上党政机关互联网政务应用开展安全监测。\n各地区、各部门应当对本地区、本行业机关事业单位互联网政务应用开展日常监测和安全检查。\n机关事业单位应当建立完善互联网政务应用安全监测能力，实时监测互联网政务应用运行状态和网络安全事件情况。"},{"t":"a","x":"第三十七条 互联网政务应用发生网络安全事件时，机关事业单位应当按照有关规定向相关部门报告。"},{"t":"a","x":"第三十八条 中央网络安全和信息化委员会办公室统筹协调重大网络安全事件的应急处置。\n互联网政务应用发生或可能发生网络安全事件时，机关事业单位应当立即启动本单位网络安全应急预案，及时处置网络安全事件，消除安全隐患，防止危害扩大。"},{"t":"a","x":"第三十九条 机构编制管理部门会同网信部门开展针对假冒仿冒互联网政务应用的扫描监测，受理相关投诉举报。网信部门会同电信主管部门，及时对监测发现或网民举报的假冒仿冒互联网政务应用采取停止域名解析、阻断互联网连接和下线处理等措施。公安部门负责打击假冒仿冒互联网政务应用相关违法犯罪活动。"},{"t":"h","x":"第七章 监督管理"},{"t":"a","x":"第四十条 中央网络安全和信息化委员会办公室负责统筹协调互联网政务应用安全管理工作。中央机构编制管理部门负责互联网政务应用开办主体身份核验、名称管理和标识管理工作。国务院电信主管部门负责互联网政务应用域名监督管理和互联网信息服务（ICP）备案工作。国务院公安部门负责监督检查指导互联网政务应用网络安全等级保护和相关安全管理工作。\n各地区、各部门承担本地区、本行业机关事业单位互联网政务应用安全管理责任，指定一名负责人分管相关工作，加强对互联网政务应用安全工作的组织领导。"},{"t":"a","x":"第四十一条 对违反或者未能正确履行本规定相关要求的，按照《党委（党组）网络安全工作责任制实施办法》等文件，依规依纪追究当事人和有关领导的责任。"},{"t":"h","x":"第八章 附则"},{"t":"a","x":"第四十二条 列入关键信息基础设施的互联网门户网站、移动应用程序、公众账号，以及电子邮件系统的安全管理工作，参照本规定有关内容执行。"},{"t":"a","x":"第四十三条 本规定由中央网络安全和信息化委员会办公室、中央机构编制委员会办公室、工业和信息化部、公安部负责解释。"},{"t":"a","x":"第四十四条 本规定自2024年7月1日起施行。"}]},{"title":"人工智能生成合成内容标识办法","source":"中国网信网","date":"国家网信办等4部门令第17号，2025年9月1日起施行","url":"https://www.cac.gov.cn/2025-03/14/c_1743654684782215.htm","arts":[{"t":"a","x":"第一条 为了促进人工智能健康发展，规范人工智能生成合成内容标识，保护公民、法人和其他组织合法权益，维护社会公共利益，根据《中华人民共和国网络安全法》、《互联网信息服务算法推荐管理规定》、《互联网信息服务深度合成管理规定》、《生成式人工智能服务管理暂行办法》等法律、行政法规和部门规章，制定本办法。"},{"t":"a","x":"第二条 符合《互联网信息服务算法推荐管理规定》、《互联网信息服务深度合成管理规定》、《生成式人工智能服务管理暂行办法》规定情形的网络信息服务提供者（以下简称“服务提供者”）开展人工智能生成合成内容标识活动，适用本办法。"},{"t":"a","x":"第三条 人工智能生成合成内容是指利用人工智能技术生成、合成的文本、图片、音频、视频、虚拟场景等信息。\n人工智能生成合成内容标识包括显式标识和隐式标识。\n显式标识是指在生成合成内容或者交互场景界面中添加的，以文字、声音、图形等方式呈现并可以被用户明显感知到的标识。\n隐式标识是指采取技术措施在生成合成内容文件数据中添加的，不易被用户明显感知到的标识。"},{"t":"a","x":"第四条 服务提供者提供的生成合成服务属于《互联网信息服务深度合成管理规定》第十七条第一款情形的，应当按照下列要求对生成合成内容添加显式标识：\n（一）在文本的起始、末尾或者中间适当位置添加文字提示或者通用符号提示等标识，或者在交互场景界面、文字周边添加显著的提示标识；\n（二）在音频的起始、末尾或者中间适当位置添加语音提示或者音频节奏提示等标识，或者在交互场景界面中添加显著的提示标识；\n（三）在图片的适当位置添加显著的提示标识；\n（四）在视频起始画面和视频播放周边的适当位置添加显著的提示标识，可以在视频末尾和中间适当位置添加显著的提示标识；\n（五）呈现虚拟场景时，在起始画面的适当位置添加显著的提示标识，可以在虚拟场景持续服务过程中的适当位置添加显著的提示标识；\n（六）其他生成合成服务场景根据自身应用特点添加显著的提示标识。\n服务提供者提供生成合成内容下载、复制、导出等功能时，应当确保文件中含有满足要求的显式标识。"},{"t":"a","x":"第五条 服务提供者应当按照《互联网信息服务深度合成管理规定》第十六条的规定，在生成合成内容的文件元数据中添加隐式标识，隐式标识包含生成合成内容属性信息、服务提供者名称或者编码、内容编号等制作要素信息。\n鼓励服务提供者在生成合成内容中添加数字水印等形式的隐式标识。\n文件元数据是指按照特定编码格式嵌入到文件头部的描述性信息，用于记录文件来源、属性、用途等信息内容。"},{"t":"a","x":"第六条 提供网络信息内容传播服务的服务提供者应当采取下列措施，规范生成合成内容传播活动：\n（一）核验文件元数据中是否含有隐式标识，文件元数据明确标明为生成合成内容的，采取适当方式在发布内容周边添加显著的提示标识，明确提醒公众该内容属于生成合成内容；\n（二）文件元数据中未核验到隐式标识，但用户声明为生成合成内容的，采取适当方式在发布内容周边添加显著的提示标识，提醒公众该内容可能为生成合成内容；\n（三）文件元数据中未核验到隐式标识，用户也未声明为生成合成内容，但提供网络信息内容传播服务的服务提供者检测到显式标识或者其他生成合成痕迹的，识别为疑似生成合成内容，采取适当方式在发布内容周边添加显著的提示标识，提醒公众该内容疑似生成合成内容；\n（四）提供必要的标识功能，并提醒用户主动声明发布内容中是否包含生成合成内容。\n有前款第一项至第三项情形的，应当在文件元数据中添加生成合成内容属性信息、传播平台名称或者编码、内容编号等传播要素信息。"},{"t":"a","x":"第七条 互联网应用程序分发平台在应用程序上架或者上线审核时，应当要求互联网应用程序服务提供者说明是否提供人工智能生成合成服务。互联网应用程序服务提供者提供人工智能生成合成服务的，互联网应用程序分发平台应当核验其生成合成内容标识相关材料。"},{"t":"a","x":"第八条 服务提供者应当在用户服务协议中明确说明生成合成内容标识的方法、样式等规范内容，并提示用户仔细阅读并理解相关的标识管理要求。"},{"t":"a","x":"第九条 用户申请服务提供者提供没有添加显式标识的生成合成内容的，服务提供者可以在通过用户协议明确用户的标识义务和使用责任后，提供不含显式标识的生成合成内容，并依法留存提供对象信息等相关日志不少于六个月。"},{"t":"a","x":"第十条 用户使用网络信息内容传播服务发布生成合成内容的，应当主动声明并使用服务提供者提供的标识功能进行标识。\n任何组织和个人不得恶意删除、篡改、伪造、隐匿本办法规定的生成合成内容标识，不得为他人实施上述恶意行为提供工具或者服务，不得通过不正当标识手段损害他人合法权益。"},{"t":"a","x":"第十一条 服务提供者开展标识活动的，还应当符合相关法律、行政法规、部门规章和强制性国家标准的要求。"},{"t":"a","x":"第十二条 服务提供者在履行算法备案、安全评估等手续时，应当按照本办法提供生成合成内容标识相关材料，并加强标识信息共享，为防范打击相关违法犯罪活动提供支持和帮助。"},{"t":"a","x":"第十三条 违反本办法规定的，由网信、电信、公安和广播电视等有关主管部门依据职责，按照有关法律、行政法规、部门规章的规定予以处理。"},{"t":"a","x":"第十四条 本办法自2025年9月1日起施行。"}]},{"title":"商用密码产品认证规则","source":"中国政府网","date":"市场监管总局、国家密码管理局联合公告，2020年","url":"https://www.gov.cn/zhengce/zhengceku/2020-05/11/5510753/files/3760950006644e2ca3929db5889d6ff0.pdf","arts":[{"t":"p","x":"商用密码产品认证规则目录\n1 适用范围\n本规则依据《中华人民共和国密码法》《中华人民共和国认证认可条例》制定，规定了市场监管总局和国家密码管理局发布的《商用密码产品认证目录》中的产品，实施商用密码产品认证的基本原则和要求。\n2 认证模式\n商用密码产品认证模式为：\n型式试验+初始工厂检查+获证后监督认证机构可对获证产品生产企业的扩项产品认证委托，减免初始工厂检查环节。\n3 认证单元划分\n原则上应按产品型号的不同划分认证单元。同一认证单元内有多个版本的产品时，认证委托人应提交不同版本间的差异说明，必要时还应进行补充差异试验。\n4 认证实施程序\n4.1 认证委托\n认证机构应明确认证委托资料要求，包括产品技术文档，生产能力、质量保障能力、安全保障能力说明等。\n认证委托人应按认证机构要求提交认证委托资料，认证机构在对认证委托资料审核后及时反馈是否受理的信息。\n4.2 型式试验\n1认证机构应根据认证委托资料制定型式试验方案，包括型式试验的样品要求和数量、检测标准项目、检测机构信息等，并通知认证委托人。\n认证委托人应按型式试验方案提供样品至检测机构，并保证样品与实际生产产品一致；必要时，认证机构也可采用生产现场抽样的方式获得样品。认证委托人可在认证结束后取回型式试验样品。\n检测机构应对型式试验全过程作出完整记录，并妥善管理、保存、保密相关资料，确保在认证有效期内检测结果可追溯。型式试验结束后，及时向认证机构和认证委托人出具型式试验报告。\n4.3 初始工厂检查\n认证机构应根据产品认证通用要求，结合 GM/T 0065《商用密码产品生产和保障能力建设规范》、GM/T 0066《商用密码产品生产和保障能力建设实施指南》等标准对认证委托产品的生产企业实施初始工厂检查，检查内容包括其生产能力、质量保障能力、安全保障能力和产品一致性控制能力等。\n4.4 认证评价与决定\n认证机构对型式试验、初始工厂检查结论和相关资料信息进行综合评价，作出认证决定。对符合认证要求的，颁发认证证书并允许使用认证标志；对暂不符合认证要求的，可要求认证委托人限期整改，整改后仍不符合的则书面通知认证委托人终止认证。\n4.5 获证后监督\n认证机构应对认证有效期内的获证产品和生产企业进行持续监督。获证后监督可不预先通知生产企业，一般采用工厂检查的方式实施，必要时可在生产现场或市场抽样检测。\n2认证机构对获证后监督结论和相关资料信息进行综合评价，评价通过的，可继续保持认证证书、使用认证标志；不通过的，认证机构应当根据相应情形做出暂停或者撤销认证证书的处理。\n4.6 认证时限\n认证机构应对认证各环节的时限做出明确规定，并确保相关工作按时限要求完成。认证委托人须对认证活动予以积极配合。\n5 认证证书\n5.1 认证证书的保持\n认证证书有效期为 5 年，并通过认证机构的获证后监督保持效力。证书到期需延续使用的，认证委托人应在有效期届满前 6 个月内提出认证委托。认证机构应采用获证后监督的方式对符合认证要求的委托换发新证书。\n5.2 认证证书覆盖产品的变更获证后的产品或其生产者、生产企业等发生变化时，认证委托人应向认证机构提出变更委托。\n认证机构根据变更的内容，对委托资料进行审核，确定是否可以批准变更。如需样品检测和/或工厂检查，应在检测和/或检查合格后方能批准。\n5.3 认证证书覆盖产品的扩展认证委托人需要增加已经获得的认证证书覆盖的产品范围时，应向认证机构提出扩展委托，并提供扩展产品和获证产品之间的差异说明。\n认证机构可采用委托资料审核、补充差异试验和/或工厂检查的\n3方式核查原认证结果对扩展产品的有效性。核查通过的，由认证机构换发新证书。\n5.4 认证证书的暂停、注销和撤销认证证书的暂停、注销和撤销依据有关规定执行。认证机构应采用适当方式对外公布被暂停、注销和撤销的产品认证证书。\n5.5 认证证书的使用\n认证证书可以展示在文件、网站、通过认证的工作场所、销售场所、广告和宣传资料或广告宣传等商业活动中，但不得利用认证证书和相关文字、符号，误导公众认为认证证书覆盖范围外的产品、服务、管理体系获得认证。宣传认证结果时不应损害认证机构的声誉。\n6 认证标志\n商用密码产品认证实行统一的认证标志管理。\n标志的样式和使用应符合《商用密码产品认证标志管理要求》\n（详见附件）。\n7 认证实施细则\n认证机构应依据本规则的原则和要求，细化认证实施程序，制定科学、合理、可操作的认证实施细则，并对外公布实施。\n4\n8 认证责任\n认证机构应对其做出的认证结论负责。\n检测机构应对检测结果和检测报告负责。\n认证机构及其所委派的工厂检查员应对工厂检查结论负责。\n认证委托人应对其所提交的委托资料及样品的真实性、合法性负责。\n5附件商用密码产品认证标志管理要求\n一、标志样式\n（一）商用密码产品认证标志的样式由基本图案和认证机构名称缩写（图中ABCDE）组成，见下图。\n（二）认证标志的颜色为白色底版，基本图案为黑色（CMYK\n0/60/0/100，Pantone Process Black），认证机构名称缩写颜色与基本图案相同。\n（三）认证标志的尺寸应等比例放大或缩小，放大或缩小后的标志应清晰可辨，标志必须完整，不得将其变形使用。\n二、标志使用要求\n（一）标志的制作\n认证标志的制作、发放由颁发证书的认证机构承担。\n（二）标志的使用\n6\n1.认证标志应加施在铭牌或产品外体的明显位置上；获证产品本体上不能加施认证标志的，其认证标志必须加施在最小的产品外包装上及随附文件中。\n2.软件产品应在其软件包装/载体上加施认证标志，如该软件产品不使用包装/载体，则应在软件使用的许可协议中的显著位置明示该产品已获认证。\n3.获证产品的外包装上可以加施认证标志。\n4.获证企业应建立认证标志使用管理制度，对认证标志的使用情况如实记录和存档。\n5.应符合认证标志有关法规和规定的相关要求。\n（三）监督管理与罚则\n按认证标志有关法规和规定执行。\n7"}]},{"title":"网络关键设备和网络安全专用产品安全认证实施规则","source":"国家认监委","date":"CNCA-CCIS-2023，认监委2023年第14号公告发布","url":"https://www.isccc.gov.cn/wlaqrz/cprz/wlgjsb/tzgg_7/202308/t20230830_8694.htm","arts":[{"t":"p","x":"附件编号：CNCA-CCIS-2023网络关键设备和网络安全专用产品安全认证实施规则国家认证认可监督管理委员会发布\n1 适用范围\n本规则依据《中华人民共和国网络安全法》《中华人民共和国认证认可条例》制定，规定了《网络关键设备和网络安全专用产品目录》中的产品实施认证的基本原则和要求。\n本规则适用于国家互联网信息办公室、工业和信息化部、公安部、国家认证认可监督管理委员会等部门发布的网络关键设备和网络安全专用产品。\n认证机构应当依据本规则要求编制认证实施细则，并配套本规则共同实施。\n2 认证依据标准\n网络关键设备认证依据的标准为GB 40050，网络安全专用产品认证依据的标准为GB 42250。\n上述标准原则上应当执行最新版本，当需要使用标准的其他版本时，按有关主管部门发布的文件要求执行。\n3 认证模式\n型式试验+ 获证后监督\n4 认证单元划分\n原则上，按产品型号/版本划分认证单元。同一认证单元内有多个型号/版本的产品时，需要认证委托人提交型号/版本间的差异说明。\n5 认证实施程序\n5.\n1 认证委托\n认证机构应当明确认证委托资料要求，至少包括认证委托人信息、产品功能说明书和/或使用手册、安全保障能力文件、同一认证单元中型号/版本的差异说明（适用时）等。\n认证委托人应当按认证机构要求提出认证委托，认证机构在对认证委托审核后及时反馈是否受理。\n5.\n2 型式试验\n认证机构应当根据认证委托确定型式试验方案，包括型式试验的全部样品要求和数量、检测标准项目、实验室信息等，并告知认证委托人。\n认证委托人应当按照型式试验方案向实验室提供型式试验样品。\n实验室应当对型式试验全过程作出完整记录，并妥善管理、保存、保密相关文件，确保检测结果可追溯。型式试验结束后，实验室应当及时向认证机构和认证委托人出具型式试验报告。\n5.3 认证结果评价与批准认证机构对型式试验和相关文件信息进行综合评价，作出认证决定。对符合认证要求的，颁发认证证书并允许使用认证标志；对暂不符合认证要求的，允许认证委托人限期整改，对整改后仍然不符合认证要求的，认证机构不予批准认证委托，认证终止。\n5.\n4 获证后监督\n5.4.1 生产企业分类管理\n认证机构应当根据诚信守法状况、所生产产品质量状况等与质量相关的信息进行综合评价，对生产企业进行分类，从而对不同类别生产企业所生产的产品在获证后监督等方面实施差异化管理，以实现控制认证风险、提高认证活动的质量和效率、确保获证产品持续符合认证要求的目标。\n5.4.2 监督的频次\n认证机构应当对获证产品、生产者和生产企业进行持续监督，并在生产企业分类管理的基础上合理确定监督频次，具体要求应当在实施细则中予以明确。\n5.4.3 监督的实施\n获证后监督的内容为安全质量持续符合能力评价或产品检测。安全质量持续符合能力评价的内容包括产品一致性、认证标志管理等。认证机构应当在实施细则中对评价内容及评价方式予以明确。\n5.\n4.4 获证后监督结果的评价\n认证机构对获证后监督结论和相关文件信息进行综合评价，作出认证决定。对符合认证要求的，可继续保持认证证书、使用认证标志；不符合的，允许认证委托人限期整改，对整改后仍然不符合认证要求的，认证机构应当根据相应情形作出暂停或者撤销认证证书的处理，停止使用认证标志，并予以公布。\n5.\n5 认证时限\n认证机构应当对认证各环节的时限作出明确规定，并确保相关工作按时限要求完成。认证委托人须对认证活动予以积极配合。一般情况下，自受理认证委托起60天内向认证委托人出具认证证书。\n6 认证证书\n6.\n1 认证证书的保持\n认证证书的有效期为5年。在有效期内，通过认证机构的获证后监督，保持认证证书的有效性。认证证书有效期届满、需要延续使用的，认证委托人应当在有效期届满前90天内提出认证委托。认证有效期内最后一次获证后监督结果合格的，认证机构应当在接到认证委托后直接换发新证书。\n6.\n2 认证证书的变更\n获证产品、生产者、生产企业等发生变化，或认证要求发生变更时，认证委托人应当向认证机构提出变更委托。\n认证机构根据变更的内容，对委托文件进行评价，作出认证决定。\n6.\n3 认证证书覆盖产品的扩展认证委托人需要扩展已经获得的认证证书覆盖的产品范围时，应当向认证机构提出扩展委托，并提供扩展产品和获证产品之间的差异说明。\n认证机构根据扩展的内容，对委托文件进行评价，确认原认证结果对扩展产品的有效性，作出认证决定。\n6.\n4 认证证书的暂停、注销和撤销认证证书的暂停、注销和撤销依据有关规定执行。在认证证书暂停期间及认证证书注销和撤销后，获证机构不得继续使用证书。\n7 认证标志\n7.\n1 认证标志的样式\n7.2认证标志的使用认证标志在使用时可以等比例的放大或缩小，不允许变形。\n7.3 加施方式\n可以采用统一印制的标准规格标志，或模压、铭牌印刷、软件加施等方式。\n7.4 标志位置\n硬件产品应当在本体的铭牌附近加施认证标志。\n软件产品应当在其软件包装/载体上加施认证标志，如该软件产品不使用包装/载体，则应当在软件使用的许可协议中的显著位置明确该产品已经获得认证。\n8 认证实施细则\n认证机构应当依据本规则有关要求，细化认证实施程序，制定科学、合理、可操作的认证实施细则，并对外公布实施。\n9 认证责任\n认证机构应当对其作出的认证结论负责。\n实验室应当对其检测结果和检测报告负责。\n认证委托人应当对其所提交的认证委托文件及样品的真实性、合法性负责。\n儀儀儀儀儀儀儀儀儀儀儀M根据我局与越南科技与环境部签署的谅解备忘录，自2002年10月1日起，中国出口越南的摩托车、摩托车发动机和头盔应经过强制性产品认证并加贴“CCC”认证标志"}]}];

}
function parseExplanations(text){
  /* 只按题目唯一 ID（十六进制）匹配；不按原题号，因为不同题目题号可能相同 */
  const hex2id = {};
  QUESTIONS.forEach(q => { hex2id[q.hex.toUpperCase()] = q.id; });
  const normHex = k => {
    const s = k.trim().toUpperCase().replace(/^#/, '').replace(/^0X/, '');
    return /^[0-9A-F]{1,4}$/.test(s) ? s.padStart(3,'0') : null;
  };
  let matched = 0;
  text.replace(/^\uFEFF/, '').split(/\r?\n/).forEach(line => {
    const t = line.trim();
    if(!t.startsWith('|')) return;
    const cells = t.replace(/\\\|/g, '\u0001').split('|').map(c => c.trim().replace(/\u0001/g, '|'));
    if(cells.length && cells[0] === '') cells.shift();
    if(cells.length && cells[cells.length-1] === '') cells.pop();
    if(cells.length < 2) return;
    const key = cells[0], exp = cells[1];
    if(!key || !exp) return;
    if(/^:?-+:?$/.test(key) || /题\s*目\s*ID|^\s*ID/i.test(key)) return;   // 分隔行 / 表头
    const hx = normHex(key);
    const id = (hx && hex2id[hx]) || (BY_ID[key] ? key : null);
    if(id && EXP[id] !== exp){ EXP[id] = exp; matched++; }
  });
  return matched;
}
function loadExplanations(){
  fetch('analysis.md', {cache:'no-store'})
    .then(r => { if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(t => {
      const n = parseExplanations(t);
      if(n){ render(); toast(`已读取 ${n} 条题目解析（analysis.md）`); }
    })
    .catch(() => { /* 直接以 file:// 打开时浏览器禁止读取同目录文件，解析功能静默不可用；通过 HTTP 访问或发布后可用 */ });
}

/* ---------- 卡片 ---------- */
function optClass(q, k){
  const s = st(q.id);
  let cls = 'opt';
  const ans = q.ans.split('');
  if(!s) return cls;
  const hideAns = view.kind === 'wrong' && s.done && !s.revealed;   // 错题本未查看答案：不标正确答案
  if(s.sel.includes(k)) cls += ' sel';
  if(s.done && !hideAns){
    if(ans.includes(k)) cls += ' ok';
    else if(s.sel.includes(k)) cls += ' bad';
    else cls += ' dim';
  }
  if(hideAns && !s.ok && s.sel.includes(k)) cls = cls.replace(' sel','') + ' bad';   // 错题本未查看答案：上次错选标红
  if(s.done && (s.wrongSel||[]).includes(k) && !s.sel.includes(k) && !cls.includes('ok')) cls += ' wsel';
  return cls;
}

function cardHTML(q, idx){
  const s = st(q.id);
  const done = !!(s && s.done);
  const locked = done;
  const hideAns = view.kind === 'wrong' && done && s && !s.revealed;   // 错题本默认不显示正确答案
  const ans = q.ans;
  let body = '';

  if(q.type === '填空题'){
    body = `<div class="fill">
      <input type="text" class="fillin" placeholder="输入你的答案…" value="${s && s.sel[0] ? esc(s.sel[0]) : ''}" ${locked?'disabled':''}>
      ${locked?'':`<button class="btn primary" data-act="submit">提交</button>`}
    </div>`;
  } else if(q.type === '判断题'){
    body = `<div class="judge">
      ${['对','错'].map(k=>{
        let mk = '';
        if(hideAns){
          if(s.sel.includes(k)) mk = '你的选择';
          else if((s.wrongSel||[]).includes(k)) mk = '上次作答';
        } else {
          if(done && q.ans === k) mk = '正确答案';
          if(done && s.sel.includes(k)) mk = (done && s.sel[0] !== ans) ? '你的选择' : mk;
          if(done && (s.wrongSel||[]).includes(k) && !s.sel.includes(k) && ans !== k) mk = '上次作答';
        }
        return `<button class="${optClass(q,k)}" data-k="${k}"><span class="k"></span><span class="t">${k}</span>${mk?`<span class="mk">${mk}</span>`:''}</button>`;
      }).join('')}
    </div>`;
  } else {
    const multiBar = q.type === '多选题'
      ? `<div class="fill"><button class="btn primary" data-act="submit"${(s && s.sel && s.sel.length) ? '' : ' disabled'}>提交答案</button><span class="hint" style="align-self:center">可多选</span></div>` : '';
    body = `<div class="opts">${q.opts.map((t,i)=>{
      const k = String.fromCharCode(65+i);
      let mk = '';
      if(hideAns){
        if(s.sel.includes(k)) mk = '你的选择';
        else if((s.wrongSel||[]).includes(k)) mk = '上次作答';
      } else {
        const isAns = done && ans.includes(k);
        const mine = done && s.sel.includes(k);
        if(isAns && mine) mk = '正确答案 · 已选';
        else if(isAns) mk = '正确答案';
        else if(mine) mk = '你的选择';
        else if(done && (s.wrongSel||[]).includes(k) && !ans.includes(k)) mk = '上次作答';
      }
      return `<button class="${optClass(q,k)}" data-k="${k}"><span class="k">${k}</span><span class="t">${hl(t)}</span>${mk?`<span class="mk">${mk}</span>`:''}</button>`;
    }).join('')}</div>${multiBar}`;
  }

  let res = '';
  if(done){
    const revealed = s.revealed;
    const key = q.type === '判断题' ? q.ans : (ans ? ans.split('').join('') : '—');
    const mine = s.sel.length ? s.sel.join('') : '未作答';
    const wsel = (s.wrongSel && s.wrongSel.length) ? s.wrongSel.join('') : null;
    if(hideAns){
      if(s.ok) res = `<div class="res good show">✓ 已订正${wsel?` · 上次答错 <span class="ans-key">${esc(wsel)}</span>`:''}</div>`;
      else res = `<div class="res bad show">✗ 上次答错 · 你的答案 <span class="ans-key">${esc(s.sel.length?mine:'—')}</span></div>`;
    } else if(revealed && s.ok === null){
      res = `<div class="res info show">已显示答案 · 正确答案 <span class="ans-key">${esc(key)}</span></div>`;
    } else if(s.ok){
      res = `<div class="res good show">✓ 回答正确 · 正确答案 <span class="ans-key">${esc(key)}</span></div>`;
    } else {
      res = `<div class="res bad show">✗ 回答错误 · 正确答案 <span class="ans-key">${esc(key)}</span>${q.type==='填空题'?'':'，你的选择 '+esc(mine)}</div>`;
    }
  }

  const hintText = done
    ? (s && s.ok === null ? '已查看答案' : (s && s.ok ? '已答对' : '已答错'))
    : (q.type==='多选题'?'多选题：选好后点“提交”':q.type==='填空题'?'填空题：填好后点“提交”':'点击选项即可作答');
  const rmBtn = view.kind === 'wrong' ? `<button class="btn ghost" data-act="rmwrong">移出错题本</button>` : '';
  const foot = `<div class="q-foot">
      <span class="hint">${hintText}</span>
      <span class="right">
        ${done?`<button class="btn ghost" data-act="redo"${view.kind==='wrong'?' title="隐藏本页全部答案，整页重新作答"':''}>${view.kind==='wrong'?'重做本页':'重做'}</button>`:`<button class="btn ghost" data-act="reveal">查看答案</button>`}
        ${view.kind==='wrong' && done && !s.revealed ? `<button class="btn ghost" data-act="reveal">查看答案</button>` : ''}${rmBtn}
      </span>
    </div>`;

  return `<article class="q${done?' locked':''}" id="q-${q.id}" data-id="${q.id}">
    <div class="q-hd">
      <span class="q-no">${idx}</span>
      <span class="tag t${TYPES.indexOf(q.type)}">${q.type}</span>
      <span class="q-meta">原题号 ${q.num}</span><span class="qhex" title="题目ID，可用于 analysis.md 引用">${q.hex}</span>
    </div>
    <div class="q-stem">${hl(q.stem)}</div>
    ${(q.refs && q.refs.length && !done && view.showRefs) ? `<div class="qlaws"><span class="lbl">关联</span>${q.refs.map((i,k)=>lawChip(i,0,(q.arefs||[])[k])).join('')}</div>` : ''}
    ${body}
    ${res}
    ${(done && q.refs && q.refs.length) ? basisHTML(q) : ''}
    ${(done && EXP[q.id] && !hideAns) ? `<div class="qexp"><span class="lbl">解析</span><div class="expbody">${expHTML(EXP[q.id])}</div></div>` : ''}
    ${foot}
  </article>`;
}

/* ---------- 数据筛选 ---------- */
function currentList(){
  if(view.kind === 'wrong'){
    return QUESTIONS.filter(q => st(q.id) && st(q.id).wrong);
  }
  if(view.kind === 'search'){
    const k = view.keyword.trim().toLowerCase();
    if(!k) return [];
    return QUESTIONS.filter(q => (q.stem + ' ' + q.opts.join(' ')).toLowerCase().includes(k));
  }
  let list = chapterItems(view.ci);
  if(view.type) list = list.filter(q => q.type === view.type);
  if(view.filter === 'todo') list = list.filter(q => !st(q.id) || !st(q.id).done);
  if(view.filter === 'wrong') list = list.filter(q => st(q.id) && st(q.id).wrong);
  if(view.filter === 'done') list = list.filter(q => st(q.id) && st(q.id).done);
  if(view.shuffle){
    if(!view.order || view.order.length !== list.length) view.order = shuffled(list.length);
    const m = new Map(); list.forEach((q,i)=>m.set(i,q));
    list = view.order.map(i => m.get(i)).filter(Boolean);
  }
  return list;
}
function shuffled(n){
  const a = [...Array(n).keys()];
  for(let i=n-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function afterRender(content){
  if(view.kind === 'lawq' && view.artsel){
    window.scrollTo = _realScrollTo;
    const el = document.querySelector('#lawText [data-a="' + view.artsel + '"]');
    if(el){
      el.scrollIntoView({block:'center'});
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      setTimeout(()=>el.classList.remove('flash'), 2400);
    }
    view.artsel = null; restoring = false;
    updateStats();
    return;
  }
  if(restoring){
    window.scrollTo = _realScrollTo;
    if(pendingAnchor){
      const el = document.getElementById('q-' + pendingAnchor);
      if(el){
        const y = el.getBoundingClientRect().top + window.scrollY - 76;
        window.scrollTo({top: Math.max(0, y)});
        el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'), 2400);
      } else if(pendingScrollY != null){
        window.scrollTo({top: pendingScrollY});
      }
    } else if(pendingScrollY != null){
      window.scrollTo({top: pendingScrollY});
    }
    pendingAnchor = null; pendingScrollY = null;
  } else {
    window.scrollTo({top:0});
  }
}

function applyRevealAll(){
  document.querySelectorAll('.q').forEach(el => {
    const id = el.dataset.id, q = BY_ID[id], s = st(id);
    if(s && s.done) return;
    const key = q.type==='判断题'? q.ans : q.ans;
    el.querySelectorAll('.opt').forEach(o=>{
      const k = o.dataset.k;
      if(q.ans.split('').includes(k)){ o.classList.add('ok'); o.classList.remove('sel'); 
        if(!o.querySelector('.mk')) o.insertAdjacentHTML('beforeend','<span class="mk">正确答案</span>'); }
      else o.classList.add('dim');
    });
    if(!el.querySelector('.res')){
      el.insertAdjacentHTML('beforeend', `<div class="res info show">正确答案 <span class="ans-key">${esc(key||'—')}</span></div>`);
    }
    el.classList.add('locked');
  });
}

/* ---------- 法规与标准 ---------- */
function chapterChips(items){
  const rc = {};
  items.forEach(q => (q.refs||[]).forEach(i => rc[i]=(rc[i]||0)+1));
  const tops = Object.entries(rc).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(!tops.length) return '';
  return `<div class="qlaws"><span class="lbl">本章涉及</span>${tops.map(([i,c])=>lawChip(+i,c)).join('')}</div>`;
}

function badgeHTML(anchor, n){
  return `<button class="abadge" data-ago="${esc(anchor)}" title="相关题目">${n} 题</button>`;

function lawBodyHTML(FT){
  return FT.arts.map(a => {
    if(a.t === 'h') return `<div class="lh">${esc(a.x)}</div>`;
    if(a.t === 'a'){
      const m = a.x.match(/^(第[\u4e00-\u9fff\d]{1,4}条)/);
      const anchor = m ? m[1] : '';
      const b = (anchor && view.lawidx && lawQMap[anchor]) ? badgeHTML(anchor, lawQMap[anchor].length) : '';
      const hl = view.artsel === anchor ? ' flash' : '';
      return `<p class="la${hl}" data-a="${esc(anchor)}">${esc(a.x).replace(/^(第[\u4e00-\u9fff\d]{1,4}条)/,'<b>$1</b>')}${b}</p>`;
    }
    return a.x.split('\n').map(ln => {
      if(/^(（[\u4e00-\u9fff]+）|[\u4e00-\u9fff]+、|\d{1,2}(?:\.\d{1,2})* )/.test(ln) && ln.length < 40){
        const b = (view.lawidx && lawQMap[ln]) ? badgeHTML(ln, lawQMap[ln].length) : '';
        const hl = view.artsel === ln ? ' flash' : '';
        return `<div class="lh2${hl}" data-a="${esc(ln)}">${esc(ln)}${b}</div>`;
      }
      return `<p class="lp">${esc(ln)}</p>`;
    }).join('');
  }).join('');
}

/* ---------- 统计 ---------- */
function updateStats(){
  const all = QUESTIONS;
  const done = all.filter(q=>st(q.id)&&st(q.id).done).length;
  const right = all.filter(q=>st(q.id)&&st(q.id).done&&st(q.id).ok).length;
  const wrong = all.filter(q=>st(q.id)&&st(q.id).wrong).length;
  $('#pgDone').textContent = done;
  $('#pgBar').style.width = pct(done, all.length) + '%';
  $('#wrongCount').textContent = wrong;
  $('#topStat').innerHTML = `已答 <b>${done}</b> · 正确率 <b>${done?pct(right,done):0}%</b>`;
}

/* ---------- 判分 ---------- */
function grade(q, sel){
  if(q.type === '填空题'){
    const norm = s => s.toLowerCase().replace(/[\s，。、；：""''（）()《》\-_,.;:]/g,'');
    return norm(sel[0]||'') === norm(q.ans) && q.ans !== '';
  }
  const a = q.ans.split('').sort().join('');
  const b = sel.slice().sort().join('');
  return a === b;
}

function commit(qid, sel){
  const q = BY_ID[qid];
  const ok = grade(q, sel);
  const prev = st(qid);
  const wasWrong = !!(prev && prev.wrong);
  const wrongSel = !ok ? sel : (prev && prev.wrongSel ? prev.wrongSel : null);
  state[qid] = {sel: sel, done: true, ok: ok, revealed: false, wrong: wasWrong || !ok, wrongSel: wrongSel, ts: Date.now()};
  save();
  refreshCard(qid);
  updateStats(); buildSidebar();
  if(view.kind === 'wrong' && ok) toast('已订正，仍保留在错题本，可点“移出错题本”删除');
}

function refreshCard(qid){
  const el = document.querySelector(`.q[data-id="${qid}"]`);
  if(!el) return;
  const list = currentList();
  const i = list.findIndex(q=>q.id===qid);
  const idx = i>=0 ? i+1 : (el.querySelector('.q-no').textContent);
  const tmp = document.createElement('div');
  tmp.innerHTML = cardHTML(BY_ID[qid], idx);
  const node = tmp.firstElementChild;
  node.classList.add('flash');
  el.replaceWith(node);
  if(view.revealAll) { /* 保持整体显示状态 */ }
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const jump = e.target.closest('[data-jump]');
  if(jump){
    const el = document.getElementById('q-'+jump.dataset.jump);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1200); }
    return;
  }
  const opt = e.target.closest('.opt');
  if(opt){
    const card = opt.closest('.q'); if(!card || card.classList.contains('locked')) return;
    const q = BY_ID[card.dataset.id];
    if(q.type === '多选题'){
      const cur = (st(q.id) && st(q.id).sel) || [];
      const k = opt.dataset.k;
      const next = cur.includes(k) ? cur.filter(x=>x!==k) : [...cur, k].sort();
      card.querySelectorAll('.opt').forEach(o=>{
        o.classList.toggle('sel', next.includes(o.dataset.k));
      });
      const sb = card.querySelector('[data-act="submit"]');
      if(sb) sb.disabled = next.length === 0;
      return;
    }
    if(q.type === '判断题'){ commit(q.id, [opt.dataset.k]); return; }
    commit(q.id, [opt.dataset.k]);
    return;
  }
  const btn = e.target.closest('[data-act]');
  if(btn){
    const act = btn.dataset.act;
    const card = btn.closest('.q');
    if(act === 'submit' && card){
      const q = BY_ID[card.dataset.id];
      if(q.type === '多选题'){
        const sel = [...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k);
        if(!sel.length){ toast('请先选择选项'); return; }
        commit(q.id, sel);
      } else if(q.type === '填空题'){
        const v = card.querySelector('.fillin').value.trim();
        if(!v){ toast('请先填写答案'); card.querySelector('.fillin').focus(); return; }
        commit(q.id, [v]);
      }
      return;
    }
    if(act === 'reveal' && card){
      const q = BY_ID[card.dataset.id];
      const prev = st(q.id);
      state[q.id] = {sel: prev && prev.done ? prev.sel : [], done: true, ok: null, revealed: true,
                     wrong: !!(prev && prev.wrong), wrongSel: prev ? (prev.wrongSel || null) : null, ts: Date.now()};
      save(); refreshCard(q.id); updateStats(); buildSidebar();
      return;
    }
    if(act === 'redo' && card){
      if(view.kind === 'wrong'){
        // 重做本页：隐藏本页所有答案，全部回到未作答状态
        document.querySelectorAll('#content .q').forEach(el=>{
          const p = st(el.dataset.id); if(!p) return;
          state[el.dataset.id] = {sel: [], done: false, ok: null, revealed: false, wrong: true, wrongSel: p.wrongSel || null, ts: Date.now()};
        });
        save(); render(); toast('已隐藏本页全部答案，可重新作答');
        return;
      }
      { const prev = st(card.dataset.id); const wasWrong = !!(prev && prev.wrong);
        /* 普通页面重做 = 全新开始：清空历史错选记录，重新作答后不再显示"上次作答" */
        state[card.dataset.id] = {sel: [], done: false, ok: null, revealed: false, wrong: wasWrong, wrongSel: null, ts: Date.now()};
        save(); refreshCard(card.dataset.id); updateStats(); buildSidebar(); }
      return;
    }
    if(act === 'redoall' && view.kind === 'wrong'){
      document.querySelectorAll('#content .q').forEach(el=>{
        const p = st(el.dataset.id); if(!p) return;
        state[el.dataset.id] = {sel: [], done: false, ok: null, revealed: false, wrong: true, wrongSel: p.wrongSel || null, ts: Date.now()};
      });
      save(); render(); toast('已隐藏本页全部答案，可重新作答');
      return;
    }
    if(act === 'shuffle'){ view.shuffle = !view.shuffle; view.order = null; render(); return; }
    if(act === 'revealall'){
      view.revealAll = !view.revealAll;
      if(view.revealAll){ document.querySelectorAll('#content .q').forEach(()=>{}); }
      render();
      return;
    }
    if(act === 'cardgrid'){ view.cardgrid = !view.cardgrid; render(); return; }
    if(act === 'lawidx'){ view.lawidx = !view.lawidx; ui.lawidx = view.lawidx; saveUi(); render(); return; }
    if(act === 'backq' && backTo){
      const b = backTo;
      backTo = null; saveBack();
      if(b.kind === 'lawq'){
        view.kind = 'lawq'; view.law = b.law; view.lawtab = 'q'; view.artsel = null; view.artq = null;
      }else{
        view.kind = ['set','wrong','search'].includes(b.kind) ? b.kind : 'set';
        view.ci = b.ci || 0; view.type = b.type || null; view.filter = b.filter || 'all';
        view.keyword = b.keyword || '';
        const se = $('#search'); if(se) se.value = view.keyword;
      }
      pendingAnchor = b.anchor || null;
      pendingScrollY = b.anchor ? null : (b.scrollY || 0);
      render();
      return;
    }
    if(act === 'showrefs'){ view.showRefs = !view.showRefs; ui.showRefs = view.showRefs; saveUi(); render(); return; }
    if(act === 'lawback'){ view.kind = 'laws'; view.artsel = null; view.artq = null; render(); window.scrollTo({top:0}); return; }
    if(act === 'artback'){ view.lawtab = 'law'; view.artsel = view.artq; render(); return; }
    if(act === 'artclear'){ view.artq = null; render(); window.scrollTo({top:0}); return; }
    if(act === 'rmwrong' && card){
      const s = st(card.dataset.id);
      if(s){ s.wrong = false; save(); buildSidebar(); updateStats(); render(); toast('已移出错题本'); }
      return;
    }
    if(act === 'cleanwrong'){
      Object.keys(state).forEach(k=>{ if(state[k].wrong) delete state[k]; });
      save(); render(); return;
    }
  }

  const agoEl = e.target.closest('[data-ago]');
  if(agoEl){
    // 点原文条文索引徽章 → 相关题目页只显示该条文的题目
    view.artq = agoEl.dataset.ago; view.lawtab = 'q'; view.artsel = null;
    render();
    window.scrollTo({top:0});
    return;
  }
  const jumpEl = e.target.closest('[data-lawjump]');
  if(jumpEl){
    const parts = jumpEl.dataset.lawjump.split('|');
    const hasArt = !!parts[1];
    rememberBack(jumpEl);
    view.kind = 'lawq'; view.law = +parts[0]; view.artsel = parts[1] || null; view.lawtab = 'law'; view.artq = null;
    render();
    if(!hasArt) window.scrollTo({top:0});
    document.body.classList.remove('nav-open');
    return;
  }
  const chipEl = e.target.closest('[data-law]');
  if(chipEl){
    rememberBack(chipEl);
    view.kind = 'lawq'; view.law = +chipEl.dataset.law; view.artsel = null; view.artq = null; view.lawtab = lawEntryTab(view.law);
    render(); window.scrollTo({top:0});
    document.body.classList.remove('nav-open');
    return;
  }
  const lawItem = e.target.closest('[data-lawitem]');
  if(lawItem){
    view.kind = 'lawq'; view.law = +lawItem.dataset.lawitem; view.artq = null; view.lawtab = lawEntryTab(view.law);
    render(); window.scrollTo({top:0});
    return;
  }
  const lawCat = e.target.closest('[data-lawcat]');
  if(lawCat){
    view.kind = 'laws'; view.cat = lawCat.dataset.lawcat; view.lawkw = '';
    render(); window.scrollTo({top:0});
    document.body.classList.remove('nav-open');
    return;
  }
  const lawNav = e.target.closest('[data-lawnav]');
  if(lawNav){
    view.kind = 'laws'; view.cat = view.cat || 'all'; view.lawkw = '';
    render(); window.scrollTo({top:0});
    document.body.classList.remove('nav-open');
    return;
  }
  const tabEl = e.target.closest('[data-lawtab]');
  if(tabEl){
    view.lawtab = tabEl.dataset.lawtab;
    render();
    window.scrollTo({top: 0});
    return;
  }
  const chHd = e.target.closest('[data-ch]');
  if(chHd){
    const ci = +chHd.dataset.ch;
    const box = chHd.parentElement;
    const same = view.kind === 'set' && view.ci === ci && !view.type;
    box.classList.toggle('open');
    if(box.classList.contains('open')) nav.open.add(ci); else nav.open.delete(ci);
    if(!(same && !box.classList.contains('open'))){
      view.kind = 'set'; view.ci = ci; view.type = null; view.filter = 'all';
      view.shuffle = false; view.order = null; view.keyword = ''; $('#search').value = '';
      nav.open.add(ci);
      render(); window.scrollTo({top:0});
      document.body.classList.remove('nav-open');
    }
    return;
  }
  const sxNav = e.target.closest('[data-sxnav]');
  if(sxNav){
    view.kind = 'shixun'; view.keyword = ''; $('#search').value = '';
    const box = sxNav.parentElement;
    box.classList.toggle('open');
    render(); window.scrollTo({top:0});
    document.body.classList.remove('nav-open');
    return;
  }
  const sxCh = e.target.closest('[data-sxch]');
  if(sxCh){
    view.kind = 'shixun'; render();
    const chName = sxCh.dataset.sxch;
    const target = [...document.querySelectorAll('.sx-chap')].find(el => el.textContent.trim() === chName);
    if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    document.body.classList.remove('nav-open');
    return;
  }
  const setBtn = e.target.closest('[data-set]');
  if(setBtn){
    view.kind = 'set'; view.ci = +setBtn.dataset.set;
    view.type = setBtn.dataset.type || null;
    view.filter = 'all'; view.shuffle = false; view.order = null; view.keyword = '';
    $('#search').value = '';
    nav.open.add(view.ci);
    render(); window.scrollTo({top:0});
    document.body.classList.remove('nav-open');
    return;
  }
  const fBtn = e.target.closest('[data-f]');
  if(fBtn){
    view.filter = fBtn.dataset.f; view.order = null; render(); return;
  }
  const sx = e.target.closest('[data-sx]');
  if(sx){ sx.closest('.sx').classList.toggle('open'); return; }
  const partHd = e.target.closest('[data-part]');
  if(partHd){
    const name = partHd.dataset.part;
    const first = DATA.findIndex(c => c.p === name);
    if(first >= 0){
      view.kind='set'; view.ci=first; view.type=null; view.filter='all'; view.shuffle=false; view.order=null;
      nav.open.add(first); render(); window.scrollTo({top:0});
      document.body.classList.remove('nav-open');
    }
    return;
  }
});

/* 法规筛选 */

  if(e.target && e.target.id === 'lawFilter'){
    view.lawkw = e.target.value;
    const v = e.target.value;

    const inp = $('#lawFilter');

/* 搜索 */
let sTimer;
$('#search').addEventListener('input', e => {
  clearTimeout(sTimer);
  const v = e.target.value;
  sTimer = setTimeout(()=>{
    if(!v.trim()){ view.kind='set'; view.keyword=''; render(); return; }
    view.kind='search'; view.keyword = v; render();
  }, 220);
});
$('#searchClear').addEventListener('click', ()=>{
  $('#search').value=''; view.keyword=''; view.kind='set'; render();
});

$('#menuBtn').addEventListener('click', ()=> document.body.classList.toggle('nav-open'));
$('#btnWrong').addEventListener('click', ()=>{
  view.kind='wrong'; view.keyword=''; $('#search').value=''; render(); window.scrollTo({top:0});
  document.body.classList.remove('nav-open');
});
function exportProgress(){
  const payload = {app:'mm-tiku', ver:1, savedAt:new Date().toISOString(), state};
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const d = new Date(), pad = n => String(n).padStart(2,'0');
  const a = document.createElement('a');
  a.href = url;
  a.download = `密码题库进度-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  toast('进度已导出，可保存到网盘或别处');
}

function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const raw = JSON.parse(fr.result);
      const obj = raw && raw.state ? raw.state : raw;
      if(!obj || typeof obj !== 'object') throw new Error('bad');
      let n = 0;
      Object.keys(obj).forEach(k => {
        const v = obj[k];
        if(!BY_ID[k] || !v || !Array.isArray(v.sel)) return;
        state[k] = {sel:v.sel, done:!!v.done, ok:(v.ok===null?null:!!v.ok), revealed:!!v.revealed, wrong:!!v.wrong || (!!v.done && v.ok===false),
                    wrongSel:(v.wrongSel !== undefined ? v.wrongSel : ((!!v.done && v.ok===false && v.sel && v.sel.length) ? v.sel : null)), ts:v.ts||Date.now()};
        n++;
      });
      save(); render(); window.scrollTo({top:0});
      toast(n ? `已导入 ${n} 条作答记录` : '文件里没有可用的作答记录');
    }catch(e){ toast('文件格式不正确'); }
  };
  fr.readAsText(file);
}

$('#btnExport').addEventListener('click', exportProgress);
$('#btnImport').addEventListener('click', ()=> $('#fileImport').click());
$('#fileImport').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if(f) importProgress(f);
  e.target.value = '';
});

$('#btnReset').addEventListener('click', ()=>{
  if(!confirm('确定清空全部作答记录吗？此操作不可撤销。')) return;
  state = {}; save(); render(); toast('已重置');
});

/* ---------- QQ交流群弹窗（是否启用由同目录 config.json 的 qqPopup 控制） ---------- */
const QQDEFAULT = {name:'CTF交流群', id:'1043670522'};
function openQQ(){ $('#qqMask').hidden = false; }
function closeQQ(){
  if($('#qqNoMore').checked && !ui.qqhide){ ui.qqhide = true; saveUi(); }
  $('#qqMask').hidden = true;
}
$('#qqClose').addEventListener('click', closeQQ);
$('#qqCloseX').addEventListener('click', closeQQ);
$('#qqMask').addEventListener('click', e => { if(e.target === e.currentTarget) closeQQ(); });
$('#btnQQ').addEventListener('click', openQQ);

(function(){
  /* 通过 HTTP 访问时读取同目录 config.json；file:// 打开或读取失败时按默认配置（显示弹窗） */
  fetch('config.json', {cache:'no-store'})
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .catch(() => { return {}; })
    .then(c => {
      const cfg = c || {};
      const g = Object.assign({}, QQDEFAULT, cfg.qqGroup || {});
      $('#qqName').textContent = g.name;
      $('#qqId').textContent = '群号：' + g.id;
      if(cfg.qqPopup !== false && !ui.qqhide) openQQ();
    });
})();

(function(){
  const pos = loadPos();
  if(pos){
    view.kind = pos.kind;
    if(pos.kind === 'set'){ view.ci = pos.ci; view.type = pos.type || null; view.filter = pos.filter || 'all'; }
    if(pos.kind === 'laws'){ view.cat = pos.cat || 'all'; }
    if(pos.kind === 'lawq'){ view.law = pos.law; view.lawtab = pos.anchor ? 'q' : (pos.lawtab || 'q'); view.artq = pos.artq || null; }
    pendingAnchor = pos.anchor || null;
    pendingScrollY = pos.anchor ? null : (pos.scrollY || 0);
  }
})();
render();
loadExplanations();
