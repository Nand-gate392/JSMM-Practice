的机构，应当经国家密码管理局认定，依法取得商用密码检测机构资质。"},{"t":"a","x":"第五条 国家密码管理局支持商用密码应用安全性评估技术、标准、工具创新，完善商用密码应用安全性评估标准体系，鼓励设立商用密码应用安全性评估行业组织，加强行业自律，维护行业秩序。"},{"t":"a","x":"第六条 法律、行政法规和国家有关规定要求使用商用密码进行保护的网络与信息系统（以下简称重要网络与信息系统），其运营者应当使用商用密码进行保护，制定商用密码应用方案，配备必要的资金和专业人员，同步规划、同步建设、同步运行商用密码保障系统，并定期开展商用密码应用安全性评估。"},{"t":"a","x":"第七条 重要网络与信息系统规划阶段，其运营者应当依照相关法律法规和标准规范，根据商用密码应用需求，制定商用密码应用方案，规划商用密码保障系统。\n重要网络与信息系统的运营者应当自行或者委托商用密码检测机构对商用密码应用方案进行商用密码应用安全性评估。商用密码应用方案未通过商用密码应用安全性评估的，不得作为商用密码保障系统的建设依据。"},{"t":"a","x":"第八条 重要网络与信息系统建设阶段，其运营者应当按照通过商用密码应用安全性评估的商用密码应用方案组织实施，落实商用密码安全防护措施，建设商用密码保障系统。\n重要网络与信息系统运行前，其运营者应当自行或者委托商用密码检测机构开展商用密码应用安全性评估。网络与信息系统未通过商用密码应用安全性评估的，运营者应当进行改造，改造期间不得投入运行。"},{"t":"a","x":"第九条 重要网络与信息系统建成运行后，其运营者应当自行或者委托商用密码检测机构每年至少开展一次商用密码应用安全性评估，确保商用密码保障系统正确有效运行。未通过商用密码应用安全性评估的，运营者应当进行改造，并在改造期间采取必要措施保证网络与信息系统运行安全。"},{"t":"a","x":"第十条 对商用密码应用方案开展商用密码应用安全性评估，应当包括以下内容：\n（一）考量商用密码应用需求的全面性、合理性和针对性，对照相关标准规范选取适用指标的准确性，以及不适用指标论证的充分性；\n（二）分析商用密码应用流程和机制是否具备可实施性、商用密码保护措施是否达到相应的商用密码应用要求、相关描述是否详尽；\n（三）论证商用密码技术、产品和服务选用的合规性，密钥管理的安全性，以及使用商用密码解决安全风险的科学性；\n（四）编制形成商用密码应用安全性评估报告。"},{"t":"a","x":"第十一条 对建设完成的网络与信息系统开展商用密码应用安全性评估，应当包括以下内容：\n（一）对照商用密码应用方案，了解网络与信息系统基本情况，准确划定评估范围；\n（二）确定评估指标及评估对象，论证编制商用密码应用安全性评估实施方案；\n（三）依据商用密码应用安全性评估实施方案，开展现场评估，做好数据采集和信息汇总，研判商用密码保障系统配置及运行情况；\n（四）根据客观凭据逐项对评估指标进行判定，编制形成商用密码应用安全性评估报告。"},{"t":"a","x":"第十二条 运营者开展商用密码应用安全性评估活动，应当遵守法律法规、标准规范要求，遵循客观实际、科学公正、诚实信用原则。委托商用密码检测机构开展商用密码应用安全性评估的，不得对评估结果施加不当影响，并应当提供以下支持：\n（一）对网络与信息系统的重要数据进行备份；\n（二）提供完整有效的网络与信息系统设备清单和网络拓扑；\n（三）提供详细的网络与信息系统商用密码应用方案、密码相关管理制度和密码配置、运行、维护记录；\n（四）提供商用密码产品管理入口、网络交换设备接入端口等相关信息、数据接入分析条件，并配合进行数据采集；\n（五）安排网络与信息系统相关网络管理员、系统管理员、密钥管理员、密码安全审计员、密码操作员等做好配合；\n（六）其他需要配合的事项。"},{"t":"a","x":"第十三条 自行开展商用密码应用安全性评估的网络与信息系统，其运营者应当符合以下要求：\n（一）具有与开展商用密码应用安全性评估活动相适应的设备设施；\n（二）具有与开展商用密码应用安全性评估活动相适应的项目管理、质量管理、人员管理、档案管理、安全保密管理等规章制度；\n（三）具有与开展商用密码应用安全性评估活动相适应的专业人员；\n（四）具有与开展商用密码应用安全性评估活动相适应的专业能力。\n自行开展商用密码应用安全性评估形成的商用密码应用安全性评估报告，应当符合相关国家标准、行业标准和有关规定的要求，由本单位密码或者网络安全负责人签字确认并加盖本单位公章。\n运营者应当对商用密码应用安全性评估原始记录和商用密码应用安全性评估报告归档留存，保证其具有可追溯性。商用密码应用安全性评估原始记录和商用密码应用安全性评估报告的保存期限不得少于6年。"},{"t":"a","x":"第十四条 重要网络与信息系统的运营者应当在商用密码应用安全性评估报告形成后30日内，将评估报告和相关工作情况按照国家有关规定报送国家密码管理局或者网络与信息系统所在地省、自治区、直辖市密码管理部门备案。\n国家密码管理局或者省、自治区、直辖市密码管理部门对商用密码应用安全性评估结果备案材料进行形式审查。形式审查未通过的，相关运营者应当重新提交备案材料。\n国家密码管理局可以对商用密码应用安全性评估结果进行抽样检查。抽样检查不合格的，相关运营者应当重新开展商用密码应用安全性评估。\n省、自治区、直辖市密码管理部门应当按季度向国家密码管理局报送本地区商用密码应用安全性评估工作开展情况。"},{"t":"a","x":"第十五条 运营者发现密码相关重大安全事件、重大密码安全隐患或者特殊紧急情况的，应当及时向国家密码管理局或者网络与信息系统所在地省、自治区、直辖市密码管理部门报告，并启动应急处置方案，必要时开展商用密码应用安全性评估。"},{"t":"a","x":"第十六条 县级以上地方各级密码管理部门、国家机关和涉及商用密码工作的单位可以根据工作需要，对本地区、本机关、本单位或者本系统的重要网络与信息系统商用密码应用安全性评估情况开展专项检查。"},{"t":"a","x":"第十七条 重要网络与信息系统的运营者违反《中华人民共和国密码法》、《商用密码管理条例》和本办法规定，有下列情形之一的，由密码管理部门责令改正，给予警告；拒不改正或者有其他严重情节的，处10万元以上100万元以下罚款，对直接负责的主管人员处1万元以上10万元以下罚款：\n（一）重要网络与信息系统规划阶段，未对商用密码应用方案进行商用密码应用安全性评估的；\n（二）重要网络与信息系统建设阶段，未按照通过商用密码应用安全性评估的商用密码应用方案建设商用密码保障系统的；\n（三）重要网络与信息系统运行前，未开展商用密码应用安全性评估的；\n（四）重要网络与信息系统运行前，未通过商用密码应用安全性评估且未进行改造的；\n（五）重要网络与信息系统建成运行后，未定期开展商用密码应用安全性评估的；\n（六）重要网络与信息系统建成运行后，未通过定期开展的商用密码应用安全性评估且未进行改造的；\n（七）违反法律法规、标准规范要求开展商用密码应用安全性评估的；\n（八）不符合相关要求自行开展商用密码应用安全性评估的。"},{"t":"a","x":"第十八条 重要网络与信息系统的运营者违反本办法规定，有下列情形之一的，由密码管理部门责令改正；逾期未改正或者改正后仍不符合要求的，处1万元以上10万元以下罚款，对直接负责的主管人员处5000元以上5万元以下罚款：\n（一）对商用密码应用安全性评估结果施加不当影响的；\n（二）未为商用密码应用安全性评估活动提供必要支持的；\n（三）未按照要求进行商用密码应用安全性评估结果备案的。"},{"t":"a","x":"第十九条 从事商用密码应用安全性评估监督管理工作的人员滥用职权、玩忽职守、徇私舞弊，或者泄露、非法向他人提供在履行职责中知悉的商业秘密、个人隐私、举报人信息的，依法给予处分。"},{"t":"a","x":"第二十条 本办法施行前正在建设的重要网络与信息系统，其运营者应当加强商用密码应用方案编制论证，建设完善商用密码保障系统，并按照本办法第八条规定开展商用密码应用安全性评估。\n本办法施行前已经投入运行的重要网络与信息系统，其运营者应当按照本办法第九条规定开展商用密码应用安全性评估。"},{"t":"a","x":"第二十一条 本办法自2023年11月1日起施行。"}]},{"title":"电子政务电子认证服务管理办法","source":"国家密码管理局","date":"国家密码管理局令第4号，2024年11月1日起施行","url":"https://www.oscca.gov.cn/sca/xxgk/2024-09/10/content_1061204.shtml","arts":[{"t":"a","x":"第一条 为了规范电子政务电子认证服务行为，对电子政务电子认证服务机构实施监督管理，保障电子政务安全可靠，维护有关各方合法权益，根据《中华人民共和国密码法》、《中华人民共和国电子签名法》和《商用密码管理条例》等有关法律法规，制定本办法。"},{"t":"a","x":"第二条 在中华人民共和国境内设立电子政务电子认证服务机构、提供电子政务电子认证服务及其监督管理，适用本办法。"},{"t":"a","x":"第三条 本办法所称电子政务电子认证服务，是指采用商用密码技术为政务活动提供电子签名认证服务，保证电子签名的真实性和可靠性的活动。"},{"t":"a","x":"第四条 从事电子政务电子认证服务的机构，应当经国家密码管理局认定，依法取得电子政务电子认证服务机构资质。"},{"t":"a","x":"第五条 国家密码管理局对全国电子政务电子认证服务活动实施监督管理。\n县级以上地方各级密码管理部门对本行政区域的电子政务电子认证服务活动实施监督管理。"},{"t":"h","x":"第二章 资质认定"},{"t":"a","x":"第六条 取得电子政务电子认证服务机构资质，应当符合下列条件：\n（一）具有企业法人或者事业单位法人资格；\n（二）具有与从事电子政务电子认证服务活动及其使用密码相适应的资金；\n（三）具有与从事电子政务电子认证服务活动及其使用密码相适应的运营场所；\n（四）具有在境内设置、符合国家有关密码标准的电子认证服务系统等设备设施；\n（五）具有30名以上与从事电子政务电子认证服务活动及其使用密码相适应的专业技术人员、运营管理人员、安全管理人员和客户服务人员等专业人员；\n（六）具有为政务活动提供长期电子政务电子认证服务的能力，包括持续保持财务状况良好、运营资金充足、设备设施稳定运行、专业人员队伍稳定，没有重大违法记录或者不良信用记录等；\n（七）具有保证电子政务电子认证服务活动及其使用密码安全运行的管理体系。"},{"t":"a","x":"第七条 申请电子政务电子认证服务机构资质，应当向国家密码管理局提出书面申请，向国家密码管理局委托进行受理的省、自治区、直辖市密码管理部门提交下列材料：\n（一）电子政务电子认证服务机构资质申请表；\n（二）法人资格证书；\n（三）资金情况，包括注册资本、资本结构、股权结构、运营资金保障等情况；\n（四）运营场所情况；\n（五）电子认证服务系统相关技术材料及相关设备清单，包括电子认证服务系统建设工作报告、技术工作报告、安全性设计报告、安全管理策略和规范、标准符合性自评估报告，相关软件、硬件清单及其符合国家有关安全标准的情况等；\n（六）专业人员情况；\n（七）为用户提供长期服务和质量保障能力说明及承诺；\n（八）电子政务电子认证服务及其使用密码安全管理体系建立情况，包括业务运营管理、电子认证服务系统运行管理、人员管理、档案管理、安全保密管理等管理体系建立情况。"},{"t":"a","x":"第八条 受国家密码管理局委托进行受理的省、自治区、直辖市密码管理部门自收到申请材料之日起5个工作日内，对申请材料进行形式审查，根据下列情况分别作出处理：申请材料齐全、符合规定形式的，应当受理行政许可申请并出具受理通知书；申请材料不齐全或者不符合规定形式的，应当当场或者在5个工作日内一次告知需要补正的全部内容；不予受理的，应当出具不予受理通知书并说明理由。"},{"t":"a","x":"第九条 国家密码管理局应当自行政许可申请受理之日起20个工作日内，对行政许可申请进行审查，并依法作出是否许可的决定。准予许可的，颁发《电子政务电子认证服务机构资质证书》，并予以公开；不予许可的，应当出具不予行政许可决定书，说明理由并告知申请人相关权利。\n需要对申请人进行技术评审的，技术评审所需时间不计算在本条规定的期限内。国家密码管理局应当将所需时间书面告知申请人。"},{"t":"a","x":"第十条 国家密码管理局根据技术评审需要和专业要求，可以委托专业机构或者组织专家实施技术评审。\n技术评审包括电子认证服务系统安全性审查，运营场所、设备设施、管理体系建设实地查勘，专业人员能力考核等。\n专业机构和专家应当独立、公正、科学、诚信地开展技术评审活动，对技术评审结论的真实性、符合性负责，并承担相应法律责任。国家密码管理局应当对技术评审活动进行监督，建立责任追究机制。"},{"t":"a","x":"第十一条 外商投资电子政务电子认证服务，影响或者可能影响国家安全的，应当依法进行外商投资安全审查。"},{"t":"a","x":"第十二条 《电子政务电子认证服务机构资质证书》有效期5年，内容包括：获证机构名称、证书编号、有效期限、发证机关和发证日期等。\n《电子政务电子认证服务机构资质证书》由正本和副本组成，正本、副本具有同等法律效力。\n禁止转让、出租、出借、伪造、变造、冒用、租借《电子政务电子认证服务机构资质证书》。"},{"t":"a","x":"第十三条 电子政务电子认证服务机构应当在其网站和运营场所公布并及时更新其《电子政务电子认证服务机构资质证书》的机构名称、证书编号、有效期限、发证机关和发证日期等内容。"},{"t":"a","x":"第十四条 有下列情形之一的，电子政务电子认证服务机构应当自变更之日起30日内向国家密码管理局办理变更手续：\n（一）机构名称、住所、法定代表人发生变更；\n（二）机构注册资本、资本结构、股权结构、法人性质或者单位隶属关系发生变更；\n（三）电子认证服务系统等设备设施发生变化，影响或者可能影响电子政务电子认证服务使用密码安全；\n（四）新建、搬迁电子认证服务系统；\n（五）依法需要办理变更的其他事项。\n电子政务电子认证服务机构发生变更的事项影响其符合资质认定条件和要求的，国家密码管理局根据申请人的实际情况，采取书面或者现场形式开展审查。需要进行技术评审的，依照本办法第十条规定对其开展技术评审。"},{"t":"a","x":"第十五条 电子政务电子认证服务机构资质有效期届满需要延续的，应当在有效期届满60日前向国家密码管理局提出书面申请。国家密码管理局根据申请人的实际情况，采取书面或者现场形式进行审查，并在电子政务电子认证服务机构资质有效期届满前作出是否准予延续的决定。"},{"t":"h","x":"第三章 行为规范"},{"t":"a","x":"第十六条 电子政务电子认证服务机构应当按照国家密码管理局公布的电子政务电子认证业务规则规范等要求，制定本机构的电子政务电子认证业务规则和相应的电子签名认证证书策略，在提供电子政务电子认证服务前予以公布，并向住所地省、自治区、直辖市密码管理部门备案。\n电子政务电子认证业务规则和电子签名认证证书策略发生变更的，电子政务电子认证服务机构应当予以公布，并自公布之日起30日内向住所地省、自治区、直辖市密码管理部门备案。\n电子政务电子认证服务机构应当保持本机构已公布的电子政务电子认证业务规则和电子签名认证证书策略的可访问性。"},{"t":"a","x":"第十七条 电子政务电子认证服务机构应当按照本机构公布的电子政务电子认证业务规则提供电子政务电子认证服务。"},{"t":"a","x":"第十八条 电子政务电子认证服务机构应当保证提供下列服务：\n（一）电子签名认证证书注册、签发、更新、撤销等生命周期管理服务；\n（二）电子签名认证证书信息查询服务；\n（三）电子签名认证证书状态查询服务；\n（四）电子签名认证证书使用支持服务；\n（五）其他与电子签名认证相关的服务。"},{"t":"a","x":"第十九条 电子政务电子认证服务机构签发的电子签名认证证书应当载明下列内容：\n（一）电子政务电子认证服务机构名称；\n（二）电子签名认证证书持有人名称；\n（三）电子签名认证证书序列号；\n（四）电子签名认证证书有效期；\n（五）电子签名认证证书对应的证书策略对象标识符；\n（六）电子签名制作数据对应的电子签名验证数据；\n（七）电子政务电子认证服务机构的电子签名；\n（八）国家密码管理局规定的其他内容。"},{"t":"a","x":"第二十条 电子政务电子认证服务机构应当保证电子签名认证证书内容在有效期内完整、准确，并保证电子签名依赖方能够证实或者了解电子签名认证证书所载内容及其他有关事项。"},{"t":"a","x":"第二十一条 电子签名人向电子政务电子认证服务机构申请电子签名认证证书，应当提供真实、完整和准确的信息。\n电子政务电子认证服务机构受理电子签名认证证书申请时，应当对申请人的身份进行查验，对有关申请材料进行审查，并向申请人告知电子签名认证证书和电子签名的使用条件、电子签名所产生的法律责任、保存和使用电子签名认证证书持有人信息的权限和责任、电子政务电子认证服务机构和电子签名认证证书持有人的责任范围等事项。\n电子政务电子认证服务机构受理电子签名认证证书申请后，应当与申请人签订电子政务电子认证服务协议，明确双方的权利义务。"},{"t":"a","x":"第二十二条 电子政务电子认证服务机构应当遵守国家有关密码管理要求，保障电子政务电子认证服务使用密码安全。\n电子政务电子认证服务机构提供的电子政务电子认证服务应当纳入统一的电子认证信任体系，遵守电子认证服务互信互认要求。"},{"t":"a","x":"第二十三条 电子政务电子认证服务机构应当建立完善的保密制度，对其在工作中知悉的国家秘密、商业秘密和个人隐私承担保密义务，采取相应的技术措施和其他必要措施保护有关信息和数据安全。"},{"t":"a","x":"第二十四条 电子政务电子认证服务机构应当完整记录和保存与电子签名认证相关的信息，保证认证过程和结果具有可追溯性，信息保存期限至少为电子签名认证证书失效后5年。"},{"t":"a","x":"第二十五条 电子政务电子认证服务机构委托其他机构开展电子签名认证证书注册业务的，应当自委托协议签订之日起30日内将受委托开展电子签名认证证书注册业务的机构（以下简称受委托机构）名称、负责人，电子签名认证证书注册业务办理地址，委托事项等情况向受委托机构住所地省、自治区、直辖市密码管理部门备案。备案内容发生变更的，电子政务电子认证服务机构应当自变更之日起30日内向受委托机构住所地省、自治区、直辖市密码管理部门备案。\n电子政务电子认证服务机构应当对受委托机构开展电子签名认证证书注册业务的行为进行监督，并对该行为的后果承担法律责任。\n受委托机构在委托范围内，以委托其开展电子签名认证证书注册业务的电子政务电子认证服务机构名义开展电子签名认证证书注册业务，不得再委托其他机构或者个人开展电子签名认证证书注册业务。"},{"t":"a","x":"第二十六条 电子政务电子认证服务机构应当自行或者委托专业机构每年至少进行一次电子政务电子认证服务合规性评估，对评估中发现的问题及时进行整改，并向住所地省、自治区、直辖市密码管理部门报送合规性评估报告。"},{"t":"a","x":"第二十七条 电子政务电子认证服务机构应当建立和完善投诉处理机制，公布投诉方式，畅通投诉渠道，及时受理并妥善处理有关投诉事项。"},{"t":"a","x":"第二十八条 电子政务电子认证服务机构应当对本单位及受委托机构的从业人员进行岗位培训，建立培训制度，制定培训计划，加强考核并做好培训记录。"},{"t":"a","x":"第二十九条 电子政务电子认证服务机构拟暂停或者终止电子政务电子认证服务的，应当在暂停或者终止服务60日前向国家密码管理局报告，并与其他电子政务电子认证服务机构就业务承接进行协商，作出妥善安排。\n电子政务电子认证服务机构未能就业务承接事项与其他电子政务电子认证服务机构达成协议的，应当申请国家密码管理局安排其他电子政务电子认证服务机构承接其业务。\n电子政务电子认证服务机构被依法吊销电子政务电子认证服务机构资质的，其业务承接事项的处理按照国家密码管理局的规定执行。\n电子政务电子认证服务机构有根据国家密码管理局的安排承接其他机构开展的电子政务电子认证服务业务的义务。"},{"t":"h","x":"第四章 监督管理"},{"t":"a","x":"第三十条 密码管理部门依法对电子政务电子认证服务活动进行监督检查。监督检查可以采取书面检查、实地核查、网络监测等方式。"},{"t":"a","x":"第三十一条 密码管理部门依法实施监督检查时，可以进入电子政务电子认证服务活动场所实施现场检查，调查、了解有关情况，查阅、复制有关资料，并可以委托专业机构或者组织专家开展有关检测鉴定工作。\n电子政务电子认证服务机构及受委托机构应当予以配合，并如实提供相关材料和技术支持。"},{"t":"a","x":"第三十二条 密码管理部门开展监督检查，不得妨碍电子政务电子认证服务机构及受委托机构的正常经营和服务活动，不得收取任何费用，不得泄露或者非法向他人提供在履行职责中知悉的商业秘密和个人隐私。"},{"t":"a","x":"第三十三条 电子政务电子认证服务机构有下列情形之一的，密码管理部门应当进行重点监督检查：\n（一）一年内在监督检查中发现存在严重问题；\n（二）因违反有关法律法规受到行政处罚；\n（三）其他需要进行重点监督检查的情形。"},{"t":"a","x":"第三十四条 电子政务电子认证服务机构应当保证其基本条件和能力能够持续符合资质认定条件和要求。"},{"t":"a","x":"第三十五条 电子政务电子认证服务机构应当于每年1月15日前向住所地省、自治区、直辖市密码管理部门报送上一年度工作报告，包括：\n（一）持续符合资质认定条件和要求的情况；\n（二）电子政务电子认证服务业务开展情况及相关统计数据；\n（三）行为规范执行情况；\n（四）电子认证服务系统安全运行情况；\n（五）电子政务电子认证服务及其使用密码安全管理体系执行情况。"},{"t":"a","x":"第三十六条 有下列情形之一的，电子政务电子认证服务机构应当自发生之日起15日内向住所地省、自治区、直辖市密码管理部门报告：\n（一）重大安全风险和安全事件；\n（二）重要系统、关键设备事故；\n（三）关键岗位人员变动；\n（四）重大财产损失。"},{"t":"h","x":"第五章 法律责任"},{"t":"a","x":"第三十七条 未经认定从事电子政务电子认证服务的，由密码管理部门依据《中华人民共和国密码法》和《商用密码管理条例》有关规定进行处罚。"},{"t":"a","x":"第三十八条 电子政务电子认证服务机构违反《中华人民共和国密码法》、《商用密码管理条例》和本办法有关规定，有下列情形之一的，由密码管理部门责令改正或者停止违法行为，给予警告，没收违法所得；违法所得30万元以上的，可以并处违法所得1倍以上3倍以下罚款；没有违法所得或者违法所得不足30万元的，可以并处10万元以上30万元以下罚款；情节严重的，责令停业整顿，直至吊销电子政务电子认证服务机构资质：\n（一）超出批准范围开展电子政务电子认证服务；\n（二）转让、出租、出借、伪造、变造、冒用、租借《电子政务电子认证服务机构资质证书》；\n（三）未按照本机构公布的电子政务电子认证业务规则提供电子政务电子认证服务；\n（四）电子签名认证证书内容不符合规定要求；\n（五）电子签名认证证书申请受理未查验申请人身份、未审查有关申请材料、未向申请人告知有关事项，或者未与申请人签订电子政务电子认证服务协议；\n（六）泄露或者非法向他人提供在履行职责中知悉的商业秘密、个人隐私；\n（七）未按照要求完整记录、保存与电子签名认证相关的信息；\n（八）未履行监督义务，受委托机构以自身名义开展电子签名认证证书注册业务，或者再委托其他机构、个人开展电子签名认证证书注册业务；\n（九）拒不报送或者不如实报送年度工作报告、重大事项报告等实施情况。"},{"t":"a","x":"第三十九条 电子政务电子认证服务机构违反本办法有关规定，有下列情形之一的，由密码管理部门责令改正；逾期未改正或者改正后仍不符合要求的，处1万元以上10万元以下罚款：\n（一）未按照本办法第十四条规定办理变更手续；\n（二）未按照本办法第十六条、第二十五条规定进行备案；\n（三）未按照要求进行电子政务电子认证服务合规性评估，或者未对评估中发现的问题及时进行整改；\n（四）未建立投诉处理机制、公布投诉方式，或者未及时受理、妥善处理有关投诉事项；\n（五）未对本单位及受委托机构的从业人员进行岗位培训；\n（六）未按照要求报告暂停或者终止电子政务电子认证服务的情况；\n（七）未按照要求承接电子政务电子认证服务业务。"},{"t":"a","x":"第四十条 电子签名人或者电子签名依赖方因依据电子政务电子认证服务机构提供的电子签名认证服务在政务活动中遭受损失，电子政务电子认证服务机构不能证明自己无过错的，承担赔偿责任。"},{"t":"a","x":"第四十一条 从事电子政务电子认证服务监督管理工作的人员滥用职权、玩忽职守、徇私舞弊，或者泄露、非法向他人提供在履行职责中知悉的商业秘密、个人隐私、举报人信息的，依法给予处分。"},{"t":"h","x":"第六章 附 则"},{"t":"a","x":"第四十二条 本办法自2024年11月1日起施行。"}]},{"title":"关键信息基础设施商用密码使用管理规定","source":"国家密码管理局","date":"国家密码管理局、国家网信办、公安部令第5号，2025年7月1日起施行","url":"https://www.oscca.gov.cn/sca/xxgk/2025-06/27/content_1061270.shtml","arts":[{"t":"a","x":"第一条 为规范关键信息基础设施商用密码使用，保护关键信息基础设施安全，根据《中华人民共和国密码法》、《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》、《商用密码管理条例》和《关键信息基础设施安全保护条例》、《网络数据安全管理条例》等有关法律、行政法规，制定本规定。"},{"t":"a","x":"第二条 依据《中华人民共和国网络安全法》、《关键信息基础设施安全保护条例》等法律、行政法规和国家有关规定认定的关键信息基础设施的商用密码使用管理，适用本规定。"},{"t":"a","x":"第三条 国家密码管理部门会同国家网信部门、国务院公安部门负责规划、指导和监督全国的关键信息基础设施商用密码使用管理工作，建立关键信息基础设施商用密码使用管理信息共享机制。\n县级以上地方各级密码管理部门会同网信部门、公安机关负责指导和监督本行政区域的关键信息基础设施商用密码使用管理工作。"},{"t":"a","x":"第四条 关键信息基础设施保护工作部门（以下简称保护工作部门）在职责范围内负责监督管理本行业、本领域关键信息基础设施商用密码使用工作，单独编制本行业、本领域商用密码使用规划或者纳入本行业、本领域的关键信息基础设施安全规划并组织实施，指导本行业、本领域关键信息基础设施运营者（以下简称运营者）开展商用密码相关制度、人员、经费等保障工作。\n保护工作部门应当于每年3月31日前向国家密码管理部门、国家网信部门、国务院公安部门报告上一年度本行业、本领域关键信息基础设施商用密码使用管理情况。\n关键信息基础设施发生涉及商用密码的重大网络安全事件或者发现涉及商用密码的重大网络安全威胁时，保护工作部门应当及时向国家密码管理部门、国家网信部门、国务院公安部门报告，指导运营者开展应急处置，必要时开展商用密码应用安全性评估。"},{"t":"a","x":"第五条 运营者应当按照相关法律、行政法规和国家有关规定，遵循国家商用密码管理、网络安全等级保护、关键信息基础设施安全保护等制度要求，使用商用密码保护关键信息基础设施，同步规划、同步建设、同步运行商用密码保障系统，并定期开展商用密码应用安全性评估。\n运营者应当于每年1月31日前向所属的保护工作部门报告上一年度关键信息基础设施商用密码使用以及商用密码应用安全性评估开展情况。"},{"t":"a","x":"第六条 运营者应当加强关键信息基础设施商用密码使用制度保障，建立商用密码使用、应急处置、重大事件报告等关键信息基础设施商用密码使用管理制度。\n运营者的主要负责人对关键信息基础设施商用密码使用管理负总责，负责关键信息基础设施商用密码使用和涉及商用密码的重大网络安全事件处置工作。"},{"t":"a","x":"第七条 运营者应当加强关键信息基础设施商用密码使用人员保障，配备取得密码相关专业学历或者密码相关国家职业技能等级认定证书的专业人员分别承担密钥管理员、密码操作员等职责，配备具有安全审计专业能力的人员承担密码安全审计员职责。\n运营者应当对密码相关专业人员进行安全背景审查，并定期组织其参加密码相关业务技能培训，提高密码相关专业人员的商用密码使用能力。"},{"t":"a","x":"第八条 运营者应当加强关键信息基础设施商用密码使用和应用安全性评估经费保障，将商用密码使用和应用安全性评估经费纳入网络安全和信息化经费安排。"},{"t":"a","x":"第九条 关键信息基础设施使用的商用密码产品、服务应当经检测认证合格，使用的密码算法、密码协议、密钥管理机制等商用密码技术应当通过国家密码管理部门审查鉴定。\n运营者采购涉及商用密码的网络产品和服务，影响或者可能影响国家安全的，应当按照《网络安全审查办法》进行网络安全审查。"},{"t":"a","x":"第十条 关键信息基础设施应当按照国家数据安全保护、个人信息保护有关要求，使用商用密码对其存储、使用、传输的核心数据、重要数据和个人信息进行保护。"},{"t":"a","x":"第十一条 关键信息基础设施规划阶段，其运营者应当依照相关法律、行政法规和标准规范，根据商用密码应用需求，制定商用密码应用方案，规划商用密码保障系统并纳入关键信息基础设施安全规划统筹部署。\n运营者应当自行或者委托商用密码检测机构对商用密码应用方案进行商用密码应用安全性评估。商用密码应用方案未通过商用密码应用安全性评估的，不得作为商用密码保障系统的建设依据。"},{"t":"a","x":"第十二条 关键信息基础设施建设阶段，其运营者应当按照通过商用密码应用安全性评估的商用密码应用方案组织实施，落实商用密码安全防护措施，建设商用密码保障系统。建设过程中需要调整商用密码应用方案的，应当重新开展商用密码应用安全性评估，评估通过后方可按照调整后的商用密码应用方案继续建设。\n关键信息基础设施运行前，其运营者应当自行或者委托商用密码检测机构开展商用密码应用安全性评估。关键信息基础设施未通过商用密码应用安全性评估的，运营者应当进行改造，改造期间不得投入运行。"},{"t":"a","x":"第十三条 关键信息基础设施建成运行后，其运营者应当自行或者委托商用密码检测机构每年至少开展一次商用密码应用安全性评估，确保关键信息基础设施商用密码的正确使用和商用密码保障系统的有效运行。关键信息基础设施未通过商用密码应用安全性评估的，运营者应当进行改造，并在改造期间采取必要措施保证关键信息基础设施运行安全。"},{"t":"a","x":"第十四条 本规定施行前正在建设的关键信息基础设施，其运营者应当加强商用密码应用方案编制论证，建设完善商用密码保障系统，并按照本规定第十二条开展商用密码应用安全性评估。\n本规定施行前已经投入运行的关键信息基础设施，其运营者应当按照本规定第十三条开展商用密码应用安全性评估。"},{"t":"a","x":"第十五条 开展关键信息基础设施商用密码应用安全性评估，应当符合《商用密码应用安全性评估管理办法》有关规定。\n关键信息基础设施商用密码应用安全性评估应当与关键信息基础设施安全检测评估、网络安全等级测评加强衔接，避免重复评估、测评。"},{"t":"a","x":"第十六条 国家密码管理部门负责建设和管理国家关键信息基础设施商用密码运行安全管理基础设施，统筹保护工作部门建设本行业、本领域关键信息基础设施商用密码运行安全管理基础设施，会同国家网信部门、国务院公安部门分析研判关键信息基础设施商用密码运行安全态势，协同应对处置重大商用密码运行安全威胁。"},{"t":"a","x":"第十七条 密码管理部门应当定期组织开展关键信息基础设施商用密码使用情况监督检查。保护工作部门应当定期对本行业、本领域关键信息基础设施商用密码使用情况进行检查并提出改进措施，必要时可以自行或者委托商用密码检测机构等专业机构进行商用密码应用安全性评估。\n运营者对密码管理部门和保护工作部门开展的关键信息基础设施商用密码使用情况监督检查应当予以配合，根据监督检查意见及时进行整改并向保护工作部门报告整改情况，保护工作部门应当将整改情况向国家密码管理部门报告。\n开展关键信息基础设施商用密码使用情况监督检查应当加强协同配合、信息沟通，避免不必要的检查和交叉重复检查。监督检查不得收取费用，不得要求被监督检查单位购买、使用指定单位或者指定品牌的商用密码产品、服务。"},{"t":"a","x":"第十八条 密码管理部门、有关部门、商用密码检测机构及其工作人员对其在履行职责中知悉的国家秘密、商业秘密和个人隐私承担保密义务，不得泄露或者非法向他人提供。"},{"t":"a","x":"第十九条 运营者违反《中华人民共和国密码法》、《中华人民共和国网络安全法》、《商用密码管理条例》、《关键信息基础设施安全保护条例》和本规定有关条款，有下列情形之一的，由密码管理部门责令改正，给予警告；拒不改正或者有其他严重情节的，处10万元以上100万元以下罚款，对直接负责的主管人员处1万元以上10万元以下罚款：\n（一）未按照要求使用商用密码保护关键信息基础设施，同步规划、同步建设、同步运行商用密码保障系统的；\n（二）关键信息基础设施使用的商用密码产品、服务未经检测认证合格的；\n（三）关键信息基础设施使用的密码算法、密码协议、密钥管理机制等商用密码技术未通过国家密码管理部门审查鉴定的；\n（四）关键信息基础设施规划阶段，未制定商用密码应用方案，或者未对商用密码应用方案进行商用密码应用安全性评估的；\n（五）关键信息基础设施建设阶段，未按照通过商用密码应用安全性评估的商用密码应用方案建设商用密码保障系统的；\n（六）关键信息基础设施运行前，未开展商用密码应用安全性评估，或者未通过商用密码应用安全性评估且未进行改造的；\n（七）关键信息基础设施建成运行后，未定期开展商用密码应用安全性评估，或者未通过定期开展的商用密码应用安全性评估且未进行改造的。"},{"t":"a","x":"第二十条 运营者违反《中华人民共和国密码法》、《中华人民共和国网络安全法》、《商用密码管理条例》、《关键信息基础设施安全保护条例》和本规定第九条，使用未经安全审查或者安全审查未通过的涉及商用密码的网络产品或者服务的，由有关主管部门责令停止使用，处采购金额1倍以上10倍以下罚款；对直接负责的主管人员和其他直接责任人员处1万元以上10万元以下罚款。"},{"t":"a","x":"第二十一条 运营者违反《中华人民共和国密码法》、《中华人民共和国网络安全法》、《商用密码管理条例》、《关键信息基础设施安全保护条例》和本规定第十七条，无正当理由拒不接受、不配合或者干预、阻挠密码管理部门、有关部门的商用密码监督管理的，由密码管理部门、有关部门责令改正，给予警告；拒不改正或者有其他严重情节的，处5万元以上50万元以下罚款，对直接负责的主管人员和其他直接责任人员处1万元以上10万元以下罚款；情节特别严重的，责令停业整顿。"},{"t":"a","x":"第二十二条 运营者违反本规定，有下列情形之一的，由密码管理部门、有关部门依据职责责令改正：\n（一）未按照要求报告上一年度关键信息基础设施商用密码使用以及商用密码应用安全性评估开展情况的；\n（二）未建立关键信息基础设施商用密码使用管理制度的；\n（三）未按照要求配备密钥管理员、密码操作员、密码安全审计员的；\n（四）未保障关键信息基础设施商用密码使用和应用安全性评估经费的。"},{"t":"a","x":"第二十三条 从事关键信息基础设施商用密码使用监督管理工作的人员滥用职权、玩忽职守、徇私舞弊，或者泄露、非法向他人提供在履行职责中知悉的商业秘密、个人隐私、举报人信息的，依法给予处分。"},{"t":"a","x":"第二十四条 属于国家政务信息系统的关键信息基础设施的商用密码使用管理，除应当遵守本规定以外，还应当按照《国家政务信息化项目建设管理办法》（国办发〔2019〕57号）等有关规定要求执行。"},{"t":"a","x":"第二十五条 本规定自2025年8月1日起施行。"}]},{"title":"江苏省省级政务信息化项目建设管理办法","source":"江苏省人民政府网","date":"苏政办发〔2024〕38号","url":"https://www.jiangsu.gov.cn/art/2024/12/30/art_46144_11457649.html","arts":[{"t":"a","x":"第一条 为进一步规范省级政务信息化项目管理，加强规划和统筹，加大力度推进信息系统整合上云，扎实抓好数据安全工作，坚决防范重复建设、资源浪费，切实提高项目建设质效，根据《政府投资条例》（国务院令第712号）、《国家政务信息化项目建设管理办法》（国办发〔2019〕57号）、《江苏省政府投资管理办法》（苏政发〔2020〕68号）等有关规定，结合我省实际，制定本办法。"},{"t":"a","x":"第二条 省级政务信息化项目，是指省级各党政机关、事业单位和团体组织（不含高校、医院，以下简称省各有关单位）使用财政预算资金实施的，符合《政务信息系统定义和范围》（GB/T 40692-2021）规定的数字基础设施、软件开发和数据治理等项目。"},{"t":"a","x":"第三条 不产生公共数据资源的楼宇智能化工程、专业科研设备及配套系统、办公终端、通用软件以及属于《建设工程分类标准》范畴的电子设备、通信设备、通信线路、广播电影电视工程项目，不纳入省级政务信息化项目建设管理范畴。"},{"t":"a","x":"第四条 省级政务信息化项目建设管理实行“统一规划、统一标准、统一监督、统一评价”，逐步实行“统一实施、统一运维”，原则上省各有关单位不再单独、分散建设。\n健全省级政务信息化项目建设管理协调机制，加强项目年度建设资金总额控制，根据项目轻重缓急，统筹协调省各有关单位政务信息化项目规划实施。"},{"t":"a","x":"第五条 省级政务信息化项目管理职责分工：\n（一）省数据局负责牵头编制省级政务信息化建设相关规划及制度规范；牵头开展项目建设需求申报及技术审核，与省发展改革委、省财政厅共同研究提出项目建设安排建议；负责组织项目实施、系统运行过程的监督评估。\n（二）省发展改革委负责项目审批和竣工验收，与省财政厅共同负责对拟申请省级财政预算资金建设项目的统筹安排。\n（三）省财政厅负责项目建设和运维资金审核、预算管理和政府采购监督管理，组织指导财政资金预算绩效管理和数据资产管理，组织开展财政资金监督检查。\n（四）省委网信办负责项目网络和数据安全审核工作。\n（五）省保密局负责涉密项目保密技术防护监督管理工作。\n（六）省国家密码管理局负责项目安全可靠情况、密码应用、电子文件管理等审核及监督工作。\n（七）省审计厅负责对项目进行审计监督。"},{"t":"h","x":"第二章 规 划"},{"t":"a","x":"第六条 坚持规划引领，省数据局根据信息化发展规律、国家信息化有关规划、数字江苏建设决策部署，统筹考虑并充分论证各部门建设需求，制定省级政务信息化建设相关规划。\n省各有关单位按照省级政务信息化建设相关规划，结合业务发展需要，可编制本系统、本单位实施方案，经省数据局审核后，作为项目申报的依据。"},{"t":"a","x":"第七条 省各有关单位应按相关规划要求加强统筹整合，做好新建项目和存量项目的衔接，按照“一部门一系统”原则，优化流程、归并功能，实现数据共享、通用技术能力集约复用，破除“信息孤岛”和“数据烟囱”。\n对于需要各设区市共享协同的政务信息化项目，应注重顶层设计，统筹制定数据资源共享、业务协同的总体要求和标准规范，省级部门开发基础平台，统一数据和业务接口，与各设区市拓展功能有效衔接。省级规划建设的政务APP应向下开放权限，省级以下不再重复建设。"},{"t":"h","x":"第三章 申 报"},{"t":"a","x":"第八条 申报项目应符合下列要求：\n（一）符合国家和省有关文件规定及工作部署，需求合理，目标明确；\n（二）列入国家和省级政务信息化建设相关规划；\n（三）遵循统筹、整合、共享原则，依托电子政务网络、省政务云等公共支撑平台建设，符合国家、省相关标准规范；\n（四）项目可行性研究报告中建设内容、技术方案和投资估算合理可行；\n（五）符合网络安全和密码应用要求，符合国家安全可靠应用政策规定。"},{"t":"a","x":"第九条 跨部门集约共享的省级政务信息化项目，由牵头部门履行申报程序。牵头部门应会同参与部门共同确定项目目标、主体内容，统一系统接口与数据资源目录，实现集约共享要求。"},{"t":"a","x":"第十条 跨层级协同实施的政务信息化项目，应遵循统筹规划、分级审批、分级实施、共享协同的原则，并加强与国家、市、县（市、区）已有项目的衔接。所需资金按照财政事权和支出责任相适应原则分级承担。推动省有关部门建设省市县一体化信息系统，建设经费由省级安排，运维费各自承担。"},{"t":"a","x":"第十一条 项目申报流程主要包括：\n（一）项目单位依据项目必要性、紧迫性向省数据局提出需求申请；\n（二）省数据局、省发展改革委、省财政厅共同研究通过后，项目单位编制项目可行性研究报告报送省数据局，抄送省发展改革委和省财政厅；\n（三）省数据局会同省委网信办、省国家密码管理局等部门开展技术审核，其中涉密项目应征求省保密局意见，省发展改革委会同省财政厅对项目建设投资规模、资金来源安排等进行审核；\n（四）项目单位根据审核意见对可行性研究报告修改完善并组织专家论证、履行内部决策程序后报送省发展改革委，抄送省财政厅和省数据局；\n（五）省发展改革委、省财政厅、省数据局根据项目修改完善情况分批次共同提请省政府决策。\n省各有关单位政务信息系统整体运维方案按年度报省数据局审核，由省财政厅复核后列入年度预算。"},{"t":"a","x":"第十二条 严把项目和运维经费审核审批关，做到“五个不得”：未纳入省级政务信息化建设相关规划、重点工作任务的，不得申请项目立项；未按要求推进政务信息系统整合的，不得申请新项目建设；未按要求及时迁移至省政务云的，不得申请新项目建设；未按要求共享、更新公共数据的，不得安排运维经费；未按要求开展集约共享建设造成重复浪费的，不得批准立项。"},{"t":"a","x":"第十三条 省数据局依托省级政务信息化项目管理平台对项目实施全流程、全生命周期管理，实现与相关职能部门业务平台联通、项目数据共享。省各有关单位全量非涉密政务信息化项目及相关运维服务，均应在管理平台申报，涉密项目按国家有关保密规定申报。"},{"t":"h","x":"第四章 审 批"},{"t":"a","x":"第十四条 项目经省政府决策同意后，项目单位应按规定通过江苏省投资项目在线审批监管平台申请项目代码，向省发展改革委报送项目审批文件，履行报批手续，由省发展改革委按程序审批。简化报批文件和审批程序按《江苏省政府投资管理办法》执行。"},{"t":"a","x":"第十五条 可行性研究报告、初步设计应包括数据资源共享分析篇（章），编制数据资源目录，明确数据共享类型、要求和共享途径，建立数据共享长效机制和共享数据使用情况反馈机制，持续畅通数据共享应用，不得将应普遍共享的数据仅与特定部门共享，或仅向特定企业、社会组织开放。\n数据资源目录是审批相关政务信息化项目的必备条件。数据资源共享的完整性、时效性，数据共享通道、共享范围以及网络和数据安全、软硬件产品安全可靠情况是确定项目实施、运行维护经费安排和验收的重要依据。"},{"t":"a","x":"第十六条 省级政务信息化项目原则上不再进行节能评估、规划选址、用地预审、环境影响评价等审批，涉及新建土建工程、高耗能项目的除外。"},{"t":"h","x":"第五章 实 施"},{"t":"a","x":"第十七条 省数据局会同省发展改革委、省财政厅等部门建立健全项目实施、运维管理机制，稳妥有序推动统一实施、统一运维，积极探索应用集中建设模式。"},{"t":"a","x":"第十八条 项目单位应严格按政府采购有关规定开展采购。与公共支撑保障能力紧密关联、适宜统一集中采购的项目，省数据局组织联合采购，项目单位根据采购结果分别签订合同。采购涉密项目的，应执行有关保密法律法规规定和涉密采购相关管理办法。"},{"t":"a","x":"第十九条 加强项目实施过程监管。项目单位应建立健全项目管理制度，加强全过程统筹协调，监督执行效果，组织验收评价。项目单位应按要求定期报送项目实施情况，省数据局会同省有关部门加强对项目开工建设、实施进度、资金使用等关键环节监管，组织集中采购监理服务，防范项目建设过程中的廉政风险。"},{"t":"a","x":"第二十条 项目单位应按《中华人民共和国网络安全法》《中华人民共和国数据安全法》等法律法规以及党政机关网络和数据安全管理等有关规定，建立健全网络和数据安全管理制度，同步规划、同步建设、同步使用网络安全技术措施，定期开展网络安全检测与风险评估，保障信息系统安全稳定运行。"},{"t":"a","x":"第二十一条 项目单位应按《中华人民共和国密码法》等法律法规和标准规范要求，制定项目密码应用方案，同步规划、同步建设、同步运行密码保障系统并定期进行评估；应按电子文件管理相关法规和标准规范要求，实现电子文件管理与项目建设同步规划、同步实施、同步应用。\n涉密项目还应按《中华人民共和国保守国家秘密法》等法律法规和标准规范要求，制定涉密项目安全保密防护管理方案，同步规划、同步建设、同步运行保密设施、设备等，并进行评估。"},{"t":"a","x":"第二十二条 项目单位根据实际需求向省数据局申请公共基础设施资源，由省数据局审核分配。"},{"t":"a","x":"第二十三条 项目实施期间应定期形成绩效评价报告，按规定在每年年底前向省财政厅、省数据局提交，抄送省发展改革委，并在管理平台中报送。\n项目绩效评价报告主要包括实施进度和资金执行情况。对于已投入试运行的系统，还应说明试运行效果及存在问题等。"},{"t":"a","x":"第二十四条 省数据局督促项目单位开工建设，项目单位应严格按有关规定组织实施，项目实施过程中出现严重逾期（超过批复工期6个月以上）、造成重大损失等问题的，项目单位应当及时向省数据局报告并提出整改方案，省数据局会同省发展改革委、省财政厅按有关规定研究后，要求责任单位限期整改或者暂停项目实施。由财政预算资金安排未按时开工建设的项目（超过初步设计批复时间6个月以上）报省发展改革委、省财政厅适时调整。"},{"t":"a","x":"第二十五条 项目单位应严格按批复的初步设计和投资概算实施项目。项目目标和内容不变，项目实际支出有结余的，应及时将结余资金上缴财政。\n项目资金支出按照国库集中支付有关制度规定执行。"},{"t":"a","x":"第二十六条 项目投资规模未超出概算批复、建设目标不变，项目主要内容确需调整且资金调整数额不超过概算总投资15%，并符合下列情形之一的，经省数据局、省财政厅审核后可以调整，同时报省发展改革委备案。\n（一）根据法律法规、国家和省工作部署，确需改变实施内容的；\n（二）确需对原项目技术方案进行完善优化的；\n（三）根据项目业务发展需要，在已批复项目建设规划的框架下调整相关建设内容及进度的。\n不符合上述情形的，应按相关法律法规、国家和省有关规定执行。"},{"t":"a","x":"第二十七条 项目建成后6个月内，项目单位应按国家有关规定申请省发展改革委组织竣工验收，提交验收申请报告时应一并附上项目建设总结、财务审计报告、安全风险评估报告、密码应用安全性评估报告等材料。省有关部门可依据职责组织专项技术验收。\n安全风险评估、密码应用安全性评估结果不合格的，不得申请项目竣工验收。\n项目单位不能按期申请验收的，应向省发展改革委提出延期验收申请。\n省发展改革委接到项目单位申请后，应会同省数据局等有关部门及时组织竣工验收。省数据局同步开展项目与设计方案符合性审查。\n竣工验收合格后，项目单位应在3个月内向省财政厅编报竣工财务决算，特殊情况确需延长的，需报省财政厅批准，最长不得超过6个月。\n涉密项目的竣工验收按有关规定执行。"},{"t":"a","x":"第二十八条 项目单位应按国家有关档案管理的规定，做好项目档案管理，有条件的积极应用电子档案。\n未经档案验收或档案验收不合格的，不得通过项目竣工验收。"},{"t":"a","x":"第二十九条 涉密项目应经保密行政管理部门审查合格，方可投入运行，项目单位应指定专门机构或者人员负责运行使用管理。"},{"t":"a","x":"第三十条 项目单位应在项目通过验收并投入运行后12个月内，参照国家政务信息化建设管理绩效评价有关要求开展自评价，并将自评价报告报送省数据局，抄送省发展改革委、省财政厅。"},{"t":"h","x":"第六章 监 督"},{"t":"a","x":"第三十一条 省数据局会同省发展改革委等部门对省级政务信息化项目运行效率、网络和数据安全、应用效果等方面进行监督，监督评价结果作为项目审核审批的重要依据。"},{"t":"a","x":"第三十二条 省财政厅依法依规对省级政务信息化项目资金使用、项目绩效进行监督，确保符合国家和省有关资金管理规定。"},{"t":"a","x":"第三十三条 省审计厅依法依规对省级政务信息化项目进行审计监督，促进专项资金使用真实、合法和高效，推动完善并监督落实相关制度政策。"},{"t":"a","x":"第三十四条 对省级政务信息化项目负有监督管理职责的单位应通过管理平台建立项目信息共享机制，实现信息共享。"},{"t":"a","x":"第三十五条 项目单位应接受相关职能部门监督管理，如实提供项目有关资料和情况，不得拒绝、隐匿、瞒报。单位或者个人违反本办法规定未履行审核审批程序、未依规安排使用财政资金，或者因管理不善、弄虚作假造成严重超概算、质量低劣、损失浪费、安全事故或者其他责任事故的，相关监管部门应对负有直接责任的主管人员和其他责任人员依纪依法追究责任。"},{"t":"h","x":"第七章 附 则"},{"t":"a","x":"第三十六条 本办法自印发之日起施行。《江苏省省级政务信息化项目建设管理办法》（苏政办发〔2021〕24号）同时废止。"}]},{"title":"国家政务信息化项目建设管理办法","source":"中国政府网","date":"国办发〔2019〕57号","url":"https://www.gov.cn/zhengce/zhengceku/2020-01/21/content_5471256.htm","arts":[{"t":"a","x":"第一条 为规范国家政务信息化建设管理，推动政务信息系统跨部门跨层级互联互通、信息共享和业务协同，强化政务信息系统应用绩效考核，根据《国务院关于印发政务信息资源共享管理暂行办法的通知》（国发〔2016〕51号）等有关规定，制定本办法。"},{"t":"a","x":"第二条 本办法适用的国家政务信息系统主要包括：国务院有关部门和单位负责实施的国家统一电子政务网络平台、国家重点业务信息系统、国家信息资源库、国家信息安全基础设施、国家电子政务基础设施（数据中心、机房等)、国家电子政务标准化体系以及相关支撑体系等符合《政务信息系统定义和范围》规定的系统。"},{"t":"a","x":"第三条 国家政务信息化建设管理应当坚持统筹规划、共建共享、业务协同、安全可靠的原则。"},{"t":"a","x":"第四条 国家发展改革委负责牵头编制国家政务信息化建设规划，对各部门审批的国家政务信息化项目进行备案管理。财政部负责国家政务信息化项目预算管理和政府采购管理。各有关部门按照职责分工，负责国家政务信息化项目审批、建设、运行和安全监管等相关工作，并按照“以统为主、统分结合、注重实效”的要求，加强对政务信息化项目的并联管理。"},{"t":"a","x":"第五条 国家发展改革委会同中央网信办、国务院办公厅、财政部建立国家政务信息化建设管理的协商机制，做好统筹协调，开展督促检查和评估评价，推广经验成果，形成工作合力。"},{"t":"h","x":"第二章 规划和审批管理"},{"t":"a","x":"第六条 国家发展改革委会同有关部门根据信息化发展规律和政务信息化建设特点，统筹考虑并充分论证各部门建设需求，编制国家政务信息化建设规划并报国务院批准后实施；如内外部发展环境发生重大变化，适时组织评估论证，提出调整意见报国务院批准。各有关部门编制规划涉及政务信息化建设的，应当与国家政务信息化建设规划进行衔接。"},{"t":"a","x":"第七条 国家发展改革委审批或者核报国务院审批的政务信息化项目，以及其他有关部门按照项目审批管理的政务信息化项目，原则上包括编报项目建议书、可行性研究报告、初步设计方案等环节。\n对于已经纳入国家政务信息化建设规划的项目，可以直接编报可行性研究报告。\n对于党中央、国务院有明确要求，或者涉及国家重大战略、国家安全等特殊原因，情况紧急，且前期工作深度达到规定要求的项目，可以直接编报项目可行性研究报告、初步设计方案和投资概算。"},{"t":"a","x":"第八条 国家政务信息化项目原则上不再进行节能评估、规划选址、用地预审、环境影响评价等审批，涉及新建土建工程、高耗能项目的除外。"},{"t":"a","x":"第九条 除国家发展改革委审批或者核报国务院审批的外，其他有关部门自行审批新建、改建、扩建，以及通过政府购买服务方式产生的国家政务信息化项目，应当按规定履行审批程序并向国家发展改革委备案。\n备案文件应当包括项目名称、建设单位、审批部门、绩效目标及绩效指标、投资额度、运行维护经费、经费渠道、信息资源目录、信息共享开放、应用系统、等级保护或者分级保护备案情况、密码应用方案和密码应用安全性评估报告等内容，其中改建、扩建项目还需提交前期项目第三方后评价报告。"},{"t":"a","x":"第十条 跨部门共建共享的政务信息化项目，由牵头部门会同参建部门共同开展跨部门工程框架设计，形成统一框架方案后联合报国家发展改革委。框架方案要确定工程的参建部门、建设目标、主体内容，明确各部门项目与总体工程的业务流、数据流及系统接口，初步形成数据目录，确保各部门建设内容无重复交叉，实现共建共享要求。框架方案确定后，各部门按照项目管理要求申请建设本部门参建内容。\n各有关部门对于需要地方共享协同的政务信息化项目，应当按照统筹规划、分级审批、分级建设、共享协同的原则建设，并加强与地方已有项目的衔接。项目建设单位应当加强对地方的指导，统筹制定信息共享、业务协同的总体要求和标准规范。地方项目建设单位应当根据项目的总体目标、整体框架、建设任务、绩效目标及指标等，按照本地有关规定开展项目审批建设工作，并做好与国家有关项目建设单位的衔接配合。"},{"t":"a","x":"第十一条 可行性研究报告、初步设计方案应当包括信息资源共享分析篇（章）。咨询评估单位的评估报告应当包括对信息资源共享分析篇（章）的评估意见。审批部门的批复文件或者上报国务院的请示文件应当包括对信息资源共享分析篇（章）的意见。\n项目建设单位应当编制信息资源目录，建立信息共享长效机制和共享信息使用情况反馈机制，确保信息资源共享，不得将应当普遍共享的数据仅向特定企业、社会组织开放。\n信息资源目录是审批政务信息化项目的必备条件。信息资源共享的范围、程度以及网络安全情况是确定项目建设投资、运行维护经费和验收的重要依据。"},{"t":"a","x":"第十二条 各部门所有新建政务信息化项目，均应当在全国投资项目在线审批监管平台政务信息化项目管理子平台（以下简称管理平台）报批或者备案。\n所有中央本级政务信息系统应当全口径纳入管理平台进行统一管理。各部门应当在管理平台及时更新本部门政务信息系统目录。管理平台汇总形成国家政务信息系统总目录。"},{"t":"h","x":"第三章 建设和资金管理"},{"t":"a","x":"第十三条 项目建设单位应当确定项目实施机构和项目责任人，建立健全项目管理制度，加强对项目全过程的统筹协调，强化信息共享和业务协同，并严格执行招标投标、政府采购、工程监理、合同管理等制度。招标采购涉密信息系统的，还应当执行保密有关法律法规规定。"},{"t":"a","x":"第十四条 项目建设单位应当按照《中华人民共和国网络安全法》等法律法规以及党政机关安全管理等有关规定，建立网络安全管理制度，采取技术措施，加强政务信息系统与信息资源的安全保密设施建设，定期开展网络安全检测与风险评估，保障信息系统安全稳定运行。"},{"t":"a","x":"第十五条 项目建设单位应当落实国家密码管理有关法律法规和标准规范的要求，同步规划、同步建设、同步运行密码保障系统并定期进行评估。"},{"t":"a","x":"第十六条 项目应当采用安全可靠的软硬件产品。在项目报批阶段，要对产品的安全可靠情况进行说明。项目软硬件产品的安全可靠情况，项目密码应用和安全审查情况，以及硬件设备和新建数据中心能源利用效率情况是项目验收的重要内容。"},{"t":"a","x":"第十七条 项目建设单位应当充分依托云服务资源开展集约化建设。"},{"t":"a","x":"第十八条 对于人均投资规模过大、项目建设单位不具备建设运行维护能力的项目，应当充分发挥职能部门作用或者外包，减少自建自管自用自维。"},{"t":"a","x":"第十九条 国家政务信息化项目实行工程监理制，项目建设单位应当按照信息系统工程监理有关规定，委托工程监理单位对项目建设进行工程监理。"},{"t":"a","x":"第二十条 项目建设单位应当对项目绩效目标执行情况进行评价，并征求有关项目使用单位和监理单位的意见，形成项目绩效评价报告，在建设期内每年年底前向项目审批部门提交。\n项目绩效评价报告主要包括建设进度和投资计划执行情况。对于已投入试运行的系统，还应当说明试运行效果及遇到的问题等。"},{"t":"a","x":"第二十一条 项目建设过程中出现工程严重逾期、投资重大损失等问题的，项目建设单位应当及时向项目审批部门报告，项目审批部门按照有关规定要求项目建设单位进行整改或者暂停项目建设。"},{"t":"a","x":"第二十二条 项目建设单位应当严格按照项目审批部门批复的初步设计方案和投资概算实施项目建设。项目建设目标和内容不变，项目总投资有结余的，应当按照相关规定将结余资金退回。\n项目建设的资金支出按照国库集中支付有关制度规定执行。"},{"t":"a","x":"第二十三条 项目投资规模未超出概算批复、建设目标不变，项目主要建设内容确需调整且资金调整数额不超过概算总投资15%，并符合下列情形之一的，可以由项目建设单位调整，同时向项目审批部门备案：\n（一）根据党中央、国务院部署，确需改变建设内容的；\n（二）确需对原项目技术方案进行完善优化的；\n（三）根据所建政务信息化项目业务发展需要，在已批复项目建设规划的框架下调整相关建设内容及进度的。\n不符合上述情形的，应当按照国家有关规定履行相应手续。"},{"t":"a","x":"第二十四条 初步设计方案和投资概算未获批复前，原则上不予下达项目建设投资。对于因开展需求分析、编制可行性研究报告和初步设计、购地、拆迁等确需提前安排投资的政务信息化项目，项目建设单位可以在项目可行性研究报告获批复后，向项目审批部门提出申请。"},{"t":"a","x":"第二十五条 国家政务信息化项目建成后半年内，项目建设单位应当按照国家有关规定申请审批部门组织验收，提交验收申请报告时应当一并附上项目建设总结、财务报告、审计报告、安全风险评估报告（包括涉密信息系统安全保密测评报告或者非涉密信息系统网络安全等级保护测评报告等）、密码应用安全性评估报告等材料。\n项目建设单位不能按期申请验收的，应当向项目审批部门提出延期验收申请。\n项目审批部门应当及时组织验收。验收完成后，项目建设单位应当将验收报告等材料报项目审批部门备案。"},{"t":"a","x":"第二十六条 项目建设单位应当按照国家有关档案管理的规定，做好项目档案管理，并探索应用电子档案。\n未进行档案验收或者档案验收不合格的，不得通过项目验收。"},{"t":"a","x":"第二十七条 项目建设单位应当在项目通过验收并投入运行后12至24个月内，依据国家政务信息化建设管理绩效评价有关要求，开展自评价，并将自评价报告报送项目审批部门和财政部门。项目审批部门结合项目建设单位自评价情况，可以委托相应的第三方咨询机构开展后评价。"},{"t":"a","x":"第二十八条 加强国家政务信息化项目建设投资和运行维护经费协同联动，坚持“联网通办是原则，孤网是例外”。部门已建的政务信息化项目需升级改造，或者拟新建政务信息化项目，能够按要求进行信息共享的，由国家发展改革委会同有关部门进行审核；如果部门认为根据有关法律法规和党中央、国务院要求不能进行信息共享，但是确有必要建设或者保留的，由国家发展改革委报国务院，由国务院办公厅会同有关部门进行审核，经国务院批准后方可建设或者保留。\n（一）对于未按要求共享数据资源或者重复采集数据的政务信息系统，不安排运行维护经费，项目建设单位不得新建、改建、扩建政务信息系统。\n（二）对于未纳入国家政务信息系统总目录的系统，不安排运行维护经费。\n（三）对于不符合密码应用和网络安全要求，或者存在重大安全隐患的政务信息系统，不安排运行维护经费，项目建设单位不得新建、改建、扩建政务信息系统。"},{"t":"h","x":"第四章 监督管理"},{"t":"a","x":"第二十九条 项目建设单位应当接受项目审批部门及有关部门的监督管理，配合做好绩效评价、审计等监督管理工作，如实提供建设项目有关资料和情况，不得拒绝、隐匿、瞒报。"},{"t":"a","x":"第三十条 国务院办公厅、国家发展改革委、财政部、中央网信办会同有关部门按照职责分工，对国家政务信息化项目是否符合国家有关政务信息共享的要求，以及项目建设中招标采购、资金使用、密码应用、网络安全等情况实施监督管理。发现违反国家有关规定或者批复要求的，应当要求项目建设单位限期整改。逾期不整改或者整改后仍不符合要求的，项目审批部门可以对其进行通报批评、暂缓安排投资计划、暂停项目建设直至终止项目。\n网络安全监管部门应当依法加强对国家政务信息系统的安全监管，并指导监督项目建设单位落实网络安全审查制度要求。\n各部门应当严格遵守有关保密等法律法规规定，构建全方位、多层次、一致性的防护体系，按要求采用密码技术，并定期开展密码应用安全性评估，确保政务信息系统运行安全和政务信息资源共享交换的数据安全。"},{"t":"a","x":"第三十一条 审计机关应当依法加强对国家政务信息系统的审计，促进专项资金使用真实、合法和高效，推动完善并监督落实相关制度政策。"},{"t":"a","x":"第三十二条 项目审批部门、主管部门应当加强对绩效评价和项目后评价结果的应用，根据评价结果对国家政务信息化项目存在的问题提出整改意见，指导完善相关管理制度，并按照项目审批管理要求将评价结果作为下一年度安排政府投资和运行维护经费的重要依据。"},{"t":"a","x":"第三十三条 单位或者个人违反本办法规定未履行审批、备案程序，或者因管理不善、弄虚作假造成严重超概算、质量低劣、损失浪费、安全事故或者其他责任事故的，相关部门应当予以通报批评，并对负有直接责任的主管人员和其他责任人员依法给予处分。\n相关部门、单位或者个人违反国家有关规定，截留、挪用政务信息化项目资金，或者违规安排运行维护经费的，由有关部门按照《财政违法行为处罚处分条例》等相关规定予以查处。"},{"t":"h","x":"第五章 附 则"},{"t":"a","x":"第三十四条 国务院有关部门可以根据本办法的规定及职责分工，制定本部门的具体管理办法。\n各省、自治区、直辖市人民政府可以参照本办法制定本地区的管理办法。"},{"t":"a","x":"第三十五条 本办法由国家发展改革委会同财政部负责解释。"},{"t":"a","x":"第三十六条 本办法自2020年2月1日起施行。2007年8月13日国家发展改革委公布的《国家电子政务工程建设项目管理暂行办法》同时废止。"}]},{"title":"江苏省数据条例","source":"宿迁市人民政府网转载","date":"江苏省人大常委会2025年1月通过，2025年4月1日起施行","url":"https://suqian.gov.cn/zcwjk/shtbsjw/202502/60a00a4ef5044affbaba72efe96f02ce.shtml","arts":[{"t":"a","x":"第一条 为了加强数据资源管理，保护数据权益，保障数据安全，促进数据依法有序流通和应用，推动数据要素赋能新质生产力发展，加快建设数实融合强省，根据《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》等法律、行政法规，结合本省实际，制定本条例。"},{"t":"a","x":"第二条 本省行政区域内数据权益保护、资源管理、流通交易、产业发展、开发利用、安全和保障等活动，适用本条例。"},{"t":"a","x":"第三条 本条例中下列用语的含义：\n（一）数据，是指任何以电子或者其他方式对信息的记录。\n（二）数据处理，包括数据的收集、存储、使用、加工、传输、提供、公开、删除、销毁等。\n（三）数据安全，是指通过采取必要措施，确保数据处于有效保护和合法利用的状态，以及具备保障持续安全状态的能力。\n（四）公共数据，是指本省国家机关、法律法规授权的具有管理公共事务职能的组织和教育、医疗、供水、供电、供气、供热、交通运输、文化旅游、体育、环境保护等公共企事业单位（以下统称公共管理和服务机构）依法履行职责或者提供公共服务过程中收集、产生的数据，以及中央国家机关派驻本省的机关或者派出机构根据本省应用需求提供的数据。"},{"t":"a","x":"第四条 数据工作应当遵循统筹规划、创新引领、促进发展、保障安全的原则。"},{"t":"a","x":"第五条 县级以上地方人民政府应当加强对数据工作的领导，将数据工作纳入国民经济和社会发展规划，统筹安排资金支持数据领域发展和建设，加强督促指导和工作协调，研究解决数据工作中的重大问题，推动实现数据跨部门、跨层级、跨地区、跨行业、跨领域流通和应用，促进全社会数字化转型。"},{"t":"a","x":"第六条 省数据主管部门负责统筹推进全省数据工作，建立健全数据工作相关制度并组织实施，统筹数据汇聚共享和开发利用，指导数据要素市场建设，协调推进数据基础设施布局建设。设区的市、县（市、区）数据主管部门负责统筹推进本行政区域内数据工作。\n网信部门依法负责统筹协调网络数据安全、个人信息保护、数据跨境流通和相关监管工作。\n公安机关、国家安全机关等依法在各自职责范围内承担数据安全监管职责。\n有关部门和单位按照各自职责做好数据相关工作。"},{"t":"a","x":"第七条 省人民政府建立数据工作专家咨询机制，选聘高等学校、科研机构、企业、行业协会、相关部门和单位等方面的专家，为数据工作重大事项提供专业意见和技术支持。"},{"t":"a","x":"第八条 省人民政府、有关部门应当与长三角等区域其他省市建立数据跨区域协同发展机制，在数据标准规范统一、数据安全可信流通、算力资源合作发展、数据市场一体化、数字经济统筹协同、公共数据开发利用等方面加强协作。"},{"t":"a","x":"第九条 对在数据工作中做出突出贡献的单位和个人，按照国家和省有关规定给予表彰、奖励。"},{"t":"h","x":"第二章 数据权益"},{"t":"a","x":"第十条 本省依法保护个人、组织享有的数据持有、使用、经营等与数据有关的权益。\n个人、组织对通过合法途径收集、获取的数据，依法享有数据持有权益，可以自主管控其持有的数据。\n个人、组织对合法持有的数据，依法或者依约定享有数据使用权益，包括对数据进行清洗、变换、归集、标注、训练、分析等，以及持有在此过程中所形成的衍生数据。\n个人、组织对合法持有的数据以及通过加工、分析等形成的数据产品和服务，依法或者依约定享有数据经营权益，可以对其进行交易。"},{"t":"a","x":"第十一条 本省实行公共数据资源授权运营，鼓励探索企业等经营主体数据授权使用新模式，推动数据处理者按照个人授权范围依法依规采集、持有、托管和使用个人信息相关数据，推进数据分类分级确权授权使用和市场化流通交易。"},{"t":"a","x":"第十二条 数据处理者对其在自身或者共同参与的生产经营活动中，不违反法律、法规和合同约定前提下收集、产生的数据，享有持有、使用和经营权益。\n数据处理者委托他人处理数据的，受托方对委托处理的原始数据、过程数据、结果数据等，均不享有数据持有、使用、经营权益。法律、行政法规另有规定或者合同另有约定的除外。"},{"t":"a","x":"第十三条 个人、组织对数据财产性权益进行约定和分配时，应当遵循合法、自愿、公平、诚信的原则。\n数据来源者有权获取或者复制转移由其促成产生的数据。"},{"t":"a","x":"第十四条 省数据主管部门按照国家规定统筹建设全省数据产权登记体系，推进数据产权登记工作，负责数据产权登记管理。\n鼓励个人、组织在依法设立的登记机构对数据的持有、使用、经营等权益进行登记。经登记机构审查后取得的数据权益登记凭证，可以作为开展或者参与数据流通交易、数据资产会计处理、数据企业认定、融资担保等活动的证明。法律、行政法规和国家另有规定的，从其规定。\n数据主管部门应当对本行政区域内数据权益登记活动进行指导和监督。"},{"t":"a","x":"第十五条 个人、组织收集数据，应当采取合法、正当的方式，不得窃取或者以其他非法方式获取数据。\n法律、行政法规对收集、使用数据的目的、范围有规定的，应当在规定的目的和范围内收集、使用数据。\n收集个人信息应当限于实现处理目的的最小范围，不得过度收集。处理敏感个人信息应当具有特定的目的和充分的必要性，并采取严格的保护措施。处理敏感个人信息应当取得个人的单独同意；法律、行政法规规定处理敏感个人信息应当取得书面同意的，从其规定。"},{"t":"a","x":"第十六条 因依法履行突发事件应对工作职责或者义务获取的个人信息相关数据，只能用于突发事件应对，并在突发事件应对工作结束后予以销毁。确因依法作为证据使用或者调查评估需要留存或者延期销毁的，应当按照规定进行合法性、必要性、安全性评估，并采取相应保护和处理措施，严格依法使用。"},{"t":"a","x":"第十七条 网络平台服务提供者不得利用网络数据、算法以及平台规则等从事下列活动：\n（一）通过误导、欺诈、胁迫等方式处理用户在平台上产生的网络数据；\n（二）无正当理由限制用户访问、使用其自身在平台上产生的网络数据；\n（三）对用户实施不合理的差别待遇，损害用户合法权益；\n（四）法律、行政法规禁止的其他活动。"},{"t":"h","x":"第三章 数据资源"},{"t":"a","x":"第十八条 本省建立健全一体化数据资源体系，加强公共数据供给，支持企业等经营主体开放数据，促进个人信息相关数据合理利用。\n数据主管部门应当会同有关部门推动建立数据合作机制，促进各类数据汇聚共享和开发利用。"},{"t":"a","x":"第十九条 公共管理和服务机构按照法定权限、范围、程序和标准规范收集公共数据。能够通过共享获取数据的，不得重复收集、多头收集。\n财政资金保障运行的公共管理和服务机构因履行法定职责、提供公共服务需要，可以按照有关规定采购公共数据以外的数据。数据主管部门应当会同有关部门统筹管理数据采购工作。"},{"t":"a","x":"第二十条 公共数据实行统一目录管理和分类管理，具体办法由省人民政府制定。\n本省建立健全统一的公共数据目录管理体系，数据主管部门负责公共数据目录的统一管理。公共管理和服务机构应当按照国家和省统一标准编制本机构公共数据目录，并在本级公共数据平台发布，实行动态调整。\n省数据主管部门应当根据公共数据的通用性、基础性、重要性和数据来源属性等，制定公共数据分类规则、标准和管理要求。公共管理和服务机构应当按照规定，对公共数据实行全生命周期管理。"},{"t":"a","x":"第二十一条 数据主管部门依托公共数据平台实施公共数据的统一管理。\n省数据主管部门统筹建设和管理省公共数据平台。省大数据管理中心依托省公共数据平台归集治理全省公共数据，推动数据共享开放和融合应用。设区的市数据主管部门按照全省统一标准统筹建设和管理本行政区域公共数据平台，并与省公共数据平台对接。\n公共管理和服务机构不得在公共数据平台之外新建跨部门、跨层级、跨地区的公共数据共享、开放、运营通道；已经建成的，应当整合归并至公共数据平台。"},{"t":"a","x":"第二十二条 本省对公共数据汇聚实行清单化管理。数据主管部门应当制定公共数据汇聚清单。\n公共管理和服务机构、中央国家机关派驻本省的机关或者派出机构应当开展数据源头治理，按照公共数据汇聚清单，完整、准确、及时地向公共数据平台汇聚数据。"},{"t":"a","x":"第二十三条 上级政府部门通过垂直管理业务信息系统收集的公共数据，应当按照本行业管理要求和属地原则，完整、准确、及时地向下级政府部门回流。"},{"t":"a","x":"第二十四条 本省依托公共数据平台统筹建设全省人口、法人、电子证照、社会信用、自然资源和空间地理等基础数据库，根据需要推进宏观经济、健康医疗、社会保障、生态环保、应急管理等主题数据库建设，推动数据共建共享。"},{"t":"a","x":"第二十五条 省数据主管部门应当按照国家规定加强公共数据资源登记管理，统筹本省公共数据资源登记平台建设和使用管理工作，推进登记服务标准化。"},{"t":"a","x":"第二十六条 县级以上地方人民政府、有关部门应当引导企业等经营主体提升数据治理能力。\n鼓励企业等经营主体实施数字化改造，开展数据全流程、标准化收集和治理，推动数据互联互通和协议转换，实现数据融合和汇聚。\n鼓励科研机构、行业协会、行业龙头企业等建设行业共性数据资源库。"},{"t":"a","x":"第二十七条 鼓励个人汇聚其来源于多个途径的个人信息相关数据，通过授权使用等方式参与数据创新应用，发挥个人信息相关数据的价值。\n个人依法请求对其个人信息相关数据进行处理，或者要求对其个人信息相关数据处理规则进行解释说明的，数据处理者应当予以处理或者解释说明。"},{"t":"a","x":"第二十八条 数据主管部门应当会同有关部门健全完善公共数据质量监督管理制度规范。公共管理和服务机构应当建立健全公共数据处理全流程质量管理体系并组织实施，保证数据的真实性、准确性、完整性、时效性。\n个人、组织发现公共数据存在错误、遗漏的，可以向公共管理和服务机构提出，公共管理和服务机构应当及时校核、更正。\n鼓励企业等经营主体开展数据质量管理。相关行业协会依照章程为会员提供指导和服务。"},{"t":"a","x":"第二十九条 省数据主管部门应当会同有关部门组织开展全省数据资源情况调查，为制定相关政策、推进数据资源开发利用提供支持。\n公共管理和服务机构以及有关企业应当配合开展数据资源情况调查工作。"},{"t":"h","x":"第四章 数据流通"},{"t":"a","x":"第三十条 省数据主管部门会同有关部门完善数据流通交易体系，统筹推进数据安全高效流通交易，按照国家规定健全数据流通交易相关标准、规则，培育公平、开放、有序、诚信的数据要素市场。\n鼓励、支持个人、组织参与数据要素市场建设，依法依规采取开放、合作、交易等方式流通使用数据。"},{"t":"a","x":"第三十一条 省发展改革部门会同数据主管部门探索建立多样化、符合数据要素特性的价格形成机制。公共数据资源授权运营价格管理按照国家和省有关规定执行。\n发展改革、数据、市场监管等部门按照各自职责，对数据交易价格行为实施管理和监督。"},{"t":"a","x":"第三十二条 财政部门应当会同数据等有关部门建立健全数据资产管理制度，平等保护各类数据资产权利主体合法权益；指导行业协会等建立数据资产评估制度，科学评估反映数据资产价值，稳妥有序推进数据资产评估；推动企业、相关公共管理和服务机构按照国家统一的会计制度对数据资源进行会计处理。"},{"t":"a","x":"第三十三条 本省建立健全公共数据共享机制。公共管理和服务机构应当按照国家和省有关规定，通过公共数据平台与其他公共管理和服务机构共享公共数据。\n公共数据应当以共享为原则、不共享为例外。没有法律、法规、规章依据，不得拒绝共享；拒绝共享的，应当提供依据并说明理由。\n公共管理和服务机构通过公共数据平台共享获得的数据，仅限用于本机构履行法定职责、提供公共服务需要，不得以任何形式提供给第三方，也不得用于其他目的。"},{"t":"a","x":"第三十四条 本省建立健全公共数据开放机制。公共管理和服务机构应当按照国家和省有关规定，通过公共数据平台开放公共数据。\n公共数据开放应当坚持需求导向，遵循依法依规、安全有序的原则，优先开放与民生紧密相关、社会需求迫切的数据。\n公共数据按照开放属性分为无条件开放、有条件开放和不予开放三种类型。个人、组织申请有条件开放的公共数据的，应当明确使用目的或者应用场景，承诺真实、合规、安全使用获得的数据，不得以任何形式提供给第三方使用，不得用于其他目的或者场景。"},{"t":"a","x":"第三十五条 本省建立健全县级以上地方人民政府持有的公共数据资源授权运营机制。\n公共数据运营机构由省、设区的市人民政府按照国家和省有关规定确定，具体授权工作由省、设区的市数据主管部门按照职责组织实施。\n公共数据运营机构应当按照国家和省有关规定，依托公共数据平台依法处理公共数据，不得泄露、窃取、不当利用公共数据。\n数据主管部门应当会同有关部门对公共数据运营机构运营情况实施监督管理。"},{"t":"a","x":"第三十六条 支持企业等经营主体依法依规进行数据加工，形成数据产品和服务，开展数据交易，促进数据高效流通使用。"},{"t":"a","x":"第三十七条 个人信息相关数据的流通使用应当遵守《中华人民共和国个人信息保护法》等法律、法规的规定，依法依规取得个人同意或者经过匿名化处理，不得侵害自然人的个人信息权益。"},{"t":"a","x":"第三十八条 数据交易活动应当依法进行。有下列情形之一的，不得交易：\n（一）危害国家安全，损害社会公共利益，或者侵害个人隐私；\n（二）未经合法权利人授权同意；\n（三）法律、法规规定禁止交易的其他情形。"},{"t":"a","x":"第三十九条 数据交易场所应当依法设立。\n数据交易场所应当建立规范透明、高效便利、安全可控、可追溯的数据交易服务环境，制定交易服务规范与自律规则，建立健全内部管理制度，组织交易、结算和交付，接收处理投诉、举报，调解交易纠纷，按照国家和省有关规定采取有效措施保障数据交易安全。\n数据交易场所提供服务，应当依法要求数据提供方说明数据来源，审核交易双方的身份，并留存审核、交易记录。"},{"t":"a","x":"第四十条 公共数据运营机构交易开发利用公共数据资源形成的数据产品和服务、公共管理和服务机构利用财政资金采购公共数据以外的数据产品和服务，应当在依法设立的数据交易场所进行。\n鼓励企业等经营主体在依法设立的数据交易场所开展数据交易。"},{"t":"a","x":"第四十一条 本省落实国家规定，健全数据要素由市场评价贡献、按照贡献决定报酬机制，扩大数据要素市场化配置范围和按照价值贡献参与分配渠道；推动逐步建立保障公平的数据要素收益分配机制，完善数据要素收益的再分配调节机制，采取措施激励数据价值创造和价值实现。"},{"t":"a","x":"第四十二条 鼓励数据相关服务商为数据交易双方提供数据产品开发、发布、承销和数据资产合规化、标准化、增值化等服务，促进数据高效流通。"},{"t":"a","x":"第四十三条 中国（江苏）自由贸易试验区在国家数据分类分级保护制度框架下，可以自行制定区内需要纳入数据出境安全评估、个人信息出境标准合同、个人信息保护认证管理范围的数据清单，并按照国家规定履行批准、备案程序。\n鼓励有条件的地区按照国家规定，探索制定可以自由流动的一般数据清单、数据跨境传输合规指引等，促进数据依法有序自由流动。"},{"t":"h","x":"第五章 数据产业"},{"t":"a","x":"第四十四条 县级以上地方人民政府根据需要制定数据产业发展相关规划、方案和政策措施，培育发展数据汇聚处理、流通交易、安全治理等相关产业，推动构建数据产业生态体系。\n数据主管部门应当做好规划组织实施工作，落实国家数据战略有关要求，统筹协调推进数据产业发展；工业和信息化部门协同推进数据产业发展相关工作，其他有关部门根据各自职责开展数据产业发展相关工作。"},{"t":"a","x":"第四十五条 鼓励各地区结合实际优化数据产业布局，推进数据产业发展载体建设，促进数据产业集群化发展。\n有条件的地区可以通过组建数据产业联盟、建立协同发展平台、引进行业龙头企业等，因地制宜发展数据产业。"},{"t":"a","x":"第四十六条 省人民政府、有关部门应当完善数据产业技术创新体系和共性基础技术供给体系，推进数据领域技术进步和成果转化，推动先进技术产业化应用。\n鼓励、支持数据基础研究和关键核心技术攻关，推动建设国家和省级实验室、产业创新中心、技术创新中心、工程研究中心、企业技术中心等，促进数字技术创新与数据产业融合发展。"},{"t":"a","x":"第四十七条 本省培育数据相关专业服务机构，提供数据集成、数据经纪、合规认证、安全审计、数据公证、数据保险、数据托管、质量评估、资产评估、风险评估、人才培训、争议仲裁等服务。"},{"t":"a","x":"第四十八条 本省建立数据企业认定机制，明确认定标准、程序，引导、支持数据企业发展。\n鼓励企业等经营主体、个人发起设立或者参与组建数据企业，创新数据业务与商业模式，提供多元数据产品和服务。\n鼓励有条件的企业整合数据业务，创设数据企业或者数据业务内部机构，提升数据业务专业化、规模化、市场化水平。"},{"t":"a","x":"第四十九条 发展改革、工业和信息化、财政、商务、数据、地方金融管理等有关部门应当制定数据产业扶持政策和激励性措施，在专项资金、投资融资、招商引资等方面对数据产业发展给予支持。\n设区的市人民政府可以依法设立相关基金，引导、支持数据产业发展。\n鼓励金融机构按照市场化原则加大对数据产业相关企业信贷支持力度。鼓励社会资本采取风险投资、创业投资、股权投资等方式投向数据产业。鼓励符合条件的数据产业相关企业依法进入资本市场融资。"},{"t":"h","x":"第六章 数据应用"},{"t":"a","x":"第五十条 县级以上地方人民政府、有关部门统筹协调数据应用场景建设，加快应用场景布局，发布应用场景需求清单和指引、征集应用场景解决方案，建设典型数据应用场景，推进数据应用创新。"},{"t":"a","x":"第五十一条 县级以上地方人民政府、有关部门可以通过政府资金扶持、产学研用合作等方式，支持和鼓励个人、组织依法开发利用数据；采取发布典型案例、鼓励合作开发等措施，引导数据在不同领域融合应用，发挥数据的创新引擎作用。"},{"t":"a","x":"第五十二条 鼓励企业开发利用数据资源，在研发、生产、销售、服务等全过程应用数据，构建数据驱动的企业管理新模式。\n引导行业龙头企业、互联网平台企业发挥引领带动作用，开放、集聚数据资源，创新数据开放应用模式。\n鼓励产业链上下游企业数据共享，支持行业龙头企业、互联网平台企业与中小企业双向公平授权，建立互利共赢的合作机制，推动上下游企业协同创新、大中小企业协调发展。"},{"t":"a","x":"第五十三条 本省大力发展人工智能，统筹推进人工智能场景创新，推动解决人工智能重大应用和产业化问题，促进人工智能创新发展与规范监管，提升人工智能发展质量和水平。\n支持构建高质量数据集和语料库，推动人工智能大模型开发和训练。"},{"t":"a","x":"第五十四条 县级以上地方人民政府、工业和信息化等有关部门应当推动数据在制造业等工业领域的发展应用，支持工业企业实施智能化改造、数字化转型和网络化联接，推进智能车间、智能工厂建设，提升工业互联网应用水平；发挥制造业数据资源优势，提高制造业数据治理能力和供给水平，推动构建制造业等工业领域基础数据库和与先进制造业集群匹配的特色高价值数据集，为先进制造业发展提供高质量数据支撑。"},{"t":"a","x":"第五十五条 地方各级人民政府、农业农村等有关部门应当推进数据在农业生产、加工、销售、物流等领域的应用，推动建设以数据和模型为支撑的数智化场景，提升农业农村生产经营和管理服务的数字化、精准化、智能化水平。"},{"t":"a","x":"第五十六条 县级以上地方人民政府、有关部门应当促进数据和服务业深度融合，加快发展信息服务业；推动交通运输、商贸流通、金融服务等领域数字化转型，优化管理体系和服务模式，全面提升服务业品质和效益；推进数据在建筑设计、施工、运维等领域的应用，提升建筑业数字化水平。"},{"t":"a","x":"第五十七条 县级以上地方人民政府、有关部门应当提高科技领域数据汇聚整合和共享开放水平，推动数据支撑和服务科学研究、技术创新，通过数智融合等提升协同创新能力，促进产业创新发展。"},{"t":"a","x":"第五十八条 地方各级人民政府、有关部门应当促进数据在公共服务、社会治理、生活服务等领域的深度应用，挖掘公共卫生、医疗、教育、养老、就业、体育、文化旅游、公共法律服务等领域数据资源价值，推动公共服务数字化、普惠化。\n地方各级人民政府、有关部门应当整合数据资源，深化智慧城市发展，推进城市全域数字化转型，加快数字乡村建设，提高民生领域数字化水平。"},{"t":"a","x":"第五十九条 省数据主管部门会同有关部门推动数据与政务服务深度融合，持续提升全省一体化政务服务平台功能，推进政务服务一网通办和线上线下融合发展，实现政务服务事项高效集成办理。\n引导和鼓励电子签名、电子印章、电子证照、电子档案社会化应用。符合国家规定的电子证照与纸质证照具有同等法律效力。"},{"t":"a","x":"第六十条 本省加强数字政府集约化建设，推动建设全省一体化政务协同体系，有效提高政府运行服务效能。\n地方各级人民政府应当提高数字化履职能力，发挥数据在政府履行经济调节、市场监管、社会管理、公共服务、生态环境保护等职能中的支撑作用。"},{"t":"h","x":"第七章 数据安全"},{"t":"a","x":"第六十一条 本省构建政府、企业、社会多方协同的数据安全治理模式，健全数据安全治理体系，强化数据安全技术支撑，将安全贯穿数据供给、流通、使用等全过程，以数据安全保障数据开发利用和产业发展。"},{"t":"a","x":"第六十二条 本省按照国家和省有关规定，完善落实数据分类分级保护制度和数据安全风险评估、报告、信息共享、监测预警、应急处置等机制，提高数据安全保障能力。\n省有关部门应当按照国家规定制定重要数据目录，建立健全重要数据处理活动的风险评估和报送机制，加强对重要数据的保护。\n发生数据安全事件，有关部门应当依法启动应急预案，采取相应的应急处置措施，防止危害扩大，消除安全隐患，并及时向社会发布与公众有关的警示信息。"},{"t":"a","x":"第六十三条 数据处理者是数据安全责任主体。同时存在多个数据处理者的，各数据处理者依法承担相应的安全责任。\n数据处理者开展数据处理活动应当依照法律、行政法规的规定和国家标准的强制性要求，建立健全数据安全管理制度，组织开展数据安全教育培训，采取相应的技术措施和其他必要措施，加强数据处理全流程安全防护，实行重要系统和数据的容灾备份，保障数据安全。"},{"t":"a","x":"第六十四条 省网信部门按照国家有关规定统筹协调全省数据跨境流动安全管理工作，会同数据主管部门、国家安全机关等开展数据出境安全评估和相关监督管理。\n网信部门应当对数据处理者数据出境活动开展指导监督，健全数据出境安全管理制度，规范数据出境活动。"},{"t":"a","x":"第六十五条 鼓励开展身份认证、访问控制、数据加密、数据脱敏、数据溯源、数据备份、数据恢复、隐私保护计算等数据安全技术攻关和安全产品研发，加快培育数据安全骨干企业，构建良好数据安全产业生态。\n支持数据安全检测评估、认证等专业服务机构依法开展数据安全相关服务。支持有关部门、高等学校、科研机构、企业、行业协会、专业服务机构等在数据安全风险评估、防范、处置等方面开展协作。"},{"t":"h","x":"第八章 保障措施"},{"t":"a","x":"第六十六条 本省统筹数据基础设施建设，为数据汇聚处理、流通交易、开发利用以及安全治理等提供基础设施保障。\n省数据主管部门应当会同有关部门合理规划建设数据基础设施，探索建设数联网，推进数据流通技术研发和集成应用，推动建立可信数据空间，为数据共享、开放、交易提供安全可靠环境。\n省数据、通信管理、发展改革、工业和信息化、网信等部门应当优化算力布局，推进全省算力网建设，加强省内算力协同，推动算力与数据、算法一体化应用，促进算力与绿色电力融合，统筹推进算力发展与安全保障。"},{"t":"a","x":"第六十七条 省标准化部门应当会同数据等有关部门加强本省数据标准体系建设和管理。\n鼓励高等学校、科研机构、企业、行业协会等参与制定数据相关国际规则、国际标准、国家标准、行业标准和地方标准。支持依法制定数据相关企业标准、团体标准。"},{"t":"a","x":"第六十八条 本省加强数字人才队伍建设，将数据领域高层次、高学历、高技能以及紧缺人才纳入人才支持政策体系，建立数据领域人才职称评价体系，创新完善人才引进、培养、评价、激励机制，增强数字人才有效供给。\n鼓励高等学校加强数据领域相关学科专业建设，加大交叉学科人才培养力度。支持高等学校、科研机构与企业联合培养复合型数字人才。"},{"t":"a","x":"第六十九条 县级以上地方人民政府、有关部门应当加强数据相关技术知识、法律知识的宣传、教育、培训，提高全社会数据认知和应用水平，提升全民数字素养和数字技能。\n新闻媒体应当开展数据领域相关公益宣传。"},{"t":"a","x":"第七十条 县级以上地方人民政府、有关部门应当完善监管体系，改进监管技术和手段，对数据领域的新技术、新产业、新业态、新模式等实行包容审慎监管。\n省数据主管部门应当推进数据要素市场社会信用体系建设，依法对相关主体实施信用管理。"},{"t":"a","x":"第七十一条 数据主管部门应当对数据相关规划制定实施、重大政策贯彻落实和重大项目推进等情况进行评估督导，对发现的问题推动整改落实，对行之有效的经验做法予以推广，对业绩突出的地区和部门予以激励。"},{"t":"a","x":"第七十二条 鼓励各地区、各部门结合实际先行先试有利于数据共享开放、流通交易、开发利用和安全治理的创新举措。\n县级以上地方人民政府、有关部门应当建立鼓励创新、包容创新的容错纠错机制，支持在制度机制、价格形成、收益分配等方面积极探索。"},{"t":"a","x":"第七十三条 数据相关行业协会应当加强行业自律，推动行业合作和区域联动，开展信息交流、业务培训、人才培养等，引导会员依法开展数据相关活动，配合有关主管部门开展行业监管，促进行业健康发展。"},{"t":"a","x":"第七十四条 本省建立健全数据纠纷多元化解决机制，通过调解、行政裁决、行政复议、仲裁、诉讼等途径有效化解数据处理、流通交易活动中的争议纠纷。"},{"t":"h","x":"第九章 法律责任"},{"t":"a","x":"第七十五条 对违反本条例规定的行为，法律、法规已有处罚规定的，从其规定。"},{"t":"a","x":"第七十六条 违反本条例规定，有下列行为之一的，由数据主管部门、公共管理和服务机构按照职责责令改正，并暂时关闭其获取相关公共数据的权限；未按照要求改正的，对其终止开放相关公共数据：\n（一）超出授权范围开发利用公共数据；\n（二）未按照相关承诺使用有条件开放的公共数据；\n（三）未按照规定使用公共数据，造成严重后果的其他情形。"},{"t":"a","x":"第七十七条 公共管理和服务机构违反本条例规定，有下列行为之一的，由其上级主管部门或者数据主管部门责令限期改正；逾期未改正的，由数据主管部门提请本级人民政府进行情况通报；情节严重的，由有权机关对直接负责的主管人员和其他直接责任人员依法给予处分：\n（一）未按照规定收集、汇聚、治理、共享、回流、开放公共数据；\n（二）未按照规定对公共数据实行目录管理；\n（三）违反规定在公共数据平台之外新建跨部门、跨层级、跨地区的公共数据共享、开放、运营通道，或者未按照规定对已经建立的跨部门、跨层级、跨地区的公共数据共享、开放、运营通道进行整合；\n（四）未按照规定履行公共数据质量管理义务。"},{"t":"a","x":"第七十八条 地方各级人民政府、有关部门的工作人员在数据工作中滥用职权、玩忽职守、徇私舞弊的，依法给予处分；构成犯罪的，依法追究刑事责任。"},{"t":"h","x":"第十章 附则"},{"t":"a","x":"第七十九条 本条例自2025年4月1日起施行。"}]},{"title":"电子印章管理办法","source":"中国政府网","date":"国务院办公厅印发，2025年","url":"https://www.gov.cn/zhengce/zhengceku/202510/content_7043697.htm","arts":[{"t":"a","x":"第一条 为了加强电子印章规范管理，推动电子印章普遍应用，服务政务活动和经济社会数字化发展，根据《中华人民共和国电子签名法》、《中华人民共和国密码法》、《中华人民共和国网络安全法》、《中华人民共和国数据安全法》以及印章管理有关法律法规，制定本办法。"},{"t":"a","x":"第二条 本办法所称电子印章，是指基于密码技术和相关数字技术表征印章的特定格式数据，用于实现电子文件的可靠电子签名。\n电子印章包含印章图像数据、印章名称、印章所有者信息、电子签名认证证书以及与其关联的电子签名制作数据等。"},{"t":"a","x":"第三条 本办法适用于行政机关、企业事业单位、社会组织以及其他依法成立的组织〔以下统称单位（组织）〕的法定名称章，以法定名称冠名的内设机构章、分支机构章、业务专用章，以及用于单位（组织）事务办理的个人名章等电子印章的管理和应用活动。"},{"t":"a","x":"第四条 电子印章管理工作遵循统筹推进、分级管理、规范标准、安全可控的原则。"},{"t":"a","x":"第五条 符合本办法规定的电子印章与实物印章具有同等法律效力。除法律、行政法规明确不适用的情形外，经电子签章的电子文件与加盖实物印章的纸质文件具有同等效力。"},{"t":"h","x":"第二章 管理和服务主体"},{"t":"a","x":"第六条 国家密码管理局负责电子印章有关密码管理工作，对电子印章相关的电子政务电子认证服务实施监督管理，推动电子印章标准化工作，促进电子印章在政务活动中的互信互认。\n国家密码管理局会同有关部门统筹协调和推进全国电子印章的规范管理和推广应用。"},{"t":"a","x":"第七条 国务院办公厅负责依托全国一体化政务服务平台推动政务服务、公共服务以及相关社会化服务领域电子印章的互信互认。"},{"t":"a","x":"第八条 工业和信息化部负责对电子印章相关的电子认证服务实施监督管理。"},{"t":"a","x":"第九条 公安机关负责依法打击涉及电子印章的违法犯罪行为。"},{"t":"a","x":"第十条 省、自治区、直辖市密码管理部门负责本行政区域内电子印章有关密码管理工作，对电子印章相关的电子政务电子认证服务实施监督管理，推动电子印章标准化工作，促进电子印章在政务活动中的互信互认。"},{"t":"a","x":"第十一条 各地区各部门应当统筹加强本地区本部门（本系统）电子印章的规范管理和推广应用，促进电子印章互信互认。\n（一）各省（自治区、直辖市）、国务院各部门应当参照印章管理有关法律法规明确电子印章制发部门，负责本地区本部门（本系统）电子印章申请和注销的管理。\n（二）各省（自治区、直辖市）应当明确电子印章制作管理单位，负责本地区电子印章的制作、备案等工作。国务院各部门根据职责范围和实际需要明确电子印章制作管理单位，负责本部门（本系统）电子印章的制作、备案等工作。"},{"t":"a","x":"第十二条 电子印章涉及的电子政务电子认证服务，应当由依法设立的电子政务电子认证服务机构提供。电子印章涉及的电子认证服务，应当由依法设立的电子认证服务机构提供。"},{"t":"h","x":"第三章 制作、备案与注销管理"},{"t":"a","x":"第十三条 电子印章制发部门应当参照印章管理有关法律法规，明确申请电子印章的程序和要求。\n企业、社会组织等申请电子印章的程序可以结合实际适当简化。"},{"t":"a","x":"第十四条 电子印章制作管理单位应当明确电子印章制作程序、材料等具体要求。单位（组织）应当按照要求提交真实、合法、有效的制作材料，由电子印章制作管理单位进行核查。\n相关材料应当包含：\n（一）电子印章申请通过的相关证明材料；\n（二）单位（组织）的设立批准文件或者设立登记证件；\n（三）制作电子印章的相关数据和信息；\n（四）电子印章制作管理单位规定提交的其他材料。\n鼓励电子印章制作管理单位优先通过数据共享方式获取上述相关材料。"},{"t":"a","x":"第十五条 鼓励和支持电子印章制作系统与提供电子签章、电子签章验证等功能的信息系统独立部署。电子印章制作系统存在条块交叉的，应当统筹协调、集约建设。"},{"t":"a","x":"第十六条 电子印章制作应当符合以下要求：\n（一）电子印章的电子签名认证证书应当合法有效，由依法设立的电子政务电子认证服务机构或者电子认证服务机构签发，电子印章有效期的截止时间不超过电子印章所有者电子签名认证证书有效期的截止时间；\n（二）电子印章的数据格式、生成流程和应用接口应当符合国家有关标准规范；\n（三）电子印章的图像规格、式样等图像数据应当与印章管理有关法律法规明确的印模规制保持一致，可以根据需要附加电子印章相关标注字样。无对应实物印章的，电子印章图像数据可以参照相近实物印章的印模规制。"},{"t":"a","x":"第十七条 电子印章制作完成后，电子印章相关信息应当由电子印章制作管理单位进行备案。发生电子印章停用、恢复等状态变更情形的，电子印章所有者或者相关单位应当及时向电子印章制作管理单位进行备案。\n电子印章制作管理单位应当提供电子印章状态信息查询服务。"},{"t":"a","x":"第十八条 因电子印章有效期到期、电子印章载体损坏或者遗失、电子签名制作数据失密等情形需要重新制作电子印章的，电子印章所有者应当向电子印章制作管理单位提出重新制作。重新制作流程可以结合实际适当简化。"},{"t":"a","x":"第十九条 电子印章所有者发生更名、解散、撤销、被吊销、破产、分立、合并等情形，应当注销电子印章。电子印章所有者应当按照要求及时向电子印章制发部门提出注销电子印章，电子印章制作管理单位根据电子印章制发部门的处理意见，对需要注销的电子印章进行注销备案。\n电子印章所有者应当注销电子印章但未注销或者无法及时提出注销电子印章的，由电子印章制发部门提出注销处理意见，电子印章制作管理单位对需要注销的电子印章进行注销备案。\n电子印章所有者根据需要可以主动提出注销电子印章。"},{"t":"a","x":"第二十条 电子印章制作管理单位可以自行或者委托相关单位具体实施电子印章的制作、备案等工作，其中涉及的密码产品、服务应当符合密码检测认证有关要求。电子印章制作管理单位应当对受委托单位所承担的电子印章制作、备案等工作加强监督。\n电子印章制作、备案的操作记录、操作结果应当由电子印章制作管理单位妥善保管、长期保存。"},{"t":"h","x":"第四章 使用管理"},{"t":"a","x":"第二十一条 电子印章使用管理遵循“谁所有、谁控制，谁签章、谁负责”的原则。电子印章所有者应当制定有关规章制度，妥善保管和规范使用电子印章。"},{"t":"a","x":"第二十二条 电子签章应当使用有效的电子印章，遵照国家有关法律法规和标准规范，保证电子签章数据的真实性、完整性和不可否认性。电子签章过程信息应当被记录并保存，实现电子签章行为可追溯、可定责。"},{"t":"a","x":"第二十三条 电子签章验证应当按照国家有关标准规范核验电子签章数据的真实性、完整性和不可否认性，并核验电子印章在电子签章时的有效性。"},{"t":"a","x":"第二十四条 经电子签章的电子文件归档时，应当符合电子档案管理有关规定和标准规范。"},{"t":"h","x":"第五章 互信互认"},{"t":"a","x":"第二十五条 国家推动电子印章跨地区跨部门互信互认支撑能力建设，规范电子印章编码，促进电子印章状态信息及相关电子签名认证证书链信息的共享和使用。\n各地区各部门应当结合实际，加强本地区本部门（本系统）电子印章互信互认支撑能力建设。"},{"t":"a","x":"第二十六条 国家密码管理局会同有关部门积极推动电子印章互信互认标准规范建设，促进电子印章制作、备案、使用等环节的标准化。"},{"t":"a","x":"第二十七条 行政机关以及履行社会管理和公共服务职能的企业事业单位、社会组织在业务活动中需要使用电子印章时，其业务信息系统应当支持符合本办法规定的电子印章接入使用，法律、行政法规另有规定的除外。\n经电子签章的电子文件应当实现跨层级跨地域跨系统跨部门跨业务互通互认。"},{"t":"h","x":"第六章 安全管理"},{"t":"a","x":"第二十八条 电子印章管理全过程应当建立完善的信息保护制度，采取必要措施确保电子印章相关信息的安全，并对收集的单位（组织）和个人的信息严格保密，防止未经授权的访问以及信息泄露、篡改或者毁损、丢失。"},{"t":"a","x":"第二十九条 电子印章相关信息系统的建设、使用和运行维护应当符合国家密码管理、网络安全、数据安全等相关法律法规和标准规范。\n涉及国家秘密信息的电子印章相关信息系统的建设、使用和运行维护，还应当按照国家保密管理有关规定执行。"},{"t":"h","x":"第七章 违法违规责任"},{"t":"a","x":"第三十条 受委托承担电子印章制作、备案等工作的单位，未按照有关法律法规和标准规范制作电子印章，未按照规定履行安全管理义务，或者有其他违法行为的，由有关部门责令限期改正，并由电子印章制作管理单位将违法违规制作的电子印章标识为无效；逾期未改正的，由有关部门依法依规追究责任。\n电子政务电子认证服务或者电子认证服务存在违法行为，影响相关电子印章有效性的，由电子印章制作管理单位将涉及的相关电子印章标识为无效。"},{"t":"a","x":"第三十一条 电子印章所有者违反本办法规定的，依法依规承担相应责任。"},{"t":"a","x":"第三十二条 伪造、变造、冒用、盗用电子印章的，依法依规承担相应责任。"},{"t":"a","x":"第三十三条 依照本办法对电子印章相关活动负有监管职责的有关部门工作人员，不依法依规履行责任、失职渎职的，依法依规追究有关人员的责任；涉嫌犯罪的，移送有关机关处理。"},{"t":"h","x":"第八章 附 则"},{"t":"a","x":"第三十四条 本办法中下列用语的含义：\n（一）电子印章所有者，是指对电子印章拥有所有权的单位（组织）或者个人。电子印章的电子签名制作数据属于电子印章所有者专有。\n（二）电子签章，是指使用电子印章签署电子文件的过程，所形成的结果数据为电子签章数据。\n（三）电子印章制作系统，是指主要提供电子印章制作及相关管理功能的信息系统。"},{"t":"a","x":"第三十五条 仅用于单位（组织）内部业务的电子印章，可以参照本办法有关规定自行组织制作和管理。"},{"t":"a","x":"第三十六条 行政机关以外的其他国家机关可以参照本办法规范本部门（本系统）电子印章管理和应用活动。"},{"t":"a","x":"第三十七条 法律法规以及国家有关规定对涉密领域电子印章管理有特别规定的，依照其规定。"},{"t":"a","x":"第三十八条 本办法自印发之日起施行。"}]},{"title":"网络数据安全风险评估办法","source":"中国网信网","date":"2026年6月发布","url":"https://www.cac.gov.cn/2026-06/18/c_1783525609815499.htm","arts":[{"t":"a","x":"第一条 为了规范网络数据安全风险评估活动，保障网络数据安全，促进网络数据依法合理有效利用，根据《中华人民共和国数据安全法》、《中华人民共和国网络安全法》、《网络数据安全管理条例》等法律法规，制定本办法。"},{"t":"a","x":"第二条 在中华人民共和国境内开展网络数据安全风险评估，应当遵守本办法。\n本办法所称网络数据安全风险评估（以下简称风险评估），是指对网络数据和网络数据处理活动安全进行的风险识别、风险分析和风险评价等活动。"},{"t":"a","x":"第三条 在国家数据安全工作协调机制指导下，国家网信部门会同国务院电信、公安等有关部门建立网络数据安全风险评估专项工作机制，指导、监督风险评估工作。"},{"t":"a","x":"第四条 有关主管部门应当按照谁管业务、谁管业务数据、谁管数据安全的原则，定期组织开展本行业、本领域风险评估，根据工作需要对本行业、本领域处理重要数据的网络数据处理者（以下简称重要数据处理者）开展风险评估情况进行检查，并于每年1月底前将年度风险评估检查计划报送国家网信部门。国家网信部门通过国家数据安全工作协调机制将计划与国务院电信、公安、国家安全等有关部门共享并进行协调，避免不必要的检查和交叉重复检查。\n有关主管部门开展检查不得向被检查的重要数据处理者收取费用。"},{"t":"a","x":"第五条 重要数据处理者应当每年度开展风险评估。\n重要数据安全状态发生重大变化可能对数据安全造成不利影响的，应当及时对发生变化及其影响的部分开展风险评估。\n鼓励处理一般数据的网络数据处理者（以下简称一般数据处理者）至少每3年开展一次风险评估。"},{"t":"a","x":"第六条 风险评估工作应当按照《中华人民共和国数据安全法》、《网络数据安全管理条例》有关要求，参照数据安全风险评估有关国家标准开展。有关主管部门对本行业、本领域风险评估工作另有规定的，从其规定。"},{"t":"a","x":"第七条 网络数据处理者可以自行或者委托第三方评估机构（以下简称评估机构）开展风险评估。\n网络数据处理者自行开展风险评估，应当指定专人负责。网络数据处理者委托评估机构开展风险评估，应当通过订立合同或者其他具有法律效力的文件等方式明确双方的权利、义务等。"},{"t":"a","x":"第八条 鼓励相关评估机构通过认证。评估机构的认证按照《中华人民共和国认证认可条例》的有关规定执行。"},{"t":"a","x":"第九条 在国家数据安全工作协调机制指导下，国家网信部门和国务院电信、公安等有关部门积极促进网络数据安全风险评估服务的发展，培育评估机构。"},{"t":"a","x":"第十条 评估机构开展风险评估应当遵守法律法规，公正客观地作出风险判断，并对所出具的风险评估报告真实性、有效性、完整性负责。"},{"t":"a","x":"第十一条 评估机构不得转委托其他机构开展风险评估。"},{"t":"a","x":"第十二条 同一评估机构及其关联机构不得连续3次以上对同一网络数据处理者开展年度风险评估。"},{"t":"a","x":"第十三条 评估机构在风险评估过程中发现网络数据处理活动存在重大数据安全风险的，应当及时通知网络数据处理者。"},{"t":"a","x":"第十四条 评估机构及其工作人员应当对在风险评估过程中获得的数据、商业秘密、保密商务信息等依法予以保密，不得泄露或者非法向他人提供，在风险评估结束后及时删除或者按照合同约定妥善处置相关信息。"},{"t":"a","x":"第十五条 重要数据处理者开展年度风险评估，应当依法按照有关主管部门规定编制风险评估报告。有关主管部门对风险评估报告没有规定的，可以参照数据安全风险评估有关国家标准编制风险评估报告。风险评估报告至少保存3年。\n一般数据处理者可以参照前款要求编制风险评估报告。"},{"t":"a","x":"第十六条 重要数据处理者应当在年度风险评估完成后的20个工作日内按照有关主管部门要求向其报送风险评估报告。主管部门不明确的，向省级网信部门或者国家网信部门报送。\n有关主管部门应当公开风险评估报告报送渠道和联系方式，及时接收重要数据处理者报送的风险评估报告，自收到风险评估报告之日起的10个工作日内将报告通报同级网信部门。国家网信部门汇总相关报告，并与国务院电信、公安、国家安全等有关部门共享。\n省级以上网信部门、电信主管部门、公安机关、国家安全机关和其他有关部门可以对重要数据处理者的风险评估报告真实性、准确性进行检查核验，重要数据处理者应当配合开展检查核验。"},{"t":"a","x":"第十七条 省级以上网信部门、电信主管部门、公安机关和其他有关部门在风险评估报告核验、监督检查等工作中发现网络数据处理者有以下情形之一的，可以要求其委托通过认证的评估机构开展风险评估：\n（一）网络数据处理活动存在较大安全风险，可能危害国家安全、公共利益的；\n（二）发生网络数据安全事件，导致重要数据或者大规模个人信息泄露、被窃取的；\n（三）有关部门规定的其他情形。\n对同一网络数据安全事件或者风险，不得重复要求网络数据处理者委托评估机构开展风险评估。"},{"t":"a","x":"第十八条 网络数据处理者按照有关部门要求委托评估机构开展风险评估的，应当履行下列义务：\n（一）为评估机构开展风险评估提供必要支持，包括为风险评估人员提供必要的访问网络数据设施、网络数据、系统及操作日志记录权限等；\n（二）在限定时间内完成风险评估，情况复杂的，报有关部门批准后可以适当延长；\n（三）在完成风险评估后将评估机构出具的风险评估报告报送有关部门，风险评估报告应当由评估机构主要负责人、风险评估负责人签字并加盖机构公章；\n（四）按照有关部门要求对风险评估中发现的问题进行整改，在整改完成后15个工作日内，向有关部门报送整改情况报告。\n网络数据处理者不得以任何方式要求或者示意评估机构出具不实或者不当的风险评估报告。"},{"t":"a","x":"第十九条 有关部门在组织开展风险评估中发现重要数据处理者的重要数据处理活动可能危害国家安全、公共利益的，应当依据职责责令重要数据处理者进行整改；对拒不整改或者未达到整改要求的重要数据处理者，可以采取要求其停止处理重要数据等措施。"},{"t":"a","x":"第二十条 有关主管部门应当加强风险信息共享和协同处置，及时处置风险评估中发现的安全风险和问题，并按照有关规定及时报告。"},{"t":"a","x":"第二十一条 任何组织、个人有权对风险评估中的违法活动向有关部门进行投诉、举报，收到投诉、举报的部门应当依法及时处理。"},{"t":"a","x":"第二十二条 省级以上网信部门、电信主管部门、公安机关、国家安全机关或者其他有关部门发现网络数据处理者未按规定开展风险评估的，应当依据《中华人民共和国数据安全法》、《网络数据安全管理条例》等有关法律、行政法规予以处理。\n发现评估机构违反本办法开展风险评估的，有关部门应当依法予以处理。"},{"t":"a","x":"第二十三条 处理核心数据的网络数据处理者的风险评估，按照国家有关规定执行。\n涉及重要数据加密等技术措施的，应当按照国家密码相关法律、行政法规要求开展商用密码应用安全性评估。"},{"t":"a","x":"第二十四条 开展涉及国家秘密、工作秘密的风险评估活动，按照《中华人民共和国保守国家秘密法》等法律、行政法规及国家保密规定执行。"},{"t":"a","x":"第二十五条 本办法自2026年8月20日起施行。"}]},{"title":"智能体规范应用与创新发展实施意见","source":"中国网信网","date":"三部门印发，2026年5月","url":"https://www.cac.gov.cn/2026-05/08/c_1779979789523320.htm","arts":[{"t":"p","x":"智能体规范应用与创新发展实施意见\n智能体是具备自主感知、记忆、决策、交互与执行能力的智能系统，是人工智能产品及服务的重要形态。随着大模型等新一代人工智能技术迅猛发展，智能体正加速与网络空间、物理世界深度融合，深刻改变人类生产生活方式和社会治理模式。为落实国务院《关于深入实施“人工智能+”行动的意见》，促进智能体规范应用与创新发展，制定本实施意见。\n一、基本原则\n以推动科技创新、提升治理能力、构建产业生态、增进民生福祉为导向，坚持安全可控，将智能体安全、可靠、可信作为发展的底线要求，贯穿智能体技术研发、应用部署与推广的全过程，切实防范系统性风险。坚持规范有序，适应智能体技术演进规律，构建与现有政策法规衔接顺畅、行业自律自治、底线红线清晰的治理体系，有序推进智能体落地应用。坚持创新驱动，加强理论创新、技术创新、工程创新联动，体系化突破智能体关键技术，完善政产学研用协同机制，构建开放共享的智能体生态，提升产业创新活力。坚持应用牵引，重点围绕科学研究、产业发展、提振消费、民生福祉、社会治理等实际需求，发挥典型应用场景示范效应，先易后难、循序渐进，促进智能体技术验证、产品迭代、应用落地。\n二、夯实发展基础\n夯实技术底座，健全标准体系，降低智能体研发、适配、应用门槛，为丰富智能体产品及服务奠定基础。\n（一）完善技术底座\n1.强化基础技术研发。持续提升通用基础模型性能，支持行业发展细分领域专用模型，形成适应不同场景和设备的模型产品矩阵。面向智能体训练与运行，提升高质量数据集供给能力。加强智能体任务理解、任务规划、工具使用、长期记忆、互认互通、群体协同等技术攻关，提升智能体泛化能力。\n2.完善智能体工具链。开展智能体底层框架研究，加快研发感知、记忆、决策、交互、执行等关键组件，完善智能体研发、测试、部署、运维等工具链。发展对抗样本检测、行为异常检测等安全与治理工具，提升对智能体非合规行为的发现、干预、阻断、恢复能力。\n（二）构建标准协议\n3.建立智能体标准体系。制定智能体标准化工作指导文件，形成智能体标准框架，系统布局关键技术、重要产品、数据交换、应用场景、质量评测、安全保障、可信认证等标准体系，加快制定智能体与软件工具、应用服务、硬件外设接口等基础标准。加强智能体互联协议（AIP）等智能体互联关键国家标准、行业标准的推广应用。支持医疗、交通、媒体、公共安全等领域制定强制性标准。鼓励企业按照相关标准研发产品服务，提升智能体规范性。积极参与国际标准制定。\n4.布局发展智能互联网。研究建立智能互联网体系架构，探索建立智能体注册平台，提供智能体数字身份管理、检索发现、能力声明等服务，支持开发者、部署方式、接口协议、合规认证等信息查询和管理。提升多智能体协同能力，研究智能体身份标识、可信互联、合规支付、安全防护、冲突解决等基础技术。发挥互联网协议第六版（IPv6）技术优势，提升智能体端到端通信能力。探索建立智能互联网监测指标体系。\n三、守牢安全底线\n坚持以人为本、智能向善、多元共治、安全稳妥，营造规范发展、鼓励创新的制度环境，促进智能体健康有序发展。\n（一）明确产品准则\n5.完善政策法规和伦理规范。加快研究智能体相关政策法规及伦理规范，发挥专业机构内容资源和审核把关优势，确保智能体行为符合法律法规及主流价值观。防止智能体利用数据优势、人格化技术实施传播不良价值观、算法压榨等行为，防范未成年人、老年人沉迷成瘾、情感依赖等风险。做好与人工智能伦理审查等制度衔接。\n6.明确决策权限。在遵守法律法规、尊重社会公德和伦理规范前提下，厘清仅限用户本人决策、需由用户授权决策和智能体自主决策等各种决策方式的合理边界及所需权限。确保用户对智能体自主决策享有知情权和最终决策权，智能体执行操作不得超出用户授权范围。\n7.加强行为管控。发展规则内嵌、行为围栏等技术，确保智能体在公共场所、隐私场所、专门场所等的行为合法合规。探索利用区块链等技术，建立重要应用场景智能体行为可验证、可追溯机制，防范智能体不当行为引发重大风险。\n（二）防范安全风险\n8.提升内生安全能力。研究智能体数据安全、个人信息保护、密码防护、攻击检测、权限管理、行为控制等安全技术，提升智能体系统安全保障能力，防范数据投毒、隐私泄露、算法篡改、系统漏洞、运行失控等安全风险。研究智能体安全检测技术，探索建立智能体安全评估体系。\n9.加强供应链安全。制定智能体开发、部署、应用、维护等全周期安全规范，加强模型接入、应用程序接口调用、扩展工具使用等环节安全管理。探索建立智能体供应链安全信息共享和预警机制，及时发布风险提示，提升安全保障能力。\n10.化解应用衍生风险。完善智能体常态化风险识别、预警及干预机制，强化人机协同审核、拦截阻断等风险处置能力，防范系统性安全风险。强化智能体应用安全管理，避免智能体被用于自动化攻击、隐私侵犯、虚假信息生成传播、网络诈骗等违法犯罪行为。\n（三）完善治理体系\n11.构建分类分级治理框架。根据应用场景和潜在影响，审慎稳妥开展智能体分级治理。对于敏感领域及重点行业，由网信部门联合行业主管部门确定开放场景，根据相关法律法规、监管要求和安全防护标准，实行备案、检测、问题产品召回等管理措施。对于部分生活娱乐、日常办公等低风险领域，完善智能体评估测试工具，通过合规自测、信息报告、分发平台管理、行业自律等实现高效治理。\n12.健全合规服务体系。强化智能体风险监测预警、检测评估、咨询、认证等专业服务供给，引导行业积极研发智能体监测工具。开展智能体功能、性能、质量、合规等第三方评测服务，推动认证与检测结果互通互认，为用户选择智能体提供参考。编制并发布智能体技术及应用成熟度报告，为产业研发应用提供参考。\n（四）强化行业自律\n13.引导行业加强自律。鼓励行业组织、主要企业联合制定行业自律规则，明确智能体功能合规、算法治理、知识产权保护、公平竞争等规范细则。指导智能体开发平台、分发平台、服务提供者建立公平合理的平台规则、用户服务协议及隐私政策，明确供需双方权责，保障产业健康发展。加强智能体应用风险宣传教育，提升用户安全意识。\n14.探索信用评价机制。指导行业组织建立智能体市场主体自愿参与的信用评价机制，对于技术滥用、诱导消费、虚假宣传、隐瞒缺陷信息等行为进行信用评价，依法依规开展失信惩戒。引导智能体开发者、开发平台、分发平台、服务提供者等参与信用评价，共同营造良好发展环境。\n四、强化应用牵引\n积极稳妥推动智能体典型场景应用，牵引技术产品优化提升，探索形成可复制、可推广的智能体落地应用模式。\n（一）科学研究\n15.科研探索。研发理论推演、模拟仿真等智能体，挖掘潜在技术路径。强化智能体信息关联整合、知识体系构建等能力，提升自然科学、哲学社会科学研究发现能力。促进智能体与科学仪器、实验平台融合，实现方案设计、实验操作、数据处理、结果分析等全流程智能化。\n16.研发辅助。发展软件开发智能体，提升需求分析、架构设计、代码生成与测试等全流程开发能力。促进智能体与计算机辅助设计（CAD）、计算机辅助工程（CAE）等软件结合，提供设计方案生成、仿真验证、参数调优等功能。\n（二）产业发展\n17.智能制造。研发生产管理智能体，动态优化生产排程、资源分配和工序衔接，推动智能体在工业互联网领域应用，提升企业精细化管理水平。提升智能体工艺参数优化、加工精度检测、产品缺陷识别等能力，促进智能体与数控机床、工业机器人、自动化产线等融合，促进提质增效降本。\n18.能源资源。研发大气、水体、土壤、噪声等环境要素感知智能体，提升自然灾害、环境污染等风险预警能力。依托智能体强化对国土空间资源全周期管理能力。依托智能体实现能源、金属等矿产资源高效勘探。发展电力调度、用电监测、电网维护等智能体，提升电力资源使用效率。\n19.交通运输。研发交通安全监管、应急指挥调度等智能体，提升违章违规行为识别、交通基础设施风险预警、重点车辆（船舶）监管、事故快速响应等能力。优化交通监测调度智能体性能，发展交通载运工具管控智能体，提升路网、水网、空域的通行效率。\n20.农业生产。研发农业服务智能体，开展农技指导、病虫害诊断与防治等服务。推动智能体在种植养殖、高效育种等环节应用，推进农业智能化转型。推动智能体与智能农机具、智慧大棚、农业服务平台融合，提升农业生产效率。\n21.金融服务。研发金融风控智能体，提升信贷审批、交易监控、账户安全等环节风险识别能力。完善智能体异常检测、合规审计功能，提升信贷违约预测、信用卡盗刷拦截、反洗钱监测等能力。\n（三）提振消费\n22.终端应用。推动智能体赋能互联网应用及服务，优化在线购物、出行导航、生活缴费、日常办公等服务体验。推动智能体与手机、电脑、汽车、家居、可穿戴、消费级机器人等终端设备协同发展，提升跨应用、跨设备任务完成能力。\n23.文化旅游。研发文学、音乐、绘画、视听、演艺等内容创作智能体，促进优秀文化传播推广。发展智能导览、多语种翻译、适老适残等旅游服务智能体，提升旅游服务水平。\n24.商业服务。提升智能体客服能力，提供7×24小时咨询、预约、售后等服务。发展导引、清洁、仓储、配售等具身智能体，提升餐饮、零售、住宿、物流等商业场所的运营效率。探索通过具身智能体提供低成本家政、养老、托育、助残等服务。\n（四）民生福祉\n25.教育教学。探索课件生成、作业批改、学情分析等智能体，提高教师工作效率。依托智能体开展个性化学习方案制定，完善智能导学、答疑辅导、虚拟助教等功能。支持在线教育平台研发智能体，提供终身学习服务。\n26.医疗健康。提升医学影像分析、疾病诊断推理、定制化诊疗方案生成等医疗辅助智能体性能，探索药品管理、手术排程、病历管理等智能体，提升医疗服务效率。稳步发展预问诊、报告解析等智能体，提升患者体验。\n27.人力资源。探索智能体在就业促进、技术技能人才培养评价、劳动关系公共服务等领域应用，提升就业服务能力。发展社会保险、劳动争议仲裁、欠薪治理等智能体，保障劳动者合法权益。\n28.信息服务。探索智能体在网络内容建设管理中的应用，鼓励信息发布部门和内容传播平台研发用户分析、选题策划、采编加工、分发推荐、智能审核、舆论引导、情绪疏导、实时翻译等智能体，实现多模态信息、跨领域信息的高效整合。\n（五）社会治理\n29.政务服务。探索事项辅助审批智能体，推动政务审批流程智能化。发展政策咨询智能体，提供全天在线的政务咨询、流程指引等服务。探索主动推送适配政策、服务提醒及办理指南，加快从“人找服务”向“服务找人”转型。\n30.司法服务。探索全流程办案辅助智能体，提升案件材料梳理、案件信息录入、证据审查、辅助法律文书生成等能力。发展法律宣传、法律咨询、法律监督等智能体，为群众提供高效便捷的在线司法服务。\n31.公共安全。探索监测预警、应急处置、救援调度、协同治理等智能体，提升安全生产监管和防灾减灾救灾等能力。提升智能体异常行为识别、潜在威胁预警、动态防控处理能力，维护公共安全。推动具身智能体在灾害救援、安防巡检、危险品处置等领域落地应用。\n32.城市治理。探索智能体在城市规划、建设与治理环节应用，支撑智能建造、房屋管理、城市基础设施安全运行等工作，提升城市治理专业化水平，提升城市人居环境质量。\n33.招标投标。探索招标投标智能体，实现招标投标活动全链路智慧管理，保障全过程规范高效。提升招标投标交易、服务和监管的智慧化水平，实现招标科学合理、评标公平公正和监管穿透高效。\n五、建设创新生态\n畅通供需渠道，促进研发侧、需求侧高水平互动，形成市场牵引、内驱发展的智能体产业生态。\n（一）促进产业合作\n34.培育开源创新力量。引导国内人工智能开源社区加强智能体布局，开展智能体与开源芯片、开源操作系统、开源大模型兼容适配。引导企业、高校、科研机构积极参与智能体框架、交互接口、工具链等开源项目，推动技术体系融通发展，加快提升国际影响力。\n35.搭建产业协作平台。发挥智能体相关生态联盟、技术验证实验室等产业协作平台的作用，协同产业链上下游开展智能体共性技术研发、标准制定、评估认证等工作，开展智能体技术与产业应用复合人才培养。引导互联网应用、智能终端等领域企业共建生态，探索建立互利共赢的合作模式。\n（二）强化应用推广\n36.构建应用推广渠道。推动建立智能体软件商店、行业供需信息发布平台，引导智能体企业积极发布产品，形成集聚效应。开展智能体应用供需对接活动，采取公开招标、揭榜挂帅等方式吸引智能体企业定制化开发相应产品。引导整机、软件等企业基于智能体研发产品和服务，培育用户市场。\n37.推进重点场景开放。推动重点领域开放智能体应用场景，在产业集聚区、重点行业、重点领域开展智能体应用试点，打造一批具有引领作用的示范项目。发展市场化、专业化的智能体技术转化服务机构，探索智能体应用场景，提升技术成果转化效率。促进行业数据共享开放，支撑重点场景智能体训练部署。\n38.积极培育全球生态。依托世界人工智能大会、世界互联网大会等国际平台，交流展示智能体技术创新成果。推动终端设备、软件企业适配智能体，引导相关企业做好海外合规建设，推动智能体适应当地法律法规和文化习俗。\n六、保障措施\n国家网信办、国家发展改革委、工业和信息化部会同有关方面加强统筹谋划，强化资源整合和力量协同，完善配套政策，形成工作合力，推动重点任务落实落地。建立并完善智能体发展评价指标体系，加强智能体规范应用与创新发展的监测评估、滚动实施和动态调整。\n关闭\n中央网络安全和信息化委员会办公室 中华人民共和国国家互联网信息办公室 © 版权所有 联系我们\n承办：国家互联网应急中心 技术支持：长安通信科技有限责任公司 京ICP备14042428号 京公网安备11040102700108号\n学习强国\n◆ ◆\n微信\n◆ ◆\n返回顶部\n中央网络安全和信息化委员会办公室\n中华人民共和国国家互联网信息办公室 ©"}]},{"title":"生成式人工智能服务管理暂行办法","source":"中国政府网","date":"国家网信办等7部门令第15号，2023年8月15日起施行","url":"https://www.gov.cn/zhengce/zhengceku/202307/content_6891752.htm","arts":[{"t":"a","x":"第一条 为了促进生成式人工智能健康发展和规范应用，维护国家安全和社会公共利益，保护公民、法人和其他组织的合法权益，根据《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》、《中华人民共和国科学技术进步法》等法律、行政法规，制定本办法。"},{"t":"a","x":"第二条 利用生成式人工智能技术向中华人民共和国境内公众提供生成文本、图片、音频、视频等内容的服务（以下称生成式人工智能服务），适用本办法。\n国家对利用生成式人工智能服务从事新闻出版、影视制作、文艺创作等活动另有规定的，从其规定。\n行业组织、企业、教育和科研机构、公共文化机构、有关专业机构等研发、应用生成式人工智能技术，未向境内公众提供生成式人工智能服务的，不适用本办法的规定。"},{"t":"a","x":"第三条 国家坚持发展和安全并重、促进创新和依法治理相结合的原则，采取有效措施鼓励生成式人工智能创新发展，对生成式人工智能服务实行包容审慎和分类分级监管。"},{"t":"a","x":"第四条 提供和使用生成式人工智能服务，应当遵守法律、行政法规，尊重社会公德和伦理道德，遵守以下规定：\n（一）坚持社会主义核心价值观，不得生成煽动颠覆国家政权、推翻社会主义制度，危害国家安全和利益、损害国家形象，煽动分裂国家、破坏国家统一和社会稳定，宣扬恐怖主义、极端主义，宣扬民族仇恨、民族歧视，暴力、淫秽色情，以及虚假有害信息等法律、行政法规禁止的内容；\n（二）在算法设计、训练数据选择、模型生成和优化、提供服务等过程中，采取有效措施防止产生民族、信仰、国别、地域、性别、年龄、职业、健康等歧视；\n（三）尊重知识产权、商业道德，保守商业秘密，不得利用算法、数据、平台等优势，实施垄断和不正当竞争行为；\n（四）尊重他人合法权益，不得危害他人身心健康，不得侵害他人肖像权、名誉权、荣誉权、隐私权和个人信息权益；\n（五）基于服务类型特点，采取有效措施，提升生成式人工智能服务的透明度，提高生成内容的准确性和可靠性。"},{"t":"h","x":"第二章 技术发展与治理"},{"t":"a","x":"第五条 鼓励生成式人工智能技术在各行业、各领域的创新应用，生成积极健康、向上向善的优质内容，探索优化应用场景，构建应用生态体系。\n支持行业组织、企业、教育和科研机构、公共文化机构、有关专业机构等在生成式人工智能技术创新、数据资源建设、转化应用、风险防范等方面开展协作。"},{"t":"a","x":"第六条 鼓励生成式人工智能算法、框架、芯片及配套软件平台等基础技术的自主创新，平等互利开展国际交流与合作，参与生成式人工智能相关国际规则制定。\n推动生成式人工智能基础设施和公共训练数据资源平台建设。促进算力资源协同共享，提升算力资源利用效能。推动公共数据分类分级有序开放，扩展高质量的公共训练数据资源。鼓励采用安全可信的芯片、软件、工具、算力和数据资源。"},{"t":"a","x":"第七条 生成式人工智能服务提供者（以下称提供者）应当依法开展预训练、优化训练等训练数据处理活动，遵守以下规定：\n（一）使用具有合法来源的数据和基础模型；\n（二）涉及知识产权的，不得侵害他人依法享有的知识产权；\n（三）涉及个人信息的，应当取得个人同意或者符合法律、行政法规规定的其他情形；\n（四）采取有效措施提高训练数据质量，增强训练数据的真实性、准确性、客观性、多样性；\n（五）《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》等法律、行政法规的其他有关规定和有关主管部门的相关监管要求。"},{"t":"a","x":"第八条 在生成式人工智能技术研发过程中进行数据标注的，提供者应当制定符合本办法要求的清晰、具体、可操作的标注规则；开展数据标注质量评估，抽样核验标注内容的准确性；对标注人员进行必要培训，提升尊法守法意识，监督指导标注人员规范开展标注工作。"},{"t":"h","x":"第三章 服务规范"},{"t":"a","x":"第九条 提供者应当依法承担网络信息内容生产者责任，履行网络信息安全义务。涉及个人信息的，依法承担个人信息处理者责任，履行个人信息保护义务。\n提供者应当与注册其服务的生成式人工智能服务使用者（以下称使用者）签订服务协议，明确双方权利义务。"},{"t":"a","x":"第十条 提供者应当明确并公开其服务的适用人群、场合、用途，指导使用者科学理性认识和依法使用生成式人工智能技术，采取有效措施防范未成年人用户过度依赖或者沉迷生成式人工智能服务。"},{"t":"a","x":"第十一条 提供者对使用者的输入信息和使用记录应当依法履行保护义务，不得收集非必要个人信息，不得非法留存能够识别使用者身份的输入信息和使用记录，不得非法向他人提供使用者的输入信息和使用记录。\n提供者应当依法及时受理和处理个人关于查阅、复制、更正、补充、删除其个人信息等的请求。"},{"t":"a","x":"第十二条 提供者应当按照《互联网信息服务深度合成管理规定》对图片、视频等生成内容进行标识。"},{"t":"a","x":"第十三条 提供者应当在其服务过程中，提供安全、稳定、持续的服务，保障用户正常使用。"},{"t":"a","x":"第十四条 提供者发现违法内容的，应当及时采取停止生成、停止传输、消除等处置措施，采取模型优化训练等措施进行整改，并向有关主管部门报告。\n提供者发现使用者利用生成式人工智能服务从事违法活动的，应当依法依约采取警示、限制功能、暂停或者终止向其提供服务等处置措施，保存有关记录，并向有关主管部门报告。"},{"t":"a","x":"第十五条 提供者应当建立健全投诉、举报机制，设置便捷的投诉、举报入口，公布处理流程和反馈时限，及时受理、处理公众投诉举报并反馈处理结果。"},{"t":"h","x":"第四章 监督检查和法律责任"},{"t":"a","x":"第十六条 网信、发展改革、教育、科技、工业和信息化、公安、广播电视、新闻出版等部门，依据各自职责依法加强对生成式人工智能服务的管理。\n国家有关主管部门针对生成式人工智能技术特点及其在有关行业和领域的服务应用，完善与创新发展相适应的科学监管方式，制定相应的分类分级监管规则或者指引。"},{"t":"a","x":"第十七条 提供具有舆论属性或者社会动员能力的生成式人工智能服务的，应当按照国家有关规定开展安全评估，并按照《互联网信息服务算法推荐管理规定》履行算法备案和变更、注销备案手续。"},{"t":"a","x":"第十八条 使用者发现生成式人工智能服务不符合法律、行政法规和本办法规定的，有权向有关主管部门投诉、举报。"},{"t":"a","x":"第十九条 有关主管部门依据职责对生成式人工智能服务开展监督检查，提供者应当依法予以配合，按要求对训练数据来源、规模、类型、标注规则、算法机制机理等予以说明，并提供必要的技术、数据等支持和协助。\n参与生成式人工智能服务安全评估和监督检查的相关机构和人员对在履行职责中知悉的国家秘密、商业秘密、个人隐私和个人信息应当依法予以保密，不得泄露或者非法向他人提供。"},{"t":"a","x":"第二十条 对来源于中华人民共和国境外向境内提供生成式人工智能服务不符合法律、行政法规和本办法规定的，国家网信部门应当通知有关机构采取技术措施和其他必要措施予以处置。"},{"t":"a","x":"第二十一条 提供者违反本办法规定的，由有关主管部门依照《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》、《中华人民共和国科学技术进步法》等法律、行政法规的规定予以处罚；法律、行政法规没有规定的，由有关主管部门依据职责予以警告、通报批评，责令限期改正；拒不改正或者情节严重的，责令暂停提供相关服务。\n构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。"},{"t":"h","x":"第五章 附 则"},{"t":"a","x":"第二十二条 本办法下列用语的含义是：\n（一）生成式人工智能技术，是指具有文本、图片、音频、视频等内容生成能力的模型及相关技术。\n（二）生成式人工智能服务提供者，是指利用生成式人工智能技术提供生成式人工智能服务（包括通过提供可编程接口等方式提供生成式人工智能服务）的组织、个人。\n（三）生成式人工智能服务使用者，是指使用生成式人工智能服务生成内容的组织、个人。"},{"t":"a","x":"第二十三条 法律、行政法规规定提供生成式人工智能服务应当取得相关行政许可的，提供者应当依法取得许可。\n外商投资生成式人工智能服务，应当符合外商投资相关法律、行政法规的规定。"},{"t":"a","x":"第二十四条 本办法自2023年8月15日起施行。\n国家互联网信息办公室\n中华人民共和国国家发展和改革委员会\n中华人民共和国教育部\n中华人民共和国科学技术部\n中华人民共和国工业和信息化部\n中华人民共和国公安部\n国家广播电视总局\n令\n第15号\n《生成式人工智能服务管理暂行办法》已经2023年5月23日国家互联网信息办公室2023年第12次室务会会议审议通过，并经国家发展和改革委员会、教育部、科学技术部、工业和信息化部、公安部、国家广播电视总局同意，现予公布，自2023年8月15日起施行。\n国家互联网信息办公室主任 庄荣文\n国家发展和改革委员会主任 郑栅洁\n教育部部长 怀进鹏\n科学技术部部长 王志刚\n工业和信息化部部长 金壮龙\n公安部部长 王小洪\n国家广播电视总局局长 曹淑敏\n2023年7月10日\n生成式人工智能服务管理暂行办法"},{"t":"h","x":"第一章 总 则"},{"t":"a","x":"第一条 为了促进生成式人工智能健康发展和规范应用，维护国家安全和社会公共利益，保护公民、法人和其他组织的合法权益，根据《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》、《中华人民共和国科学技术进步法》等法律、行政法规，制定本办法。"},{"t":"a","x":"第二条 利用生成式人工智能技术向中华人民共和国境内公众提供生成文本、图片、音频、视频等内容的服务（以下称生成式人工智能服务），适用本办法。\n国家对利用生成式人工智能服务从事新闻出版、影视制作、文艺创作等活动另有规定的，从其规定。\n行业组织、企业、教育和科研机构、公共文化机构、有关专业机构等研发、应用生成式人工智能技术，未向境内公众提供生成式人工智能服务的，不适用本办法的规定。"},{"t":"a","x":"第三条 国家坚持发展和安全并重、促进创新和依法治理相结合的原则，采取有效措施鼓励生成式人工智能创新发展，对生成式人工智能服务实行包容审慎和分类分级监管。"},{"t":"a","x":"第四条 提供和使用生成式人工智能服务，应当遵守法律、行政法规，尊重社会公德和伦理道德，遵守以下规定：\n（一）坚持社会主义核心价值观，不得生成煽动颠覆国家政权、推翻社会主义制度，危害国家安全和利益、损害国家形象，煽动分裂国家、破坏国家统一和社会稳定，宣扬恐怖主义、极端主义，宣扬民族仇恨、民族歧视，暴力、淫秽色情，以及虚假有害信息等法律、行政法规禁止的内容；\n（二）在算法设计、训练数据选择、模型生成和优化、提供服务等过程中，采取有效措施防止产生民族、信仰、国别、地域、性别、年龄、职业、健康等歧视；\n（三）尊重知识产权、商业道德，保守商业秘密，不得利用算法、数据、平台等优势，实施垄断和不正当竞争行为；\n（四）尊重他人合法权益，不得危害他人身心健康，不得侵害他人肖像权、名誉权、荣誉权、隐私权和个人信息权益；\n（五）基于服务类型特点，采取有效措施，提升生成式人工智能服务的透明度，提高生成内容的准确性和可靠性。"},{"t":"h","x":"第二章 技术发展与治理"},{"t":"a","x":"第五条 鼓励生成式人工智能技术在各行业、各领域的创新应用，生成积极健康、向上向善的优质内容，探索优化应用场景，构建应用生态体系。\n支持行业组织、企业、教育和科研机构、公共文化机构、有关专业机构等在生成式人工智能技术创新、数据资源建设、转化应用、风险防范等方面开展协作。"},{"t":"a","x":"第六条 鼓励生成式人工智能算法、框架、芯片及配套软件平台等基础技术的自主创新，平等互利开展国际交流与合作，参与生成式人工智能相关国际规则制定。\n推动生成式人工智能基础设施和公共训练数据资源平台建设。促进算力资源协同共享，提升算力资源利用效能。推动公共数据分类分级有序开放，扩展高质量的公共训练数据资源。鼓励采用安全可信的芯片、软件、工具、算力和数据资源。"},{"t":"a","x":"第七条 生成式人工智能服务提供者（以下称提供者）应当依法开展预训练、优化训练等训练数据处理活动，遵守以下规定：\n（一）使用具有合法来源的数据和基础模型；\n（二）涉及知识产权的，不得侵害他人依法享有的知识产权；\n（三）涉及个人信息的，应当取得个人同意或者符合法律、行政法规规定的其他情形；\n（四）采取有效措施提高训练数据质量，增强训练数据的真实性、准确性、客观性、多样性；\n（五）《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》等法律、行政法规的其他有关规定和有关主管部门的相关监管要求。"},{"t":"a","x":"第八条 在生成式人工智能技术研发过程中进行数据标注的，提供者应当制定符合本办法要求的清晰、具体、可操作的标注规则；开展数据标注质量评估，抽样核验标注内容的准确性；对标注人员进行必要培训，提升尊法守法意识，监督指导标注人员规范开展标注工作。"},{"t":"h","x":"第三章 服务规范"},{"t":"a","x":"第九条 提供者应当依法承担网络信息内容生产者责任，履行网络信息安全义务。涉及个人信息的，依法承担个人信息处理者责任，履行个人信息保护义务。\n提供者应当与注册其服务的生成式人工智能服务使用者（以下称使用者）签订服务协议，明确双方权利义务。"},{"t":"a","x":"第十条 提供者应当明确并公开其服务的适用人群、场合、用途，指导使用者科学理性认识和依法使用生成式人工智能技术，采取有效措施防范未成年人用户过度依赖或者沉迷生成式人工智能服务。"},{"t":"a","x":"第十一条 提供者对使用者的输入信息和使用记录应当依法履行保护义务，不得收集非必要个人信息，不得非法留存能够识别使用者身份的输入信息和使用记录，不得非法向他人提供使用者的输入信息和使用记录。\n提供者应当依法及时受理和处理个人关于查阅、复制、更正、补充、删除其个人信息等的请求。"},{"t":"a","x":"第十二条 提供者应当按照《互联网信息服务深度合成管理规定》对图片、视频等生成内容进行标识。"},{"t":"a","x":"第十三条 提供者应当在其服务过程中，提供安全、稳定、持续的服务，保障用户正常使用。"},{"t":"a","x":"第十四条 提供者发现违法内容的，应当及时采取停止生成、停止传输、消除等处置措施，采取模型优化训练等措施进行整改，并向有关主管部门报告。\n提供者发现使用者利用生成式人工智能服务从事违法活动的，应当依法依约采取警示、限制功能、暂停或者终止向其提供服务等处置措施，保存有关记录，并向有关主管部门报告。"},{"t":"a","x":"第十五条 提供者应当建立健全投诉、举报机制，设置便捷的投诉、举报入口，公布处理流程和反馈时限，及时受理、处理公众投诉举报并反馈处理结果。"},{"t":"h","x":"第四章 监督检查和法律责任"},{"t":"a","x":"第十六条 网信、发展改革、教育、科技、工业和信息化、公安、广播电视、新闻出版等部门，依据各自职责依法加强对生成式人工智能服务的管理。\n国家有关主管部门针对生成式人工智能技术特点及其在有关行业和领域的服务应用，完善与创新发展相适应的科学监管方式，制定相应的分类分级监管规则或者指引。"},{"t":"a","x":"第十七条 提供具有舆论属性或者社会动员能力的生成式人工智能服务的，应当按照国家有关规定开展安全评估，并按照《互联网信息服务算法推荐管理规定》履行算法备案和变更、注销备案手续。"},{"t":"a","x":"第十八条 使用者发现生成式人工智能服务不符合法律、行政法规和本办法规定的，有权向有关主管部门投诉、举报。"},{"t":"a","x":"第十九条 有关主管部门依据职责对生成式人工智能服务开展监督检查，提供者应当依法予以配合，按要求对训练数据来源、规模、类型、标注规则、算法机制机理等予以说明，并提供必要的技术、数据等支持和协助。\n参与生成式人工智能服务安全评估和监督检查的相关机构和人员对在履行职责中知悉的国家秘密、商业秘密、个人隐私和个人信息应当依法予以保密，不得泄露或者非法向他人提供。"},{"t":"a","x":"第二十条 对来源于中华人民共和国境外向境内提供生成式人工智能服务不符合法律、行政法规和本办法规定的，国家网信部门应当通知有关机构采取技术措施和其他必要措施予以处置。"},{"t":"a","x":"第二十一条 提供者违反本办法规定的，由有关主管部门依照《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》、《中华人民共和国科学技术进步法》等法律、行政法规的规定予以处罚；法律、行政法规没有规定的，由有关主管部门依据职责予以警告、通报批评，责令限期改正；拒不改正或者情节严重的，责令暂停提供相关服务。\n构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。"},{"t":"h","x":"第五章 附 则"},{"t":"a","x":"第二十二条 本办法下列用语的含义是：\n（一）生成式人工智能技术，是指具有文本、图片、音频、视频等内容生成能力的模型及相关技术。\n（二）生成式人工智能服务提供者，是指利用生成式人工智能技术提供生成式人工智能服务（包括通过提供可编程接口等方式提供生成式人工智能服务）的组织、个人。\n（三）生成式人工智能服务使用者，是指使用生成式人工智能服务生成内容的组织、个人。"},{"t":"a","x":"第二十三条 法律、行政法规规定提供生成式人工智能服务应当取得相关行政许可的，提供者应当依法取得许可。\n外商投资生成式人工智能服务，应当符合外商投资相关法律、行政法规的规定。"},{"t":"a","x":"第二十四条 本办法自2023年8月15日起施行。"}]},{"title":"电子认证服务使用密码管理办法","source":"国家密码管理局","date":"国家密码管理局令第6号，2026年8月1日起施行","url":"https://www.oscca.gov.cn/sca/xxgk/2026-06/03/content_1061341.shtml","arts":[{"t":"a","x":"第一条 为了规范电子认证服务使用密码行为，保障电子认证服务使用密码安全，根据《中华人民共和国电子签名法》、《中华人民共和国密码法》和《商用密码管理条例》等法律、行政法规，制定本办法。"},{"t":"a","x":"第二条 在中华人民共和国境内的电子认证服务使用密码及其监督管理，适用本办法。"},{"t":"a","x":"第三条 采用商用密码技术提供电子认证服务，应当依法取得国家密码管理局颁发的《电子认证服务使用密码许可证》。"},{"t":"a","x":"第四条 国家密码管理局对全国电子认证服务使用密码行为实施监督管理。\n县级以上地方各级密码管理部门对本行政区域的电子认证服务使用密码行为实施监督管理。"},{"t":"a","x":"第五条 申请《电子认证服务使用密码许可证》，应当具备下列条件：\n（一）具有企业法人资格；\n（二）具有与电子认证服务使用密码相适应的运营场所；\n（三）具有在境内设置、符合国家有关密码标准的电子认证服务系统等设备设施；\n（四）具有密码或者相关专业知识的专业技术人员和安全管理人员等专业人员；\n（五）具有与电子认证服务使用密码相适应的专业能力；\n（六）具有与电子认证服务使用密码相适应的管理体系。"},{"t":"a","x":"第六条 申请《电子认证服务使用密码许可证》，应当向国家密码管理局委托进行受理的省、自治区、直辖市密码管理部门提交下列材料：\n（一）书面申请表；\n（二）企业法人营业执照；\n（三）运营场所情况；\n（四）电子认证服务系统相关技术材料及相关设备清单，包括建设工作报告、技术工作报告、安全性设计报告、安全管理策略和规范、标准符合性自评估报告，相关软件、硬件清单及其符合国家有关安全标准的情况等；\n（五）专业人员情况；\n（六）专业能力情况；\n（七）电子认证服务使用密码管理体系建立情况，包括电子认证服务系统运行管理、设备管理、人员管理、文档管理、安全保密管理等管理体系建立情况。"},{"t":"a","x":"第七条 受国家密码管理局委托进行受理的省、自治区、直辖市密码管理部门自收到申请材料之日起5个工作日内，对申请材料进行形式审查，根据下列情况分别作出处理：申请材料齐全、符合规定形式的，应当受理行政许可申请并出具受理通知书；申请材料不齐全或者不符合规定形式的，应当当场或者在5个工作日内一次告知需要补正的全部内容；不予受理的，应当出具不予受理通知书并说明理由。"},{"t":"a","x":"第八条 国家密码管理局应当自行政许可申请受理之日起20个工作日内，对行政许可申请进行审查，并依法作出是否许可的决定。准予许可的，颁发《电子认证服务使用密码许可证》，并予以公开；不予许可的，应当出具不予行政许可决定书，说明理由并告知申请人相关权利。\n需要对申请人进行技术评审的，技术评审所需时间不计算在本条规定的期限内。国家密码管理局应当将技术评审所需时间书面告知申请人。"},{"t":"a","x":"第九条 国家密码管理局根据行政许可申请审查需要，可以委托专业机构或者组织专家实施技术评审。\n技术评审包括电子认证服务系统安全性审查和互联互通测试，运营场所、设备设施、管理体系建设实地查勘等。\n专业机构和专家应当独立、公正、科学、诚信地开展技术评审活动，对技术评审结论的真实性、符合性负责，并承担相应法律责任。国家密码管理局应当对技术评审活动进行监督，建立责任追究机制。"},{"t":"a","x":"第十条 《电子认证服务使用密码许可证》有效期5年，内容包括：获证机构名称、证书编号、有效期限、发证机关和发证日期等。"},{"t":"a","x":"第十一条 有下列情形之一的，获得《电子认证服务使用密码许可证》的机构应当自变更之日起30日内向国家密码管理局办理变更手续：\n（一）机构名称、住所、法定代表人发生变更；\n（二）电子认证服务系统等设备设施发生变化，影响或者可能影响电子认证服务使用密码安全；\n（三）新建、搬迁电子认证服务系统；\n（四）依法需要办理变更的其他事项。\n获得《电子认证服务使用密码许可证》的机构发生变更的事项影响其符合许可条件和要求的，国家密码管理局根据申请人的实际情况，采取书面或者现场形式开展审查。需要进行技术评审的，依照本办法第九条规定对其开展技术评审。"},{"t":"a","x":"第十二条 《电子认证服务使用密码许可证》有效期届满需要延续的，应当在有效期届满60日前向国家密码管理局提出书面申请。国家密码管理局根据申请人的实际情况，采取书面或者现场形式进行审查，并在《电子认证服务使用密码许可证》有效期届满前作出是否准予延续的决定。"},{"t":"a","x":"第十三条 获得《电子认证服务使用密码许可证》的机构应当按照国家有关密码管理要求履行电子认证服务使用密码安全管理义务，保证其电子认证服务使用密码持续符合要求。"},{"t":"a","x":"第十四条 电子认证服务系统所需密钥服务由国家密码管理局或者省、自治区、直辖市密码管理部门规划的密钥管理系统提供。"},{"t":"a","x":"第十五条 获得《电子认证服务使用密码许可证》的机构应当落实电子认证服务系统运行维护制度，明确关键岗位和岗位责任，制定操作规范，加强巡检和运行维护，提高监测预警和应急处置能力，及时消除电子认证服务系统运行安全隐患，保证电子认证服务系统安全可靠运行。"},{"t":"a","x":"第十六条 获得《电子认证服务使用密码许可证》的机构应当自行或者委托专业机构每年至少进行一次电子认证服务使用密码合规性评估，对评估中发现的问题及时进行整改，并向住所地省、自治区、直辖市密码管理部门报送电子认证服务使用密码合规性评估报告。"},{"t":"a","x":"第十七条 获得《电子认证服务使用密码许可证》的机构应当制定电子认证服务使用密码安全教育培训计划，每年组织开展电子认证服务使用密码安全知识和岗位技能培训，相关专业技术人员和安全管理人员每年教育培训时间不得少于20个小时。"},{"t":"a","x":"第十八条 密码管理部门依法对电子认证服务使用密码情况进行监督检查，可以采取书面检查、现场检查、网络监测等方式。"},{"t":"a","x":"第十九条 密码管理部门依法实施监督检查时，可以进入电子认证服务活动场所实施现场检查，调查、了解有关情况，查阅、复制有关资料，并可以委托专业机构或者组织专家开展有关检测鉴定工作。\n获得《电子认证服务使用密码许可证》的机构应当予以配合，并如实提供相关材料和技术支持。"},{"t":"a","x":"第二十条 密码管理部门开展监督检查，不得影响电子认证服务系统的正常运行，不得收取任何费用，不得泄露或者非法向他人提供在履行职责中知悉的商业秘密和个人隐私。"},{"t":"a","x":"第二十一条 获得《电子认证服务使用密码许可证》的机构违反本办法有关规定，有下列情形之一的，由密码管理部门责令限期改正；逾期未改正的，给予警告、通报批评；情节严重的，处1万元以上10万元以下罚款：\n（一）未按照本办法第十一条第一款规定办理变更手续；\n（二）电子认证服务系统所需密钥服务未由国家密码管理局或者省、自治区、直辖市密码管理部门规划的密钥管理系统提供；\n（三）未按照本办法第十五条规定履行电子认证服务系统运行维护相关义务；\n（四）未按照要求进行电子认证服务使用密码合规性评估，或者未对评估中发现的问题及时进行整改；\n（五）未按照要求开展电子认证服务使用密码安全知识和岗位技能培训。"},{"t":"a","x":"第二十二条 从事电子认证服务使用密码监督管理工作的人员滥用职权、玩忽职守、徇私舞弊，或者泄露、非法向他人提供在履行职责中知悉的商业秘密、个人隐私、举报人信息的，依法给予处分。"},{"t":"a","x":"第二十三条 《电子认证服务使用密码许可证》依法被吊销、撤销、注销的，由国家密码管理局将有关情况通报国务院工业和信息化主管部门。"},{"t":"a","x":"第二十四条 法律、行政法规和国家有关规定对电子政务电子认证服务使用密码管理另有规定的，从其规定。"},{"t":"a","x":"第二十五条 本办法自2026年7月1日起施行。2009年10月28日国家密码管理局公告第17号公布，根据2017年12月1日《国家密码管理局关于废止和修改部分管理规定的决定》修正的《电子认证服务密码管理办法》同时废止。"}]},{"title":"关键信息基础设施安全保护条例","source":"中国网信网","date":"国务院令第745号，2021年9月1日起施行","url":"https://www.cac.gov.cn/2021-08/17/c_1630785976988160.htm","arts":[{"t":"a","x":"第一条 为了保障关键信息基础设施安全，维护网络安全，根据《中华人民共和国网络安全法》，制定本条例。"},{"t":"a","x":"第二条 本条例所称关键信息基础设施，是指公共通信和信息服务、能源、交通、水利、金融、公共服务、电子政务、国防科技工业等重要行业和领域的，以及其他一旦遭到破坏、丧失功能或者数据泄露，可能严重危害国家安全、国计民生、公共利益的重要网络设施、信息系统等。"},{"t":"a","x":"第三条 在国家网信部门统筹协调下，国务院公安部门负责指导监督关键信息基础设施安全保护工作。国务院电信主管部门和其他有关部门依照本条例和有关法律、行政法规的规定，在各自职责范围内负责关键信息基础设施安全保护和监督管理工作。\n省级人民政府有关部门依据各自职责对关键信息基础设施实施安全保护和监督管理。"},{"t":"a","x":"第四条 关键信息基础设施安全保护坚持综合协调、分工负责、依法保护，强化和落实关键信息基础设施运营者（以下简称运营者）主体责任，充分发挥政府及社会各方面的作用，共同保护关键信息基础设施安全。"},{"t":"a","x":"第五条 国家对关键信息基础设施实行重点保护，采取措施，监测、防御、处置来源于中华人民共和国境内外的网络安全风险和威胁，保护关键信息基础设施免受攻击、侵入、干扰和破坏，依法惩治危害关键信息基础设施安全的违法犯罪活动。\n任何个人和组织不得实施非法侵入、干扰、破坏关键信息基础设施的活动，不得危害关键信息基础设施安全。"},{"t":"a","x":"第六条 运营者依照本条例和有关法律、行政法规的规定以及国家标准的强制性要求，在网络安全等级保护的基础上，采取技术保护措施和其他必要措施，应对网络安全事件，防范网络攻击和违法犯罪活动，保障关键信息基础设施安全稳定运行，维护数据的完整性、保密性和可用性。"},{"t":"a","x":"第七条 对在关键信息基础设施安全保护工作中取得显著成绩或者作出突出贡献的单位和个人，按照国家有关规定给予表彰。"},{"t":"h","x":"第二章 关键信息基础设施认定"},{"t":"a","x":"第八条 本条例第二条涉及的重要行业和领域的主管部门、监督管理部门是负责关键信息基础设施安全保护工作的部门（以下简称保护工作部门）。"},{"t":"a","x":"第九条 保护工作部门结合本行业、本领域实际，制定关键信息基础设施认定规则，并报国务院公安部门备案。\n制定认定规则应当主要考虑下列因素：\n（一）网络设施、信息系统等对于本行业、本领域关键核心业务的重要程度；\n（二）网络设施、信息系统等一旦遭到破坏、丧失功能或者数据泄露可能带来的危害程度；\n（三）对其他行业和领域的关联性影响。"},{"t":"a","x":"第十条 保护工作部门根据认定规则负责组织认定本行业、本领域的关键信息基础设施，及时将认定结果通知运营者，并通报国务院公安部门。"},{"t":"a","x":"第十一条 关键信息基础设施发生较大变化，可能影响其认定结果的，运营者应当及时将相关情况报告保护工作部门。保护工作部门自收到报告之日起3个月内完成重新认定，将认定结果通知运营者，并通报国务院公安部门。"},{"t":"h","x":"第三章 运营者责任义务"},{"t":"a","x":"第十二条 安全保护措施应当与关键信息基础设施同步规划、同步建设、同步使用。"},{"t":"a","x":"第十三条 运营者应当建立健全网络安全保护制度和责任制，保障人力、财力、物力投入。运营者的主要负责人对关键信息基础设施安全保护负总责，领导关键信息基础设施安全保护和重大网络安全事件处置工作，组织研究解决重大网络安全问题。"},{"t":"a","x":"第十四条 运营者应当设置专门安全管理机构，并对专门安全管理机构负责人和关键岗位人员进行安全背景审查。审查时，公安机关、国家安全机关应当予以协助。"},{"t":"a","x":"第十五条 专门安全管理机构具体负责本单位的关键信息基础设施安全保护工作，履行下列职责：\n（一）建立健全网络安全管理、评价考核制度，拟订关键信息基础设施安全保护计划；\n（二）组织推动网络安全防护能力建设，开展网络安全监测、检测和风险评估；\n（三）按照国家及行业网络安全事件应急预案，制定本单位应急预案，定期开展应急演练，处置网络安全事件；\n（四）认定网络安全关键岗位，组织开展网络安全工作考核，提出奖励和惩处建议；\n（五）组织网络安全教育、培训；\n（六）履行个人信息和数据安全保护责任，建立健全个人信息和数据安全保护制度；\n（七）对关键信息基础设施设计、建设、运行、维护等服务实施安全管理；\n（八）按照规定报告网络安全事件和重要事项。"},{"t":"a","x":"第十六条 运营者应当保障专门安全管理机构的运行经费、配备相应的人员，开展与网络安全和信息化有关的决策应当有专门安全管理机构人员参与。"},{"t":"a","x":"第十七条 运营者应当自行或者委托网络安全服务机构对关键信息基础设施每年至少进行一次网络安全检测和风险评估，对发现的安全问题及时整改，并按照保护工作部门要求报送情况。"},{"t":"a","x":"第十八条 关键信息基础设施发生重大网络安全事件或者发现重大网络安全威胁时，运营者应当按照有关规定向保护工作部门、公安机关报告。\n发生关键信息基础设施整体中断运行或者主要功能故障、国家基础信息以及其他重要数据泄露、较大规模个人信息泄露、造成较大经济损失、违法信息较大范围传播等特别重大网络安全事件或者发现特别重大网络安全威胁时，保护工作部门应当在收到报告后，及时向国家网信部门、国务院公安部门报告。"},{"t":"a","x":"第十九条 运营者应当优先采购安全可信的网络产品和服务；采购网络产品和服务可能影响国家安全的，应当按照国家网络安全规定通过安全审查。"},{"t":"a","x":"第二十条 运营者采购网络产品和服务，应当按照国家有关规定与网络产品和服务提供者签订安全保密协议，明确提供者的技术支持和安全保密义务与责任，并对义务与责任履行情况进行监督。"},{"t":"a","x":"第二十一条 运营者发生合并、分立、解散等情况，应当及时报告保护工作部门，并按照保护工作部门的要求对关键信息基础设施进行处置，确保安全。"},{"t":"h","x":"第四章 保障和促进"},{"t":"a","x":"第二十二条 保护工作部门应当制定本行业、本领域关键信息基础设施安全规划，明确保护目标、基本要求、工作任务、具体措施。"},{"t":"a","x":"第二十三条 国家网信部门统筹协调有关部门建立网络安全信息共享机制，及时汇总、研判、共享、发布网络安全威胁、漏洞、事件等信息，促进有关部门、保护工作部门、运营者以及网络安全服务机构等之间的网络安全信息共享。"},{"t":"a","x":"第二十四条 保护工作部门应当建立健全本行业、本领域的关键信息基础设施网络安全监测预警制度，及时掌握本行业、本领域关键信息基础设施运行状况、安全态势，预警通报网络安全威胁和隐患，指导做好安全防范工作。"},{"t":"a","x":"第二十五条 保护工作部门应当按照国家网络安全事件应急预案的要求，建立健全本行业、本领域的网络安全事件应急预案，定期组织应急演练；指导运营者做好网络安全事件应对处置，并根据需要组织提供技术支持与协助。"},{"t":"a","x":"第二十六条 保护工作部门应当定期组织开展本行业、本领域关键信息基础设施网络安全检查检测，指导监督运营者及时整改安全隐患、完善安全措施。"},{"t":"a","x":"第二十七条 国家网信部门统筹协调国务院公安部门、保护工作部门对关键信息基础设施进行网络安全检查检测，提出改进措施。\n有关部门在开展关键信息基础设施网络安全检查时，应当加强协同配合、信息沟通，避免不必要的检查和交叉重复检查。检查工作不得收取费用，不得要求被检查单位购买指定品牌或者指定生产、销售单位的产品和服务。"},{"t":"a","x":"第二十八条 运营者对保护工作部门开展的关键信息基础设施网络安全检查检测工作，以及公安、国家安全、保密行政管理、密码管理等有关部门依法开展的关键信息基础设施网络安全检查工作应当予以配合。"},{"t":"a","x":"第二十九条 在关键信息基础设施安全保护工作中，国家网信部门和国务院电信主管部门、国务院公安部门等应当根据保护工作部门的需要，及时提供技术支持和协助。"},{"t":"a","x":"第三十条 网信部门、公安机关、保护工作部门等有关部门，网络安全服务机构及其工作人员对于在关键信息基础设施安全保护工作中获取的信息，只能用于维护网络安全，并严格按照有关法律、行政法规的要求确保信息安全，不得泄露、出售或者非法向他人提供。"},{"t":"a","x":"第三十一条 未经国家网信部门、国务院公安部门批准或者保护工作部门、运营者授权，任何个人和组织不得对关键信息基础设施实施漏洞探测、渗透性测试等可能影响或者危害关键信息基础设施安全的活动。对基础电信网络实施漏洞探测、渗透性测试等活动，应当事先向国务院电信主管部门报告。"},{"t":"a","x":"第三十二条 国家采取措施，优先保障能源、电信等关键信息基础设施安全运行。\n能源、电信行业应当采取措施，为其他行业和领域的关键信息基础设施安全运行提供重点保障。"},{"t":"a","x":"第三十三条 公安机关、国家安全机关依据各自职责依法加强关键信息基础设施安全保卫，防范打击针对和利用关键信息基础设施实施的违法犯罪活动。"},{"t":"a","x":"第三十四条 国家制定和完善关键信息基础设施安全标准，指导、规范关键信息基础设施安全保护工作。"},{"t":"a","x":"第三十五条 国家采取措施，鼓励网络安全专门人才从事关键信息基础设施安全保护工作；将运营者安全管理人员、安全技术人员培训纳入国家继续教育体系。"},{"t":"a","x":"第三十六条 国家支持关键信息基础设施安全防护技术创新和产业发展，组织力量实施关键信息基础设施安全技术攻关。"},{"t":"a","x":"第三十七条 国家加强网络安全服务机构建设和管理，制定管理要求并加强监督指导，不断提升服务机构能力水平，充分发挥其在关键信息基础设施安全保护中的作用。"},{"t":"a","x":"第三十八条 国家加强网络安全军民融合，军地协同保护关键信息基础设施安全。"},{"t":"h","x":"第五章 法律责任"},{"t":"a","x":"第三十九条 运营者有下列情形之一的，由有关主管部门依据职责责令改正，给予警告；拒不改正或者导致危害网络安全等后果的，处10万元以上100万元以下罚款，对直接负责的主管人员处1万元以上10万元以下罚款：\n（一）在关键信息基础设施发生较大变化，可能影响其认定结果时未及时将相关情况报告保护工作部门的；\n（二）安全保护措施未与关键信息基础设施同步规划、同步建设、同步使用的；\n（三）未建立健全网络安全保护制度和责任制的；\n（四）未设置专门安全管理机构的；\n（五）未对专门安全管理机构负责人和关键岗位人员进行安全背景审查的；\n（六）开展与网络安全和信息化有关的决策没有专门安全管理机构人员参与的；\n（七）专门安全管理机构未履行本条例第十五条规定的职责的；\n（八）未对关键信息基础设施每年至少进行一次网络安全检测和风险评估，未对发现的安全问题及时整改，或者未按照保护工作部门要求报送情况的；\n（九）采购网络产品和服务，未按照国家有关规定与网络产品和服务提供者签订安全保密协议的；\n（十）发生合并、分立、解散等情况，未及时报告保护工作部门，或者未按照保护工作部门的要求对关键信息基础设施进行处置的。"},{"t":"a","x":"第四十条 运营者在关键信息基础设施发生重大网络安全事件或者发现重大网络安全威胁时，未按照有关规定向保护工作部门、公安机关报告的，由保护工作部门、公安机关依据职责责令改正，给予警告；拒不改正或者导致危害网络安全等后果的，处10万元以上100万元以下罚款，对直接负责的主管人员处1万元以上10万元以下罚款。"},{"t":"a","x":"第四十一条 运营者采购可能影响国家安全的网络产品和服务，未按照国家网络安全规定进行安全审查的，由国家网信部门等有关主管部门依据职责责令改正，处采购金额1倍以上10倍以下罚款，对直接负责的主管人员和其他直接责任人员处1万元以上10万元以下罚款。"},{"t":"a","x":"第四十二条 运营者对保护工作部门开展的关键信息基础设施网络安全检查检测工作，以及公安、国家安全、保密行政管理、密码管理等有关部门依法开展的关键信息基础设施网络安全检查工作不予配合的，由有关主管部门责令改正；拒不改正的，处5万元以上50万元以下罚款，对直接负责的主管人员和其他直接责任人员处1万元以上10万元以下罚款；情节严重的，依法追究相应法律责任。"},{"t":"a","x":"第四十三条 实施非法侵入、干扰、破坏关键信息基础设施，危害其安全的活动尚不构成犯罪的，依照《中华人民共和国网络安全法》有关规定，由公安机关没收违法所得，处5日以下拘留，可以并处5万元以上50万元以下罚款；情节较重的，处5日以上15日以下拘留，可以并处10万元以上100万元以下罚款。\n单位有前款行为的，由公安机关没收违法所得，处10万元以上100万元以下罚款，并对直接负责的主管人员和其他直接责任人员依照前款规定处罚。\n违反本条例第五条第二款和第三十一条规定，受到治安管理处罚的人员，5年内不得从事网络安全管理和网络运营关键岗位的工作；受到刑事处罚的人员，终身不得从事网络安全管理和网络运营关键岗位的工作。"},{"t":"a","x":"第四十四条 网信部门、公安机关、保护工作部门和其他有关部门及其工作人员未履行关键信息基础设施安全保护和监督管理职责或者玩忽职守、滥用职权、徇私舞弊的，依法对直接负责的主管人员和其他直接责任人员给予处分。"},{"t":"a","x":"第四十五条 公安机关、保护工作部门和其他有关部门在开展关键信息基础设施网络安全检查工作中收取费用，或者要求被检查单位购买指定品牌或者指定生产、销售单位的产品和服务的，由其上级机关责令改正，退还收取的费用；情节严重的，依法对直接负责的主管人员和其他直接责任人员给予处分。"},{"t":"a","x":"第四十六条 网信部门、公安机关、保护工作部门等有关部门、网络安全服务机构及其工作人员将在关键信息基础设施安全保护工作中获取的信息用于其他用途，或者泄露、出售、非法向他人提供的，依法对直接负责的主管人员和其他直接责任人员给予处分。"},{"t":"a","x":"第四十七条 关键信息基础设施发生重大和特别重大网络安全事件，经调查确定为责任事故的，除应当查明运营者责任并依法予以追究外，还应查明相关网络安全服务机构及有关部门的责任，对有失职、渎职及其他违法行为的，依法追究责任。"},{"t":"a","x":"第四十八条 电子政务关键信息基础设施的运营者不履行本条例规定的网络安全保护义务的，依照《中华人民共和国网络安全法》有关规定予以处理。"},{"t":"a","x":"第四十九条 违反本条例规定，给他人造成损害的，依法承担民事责任。\n违反本条例规定，构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。"},{"t":"h","x":"第六章 附 则"},{"t":"a","x":"第五十条 存储、处理涉及国家秘密信息的关键信息基础设施的安全保护，还应当遵守保密法律、行政法规的规定。\n关键信息基础设施中的密码使用和管理，还应当遵守相关法律、行政法规的规定。"},{"t":"a","x":"第五十一条 本条例自2021年9月1日起施行。"}]},{"title":"江苏省公共数据管理办法","source":"江苏省人民政府网","date":"江苏省政府令第148号，2022年3月1日起施行","url":"https://www.jiangsu.gov.cn/art/2022/1/9/art_64797_10311448.html","arts":[{"t":"a","x":"第一条 为了规范公共数据管理，保障公共数据安全，推进数字化发展，加快建设数字政府，提升政府治理能力和公共服务水平，根据《中华人民共和国数据安全法》等法律、法规，结合本省实际，制定本办法。"},{"t":"a","x":"第二条 本省行政区域内公共数据处理活动及其监督管理，适用本办法。法律、法规另有规定的，从其规定。\n本办法所称公共数据，是指本省各级行政机关、法律法规授权的具有管理公共事务职能的组织、公共企事业单位（以下统称公共管理和服务机构）为履行法定职责、提供公共服务收集、产生的，以电子或者其他方式对具有公共使用价值的信息的记录。\n开展公共数据处理活动涉及保密、个人信息等情形，以及涉及公共数据的政府信息公开，依照《中华人民共和国保守国家秘密法》《中华人民共和国个人信息保护法》《中华人民共和国政府信息公开条例》等法律、法规的规定执行。"},{"t":"a","x":"第三条 公共数据管理应当遵循政府统筹、应用牵引、便利服务、保障安全的原则。"},{"t":"a","x":"第四条 县级以上地方人民政府统一领导本行政区域公共数据管理工作，将公共数据管理工作纳入本行政区域国民经济和社会发展规划，建立健全工作协调机制，统筹解决公共数据管理重大问题，落实数据安全责任，组织开展监督考核。公共数据管理工作所需经费纳入本级财政预算。县级以上地方人民政府的主要负责人是本行政区域公共数据管理工作的第一责任人。"},{"t":"a","x":"第五条 省政务服务管理办公室是省公共数据主管部门，负责组织、指导、协调、监督公共数据管理工作。省大数据管理中心是省公共数据运行管理机构，具体负责公共数据归口管理工作，建设和管理省公共数据平台。设区的市、县（市、区）人民政府应当确定本级公共数据主管部门和公共数据运行管理机构，并明确其职责。\n网信部门依法负责统筹协调网络数据安全和相关监管工作。发展改革、教育、科技、工业和信息化、自然资源、交通运输、卫生健康、地方金融、通信等有关主管部门根据实际情况，制定本行业、本部门公共数据的建设和管理规范，负责公共数据相关管理工作，并承担监管职责。\n公共管理和服务机构应当确定本机构公共数据管理具体责任单位及其负责人并明确其职责，做好本机构公共数据的收集获取、目录编制、共享开放、更新维护和安全保障等工作，依法提供、使用公共数据；根据公共数据管理需要，探索建立本机构首席数据（数字）官制度。"},{"t":"a","x":"第六条 本省统筹数字化发展和安全，建立健全数据安全治理体系，强化公共数据安全全流程保护，提高数据安全保障能力。"},{"t":"a","x":"第七条 公共数据主管部门建立由有关主管部门、教育和科研机构、社会组织、企业等方面专家组成的公共数据专家委员会，负责研究论证公共数据管理中的重大、疑难问题，评估公共数据风险，提出专业建议。"},{"t":"a","x":"第八条 本省按照长江三角洲区域一体化、长江经济带发展等国家战略开展区域合作交流，推动建立公共数据区域一体化标准体系，推进公共数据资源供需对接和共享应用，促进数据要素市场一体化发展，提升区域治理现代化水平。"},{"t":"a","x":"第九条 鼓励和支持各地区、各部门结合实际情况，在法治框架内积极探索有利于公共数据共享开放和开发利用的创新举措；对探索中出现失误或者偏差，符合规定条件的，按照国家和省有关规定可以予以免责或者减轻责任。"},{"t":"h","x":"第二章 公共数据供给"},{"t":"a","x":"第十条 公共数据主管部门应当会同有关主管部门编制公共数据专项发展规划，报本级人民政府批准后公布实施。\n公共数据专项发展规划与数字经济、数字政府等专项发展规划应当相衔接。下级公共数据专项发展规划应当服从上级公共数据专项发展规划。"},{"t":"a","x":"第十一条 公共数据是重要生产要素，具有公共属性，由公共数据主管部门代表本级人民政府统一行使公共数据管理职责。公共管理和服务机构负责提供符合质量标准的公共数据，有权申请使用公共数据。"},{"t":"a","x":"第十二条 公共数据实行统一目录管理。公共管理和服务机构应当按照国家和省统一标准编制本机构公共数据资源目录并明确分类，定期发布并动态调整。公共数据主管部门负责会同有关主管部门确定并公布公共管理和服务机构名单，汇总、审核、上报本级公共数据资源目录；发现目录中存在重复收集内容的，应当协调明确收集机构。\n公共数据资源目录应当明确公共数据内容、形式、类型、条件、更新频率和公共数据的收集、审核、提供机构等基本信息。"},{"t":"a","x":"第十三条 公共数据通过公共数据平台实施统一管理。\n省公共数据运行管理机构负责统筹建设和管理省公共数据平台并按照规定与国家平台对接，设区的市按照全省统一标准建设和管理本行政区域公共数据平台并与省公共数据平台对接，形成全省唯一的公共数据共享交换通道。\n公共管理和服务机构应当通过公共数据平台进行数据共享开放，不得在公共数据平台之外新建共享开放通道；已经建成的，应当逐步归并至公共数据平台。"},{"t":"a","x":"第十四条 公共管理和服务机构应当依照法律、法规和公共数据资源目录以及相关标准规范收集公共数据，收集涉及个人信息的公共数据应当限于实现处理目的的最小范围，不得过度收集；能够通过公共数据平台收集公共数据的，不得重复收集、多头收集。\n鼓励公共管理和服务机构适应公共数据服务需求，采用现代信息技术优化公共数据收集方式。"},{"t":"a","x":"第十五条 公共管理和服务机构应当以数字化方式将收集、记录和存储的公共数据向省或者设区的市公共数据平台汇聚，非数字化数据在汇聚前应当进行数字化加工。本行业、本领域公共数据可以由省级公共管理和服务机构统一向省公共数据平台汇聚。设区的市公共数据运行管理机构应当将本行政区域公共数据平台汇聚的公共数据向省公共数据平台汇聚。\n本行业、本领域上级公共管理和服务机构收集、记录和存储下级公共管理和服务机构公共数据的，应当通过公共数据平台或者现有渠道满足下级公共管理和服务机构的数据需求。\n公共管理和服务机构应当对接公共数据平台，实现公共数据实时连通、同步更新或者按照共享需求明确更新频率，保证公共数据的一致性和时效性。"},{"t":"a","x":"第十六条 公共数据应当在政务云统一存储、备份保护。\n省、设区的市公共数据主管部门负责统筹建设和管理本级政务云。县（市、区）原则上不得新建政务云，县（市、区）公共数据主管部门可以依托设区的市政务云开展公共数据管理。\n公共管理和服务机构应当将本机构涉及公共数据的非涉密信息系统向政务云部署。"},{"t":"a","x":"第十七条 公共管理和服务机构应当运用多源比对、关联分析、快速校核等数字技术，建立健全公共数据处理全流程质量管理体系，提升公共数据可信溯源和校核纠错能力，保证公共数据真实、准确、完整。\n公共数据主管部门应当会同标准化主管部门等有关主管部门建立公共数据质量等标准体系。公共数据运行管理机构应当按照质量标准检查公共管理和服务机构提供的公共数据，对不符合质量标准的，应当在公共数据平台发起整改任务，有关公共管理和服务机构应当自收到整改任务之日起10个工作日内核实、更正。"},{"t":"a","x":"第十八条 公共数据运行管理机构应当会同有关主管部门建设和管理本级自然人、法人、电子证照、社会信用、自然资源和空间地理等基础数据库，根据实际需要推进各领域主题数据库、专题数据库建设。自然人数据应当以身份证件号码作为标识，法人和其他组织数据应当以统一社会信用代码作为标识。\n除法律、法规另有规定的外，基础数据库数据应当在省公共数据平台集中建设或者通过与省公共数据平台对接，实现无条件汇聚。公共管理和服务机构签发的电子证照应当实时向电子证照库归集。"},{"t":"h","x":"第三章 公共数据共享"},{"t":"a","x":"第十九条 公共管理和服务机构之间共享公共数据应当以共享为原则、不共享为例外，无偿共享公共数据。\n公共管理和服务机构提出共享需求应当明确应用场景，并承诺其真实性、合规性、安全性；通过共享获得的公共数据，应当用于本机构履行法定职责、提供公共服务需要，除法律、法规另有规定的外，不得以任何形式提供给第三方，不得用于其他任何目的。"},{"t":"a","x":"第二十条 公共数据主管部门应当健全公共数据共享供需对接机制，根据公共数据资源目录和共享需求形成供需目录清单。"},{"t":"a","x":"第二十一条 公共数据按照共享属性分为无条件共享、有条件共享和不予共享三种类型，在编制公共数据资源目录时确定其共享类型。\n（一）可以提供给所有公共管理和服务机构共享使用的公共数据属于无条件共享类。基础数据库数据应当无条件共享。\n（二）可以按照一定条件提供给有关公共管理和服务机构共享使用的公共数据属于有条件共享类。\n（三）不宜提供给其他公共管理和服务机构共享使用的公共数据属于不予共享类。\n列入有条件共享类和不予共享类的，应当说明理由，并提供相应的法律、法规依据；无法律、法规依据的，应当无条件共享。公共管理和服务机构应当列明有条件共享类公共数据的共享条件。"},{"t":"a","x":"第二十二条 公共管理和服务机构应当对有条件共享类公共数据定期进行评估，具备无条件共享条件的，应当及时转为无条件共享类数据。\n除法律、法规另有规定的外，不予共享类公共数据可以依法经脱敏等处理后转为有条件共享类或者无条件共享类公共数据。本省公共数据脱敏等处理规则，由省公共数据主管部门会同公共管理和服务机构制定。"},{"t":"a","x":"第二十三条 公共管理和服务机构应当采用请求响应的调用服务方式使用共享的公共数据；需要拷贝公共数据的，应当征得公共数据主管部门和提供公共数据的公共管理和服务机构同意。"},{"t":"a","x":"第二十四条 公共管理和服务机构为履行法定职责、提供公共服务申请共享无条件共享类公共数据的，公共数据运行管理机构应当无条件开通其访问权限。"},{"t":"a","x":"第二十五条 公共管理和服务机构为履行法定职责、提供公共服务申请共享有条件共享类公共数据的，可以通过公共数据平台向提供公共数据的公共管理和服务机构提交需求申请；提供公共数据的公共管理和服务机构应当自收到需求申请之日起5个工作日内完成审核。公共数据主管部门应当提供审核进度查询，并可以在期限届满前提醒督办。\n经审核同意共享的，应当相应开通访问权限；经审核不同意共享的，应当说明理由。无法律、法规依据，不得拒绝共享要求。\n省公共数据主管部门应当加强公共数据的共享审核督办制度建设，优化审核流程，改进审核环节，提升审核效能。"},{"t":"a","x":"第二十六条 公共管理和服务机构为履行法定职责、提供公共服务申请共享尚未列入共享目录的公共数据的，可以通过公共数据平台向有关公共管理和服务机构提交需求申请。有关公共管理和服务机构应当自收到需求申请之日起7个工作日内答复。其中，对同意并且能够直接共享的，有关公共管理和服务机构应当自答复之日起7个工作日内完成数据汇聚、共享，需要对相关公共数据进行加工等处理的，应当告知能够共享的具体时间；对不同意共享的，应当说明理由并提供相应的法律、法规依据。"},{"t":"a","x":"第二十七条 公共管理和服务机构为履行法定职责、提供公共服务需要共享本省行政区域内跨层级、跨地区等本级公共数据平台不能直接获取的公共数据的，应当通过本级公共数据主管部门或者由其向上级公共数据主管部门申请获取。\n公共管理和服务机构为履行法定职责、提供公共服务需要共享国家平台相关公共数据的，由省公共数据主管部门协调获取。"},{"t":"h","x":"第四章 公共数据开放"},{"t":"a","x":"第二十八条 公共数据开放应当以企业、群众需求为导向，依法、安全、有序向公民、法人和其他组织开放。"},{"t":"a","x":"第二十九条 公共数据按照开放属性分为不予开放、有条件开放和无条件开放三种类型，在编制公共数据资源目录时确定其开放类型。\n（一）应当依法予以保密的公共数据以及法律、法规、规章规定不得开放的其他公共数据属于不予开放类。\n（二）在限定对象、用途、使用范围等特定条件下可以提供给公民、法人和其他组织使用的公共数据属于有条件开放类。公共管理和服务机构应当明确有条件开放类公共数据的开放要求，向符合条件的公民、法人和其他组织开放。\n（三）不予开放类和有条件开放类以外的其他公共数据属于无条件开放类。公共管理和服务机构应当通过公共数据平台主动向社会开放无条件开放类公共数据，公民、法人和其他组织登录即可获取、使用。\n公共管理和服务机构应当通过门户网站、新闻媒体等途径向社会宣传推广公共数据开放相关信息，便于公民、法人和其他组织知晓。"},{"t":"a","x":"第三十条 公共管理和服务机构应当对有条件开放类公共数据定期进行评估，具备无条件开放条件的，应当及时转为无条件开放类公共数据，并相应调整公共数据资源目录中的开放类型。\n不予开放类公共数据经依法处理后，或者相关权利人同意开放的，可以根据情况转为无条件开放类或者有条件开放类公共数据。公共管理和服务机构应当相应调整公共数据资源目录中的开放类型。\n公共数据主管部门应当向社会公布本级无条件开放类公共数据资源目录。"},{"t":"a","x":"第三十一条 公民、法人和其他组织可以通过公共数据平台提出有条件开放类公共数据开放申请。提供公共数据的公共管理和服务机构收到申请后，能够立即答复的，应当立即答复；不能立即答复的，应当自收到申请之日起10个工作日内答复。\n公共数据开放申请应当包括申请标题、事由、申请类型（数据集或者接口）、使用期限、成果形式等内容。具体表单由公共数据主管部门制定。\n提供公共数据的公共管理和服务机构同意开放的，应当明确公共数据的用途和使用范围，并及时向申请人开放；不同意开放的，应当说明理由，并提供相应的法律、法规、规章依据。"},{"t":"a","x":"第三十二条 公民、法人和其他组织可以通过公共数据平台查阅开放的公共数据、提出异议申请，认为开放的公共数据侵害其隐私、个人信息、商业秘密或者其他应当保密的信息等合法权益的，有权要求提供公共数据的公共管理和服务机构撤回数据、中止开放。提供公共数据的公共管理和服务机构收到相关事实材料后，应当立即核实，根据核实的不同情况分别采取撤回数据、依法处理后开放数据、继续开放数据等措施；发现数据泄露的，应当立即采取补救措施。\n提供公共数据的公共管理和服务机构在日常监管中发现开放的公共数据可能侵害公民、法人和其他组织合法权益的，应当立即采取中止开放、撤回数据等措施，并及时核查处置。"},{"t":"a","x":"第三十三条 公共数据主管部门应当根据本地区经济社会发展情况和企业、群众需求，推动教育、科技、就业、社会保障、自然资源、生态环境、交通运输、农业农村、文化旅游、卫生健康、应急管理、市场监管、统计、医疗保障、金融、气象、信用等领域与民生保障、数字化发展密切相关的公共数据优先向社会开放。"},{"t":"h","x":"第五章 公共数据利用"},{"t":"a","x":"第三十四条 县级以上地方人民政府应当运用公共数据发展和完善数据要素市场，支持和推动公共数据资源在农业、工业、教育、安防、城市管理、交通运输、公共资源交易、市场监管、金融、体育等领域开发利用，提升公共数据资源价值。"},{"t":"a","x":"第三十五条 县级以上地方人民政府应当培育规范的公共数据资源交易平台和市场主体，推动构建公共数据市场运营体系。\n公共数据主管部门应当按照国家和省有关规定探索建立公共数据资源流通、交易、应用开发规则和机制化运营流程。"},{"t":"a","x":"第三十六条 县级以上地方人民政府可以通过政府资金扶持、企业高校智库共建等产学研用合作以及其他方式，支持和鼓励公民、法人和其他组织依法开发利用公共数据资源，提供数据产品和数据服务。"},{"t":"a","x":"第三十七条 公共数据主管部门应当利用大数据、人工智能、区块链、物联网、云计算等现代信息技术，实现公共数据在各类服务场景中的智能化应用。\n公共管理和服务机构应当拓展公共数据应用服务场景，推进一网通办、跨省通办，推动建立跨部门、跨层级、跨地区的公共数据应用服务机制。"},{"t":"a","x":"第三十八条 公共数据运行管理机构、提供公共数据的公共管理和服务机构应当对公共数据共享开放等处理活动进行全程记录。\n访问、调用和利用公共数据的公民、法人和其他组织（以下统称公共数据利用主体）利用公共数据形成数据产品、研究报告、学术论文等成果的，应当在成果中注明数据来源以及提供公共数据的公共管理和服务机构；公共数据运行管理机构有权获取公共数据利用主体数据应用成果相关资料。法律、法规另有规定的除外。"},{"t":"a","x":"第三十九条 公共管理和服务机构向符合条件的公共数据利用主体开放有条件开放类公共数据，应当签订公共数据利用协议。\n公共数据平台应当提供公共数据利用协议示范文本，供公共管理和服务机构、公共数据利用主体等下载使用。示范文本应当载明公共数据的用途、使用范围、使用方式，以及后续服务和反馈要求、禁止条款、信用承诺、违约责任、争议解决方式等内容。公共数据利用协议示范文本，由省公共数据主管部门会同省市场监管部门依法制定。"},{"t":"a","x":"第四十条 公共数据利用主体利用依法获取的公共数据形成数据产品和数据服务等权益受法律保护，但是，不得滥用相关权益，不得损害国家利益、社会公共利益或者他人合法权益。\n公共数据利用主体在利用公共数据过程中违反公共数据管理相关法律、法规、规章规定或者公共数据利用协议约
