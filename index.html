<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 江苏省密码行业职业技能竞赛 · 题库练习</title>
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1b2431; --ink-2:#3a4657; --muted:#6d788a;
  --line:#e5e9f0; --line-2:#eef1f6;
  --brand:#2b5ce0; --brand-soft:#eaf0fe; --brand-ink:#1f47b5;
  --ok:#0f9d58; --ok-soft:#e9f8f0; --ok-line:#b6e3c9;
  --bad:#dc3545; --bad-soft:#fdecec; --bad-line:#f3c3c7;
  --warn:#b06a00; --warn-soft:#fff6e6;
  --shadow:0 1px 2px rgba(20,30,50,.04), 0 8px 24px -16px rgba(20,30,50,.18);
  --sidebar:300px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
a{color:var(--brand);text-decoration:none}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);height:100vh;position:sticky;top:0;
  background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;
}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--line-2)}
.brand .eyebrow{font-size:11px;letter-spacing:.12em;color:var(--brand);font-weight:700;margin-bottom:6px}
.brand h1{font-size:17px;margin:0;letter-spacing:.01em;line-height:1.35}
.brand p{margin:6px 0 0;font-size:12px;color:var(--muted)}
.side-search{padding:12px 14px 8px}
.side-search .box{position:relative}
.side-search input{
  width:100%;padding:9px 30px 9px 32px;border:1px solid var(--line);border-radius:9px;
  background:#f7f8fb;font-size:13px;outline:none;transition:.15s;
}
.side-search input:focus{background:#fff;border-color:#c3d1f7;box-shadow:0 0 0 3px rgba(43,92,224,.1)}
.side-search .ico{position:absolute;left:10px;top:9px;opacity:.45;font-size:13px}
.side-search .clr{position:absolute;right:6px;top:5px;font-size:15px;color:var(--muted);padding:2px 6px;border-radius:6px;display:none}
.side-search .clr:hover{background:#eef1f6}
.side-search input:not(:placeholder-shown)+.clr{display:block}

.toc{flex:1;overflow-y:auto;padding:2px 10px 16px}
.toc::-webkit-scrollbar{width:8px}
.toc::-webkit-scrollbar-thumb{background:#dde3ec;border-radius:8px;border:2px solid #fff}
.part{margin-top:10px}
.part-hd{
  display:flex;align-items:center;gap:8px;width:100%;padding:8px 8px;border-radius:8px;
  font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;
}
.part-hd:hover{background:#f6f8fc}
.part-hd .cnt{margin-left:auto;font-weight:600;letter-spacing:0;color:#9aa4b4;font-size:11px}
.ch{margin:1px 0}
.ch-hd{
  display:flex;align-items:center;gap:6px;width:100%;padding:7px 8px 7px 6px;border-radius:8px;
  font-size:13.5px;text-align:left;color:var(--ink-2);transition:.12s;
}
.ch-hd:hover{background:#f5f7fb;color:var(--ink)}
.ch-hd .chev{width:14px;flex:0 0 14px;font-size:9px;color:#9aa4b4;transition:transform .18s;display:inline-block}
.ch.open .ch-hd .chev{transform:rotate(90deg)}
.ch-hd .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-hd .pg{font-size:11px;color:#9aa4b4;font-variant-numeric:tabular-nums}
.ch.active>.ch-hd{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.ch-body{display:none;padding:2px 0 6px 20px}
.ch.open>.ch-body{display:block}
.types{display:flex;flex-wrap:wrap;gap:6px;padding:2px 2px 2px 0}
.tp{
  font-size:12px;padding:4px 9px;border-radius:7px;background:#f2f5fa;color:#4a5668;
  border:1px solid transparent;transition:.12s;white-space:nowrap;
}
.tp:hover{background:#e9eefb;color:var(--brand-ink)}
.tp.on{background:var(--brand);color:#fff}
.tp .n{opacity:.6;margin-left:3px;font-size:11px}
.ch-bar{height:3px;border-radius:3px;background:#eef1f6;margin:6px 10px 2px 6px;overflow:hidden}
.ch-bar i{display:block;height:100%;background:linear-gradient(90deg,#7ba0f5,#2b5ce0);border-radius:3px}
.side-foot{border-top:1px solid var(--line-2);padding:12px 16px 14px;background:#fcfdff}
.side-foot .row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.side-foot b{color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.side-foot .bar{height:5px;background:#e9edf4;border-radius:4px;margin:8px 0 10px;overflow:hidden}
.side-foot .bar i{display:block;height:100%;background:linear-gradient(90deg,#8fb0f8,#2b5ce0);border-radius:4px;transition:width .3s}
.side-foot .acts{display:flex;gap:8px}
.side-foot .acts button{font-size:12px;color:var(--muted);padding:4px 8px;border-radius:6px}
.side-foot .acts button:hover{background:#eef1f6;color:var(--ink)}
.side-foot .acts + .acts{margin-top:2px}
.part-hd{margin-top:0}
.side-foot .tip{margin-top:9px;font-size:11px;line-height:1.65;color:#9aa4b4}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:0 28px;height:56px;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar .menu{display:none;font-size:18px;padding:6px 8px;border-radius:8px}
.topbar .menu:hover{background:#f1f4f9}
.crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;min-width:0}
.crumb .cur{color:var(--ink);font-weight:600}
.crumb .sep{opacity:.4}
.topbar .spacer{flex:1}
.topbar .stat{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.topbar .stat b{color:var(--ink);font-size:14px}
.content{flex:1;padding:26px 28px 90px;max-width:940px;width:100%;margin:0 auto}

/* ---------- set header ---------- */
.sethead{margin-bottom:22px}
.sethead .eyebrow{font-size:12px;color:var(--brand);font-weight:600;letter-spacing:.04em;margin-bottom:8px}
.sethead h2{margin:0;font-size:24px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sethead h2 .cnt{font-size:13px;color:var(--muted);font-weight:500}
.sethead .desc{color:var(--muted);font-size:13px;margin:8px 0 0}
.metrics{display:flex;gap:10px;margin:16px 0 0;flex-wrap:wrap}
.metric{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-width:92px}
.metric .l{font-size:11px;color:var(--muted);letter-spacing:.03em}
.metric .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.metric .v small{font-size:11px;font-weight:500;color:var(--muted);margin-left:2px}

.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0 4px}
.btn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
  padding:7px 12px;border-radius:8px;font-size:13px;color:var(--ink-2);transition:.12s;
}
.btn:hover{border-color:#c9d4ea;background:#fbfcff;color:var(--brand-ink)}
.btn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#244fca;color:#fff}
.btn.ghost{border-color:transparent;color:var(--muted);padding:7px 8px}
.btn.ghost:hover{background:#eef1f6;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:#eef1f6;border-radius:9px;padding:3px;gap:2px}
.seg button{font-size:12.5px;padding:5px 11px;border-radius:7px;color:#5b6577}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,30,50,.12);font-weight:600}

/* answer card grid */
.cardgrid{display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;margin:14px 0 6px}
.cardgrid.show{display:block}
.cardgrid .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px;color:var(--muted)}
.cardgrid .cells{display:flex;flex-wrap:wrap;gap:6px}
.cardgrid .cells button{
  width:32px;height:30px;border-radius:7px;border:1px solid var(--line);font-size:12px;
  color:#5b6577;background:#fff;font-variant-numeric:tabular-nums;transition:.1s;
}
.cardgrid .cells button:hover{border-color:#b9c9ee}
.cardgrid .cells button.ok{background:var(--ok-soft);border-color:var(--ok-line);color:#0a7c45;font-weight:600}
.cardgrid .cells button.bad{background:var(--bad-soft);border-color:var(--bad-line);color:#b02a37;font-weight:600}
.cardgrid .cells button.seen{background:#f2f4f8;border-color:#dde3ec;color:#7b8496}

/* ---------- question card ---------- */
.q{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px 16px;
  margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:74px;position:relative;
}
.q.flash{animation:flash 1.1s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px rgba(43,92,224,.28)}100%{box-shadow:0 0 0 3px rgba(43,92,224,0)}}
.q-hd{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.q-no{
  display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 7px;
  background:#f2f5fa;color:#5a657a;border-radius:7px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;
}
.tag{font-size:11px;padding:2.5px 7px;border-radius:5px;font-weight:600;letter-spacing:.02em}
.tag.t0{background:#eaf0fe;color:#2b5ce0}
.tag.t1{background:#f3ecfe;color:#7b3fe4}
.tag.t2{background:#e6f7f4;color:#0d8a76}
.tag.t3{background:#fff3e0;color:#a45c00}
.q-meta{margin-left:auto;font-size:11.5px;color:#9aa4b4}
.qhex{font-size:11px;color:#b7c0cd;font-family:ui-monospace,Menlo,monospace;letter-spacing:.03em}
.q-stem{font-size:15.5px;line-height:1.78;color:var(--ink);letter-spacing:.005em;word-break:break-word}
.q-stem .hl{background:#fff2ac;border-radius:3px;padding:0 1px}
.opts{margin:14px 0 2px;display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  border:1px solid #e3e8f0;background:#fff;border-radius:10px;padding:11px 13px;
  font-size:14.5px;line-height:1.65;color:var(--ink-2);transition:.13s;
}
.opt:hover{border-color:#bfd0f2;background:#fafbff}
.opt .k{
  flex:0 0 22px;height:22px;border-radius:6px;background:#f2f5fa;color:#5a657a;
  font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:1px;
}
.opt .t{flex:1;word-break:break-word}
.opt.sel{border-color:#9db6ef;background:#f5f8ff}
.opt.sel .k{background:var(--brand);color:#fff}
.opt.ok{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.62}
.opt.wsel{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wsel .k{background:var(--bad);color:#fff}
.opt.wsel .mk{color:#b02a37;font-weight:600}
.opt .mk{margin-left:auto;font-size:12px;color:var(--muted);padding-left:8px;white-space:nowrap}
.opt.ok .mk{color:#0a7c45;font-weight:600}
.opt.bad .mk{color:#b02a37;font-weight:600}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:#e3e8f0;background:#fff}
.locked .opt.ok:hover{border-color:var(--ok-line);background:var(--ok-soft)}
.locked .opt.bad:hover{border-color:var(--bad-line);background:var(--bad-soft)}

.res{display:none;margin-top:12px;border-radius:9px;padding:10px 13px;font-size:13.5px;line-height:1.6}
.res.show{display:block}
.res.good{background:var(--ok-soft);border:1px solid var(--ok-line);color:#0a6b3d}
.res.bad{background:var(--bad-soft);border:1px solid var(--bad-line);color:#a02531}
.res.info{background:#f3f6fc;border:1px solid #dbe4f7;color:#3b4a67}
.res b{font-weight:700}
.res .ans-key{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.06em}
.q-foot{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.q-foot .hint{font-size:12px;color:#9aa4b4}
.q-foot .right{margin-left:auto;display:flex;gap:6px}
.fill{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.fill input{
  flex:1;min-width:180px;padding:10px 13px;border:1px solid #e3e8f0;border-radius:9px;font-size:14.5px;
  outline:none;background:#fbfcfe;transition:.15s;
}
.fill input:focus{background:#fff;border-color:#b8c9f1;box-shadow:0 0 0 3px rgba(43,92,224,.09)}
.fill input:disabled{background:#f6f7fa;color:#5a657a}
.judge{display:flex;gap:10px;margin-top:14px}
.judge .opt{width:auto;min-width:108px;justify-content:center;padding:11px 20px}
.judge .opt .k{display:none}

/* 关联法规 chips */
.qlaws{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.qlaws .lbl{font-size:12px;color:#9aa4b4;flex:0 0 auto}
.qexp{display:flex;gap:10px;margin-top:12px;background:#f6f8fb;border:1px solid #e3e9f2;border-left:3px solid var(--brand);border-radius:8px;padding:10px 14px}
.qexp .lbl{font-size:12px;color:var(--brand);font-weight:700;flex:0 0 auto;padding-top:2px}
.qexp .expbody{font-size:13.5px;line-height:1.75;color:#2b3442;white-space:pre-wrap;word-break:break-word;min-width:0}
.qexp .expbody code{background:#eef1f6;border:1px solid #dde3ec;border-radius:4px;padding:1px 5px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3.5px 10px;border-radius:7px;background:#f2f5fa;border:1px solid #e3e8f0;color:#4a5668;transition:.12s;max-width:100%}
.chip:hover{background:var(--brand-soft);border-color:#c3d1f7;color:var(--brand-ink)}
.chip .cn{font-size:11px;opacity:.55}
.badge{flex:0 0 auto;font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.lawgrp{margin-bottom:18px}
.lawgrp-hd{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.lawgrp-hd span{font-weight:600;color:#9aa4b4;letter-spacing:0}
.lawlist{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.lawrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 16px;border-bottom:1px solid var(--line-2);transition:.12s}
.lawrow:last-child{border-bottom:none}
.lawrow:hover{background:#f7f9ff}
.lawrow .lnm{flex:1;font-size:14px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lawrow:hover .lnm{color:var(--brand-ink)}
.badge.b2{background:#e8f6ee;color:#0a7c45}
.tabs{display:flex;gap:8px;margin:2px 0 16px;border-bottom:1px solid var(--line)}
.tabs button{padding:9px 16px;font-size:14px;color:#6d788a;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button span{font-size:12px;color:#9aa4b4;margin-left:3px}
.tabs button.on{color:var(--brand-ink);font-weight:600;border-bottom-color:var(--brand)}
.lawtext{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:22px 24px}
.lawtext{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:22px 24px}
.lawq-left{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow-y:auto;border-radius:12px}
.lawq-right{min-width:0}
.abadge{display:inline-block;font-size:11px;padding:1.5px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand-ink);font-weight:600;margin-left:8px;cursor:pointer;vertical-align:1px}
.abadge:hover{background:var(--brand);color:#fff}
.chip.basis{border-color:#d8e4fb;background:#eef3fd}
.chip.basis .cn{font-size:10px;color:var(--brand)}
.flash{animation:lawflash 2.4s ease}
.backfab{position:fixed;right:26px;bottom:26px;z-index:70;display:inline-flex;align-items:center;gap:6px;
  background:var(--brand);color:#fff;border-radius:999px;padding:11px 18px;font-size:14px;font-weight:600;
  box-shadow:0 10px 26px -8px rgba(43,92,224,.55);transition:transform .15s,background .15s}
.backfab b{font-weight:700;background:rgba(255,255,255,.18);padding:1px 7px;border-radius:999px;font-size:12.5px}
.backfab:hover{transform:translateY(-1px);background:var(--brand-ink)}
.backfab:active{transform:none}
@media (max-width:760px){ .backfab{right:14px;bottom:14px;padding:10px 14px;font-size:13px} }
@keyframes lawflash{0%,55%{background:#fff3c2}100%{background:transparent}}
@media (max-width: 1020px){
  .lawq-left{position:static;max-height:none;overflow:visible}
}
.lawmeta{font-size:12.5px;color:#9aa4b4;margin-bottom:18px;padding-bottom:12px;border-bottom:1px dashed var(--line-2)}
.lawmeta a{color:var(--brand)}
.lh{font-weight:700;font-size:16px;color:var(--ink);margin:22px 0 10px;text-align:center}
.la{font-size:14.5px;line-height:1.95;color:var(--ink-2);margin:10px 0;text-align:justify}
.la b{color:var(--brand-ink);margin-right:4px}
.lp{font-size:14px;line-height:1.9;color:var(--ink-2);margin:8px 0}
.lh2{font-weight:600;font-size:14.5px;color:var(--ink);margin:14px 0 6px}
.la,.lp{white-space:pre-line}
.lawrow .lcode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--brand);margin-right:8px;font-weight:600}
.lawrow .lcnt{flex:0 0 auto;font-size:12px;color:#9aa4b4;font-variant-numeric:tabular-nums}
.lawrow .lcnt.zero{opacity:.45}

/* empty */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty .big{font-size:34px;opacity:.25;margin-bottom:10px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:#1b2431;color:#fff;
  padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 实操 */
.sx-chap{margin:26px 0 12px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.sx{border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow)}
.sx-hd{display:flex;align-items:center;gap:10px;cursor:pointer}
.sx-hd .no{font-size:12px;color:var(--brand);font-weight:700;background:var(--brand-soft);padding:3px 8px;border-radius:6px}
.sx-hd .tt{font-size:16px;font-weight:600;flex:1}
.sx-hd .pg{font-size:11.5px;color:#9aa4b4}
.sx-body{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.sx.open .sx-body{display:block}
.sx-body img{width:100%;border:1px solid var(--line);border-radius:8px;margin:8px 0;display:block;background:#fff}
.sx-note{font-size:12.5px;color:var(--muted);line-height:1.7}

@media (max-width:900px){
  :root{--sidebar:280px}
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .24s;box-shadow:0 0 40px rgba(10,20,40,.2)}
  body.nav-open .sidebar{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(18,26,40,.34);z-index:35}
  .topbar{padding:0 14px}
  .topbar .menu{display:block}
  .content{padding:18px 14px 80px}
  .q{padding:16px 15px 14px}

const LAWTEXTS = [{"title":"中华人民共和国密码法","source":"全国人大网","date":"2019年10月26日通过，2020年1月1日起施行","url":"http://www.npc.gov.cn/npc/c1773/c1848/c21114/c36794/c36798/201910/t20191028_301735.html","arts":[{"t":"a","x":"第一条 为了规范密码应用和管理，促进密码事业发展，保障网络与信息安全，维护国家安全和社会公共利益，保护公民、法人和其他组织的合法权益，制定本法。"},{"t":"a","x":"第二条 本法所称密码，是指采用特定变换的方法对信息等进行加密保护、安全认证的技术、产品和服务。"},{"t":"a","x":"第三条 密码工作坚持总体国家安全观，遵循统一领导、分级负责，创新发展、服务大局，依法管理、保障安全的原则。"},{"t":"a","x":"第四条 坚持中国共产党对密码工作的领导。中央密码工作领导机构对全国密码工作实行统一领导，制定国家密码工作重大方针政策，统筹协调国家密码重大事项和重要工作，推进国家密码法治建设。"},{"t":"a","x":"第五条 国家密码管理部门负责管理全国的密码工作。县级以上地方各级密码管理部门负责管理本行政区域的密码工作。\n国家机关和涉及密码工作的单位在其职责范围内负责本机关、本单位或者本系统的密码工作。"},{"t":"a","x":"第六条 国家对密码实行分类管理。\n密码分为核心密码、普通密码和商用密码。"},{"t":"a","x":"第七条 核心密码、普通密码用于保护国家秘密信息，核心密码保护信息的最高密级为绝密级，普通密码保护信息的最高密级为机密级。\n核心密码、普通密码属于国家秘密。密码管理部门依照本法和有关法律、行政法规、国家有关规定对核心密码、普通密码实行严格统一管理。"},{"t":"a","x":"第八条 商用密码用于保护不属于国家秘密的信息。\n公民、法人和其他组织可以依法使用商用密码保护网络与信息安全。"},{"t":"a","x":"第九条 国家鼓励和支持密码科学技术研究和应用，依法保护密码领域的知识产权，促进密码科学技术进步和创新。\n国家加强密码人才培养和队伍建设，对在密码工作中作出突出贡献的组织和个人，按照国家有关规定给予表彰和奖励。"},{"t":"a","x":"第十条 国家采取多种形式加强密码安全教育，将密码安全教育纳入国民教育体系和公务员教育培训体系，增强公民、法人和其他组织的密码安全意识。"},{"t":"a","x":"第十一条 县级以上人民政府应当将密码工作纳入本级国民经济和社会发展规划，所需经费列入本级财政预算。"},{"t":"a","x":"第十二条 任何组织或者个人不得窃取他人加密保护的信息或者非法侵入他人的密码保障系统。\n任何组织或者个人不得利用密码从事危害国家安全、社会公共利益、他人合法权益等违法犯罪活动。"},{"t":"h","x":"第二章 核心密码、普通密码"},{"t":"a","x":"第十三条 国家加强核心密码、普通密码的科学规划、管理和使用，加强制度建设，完善管理措施，增强密码安全保障能力。"},{"t":"a","x":"第十四条 在有线、无线通信中传递的国家秘密信息，以及存储、处理国家秘密信息的信息系统，应当依照法律、行政法规和国家有关规定使用核心密码、普通密码进行加密保护、安全认证。"},{"t":"a","x":"第十五条 从事核心密码、普通密码科研、生产、服务、检测、装备、使用和销毁等工作的机构（以下统称密码工作机构）应当按照法律、行政法规、国家有关规定以及核心密码、普通密码标准的要求，建立健全安全管理制度，采取严格的保密措施和保密责任制，确保核心密码、普通密码的安全。"},{"t":"a","x":"第十六条 密码管理部门依法对密码工作机构的核心密码、普通密码工作进行指导、监督和检查，密码工作机构应当配合。"},{"t":"a","x":"第十七条 密码管理部门根据工作需要会同有关部门建立核心密码、普通密码的安全监测预警、安全风险评估、信息通报、重大事项会商和应急处置等协作机制，确保核心密码、普通密码安全管理的协同联动和有序高效。\n密码工作机构发现核心密码、普通密码泄密或者影响核心密码、普通密码安全的重大问题、风险隐患的，应当立即采取应对措施，并及时向保密行政管理部门、密码管理部门报告，由保密行政管理部门、密码管理部门会同有关部门组织开展调查、处置，并指导有关密码工作机构及时消除安全隐患。"},{"t":"a","x":"第十八条 国家加强密码工作机构建设，保障其履行工作职责。\n国家建立适应核心密码、普通密码工作需要的人员录用、选调、保密、考核、培训、待遇、奖惩、交流、退出等管理制度。"},{"t":"a","x":"第十九条 密码管理部门因工作需要，按照国家有关规定，可以提请公安、交通运输、海关等部门对核心密码、普通密码有关物品和人员提供免检等便利，有关部门应当予以协助。"},{"t":"a","x":"第二十条 密码管理部门和密码工作机构应当建立健全严格的监督和安全审查制度，对其工作人员遵守法律和纪律等情况进行监督，并依法采取必要措施，定期或者不定期组织开展安全审查。"},{"t":"h","x":"第三章 商用密码"},{"t":"a","x":"第二十一条 国家鼓励商用密码技术的研究开发、学术交流、成果转化和推广应用，健全统一、开放、竞争、有序的商用密码市场体系，鼓励和促进商用密码产业发展。\n各级人民政府及其有关部门应当遵循非歧视原则，依法平等对待包括外商投资企业在内的商用密码科研、生产、销售、服务、进出口等单位（以下统称商用密码从业单位）。国家鼓励在外商投资过程中基于自愿原则和商业规则开展商用密码技术合作。行政机关及其工作人员不得利用行政手段强制转让商用密码技术。\n商用密码的科研、生产、销售、服务和进出口，不得损害国家安全、社会公共利益或者他人合法权益。"},{"t":"a","x":"第二十二条 国家建立和完善商用密码标准体系。\n国务院标准化行政主管部门和国家密码管理部门依据各自职责，组织制定商用密码国家标准、行业标准。\n国家支持社会团体、企业利用自主创新技术制定高于国家标准、行业标准相关技术要求的商用密码团体标准、企业标准。"},{"t":"a","x":"第二十三条 国家推动参与商用密码国际标准化活动，参与制定商用密码国际标准，推进商用密码中国标准与国外标准之间的转化运用。\n国家鼓励企业、社会团体和教育、科研机构等参与商用密码国际标准化活动。"},{"t":"a","x":"第二十四条 商用密码从业单位开展商用密码活动，应当符合有关法律、行政法规、商用密码强制性国家标准以及该从业单位公开标准的技术要求。\n国家鼓励商 用密码从业单位采用商用密码推荐性国家标准、行业标准，提升商用密码的防护能力，维护用户的合法权益。"},{"t":"a","x":"第二十五条 国家推进商用密码检测认证体系建设，制定商用密码检测认证技术规范、规则，鼓励商用密码从业单位自愿接受商用密码检测认证，提升市场竞争力。\n商用密码检测、认证机构应当依法取得相关资质，并依照法律、行政法规的规定和商用密码检测认证技术规范、规则开展商用密码检测认证。\n商用密码检测、认证机构应当对其在商用密码检测认证中所知悉的国家秘密和商业秘密承担保密义务。"},{"t":"a","x":"第二十六条 涉及国家安全、国计民生、社会公共利益的商用密码产品，应当依法列入网络关键设备和网络安全专用产品目录，由具备资格的机构检测认证合格后，方可销售或者提供。商用密码产品检测认证适用《中华人民共和国网络安全法》的有关规定，避免重复检测认证。\n商用密码服务使用网络关键设备和网络安全专用产品的，应当经商用密码认证机构对该商用密码服务认证合格。"},{"t":"a","x":"第二十七条 法律、行政法规和国家有关规定要求使用商用密码进行保护的关键信息基础设施，其运营者应当使用商用密码进行保护，自行或者委托商用密码检测机构开展商用密码应用安全性评估。商用密码应用安全性评估应当与关键信息基础设施安全检测评估、网络安全等级测评制度相衔接，避免重复评估、测评。\n关键信息基础设施的运营者采购涉及商用密码的网络产品和服务，可能影响国家安全的，应当按照《中华人民共和国网络安全法》的规定，通过国家网信部门会同国家密码管理部门等有关部门组织的国家安全审查。"},{"t":"a","x":"第二十八条 国务院商务主管部门、国家密码管理部门依法对涉及国家安全、社会公共利益且具有加密保护功能的商用密码实施进口许可，对涉及国家安全、社会公共利益或者中国承担国际义务的商用密码实施出口管制。商用密码进口许可清单和出口管制清单由国务院商务主管部门会同国家密码管理部门和海关总署制定并公布。\n大众消费类产品所采用的商用密码不实行进口许可和出口管制制度。"},{"t":"a","x":"第二十九条 国家密码管理部门对采用商用密码技术从事电子政务电子认证服务的机构进行认定，会同有关部门负责政务活动中使用电子签名、数据电文的管理。"},{"t":"a","x":"第三十条 商用密码领域的行业协会等组织依照法律、行政法规及其章程的规定，为商用密码从业单位提供信息、技术、培训等服务，引导和督促商用密码从业单位依法开展商用密码活动，加强行业自律，推动行业诚信建设，促进行业健康发展。"},{"t":"a","x":"第三十一条 密码管理部门和有关部门建立日常监管和随机抽查相结合的商用密码事中事后监管制度，建立统一的商用密码监督管理信息平台，推进事中事后监管与社会信用体系相衔接，强化商用密码从业单位自律和社会监督。\n密码管理部门和有关部门及其工作人员不得要求商用密码从业单位和商用密码检测、认证机构向其披露源代码等密码相关专有信息，并对其在履行职责中知悉的商业秘密和个人隐私严格保密，不得泄露或者非法向他人提供。"},{"t":"h","x":"第四章 法律责任"},{"t":"a","x":"第三十二条 违反本法第十二条规定，窃取他人加密保护的信息，非法侵入他人的密码保障系统，或者利用密码从事危害国家安全、社会公共利益、他人合法权益等违法活动的，由有关部门依照《中华人民共和国网络安全法》和其他有关法律、行政法规的规定追究法律责任。"},{"t":"a","x":"第三十三条 违反本法第十四条规定，未按照要求使用核心密码、普通密码的，由密码管理部门责令改正或者停止违法行为，给予警告；情节严重的，由密码管理部门建议有关国家机关、单位对直接负责的主管人员和其他直接责任人员依法给予处分或者处理。"},{"t":"a","x":"第三十四条 违反本法规定，发生核心密码、普通密码泄密案件的，由保密行政管理部门、密码管理部门建议有关国家机关、单位对直接负责的主管人员和其他直接责任人员依法给予处分或者处理。\n违反本法第十七条第二款规定，发现核心密码、普通密码泄密或者影响核心密码、普通密码安全的重大问题、风险隐患，未立即采取应对措施，或者未及时报告的，由保密行政管理部门、密码管理部门建议有关国家机关、单位对直接负责的主管人员和其他直接责任人员依法给予处分或者处理。"},{"t":"a","x":"第三十五条 商用密码检测、认证机构违反本法第二十五条第二款、第三款规定开展商用密码检测认证的，由市场监督管理部门会同密码管理部门责令改正或者停止违法行为，给予警告，没收违法所得；违法所得三十万元以上的，可以并处违法所得一倍以上三倍以下罚款；没有违法所得或者违法所得不足三十万元的，可以并处十万元以上三十万元以下罚款；情节严重的，依法吊销相关资质。"},{"t":"a","x":"第三十六条 违反本法第二十六条规定，销售或者提供未经检测认证或者检测认证不合格的商用密码产品，或者提供未经认证或者认证不合格的商用密码服务的，由市场监督管理部门会同密码管理部门责令改正或者停止违法行为，给予警告，没收违法产品和违法所得；违法所得十万元以上的，可以并处违法所得一倍以上三倍以下罚款；没有违法所得或者违法所得不足十万元的，可以并处三万元以上十万元以下罚款。"},{"t":"a","x":"第三十七条 关键信息基础设施的运营者违反本法第二十七条第一款规定，未按照要求使用商用密码，或者未按照要求开展商用密码应用安全性评估的，由密码管理部门责令改正，给予警告；拒不改正或者导致危害网络安全等后果的，处十万元以上一百万元以下罚款，对直接负责的主管人员处一万元以上十万元以下罚款。\n关键信息基础设施的运营者违反本法第二十七条第二款规定，使用未经安全审查或者安全审查未通过的产品或者服务的，由有关主管部门责令停止使用，处采购金额一倍以上十倍以下罚款；对直接负责的主管人员和其他直接责任人员处一万元以上十万元以下罚款。"},{"t":"a","x":"第三十八条 违反本法第二十八条实施进口许可、出口管制的规定，进出口商用密码的，由国务院商务主管部门或者海关依法予以处罚。"},{"t":"a","x":"第三十九条 违反本法第二十九条规定，未经认定从事电子政务电子认证服务的，由密码管理部门责令改正或者停止违法行为，给予警告，没收违法产品和违法所得；违法所得三十万元以上的，可以并处违法所得一倍以上三倍以下罚款；没有违法所得或者违法所得不足三十万元的，可以并处十万元以上三十万元以下罚款。"},{"t":"a","x":"第四十条 密码管理部门和有关部门、单位的工作人员在密码工作中滥用职权、玩忽职守、徇私舞弊，或者泄露、非法向他人提供在履行职责中知悉的商业秘密和个人隐私的，依法给予处分。"},{"t":"a","x":"第四十一条 违反本法规定，构成犯罪的，依法追究刑事责任；给他人造成损害的，依法承担民事责任。"},{"t":"h","x":"第五章 附 则"},{"t":"a","x":"第四十二条 国家密码管理部门依照法律、行政法规的规定，制定密码管理规章。"},{"t":"a","x":"第四十三条 中国人民解放军和中国人民武装警察部队的密码工作管理办法，由中央军事委员会根据本法制定。"},{"t":"a","x":"第四十四条 本法自2020年1月1日起施行。"}]},{"title":"中华人民共和国网络安全法","source":"中国网信网","date":"2016年11月7日通过，2017年6月1日起施行（2025年10月28日修正，题库按2016年版条号编写，本页收录2016年版）","url":"https://www.cac.gov.cn/2025-12/29/c_1768735112911946.htm","arts":[{"t":"a","x":"第一条 为了保障网络安全，维护网络空间主权和国家安全、社会公共利益，保护公民、法人和其他组织的合法权益，促进经济社会信息化健康发展，制定本法。"},{"t":"a","x":"第二条 中华人民共和国境内建设、运营、维护和使用网络，以及网络安全的监督管理，适用本法。"},{"t":"a","x":"第三条 国家坚持网络安全与信息化发展并重，遵循积极利用、科学发展、依法管理、确保安全的方针，推进网络基础设施建设和互联互通，鼓励网络技术创新和应用，支持培养网络安全人才，建立健全网络安全保障体系，提高网络安全保护能力。"},{"t":"a","x":"第四条 国家制定并不断完善网络安全战略，明确保障网络安全的基本要求和主要目标，提出重点领域的网络安全政策、工作任务和措施。"},{"t":"a","x":"第五条 国家采取措施，监测、防御、处置来源于中华人民共和国境内外的网络安全风险和威胁，保护关键信息基础设施免受攻击、侵入、干扰和破坏，依法惩治网络违法犯罪活动，维护网络空间安全和秩序。"},{"t":"a","x":"第六条 国家倡导诚实守信、健康文明的网络行为，推动传播社会主义核心价值观，采取措施提高全社会的网络安全意识和水平，形成全社会共同参与促进网络安全的良好环境。"},{"t":"a","x":"第七条 国家积极开展网络空间治理、网络技术研发和标准制定、打击网络违法犯罪等方面的国际交流与合作，推动构建和平、安全、开放、合作的网络空间，建立多边、民主、透明的网络治理体系。"},{"t":"a","x":"第八条 国家网信部门负责统筹协调网络安全工作和相关监督管理工作。国务院电信主管部门、公安部门和其他有关机关依照本法和有关法律、行政法规的规定，在各自职责范围内负责网络安全保护和监督管理工作。\n县级以上地方人民政府有关部门的网络安全保护和监督管理职责，按照国家有关规定确定。"},{"t":"a","x":"第九条 网络运营者开展经营和服务活动，必须遵守法律、行政法规，尊重社会公德，遵守商业道德，诚实信用，履行网络安全保护义务，接受政府和社会的监督，承担社会责任。"},{"t":"a","x":"第十条 建设、运营网络或者通过网络提供服务，应当依照法律、行政法规的规定和国家标准的强制性要求，采取技术措施和其他必要措施，保障网络安全、稳定运行，有效应对网络安全事件，防范网络违法犯罪活动，维护网络数据的完整性、保密性和可用性。"},{"t":"a","x":"第十一条 网络相关行业组织按照章程，加强行业自律，制定网络安全行为规范，指导会员加强网络安全保护，提高网络安全保护水平，促进行业健康发展。"},{"t":"a","x":"第十二条 国家保护公民、法人和其他组织依法使用网络的权利，促进网络接入普及，提升网络服务水平，为社会提供安全、便利的网络服务，保障网络信息依法有序自由流动。\n任何个人和组织使用网络应当遵守宪法法律，遵守公共秩序，尊重社会公德，不得危害网络安全，不得利用网络从事危害国家安全、荣誉和利益，煽动颠覆国家政权、推翻社会主义制度，煽动分裂国家、破坏国家统一，宣扬恐怖主义、极端主义，宣扬民族仇恨、民族歧视，传播暴力、淫秽色情信息，编造、传播虚假信息扰乱经济秩序和社会秩序，以及侵害他人名誉、隐私、知识产权和其他合法权益等活动。"},{"t":"a","x":"第十三条 国家支持研究开发有利于未成年人健康成长的网络产品和服务，依法惩治利用网络从事危害未成年人身心健康的活动，为未成年人提供安全、健康的网络环境。"},{"t":"a","x":"第十四条 任何个人和组织有权对危害网络安全的行为向网信、电信、公安等部门举报。收到举报的部门应当及时依法作出处理；不属于本部门职责的，应当及时移送有权处理的部门。\n有关部门应当对举报人的相关信息予以保密，保护举报人的合法权益。"},{"t":"h","x":"第二章 网络安全支持与促进"},{"t":"a","x":"第十五条 国家建立和完善网络安全标准体系。国务院标准化行政主管部门和国务院其他有关部门根据各自的职责，组织制定并适时修订有关网络安全管理以及网络产品、服务和运行安全的国家标准、行业标准。\n国家支持企业、研究机构、高等学校、网络相关行业组织参与网络安全国家标准、行业标准的制定。"},{"t":"a","x":"第十六条 国务院和省、自治区、直辖市人民政府应当统筹规划，加大投入，扶持重点网络安全技术产业和项目，支持网络安全技术的研究开发和应用，推广安全可信的网络产品和服务，保护网络技术知识产权，支持企业、研究机构和高等学校等参与国家网络安全技术创新项目。"},{"t":"a","x":"第十七条 国家推进网络安全社会化服务体系建设，鼓励有关企业、机构开展网络安全认证、检测和风险评估等安全服务。"},{"t":"a","x":"第十八条 国家鼓励开发网络数据安全保护和利用技术，促进公共数据资源开放，推动技术创新和经济社会发展。\n国家支持创新网络安全管理方式，运用网络新技术，提升网络安全保护水平。"},{"t":"a","x":"第十九条 各级人民政府及其有关部门应当组织开展经常性的网络安全宣传教育，并指导、督促有关单位做好网络安全宣传教育工作。\n大众传播媒介应当有针对性地面向社会进行网络安全宣传教育。"},{"t":"a","x":"第二十条 国家支持企业和高等学校、职业学校等教育培训机构开展网络安全相关教育与培训，采取多种方式培养网络安全人才，促进网络安全人才交流。"},{"t":"h","x":"第三章 网络运行安全\n第一节 一般规定"},{"t":"a","x":"第二十一条 国家实行网络安全等级保护制度。网络运营者应当按照网络安全等级保护制度的要求，履行下列安全保护义务，保障网络免受干扰、破坏或者未经授权的访问，防止网络数据泄露或者被窃取、篡改：\n（一）制定内部安全管理制度和操作规程，确定网络安全负责人，落实网络安全保护责任；\n（二）采取防范计算机病毒和网络攻击、网络侵入等危害网络安全行为的技术措施；\n（三）采取监测、记录网络运行状态、网络安全事件的技术措施，并按照规定留存相关的网络日志不少于六个月；\n（四）采取数据分类、重要数据备份和加密等措施；\n（五）法律、行政法规规定的其他义务。"},{"t":"a","x":"第二十二条 网络产品、服务应当符合相关国家标准的强制性要求。网络产品、服务的提供者不得设置恶意程序；发现其网络产品、服务存在安全缺陷、漏洞等风险时，应当立即采取补救措施，按照规定及时告知用户并向有关主管部门报告。\n网络产品、服务的提供者应当为其产品、服务持续提供安全维护；在规定或者当事人约定的期限内，不得终止提供安全维护。\n网络产品、服务具有收集用户信息功能的，其提供者应当向用户明示并取得同意；涉及用户个人信息的，还应当遵守本法和有关法律、行政法规关于个人信息保护的规定。"},{"t":"a","x":"第二十三条 网络关键设备和网络安全专用产品应当按照相关国家标准的强制性要求，由具备资格的机构安全认证合格或者安全检测符合要求后，方可销售或者提供。国家网信部门会同国务院有关部门制定、公布网络关键设备和网络安全专用产品目录，并推动安全认证和安全检测结果互认，避免重复认证、检测。"},{"t":"a","x":"第二十四条 网络运营者为用户办理网络接入、域名注册服务，办理固定电话、移动电话等入网手续，或者为用户提供信息发布、即时通讯等服务，在与用户签订协议或者确认提供服务时，应当要求用户提供真实身份信息。用户不提供真实身份信息的，网络运营者不得为其提供相关服务。\n国家实施网络可信身份战略，支持研究开发安全、方便的电子身份认证技术，推动不同电子身份认证之间的互认。"},{"t":"a","x":"第二十五条 网络运营者应当制定网络安全事件应急预案，及时处置系统漏洞、计算机病毒、网络攻击、网络侵入等安全风险；在发生危害网络安全的事件时，立即启动应急预案，采取相应的补救措施，并按照规定向有关主管部门报告。"},{"t":"a","x":"第二十六条 开展网络安全认证、检测、风险评估等活动，向社会发布系统漏洞、计算机病毒、网络攻击、网络侵入等网络安全信息，应当遵守国家有关规定。"},{"t":"a","x":"第二十七条 任何个人和组织不得从事非法侵入他人网络、干扰他人网络正常功能、窃取网络数据等危害网络安全的活动；不得提供专门用于从事侵入网络、干扰网络正常功能及防护措施、窃取网络数据等危害网络安全活动的程序、工具；明知他人从事危害网络安全的活动的，不得为其提供技术支持、广告推广、支付结算等帮助。"},{"t":"a","x":"第二十八条 网络运营者应当为公安机关、国家安全机关依法维护国家安全和侦查犯罪的活动提供技术支持和协助。"},{"t":"a","x":"第二十九条 国家支持网络运营者之间在网络安全信息收集、分析、通报和应急处置等方面进行合作，提高网络运营者的安全保障能力。\n有关行业组织建立健全本行业的网络安全保护规范和协作机制，加强对网络安全风险的分析评估，定期向会员进行风险警示，支持、协助会员应对网络安全风险。"},{"t":"a","x":"第三十条 网信部门和有关部门在履行网络安全保护职责中获取的信息，只能用于维护网络安全的需要，不得用于其他用途。\n第二节 关键信息基础设施的运行安全"},{"t":"a","x":"第三十一条 国家对公共通信和信息服务、能源、交通、水利、金融、公共服务、电子政务等重要行业和领域，以及其他一旦遭到破坏、丧失功能或者数据泄露，可能严重危害国家安全、国计民生、公共利益的关键信息基础设施，在网络安全等级保护制度的基础上，实行重点保护。关键信息基础设施的具体范围和安全保护办法由国务院制定。\n国家鼓励关键信息基础设施以外的网络运营者自愿参与关键信息基础设施保护体系。"},{"t":"a","x":"第三十二条 按照国务院规定的职责分工，负责关键信息基础设施安全保护工作的部门分别编制并组织实施本行业、本领域的关键信息基础设施安全规划，指导和监督关键信息基础设施运行安全保护工作。"},{"t":"a","x":"第三十三条 建设关键信息基础设施应当确保其具有支持业务稳定、持续运行的性能，并保证安全技术措施同步规划、同步建设、同步使用。"},{"t":"a","x":"第三十四条 除本法第二十一条的规定外，关键信息基础设施的运营者还应当履行下列安全保护义务：\n（一）设置专门安全管理机构和安全管理负责人，并对该负责人和关键岗位的人员进行安全背景审查；\n（二）定期对从业人员进行网络安全教育、技术培训和技能考核；\n（三）对重要系统和数据库进行容灾备份；\n（四）制定网络安全事件应急预案，并定期进行演练；\n（五）法律、行政法规规定的其他义务。"},{"t":"a","x":"第三十五条 关键信息基础设施的运营者采购网络产品和服务，可能影响国家安全的，应当通过国家网信部门会同国务院有关部门组织的国家安全审查。"},{"t":"a","x":"第三十六条 关键信息基础设施的运营者采购网络产品和服务，应当按照规定与提供者签订安全保密协议，明确安全和保密义务与责任。"},{"t":"a","x":"第三十七条 关键信息基础设施的运营者在中华人民共和国境内运营中收集和产生的个人信息和重要数据应当在境内存储。因业务需要，确需向境外提供的，应当按照国家网信部门会同国务院有关部门制定的办法进行安全评估；法律、行政法规另有规定的，依照其规定。"},{"t":"a","x":"第三十八条 关键信息基础设施的运营者应当自行或者委托网络安全服务机构对其网络的安全性和可能存在的风险每年至少进行一次检测评估，并将检测评估情况和改进措施报送相关负责关键信息基础设施安全保护工作的部门。"},{"t":"a","x":"第三十九条 国家网信部门应当统筹协调有关部门对关键信息基础设施的安全保护采取下列措施：\n（一）对关键信息基础设施的安全风险进行抽查检测，提出改进措施，必要时可以委托网络安全服务机构对网络存在的安全风险进行检测评估；\n（二）定期组织关键信息基础设施的运营者进行网络安全应急演练，提高应对网络安全事件的水平和协同配合能力；\n（三）促进有关部门、关键信息基础设施的运营者以及有关研究机构、网络安全服务机构等之间的网络安全信息共享；\n（四）对网络安全事件的应急处置与网络功能的恢复等，提供技术支持和协助。"},{"t":"h","x":"第四章 网络信息安全"},{"t":"a","x":"第四十条 网络运营者应当对其收集的用户信息严格保密，并建立健全用户信息保护制度。"},{"t":"a","x":"第四十一条 网络运营者收集、使用个人信息，应当遵循合法、正当、必要的原则，公开收集、使用规则，明示收集、使用信息的目的、方式和范围，并经被收集者同意。\n网络运营者不得收集与其提供的服务无关的个人信息，不得违反法律、行政法规的规定和双方的约定收集、使用个人信息，并应当依照法律、行政法规的规定和与用户的约定，处理其保存的个人信息。"},{"t":"a","x":"第四十二条 网络运营者不得泄露、篡改、毁损其收集的个人信息；未经被收集者同意，不得向他人提供个人信息。但是，经过处理无法识别特定个人且不能复原的除外。\n网络运营者应当采取技术措施和其他必要措施，确保其收集的个人信息安全，防止信息泄露、毁损、丢失。在发生或者可能发生个人信息泄露、毁损、丢失的情况时，应当立即采取补救措施，按照规定及时告知用户并向有关主管部门报告。"},{"t":"a","x":"第四十三条 个人发现网络运营者违反法律、行政法规的规定或者双方的约定收集、使用其个人信息的，有权要求网络运营者删除其个人信息；发现网络运营者收集、存储的其个人信息有错误的，有权要求网络运营者予以更正。网络运营者应当采取措施予以删除或者更正。"},{"t":"a","x":"第四十四条 任何个人和组织不得窃取或者以其他非法方式获取个人信息，不得非法出售或者非法向他人提供个人信息。"},{"t":"a","x":"第四十五条 依法负有网络安全监督管理职责的部门及其工作人员，必须对在履行职责中知悉的个人信息、隐私和商业秘密严格保密，不得泄露、出售或者非法向他人提供。"},{"t":"a","x":"第四十六条 任何个人和组织应当对其使用网络的行为负责，不得设立用于实施诈骗，传授犯罪方法，制作或者销售违禁物品、管制物品等违法犯罪活动的网站、通讯群组，不得利用网络发布涉及实施诈骗，制作或者销售违禁物品、管制物品以及其他违法犯罪活动的信息。"},{"t":"a","x":"第四十七条 网络运营者应当加强对其用户发布的信息的管理，发现法律、行政法规禁止发布或者传输的信息的，应当立即停止传输该信息，采取消除等处置措施，防止信息扩散，保存有关记录，并向有关主管部门报告。"},{"t":"a","x":"第四十八条 任何个人和组织发送的电子信息、提供的应用软件，不得设置恶意程序，不得含有法律、行政法规禁止发布或者传输的信息。\n电子信息发送服务提供者和应用软件下载服务提供者，应当履行安全管理义务，知道其用户有前款规定行为的，应当停止提供服务，采取消除等处置措施，保存有关记录，并向有关主管部门报告。"},{"t":"a","x":"第四十九条 网络运营者应当建立网络信息安全投诉、举报制度，公布投诉、举报方式等信息，及时受理并处理有关网络信息安全的投诉和举报。\n网络运营者对网信部门和有关部门依法实施的监督检查，应当予以配合。"},{"t":"a","x":"第五十条 国家网信部门和有关部门依法履行网络信息安全监督管理职责，发现法律、行政法规禁止发布或者传输的信息的，应当要求网络运营者停止传输，采取消除等处置措施，保存有关记录；对来源于中华人民共和国境外的上述信息，应当通知有关机构采取技术措施和其他必要措施阻断传播。"},{"t":"h","x":"第五章 监测预警与应急处置"},{"t":"a","x":"第五十一条 国家建立网络安全监测预警和信息通报制度。国家网信部门应当统筹协调有关部门加强网络安全信息收集、分析和通报工作，按照规定统一发布网络安全监测预警信息。"},{"t":"a","x":"第五十二条 负责关键信息基础设施安全保护工作的部门，应当建立健全本行业、本领域的网络安全监测预警和信息通报制度，并按照规定报送网络安全监测预警信息。"},{"t":"a","x":"第五十三条 国家网信部门协调有关部门建立健全网络安全风险评估和应急工作机制，制定网络安全事件应急预案，并定期组织演练。\n负责关键信息基础设施安全保护工作的部门应当制定本行业、本领域的网络安全事件应急预案，并定期组织演练。\n网络安全事件应急预案应当按照事件发生后的危害程度、影响范围等因素对网络安全事件进行分级，并规定相应的应急处置措施。"},{"t":"a","x":"第五十四条 网络安全事件发生的风险增大时，省级以上人民政府有关部门应当按照规定的权限和程序，并根据网络安全风险的特点和可能造成的危害，采取下列措施：\n（一）要求有关部门、机构和人员及时收集、报告有关信息，加强对网络安全风险的监测；\n（二）组织有关部门、机构和专业人员，对网络安全风险信息进行分析评估，预测事件发生的可能性、影响范围和危害程度；\n（三）向社会发布网络安全风险预警，发布避免、减轻危害的措施。"},{"t":"a","x":"第五十五条 发生网络安全事件，应当立即启动网络安全事件应急预案，对网络安全事件进行调查和评估，要求网络运营者采取技术措施和其他必要措施，消除安全隐患，防止危害扩大，并及时向社会发布与公众有关的警示信息。"},{"t":"a","x":"第五十六条 省级以上人民政府有关部门在履行网络安全监督管理职责中，发现网络存在较大安全风险或者发生安全事件的，可以按照规定的权限和程序对该网络的运营者的法定代表人或者主要负责人进行约谈。网络运营者应当按照要求采取措施，进行整改，消除隐患。"},{"t":"a","x":"第五十七条 因网络安全事件，发生突发事件或者生产安全事故的，应当依照《中华人民共和国突发事件应对法》、《中华人民共和国安全生产法》等有关法律、行政法规的规定处置。"},{"t":"a","x":"第五十八条 因维护国家安全和社会公共秩序，处置重大突发社会安全事件的需要，经国务院决定或者批准，可以在特定区域对网络通信采取限制等临时措施。"},{"t":"h","x":"第六章 法律责任"},{"t":"a","x":"第五十九条 网络运营者不履行本法第二十一条、第二十五条规定的网络安全保护义务的，由有关主管部门责令改正，给予警告；拒不改正或者导致危害网络安全等后果的，处一万元以上十万元以下罚款，对直接负责的主管人员处五千元以上五万元以下罚款。\n关键信息基础设施的运营者不履行本法第三十三条、第三十四条、第三十六条、第三十八条规定的网络安全保护义务的，由有关主管部门责令改正，给予警告；拒不改正或者导致危害网络安全等后果的，处十万元以上一百万元以下罚款，对直接负责的主管人员处一万元以上十万元以下罚款。"},{"t":"a","x":"第六十条 违反本法第二十二条第一款、第二款和第四十八条第一款规定，有下列行为之一的，由有关主管部门责令改正，给予警告；拒不改正或者导致危害网络安全等后果的，处五万元以上五十万元以下罚款，对直接负责的主管人员处一万元以上十万元以下罚款：\n（一）设置恶意程序的；\n（二）对其产品、服务存在的安全缺陷、漏洞等风险未立即采取补救措施，或者未按照规定及时告知用户并向有关主管部门报告的；\n（三）擅自终止为其产品、服务提供安全维护的。"},{"t":"a","x":"第六十一条 网络运营者违反本法第二十四条第一款规定，未要求用户提供真实身份信息，或者对不提供真实身份信息的用户提供相关服务的，由有关主管部门责令改正；拒不改正或者情节严重的，处五万元以上五十万元以下罚款，并可以由有关主管部门责令暂停相关业务、停业整顿、关闭网站、吊销相关业务许可证或者吊销营业执照，对直接负责的主管人员和其他直接责任人员处一万元以上十万元以下罚款。"},{"t":"a","x":"第六十二条 违反本法第二十六条规定，开展网络安全认证、检测、风险评估等活动，或者向社会发布系统漏洞、计算机病毒、网络攻击、网络侵入等网络安全信息的，由有关主管部门责令改正，给予警告；拒不改正或者情节严重的，处一万元以上十万元以下罚款，并可以由有关主管部门责令暂停相关业务、停业整顿、关闭网站、吊销相关业务许可证或者吊销营业执照，对直接负责的主管人员和其他直接责任人员处五千元以上五万元以下罚款。"},{"t":"a","x":"第六十三条 违反本法第二十七条规定，从事危害网络安全的活动，或者提供专门用于从事危害网络安全活动的程序、工具，或者为他人从事危害网络安全的活动提供技术支持、广告推广、支付结算等帮助，尚不构成犯罪的，由公安机关没收违法所得，处五日以下拘留，可以并处五万元以上五十万元以下罚款；情节较重的，处五日以上十五日以下拘留，可以并处十万元以上一百万元以下罚款。\n单位有前款行为的，由公安机关没收违法所得，处十万元以上一百万元以下罚款，并对直接负责的主管人员和其他直接责任人员依照前款规定处罚。\n违反本法第二十七条规定，受到治安管理处罚的人员，五年内不得从事网络安全管理和网络运营关键岗位的工作；受到刑事处罚的人员，终身不得从事网络安全管理和网络运营关键岗位的工作。"},{"t":"a","x":"第六十四条 网络运营者、网络产品或者服务的提供者违反本法第二十二条第三款、第四十一条至第四十三条规定，侵害个人信息依法得到保护的权利的，由有关主管部门责令改正，可以根据情节单处或者并处警告、没收违法所得、处违法所得一倍以上十倍以下罚款，没有违法所得的，处一百万元以下罚款，对直接负责的主管人员和其他直接责任人员处一万元以上十万元以下罚款；情节严重的，并可以责令暂停相关业务、停业整顿、关闭网站、吊销相关业务许可证或者吊销营业执照。\n违反本法第四十四条规定，窃取或者以其他非法方式获取、非法出售或者非法向他人提供个人信息，尚不构成犯罪的，由公安机关没收违法所得，并处违法所得一倍以上十倍以下罚款，没有违法所得的，处一百万元以下罚款。"},{"t":"a","x":"第六十五条 关键信息基础设施的运营者违反本法第三十五条规定，使用未经安全审查或者安全审查未通过的网络产品或者服务的，由有关主管部门责令停止使用，处采购金额一倍以上十倍以下罚款；对直接负责的主管人员和其他直接责任人员处一万元以上十万元以下罚款。"},{"t":"a","x":"第六十六条 关键信息基础设施的运营者违反本法第三十七条规定，在境外存储网络数据，或者向境外提供网络数据的，由有关主管部门责令改正，给予警告，没收违法所得，处五万元以上五十万元以下罚款，并可以责令暂停相关业务、停业整顿、关闭网站、吊销相关业务许可证或者吊销营业执照；对直接负责的主管人员和其他直接责任人员处一万元以上十万元以下罚款。"},{"t":"a","x":"第六十七条 违反本法第四十六条规定，设立用于实施违法犯罪活动的网站、通讯群组，或者利用网络发布涉及实施违法犯罪活动的信息，尚不构成犯罪的，由公安机关处五日以下拘留，可以并处一万元以上十万元以下罚款；情节较重的，处五日以上十五日以下拘留，可以并处五万元以上五十万元以下罚款。关闭用于实施违法犯罪活动的网站、通讯群组。\n单位有前款行为的，由公安机关处十万元以上五十万元以下罚款，并对直接负责的主管人员和其他直接责任人员依照前款规定处罚。"},{"t":"a","x":"第六十八条 网络运营者违反本法第四十七条规定，对法律、行政法规禁止发布或者传输的信息未停止传输、采取消除等处置措施、保存有关记录的，由有关主管部门责令改正，给予警告，没收违法所得；拒不改正或者情节严重的，处十万元以上五十万元以下罚款，并可以责令暂停相关业务、停业整顿、关闭网站、吊销相关业务许可证或者吊销营业执照，对直接负责的主管人员和其他直接责任人员处一万元以上十万元以下罚款。\n电子信息发送服务提供者、应用软件下载服务提供者，不履行本法第四十八条第二款规定的安全管理义务的，依照前款规定处罚。"},{"t":"a","x":"第六十九条 网络运营者违反本法规定，有下列行为之一的，由有关主管部门责令改正；拒不改正或者情节严重的，处五万元以上五十万元以下罚款，对直接负责的主管人员和其他直接责任人员，处一万元以上十万元以下罚款：\n（一）不按照有关部门的要求对法律、行政法规禁止发布或者传输的信息，采取停止传输、消除等处置措施的；\n（二）拒绝、阻碍有关部门依法实施的监督检查的；\n（三）拒不向公安机关、国家安全机关提供技术支持和协助的。"},{"t":"a","x":"第七十条 发布或者传输本法第十二条第二款和其他法律、行政法规禁止发布或者传输的信息的，依照有关法律、行政法规的规定处罚。"},{"t":"a","x":"第七十一条 有本法规定的违法行为的，依照有关法律、行政法规的规定记入信用档案，并予以公示。"},{"t":"a","x":"第七十二条 国家机关政务网络的运营者不履行本法规定的网络安全保护义务的，由其上级机关或者有关机关责令改正；对直接负责的主管人员和其他直接责任人员依法给予处分。"},{"t":"a","x":"第七十三条 网信部门和有关部门违反本法第三十条规定，将在履行网络安全保护职责中获取的信息用于其他用途的，对直接负责的主管人员和其他直接责任人员依法给予处分。\n网信部门和有关部门的工作人员玩忽职守、滥用职权、徇私舞弊，尚不构成犯罪的，依法给予处分。"},{"t":"a","x":"第七十四条 违反本法规定，给他人造成损害的，依法承担民事责任。\n违反本法规定，构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。"},{"t":"a","x":"第七十五条 境外的机构、组织、个人从事攻击、侵入、干扰、破坏等危害中华人民共和国的关键信息基础设施的活动，造成严重后果的，依法追究法律责任；国务院公安部门和有关部门并可以决定对该机构、组织、个人采取冻结财产或者其他必要的制裁措施。"},{"t":"h","x":"第七章 附 则"},{"t":"a","x":"第七十六条 本法下列用语的含义：\n（一）网络，是指由计算机或者其他信息终端及相关设备组成的按照一定的规则和程序对信息进行收集、存储、传输、交换、处理的系统。\n（二）网络安全，是指通过采取必要措施，防范对网络的攻击、侵入、干扰、破坏和非法使用以及意外事故，使网络处于稳定可靠运行的状态，以及保障网络数据的完整性、保密性、可用性的能力。\n（三）网络运营者，是指网络的所有者、管理者和网络服务提供者。\n（四）网络数据，是指通过网络收集、存储、传输、处理和产生的各种电子数据。\n（五）个人信息，是指以电子或者其他方式记录的能够单独或者与其他信息结合识别自然人个人身份的各种信息，包括但不限于自然人的姓名、出生日期、身份证件号码、个人生物识别信息、住址、电话号码等。"},{"t":"a","x":"第七十七条 存储、处理涉及国家秘密信息的网络的运行安全保护，除应当遵守本法外，还应当遵守保密法律、行政法规的规定。"},{"t":"a","x":"第七十八条 军事网络的安全保护，由中央军事委员会另行规定。"},{"t":"a","x":"第七十九条 本法自2017年6月1日起施行。"}]},{"title":"中华人民共和国个人信息保护法","source":"全国人大网","date":"2021年8月20日通过，2021年11月1日起施行","url":"http://www.npc.gov.cn/npc/c2/c30834/202108/t20210820_313088.html","arts":[{"t":"a","x":"第一条 为了保护个人信息权益，规范个人信息处理活动，促进个人信息合理利用，根据宪法，制定本法。"},{"t":"a","x":"第二条 自然人的个人信息受法律保护，任何组织、个人不得侵害自然人的个人信息权益。"},{"t":"a","x":"第三条 在中华人民共和国境内处理自然人个人信息的活动，适用本法。\n在中华人民共和国境外处理中华人民共和国境内自然人个人信息的活动，有下列情形之一的，也适用本法：\n（一）以向境内自然人提供产品或者服务为目的；\n（二）分析、评估境内自然人的行为；\n（三）法律、行政法规规定的其他情形。"},{"t":"a","x":"第四条 个人信息是以电子或者其他方式记录的与已识别或者可识别的自然人有关的各种信息，不包括匿名化处理后的信息。\n个人信息的处理包括个人信息的收集、存储、使用、加工、传输、提供、公开、删除等。"},{"t":"a","x":"第五条 处理个人信息应当遵循合法、正当、必要和诚信原则，不得通过误导、欺诈、胁迫等方式处理个人信息。"},{"t":"a","x":"第六条 处理个人信息应当具有明确、合理的目的，并应当与处理目的直接相关，采取对个人权益影响最小的方式。\n收集个人信息，应当限于实现处理目的的最小范围，不得过度收集个人信息。"},{"t":"a","x":"第七条 处理个人信息应当遵循公开、透明原则，公开个人信息处理规则，明示处理的目的、方式和范围。"},{"t":"a","x":"第八条 处理个人信息应当保证个人信息的质量，避免因个人信息不准确、不完整对个人权益造成不利影响。"},{"t":"a","x":"第九条 个人信息处理者应当对其个人信息处理活动负责，并采取必要措施保障所处理的个人信息的安全。"},{"t":"a","x":"第十条 任何组织、个人不得非法收集、使用、加工、传输他人个人信息，不得非法买卖、提供或者公开他人个人信息；不得从事危害国家安全、公共利益的个人信息处理活动。"},{"t":"a","x":"第十一条 国家建立健全个人信息保护制度，预防和惩治侵害个人信息权益的行为，加强个人信息保护宣传教育，推动形成政府、企业、相关社会组织、公众共同参与个人信息保护的良好环境。"},{"t":"a","x":"第十二条 国家积极参与个人信息保护国际规则的制定，促进个人信息保护方面的国际交流与合作，推动与其他国家、地区、国际组织之间的个人信息保护规则、标准等互认。"},{"t":"h","x":"第二章 个人信息处理规则\n第一节 一般规定"},{"t":"a","x":"第十三条 符合下列情形之一的，个人信息处理者方可处理个人信息：\n（一）取得个人的同意；\n（二）为订立、履行个人作为一方当事人的合同所必需，或者按照依法制定的劳动规章制度和依法签订的集体合同实施人力资源管理所必需；\n（三）为履行法定职责或者法定义务所必需；\n（四）为应对突发公共卫生事件，或者紧急情况下为保护自然人的生命健康和财产安全所必需；\n（五）为公共利益实施新闻报道、舆论监督等行为，在合理的范围内处理个人信息；\n（六）依照本法规定在合理的范围内处理个人自行公开或者其他已经合法公开的个人信息；\n（七）法律、行政法规规定的其他情形。\n依照本法其他有关规定，处理个人信息应当取得个人同意，但是有前款第二项至第七项规定情形的，不需取得个人同意。"},{"t":"a","x":"第十四条 基于个人同意处理个人信息的，该同意应当由个人在充分知情的前提下自愿、明确作出。法律、行政法规规定处理个人信息应当取得个人单独同意或者书面同意的，从其规定。\n个人信息的处理目的、处理方式和处理的个人信息种类发生变更的，应当重新取得个人同意。"},{"t":"a","x":"第十五条 基于个人同意处理个人信息的，个人有权撤回其同意。个人信息处理者应当提供便捷的撤回同意的方式。\n个人撤回同意，不影响撤回前基于个人同意已进行的个人信息处理活动的效力。"},{"t":"a","x":"第十六条 个人信息处理者不得以个人不同意处理其个人信息或者撤回同意为由，拒绝提供产品或者服务；处理个人信息属于提供产品或者服务所必需的除外。"},{"t":"a","x":"第十七条 个人信息处理者在处理个人信息前，应当以显著方式、清晰易懂的语言真实、准确、完整地向个人告知下列事项：\n（一）个人信息处理者的名称或者姓名和联系方式；\n（二）个人信息的处理目的、处理方式，处理的个人信息种类、保存期限；\n（三）个人行使本法规定权利的方式和程序；\n（四）法律、行政法规规定应当告知的其他事项。\n前款规定事项发生变更的，应当将变更部分告知个人。\n个人信息处理者通过制定个人信息处理规则的方式告知第一款规定事项的，处理规则应当公开，并且便于查阅和保存。"},{"t":"a","x":"第十八条 个人信息处理者处理个人信息，有法律、行政法规规定应当保密或者不需要告知的情形的，可以不向个人告知前条第一款规定的事项。\n紧急情况下为保护自然人的生命健康和财产安全无法及时向个人告知的，个人信息处理者应当在紧急情况消除后及时告知。"},{"t":"a","x":"第十九条 除法律、行政法规另有规定外，个人信息的保存期限应当为实现处理目的所必要的最短时间。"},{"t":"a","x":"第二十条 两个以上的个人信息处理者共同决定个人信息的处理目的和处理方式的，应当约定各自的权利和义务。但是，该约定不影响个人向其中任何一个个人信息处理者要求行使本法规定的权利。\n个人信息处理者共同处理个人信息，侵害个人信息权益造成损害的，应当依法承担连带责任。"},{"t":"a","x":"第二十一条 个人信息处理者委托处理个人信息的，应当与受托人约定委托处理的目的、期限、处理方式、个人信息的种类、保护措施以及双方的权利和义务等，并对受托人的个人信息处理活动进行监督。\n受托人应当按照约定处理个人信息，不得超出约定的处理目的、处理方式等处理个人信息；委托合同不生效、无效、被撤销或者终止的，受托人应当将个人信息返还个人信息处理者或者予以删除，不得保留。\n未经个人信息处理者同意，受托人不得转委托他人处理个人信息。"},{"t":"a","x":"第二十二条 个人信息处理者因合并、分立、解散、被宣告破产等原因需要转移个人信息的，应当向个人告知接收方的名称或者姓名和联系方式。接收方应当继续履行个人信息处理者的义务。接收方变更原先的处理目的、处理方式的，应当依照本法规定重新取得个人同意。"},{"t":"a","x":"第二十三条 个人信息处理者向其他个人信息处理者提供其处理的个人信息的，应当向个人告知接收方的名称或者姓名、联系方式、处理目的、处理方式和个人信息的种类，并取得个人的单独同意。接收方应当在上述处理目的、处理方式和个人信息的种类等范围内处理个人信息。接收方变更原先的处理目的、处理方式的，应当依照本法规定重新取得个人同意。"},{"t":"a","x":"第二十四条 个人信息处理者利用个人信息进行自动化决策，应当保证决策的透明度和结果公平、公正，不得对个人在交易价格等交易条件上实行不合理的差别待遇。\n通过自动化决策方式向个人进行信息推送、商业营销，应当同时提供不针对其个人特征的选项，或者向个人提供便捷的拒绝方式。\n通过自动化决策方式作出对个人权益有重大影响的决定，个人有权要求个人信息处理者予以说明，并有权拒绝个人信息处理者仅通过自动化决策的方式作出决定。"},{"t":"a","x":"第二十五条 个人信息处理者不得公开其处理的个人信息，取得个人单独同意的除外。"},{"t":"a","x":"第二十六条 在公共场所安装图像采集、个人身份识别设备，应当为维护公共安全所必需，遵守国家有关规定，并设置显著的提示标识。所收集的个人图像、身份识别信息只能用于维护公共安全的目的，不得用于其他目的；取得个人单独同意的除外。"},{"t":"a","x":"第二十七条 个人信息处理者可以在合理的范围内处理个人自行公开或者其他已经合法公开的个人信息；个人明确拒绝的除外。个人信息处理者处理已公开的个人信息，对个人权益有重大影响的，应当依照本法规定取得个人同意。\n第二节 敏感个人信息的处理规则"},{"t":"a","x":"第二十八条 敏感个人信息是一旦泄露或者非法使用，容易导致自然人的人格尊严受到侵害或者人身、财产安全受到危害的个人信息，包括生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹等信息，以及不满十四周岁未成年人的个人信息。\n只有在具有特定的目的和充分的必要性，并采取严格保护措施的情形下，个人信息处理者方可处理敏感个人信息。"},{"t":"a","x":"第二十九条 处理敏感个人信息应当取得个人的单独同意；法律、行政法规规定处理敏感个人信息应当取得书面同意的，从其规定。"},{"t":"a","x":"第三十条 个人信息处理者处理敏感个人信息的，除本法第十七条第一款规定的事项外，还应当向个人告知处理敏感个人信息的必要性以及对个人权益的影响；依照本法规定可以不向个人告知的除外。"},{"t":"a","x":"第三十一条 个人信息处理者处理不满十四周岁未成年人个人信息的，应当取得未成年人的父母或者其他监护人的同意。\n个人信息处理者处理不满十四周岁未成年人个人信息的，应当制定专门的个人信息处理规则。"},{"t":"a","x":"第三十二条 法律、行政法规对处理敏感个人信息规定应当取得相关行政许可或者作出其他限制的，从其规定。\n第三节 国家机关处理个人信息的特别规定"},{"t":"a","x":"第三十三条 国家机关处理个人信息的活动，适用本法；本节有特别规定的，适用本节规定。"},{"t":"a","x":"第三十四条 国家机关为履行法定职责处理个人信息，应当依照法律、行政法规规定的权限、程序进行，不得超出履行法定职责所必需的范围和限度。"},{"t":"a","x":"第三十五条 国家机关为履行法定职责处理个人信息，应当依照本法规定履行告知义务；有本法第十八条第一款规定的情形，或者告知将妨碍国家机关履行法定职责的除外。"},{"t":"a","x":"第三十六条 国家机关处理的个人信息应当在中华人民共和国境内存储；确需向境外提供的，应当进行安全评估。安全评估可以要求有关部门提供支持与协助。"},{"t":"a","x":"第三十七条 法律、法规授权的具有管理公共事务职能的组织为履行法定职责处理个人信息，适用本法关于国家机关处理个人信息的规定。"},{"t":"h","x":"第三章 个人信息跨境提供的规则"},{"t":"a","x":"第三十八条 个人信息处理者因业务等需要，确需向中华人民共和国境外提供个人信息的，应当具备下列条件之一：\n（一）依照本法第四十条的规定通过国家网信部门组织的安全评估；\n（二）按照国家网信部门的规定经专业机构进行个人信息保护认证；\n（三）按照国家网信部门制定的标准合同与境外接收方订立合同，约定双方的权利和义务；\n（四）法律、行政法规或者国家网信部门规定的其他条件。\n中华人民共和国缔结或者参加的国际条约、协定对向中华人民共和国境外提供个人信息的条件等有规定的，可以按照其规定执行。\n个人信息处理者应当采取必要措施，保障境外接收方处理个人信息的活动达到本法规定的个人信息保护标准。"},{"t":"a","x":"第三十九条 个人信息处理者向中华人民共和国境外提供个人信息的，应当向个人告知境外接收方的名称或者姓名、联系方式、处理目的、处理方式、个人信息的种类以及个人向境外接收方行使本法规定权利的方式和程序等事项，并取得个人的单独同意。"},{"t":"a","x":"第四十条 关键信息基础设施运营者和处理个人信息达到国家网信部门规定数量的个人信息处理者，应当将在中华人民共和国境内收集和产生的个人信息存储在境内。确需向境外提供的，应当通过国家网信部门组织的安全评估；法律、行政法规和国家网信部门规定可以不进行安全评估的，从其规定。"},{"t":"a","x":"第四十一条 中华人民共和国主管机关根据有关法律和中华人民共和国缔结或者参加的国际条约、协定，或者按照平等互惠原则，处理外国司法或者执法机构关于提供存储于境内个人信息的请求。非经中华人民共和国主管机关批准，个人信息处理者不得向外国司法或者执法机构提供存储于中华人民共和国境内的个人信息。"},{"t":"a","x":"第四十二条 境外的组织、个人从事侵害中华人民共和国公民的个人信息权益，或者危害中华人民共和国国家安全、公共利益的个人信息处理活动的，国家网信部门可以将其列入限制或者禁止个人信息提供清单，予以公告，并采取限制或者禁止向其提供个人信息等措施。"},{"t":"a","x":"第四十三条 任何国家或者地区在个人信息保护方面对中华人民共和国采取歧视性的禁止、限制或者其他类似措施的，中华人民共和国可以根据实际情况对该国家或者地区对等采取措施。"},{"t":"h","x":"第四章 个人在个人信息处理活动中的权利"},{"t":"a","x":"第四十四条 个人对其个人信息的处理享有知情权、决定权，有权限制或者拒绝他人对其个人信息进行处理；法律、行政法规另有规定的除外。"},{"t":"a","x":"第四十五条 个人有权向个人信息处理者查阅、复制其个人信息；有本法第十八条第一款、第三十五条规定情形的除外。\n个人请求查阅、复制其个人信息的，个人信息处理者应当及时提供。\n个人请求将个人信息转移至其指定的个人信息处理者，符合国家网信部门规定条件的，个人信息处理者应当提供转移的途径。"},{"t":"a","x":"第四十六条 个人发现其个人信息不准确或者不完整的，有权请求个人信息处理者更正、补充。\n个人请求更正、补充其个人信息的，个人信息处理者应当对其个人信息予以核实，并及时更正、补充。"},{"t":"a","x":"第四十七条 有下列情形之一的，个人信息处理者应当主动删除个人信息；个人信息处理者未删除的，个人有权请求删除：\n（一）处理目的已实现、无法实现或者为实现处理目的不再必要；\n（二）个人信息处理者停止提供产品或者服务，或者保存期限已届满；\n（三）个人撤回同意；\n（四）个人信息处理者违反法律、行政法规或者违反约定处理个人信息；\n（五）法律、行政法规规定的其他情形。\n法律、行政法规规定的保存期限未届满，或者删除个人信息从技术上难以实现的，个人信息处理者应当停止除存储和采取必要的安全保护措施之外的处理。"},{"t":"a","x":"第四十八条 个人有权要求个人信息处理者对其个人信息处理规则进行解释说明。"},{"t":"a","x":"第四十九条 自然人死亡的，其近亲属为了自身的合法、正当利益，可以对死者的相关个人信息行使本章规定的查阅、复制、更正、删除等权利；死者生前另有安排的除外。"},{"t":"a","x":"第五十条 个人信息处理者应当建立便捷的个人行使权利的申请受理和处理机制。拒绝个人行使权利的请求的，应当说明理由。\n个人信息处理者拒绝个人行使权利的请求的，个人可以依法向人民法院提起诉讼。"},{"t":"h","x":"第五章 个人信息处理者的义务"},{"t":"a","x":"第五十一条 个人信息处理者应当根据个人信息的处理目的、处理方式、个人信息的种类以及对个人权益的影响、可能存在的安全风险等，采取下列措施确保个人信息处理活动符合法律、行政法规的规定，并防止未经授权的访问以及个人信息泄露、篡改、丢失：\n（一）制定内部管理制度和操作规程；\n（二）对个人信息实行分类管理；\n（三）采取相应的加密、去标识化等安全技术措施；\n（四）合理确定个人信息处理的操作权限，并定期对从业人员进行安全教育和培训；\n（五）制定并组织实施个人信息安全事件应急预案；\n（六）法律、行政法规规定的其他措施。"},{"t":"a","x":"第五十二条 处理个人信息达到国家网信部门规定数量的个人信息处理者应当指定个人信息保护负责人，负责对个人信息处理活动以及采取的保护措施等进行监督。\n个人信息处理者应当公开个人信息保护负责人的联系方式，并将个人信息保护负责人的姓名、联系方式等报送履行个人信息保护职责的部门。"},{"t":"a","x":"第五十三条 本法第三条第二款规定的中华人民共和国境外的个人信息处理者，应当在中华人民共和国境内设立专门机构或者指定代表，负责处理个人信息保护相关事务，并将有关机构的名称或者代表的姓名、联系方式等报送履行个人信息保护职责的部门。"},{"t":"a","x":"第五十四条 个人信息处理者应当定期对其处理个人信息遵守法律、行政法规的情况进行合规审计。"},{"t":"a","x":"第五十五条 有下列情形之一的，个人信息处理者应当事前进行个人信息保护影响评估，并对处理情况进行记录：\n（一）处理敏感个人信息；\n（二）利用个人信息进行自动化决策；\n（三）委托处理个人信息、向其他个人信息处理者提供个人信息、公开个人信息；\n（四）向境外提供个人信息；\n（五）其他对个人权益有重大影响的个人信息处理活动。"},{"t":"a","x":"第五十六条 个人信息保护影响评估应当包括下列内容：\n（一）个人信息的处理目的、处理方式等是否合法、正当、必要；\n（二）对个人权益的影响及安全风险；\n（三）所采取的保护措施是否合法、有效并与风险程度相适应。\n个人信息保护影响评估报告和处理情况记录应当至少保存三年。"},{"t":"a","x":"第五十七条 发生或者可能发生个人信息泄露、篡改、丢失的，个人信息处理者应当立即采取补救措施，并通知履行个人信息保护职责的部门和个人。通知应当包括下列事项：\n（一）发生或者可能发生个人信息泄露、篡改、丢失的信息种类、原因和可能造成的危害；\n（二）个人信息处理者采取的补救措施和个人可以采取的减轻危害的措施；\n（三）个人信息处理者的联系方式。\n个人信息处理者采取措施能够有效避免信息泄露、篡改、丢失造成危害的，个人信息处理者可以不通知个人；履行个人信息保护职责的部门认为可能造成危害的，有权要求个人信息处理者通知个人。"},{"t":"a","x":"第五十八条 提供重要互联网平台服务、用户数量巨大、业务类型复杂的个人信息处理者，应当履行下列义务：\n（一）按照国家规定建立健全个人信息保护合规制度体系，成立主要由外部成员组成的独立机构对个人信息保护情况进行监督；\n（二）遵循公开、公平、公正的原则，制定平台规则，明确平台内产品或者服务提供者处理个人信息的规范和保护个人信息的义务；\n（三）对严重违反法律、行政法规处理个人信息的平台内的产品或者服务提供者，停止提供服务；\n（四）定期发布个人信息保护社会责任报告，接受社会监督。"},{"t":"a","x":"第五十九条 接受委托处理个人信息的受托人，应当依照本法和有关法律、行政法规的规定，采取必要措施保障所处理的个人信息的安全，并协助个人信息处理者履行本法规定的义务。"},{"t":"h","x":"第六章 履行个人信息保护职责的部门"},{"t":"a","x":"第六十条 国家网信部门负责统筹协调个人信息保护工作和相关监督管理工作。国务院有关部门依照本法和有关法律、行政法规的规定，在各自职责范围内负责个人信息保护和监督管理工作。\n县级以上地方人民政府有关部门的个人信息保护和监督管理职责，按照国家有关规定确定。\n前两款规定的部门统称为履行个人信息保护职责的部门。"},{"t":"a","x":"第六十一条 履行个人信息保护职责的部门履行下列个人信息保护职责：\n（一）开展个人信息保护宣传教育，指导、监督个人信息处理者开展个人信息保护工作；\n（二）接受、处理与个人信息保护有关的投诉、举报；\n（三）组织对应用程序等个人信息保护情况进行测评，并公布测评结果；\n（四）调查、处理违法个人信息处理活动；\n（五）法律、行政法规规定的其他职责。"},{"t":"a","x":"第六十二条 国家网信部门统筹协调有关部门依据本法推进下列个人信息保护工作：\n（一）制定个人信息保护具体规则、标准；\n（二）针对小型个人信息处理者、处理敏感个人信息以及人脸识别、人工智能等新技术、新应用，制定专门的个人信息保护规则、标准；\n（三）支持研究开发和推广应用安全、方便的电子身份认证技术，推进网络身份认证公共服务建设；\n（四）推进个人信息保护社会化服务体系建设，支持有关机构开展个人信息保护评估、认证服务；\n（五）完善个人信息保护投诉、举报工作机制。"},{"t":"a","x":"第六十三条 履行个人信息保护职责的部门履行个人信息保护职责，可以采取下列措施：\n（一）询问有关当事人，调查与个人信息处理活动有关的情况;\n（二）查阅、复制当事人与个人信息处理活动有关的合同、记录、账簿以及其他有关资料;\n（三）实施现场检查，对涉嫌违法的个人信息处理活动进行调查;\n（四）检查与个人信息处理活动有关的设备、物品;对有证据证明是用于违法个人信息处理活动的设备、物品，向本部门主要负责人书面报告并经批准，可以查封或者扣押。\n履行个人信息保护职责的部门依法履行职责，当事人应当予以协助、配合，不得拒绝、阻挠。"},{"t":"a","x":"第六十四条 履行个人信息保护职责的部门在履行职责中，发现个人信息处理活动存在较大风险或者发生个人信息安全事件的，可以按照规定的权限和程序对该个人信息处理者的法定代表人或者主要负责人进行约谈，或者要求个人信息处理者委托专业机构对其个人信息处理活动进行合规审计。个人信息处理者应当按照要求采取措施，进行整改，消除隐患。\n履行个人信息保护职责的部门在履行职责中，发现违法处理个人信息涉嫌犯罪的，应当及时移送公安机关依法处理。"},{"t":"a","x":"第六十五条 任何组织、个人有权对违法个人信息处理活动向履行个人信息保护职责的部门进行投诉、举报。收到投诉、举报的部门应当依法及时处理，并将处理结果告知投诉、举报人。\n履行个人信息保护职责的部门应当公布接受投诉、举报的联系方式。"},{"t":"h","x":"第七章 法律责任"},{"t":"a","x":"第六十六条 违反本法规定处理个人信息，或者处理个人信息未履行本法规定的个人信息保护义务的，由履行个人信息保护职责的部门责令改正，给予警告，没收违法所得，对违法处理个人信息的应用程序，责令暂停或者终止提供服务；拒不改正的，并处一百万元以下罚款；对直接负责的主管人员和其他直接责任人员处一万元以上十万元以下罚款。\n有前款规定的违法行为，情节严重的，由省级以上履行个人信息保护职责的部门责令改正，没收违法所得，并处五千万元以下或者上一年度营业额百分之五以下罚款，并可以责令暂停相关业务或者停业整顿、通报有关主管部门吊销相关业务许可或者吊销营业执照；对直接负责的主管人员和其他直接责任人员处十万元以上一百万元以下罚款，并可以决定禁止其在一定期限内担任相关企业的董事、监事、高级管理人员和个人信息保护负责人。"},{"t":"a","x":"第六十七条 有本法规定的违法行为的，依照有关法律、行政法规的规定记入信用档案，并予以公示。"},{"t":"a","x":"第六十八条 国家机关不履行本法规定的个人信息保护义务的，由其上级机关或者履行个人信息保护职责的部门责令改正；对直接负责的主管人员和其他直接责任人员依法给予处分。\n履行个人信息保护职责的部门的工作人员玩忽职守、滥用职权、徇私舞弊，尚不构成犯罪的，依法给予处分。"},{"t":"a","x":"第六十九条 处理个人信息侵害个人信息权益造成损害，个人信息处理者不能证明自己没有过错的，应当承担损害赔偿等侵权责任。\n前款规定的损害赔偿责任按照个人因此受到的损失或者个人信息处理者因此获得的利益确定;个人因此受到的损失和个人信息处理者因此获得的利益难以确定的，根据实际情况确定赔偿数额。"},{"t":"a","x":"第七十条 个人信息处理者违反本法规定处理个人信息，侵害众多个人的权益的，人民检察院、法律规定的消费者组织和由国家网信部门确定的组织可以依法向人民法院提起诉讼。"},{"t":"a","x":"第七十一条 违反本法规定，构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。"},{"t":"h","x":"第八章 附 则"},{"t":"a","x":"第七十二条 自然人因个人或者家庭事务处理个人信息的，不适用本法。\n法律对各级人民政府及其有关部门组织实施的统计、档案管理活动中的个人信息处理有规定的，适用其规定。"},{"t":"a","x":"第七十三条 本法下列用语的含义：\n（一）个人信息处理者，是指在个人信息处理活动中自主决定处理目的、处理方式的组织、个人。\n（二）自动化决策，是指通过计算机程序自动分析、评估个人的行为习惯、兴趣爱好或者经济、健康、信用状况等，并进行决策的活动。\n（三）去标识化，是指个人信息经过处理，使其在不借助额外信息的情况下无法识别特定自然人的过程。\n（四）匿名化，是指个人信息经过处理无法识别特定自然人且不能复原的过程。"},{"t":"a","x":"第七十四条 本法自2021年11月1日起施行。"}]},{"title":"中华人民共和国数据安全法","source":"全国人大网","date":"2021年6月10日通过，2021年9月1日起施行","url":"http://www.npc.gov.cn/npc/c2/c30834/202106/t20210610_311888.html","arts":[{"t":"a","x":"第一条 为了规范数据处理活动，保障数据安全，促进数据开发利用，保护个人、组织的合法权益，维护国家主权、安全和发展利益，制定本法。"},{"t":"a","x":"第二条 在中华人民共和国境内开展数据处理活动及其安全监管，适用本法。\n在中华人民共和国境外开展数据处理活动，损害中华人民共和国国家安全、公共利益或者公民、组织合法权益的，依法追究法律责任。"},{"t":"a","x":"第三条 本法所称数据，是指任何以电子或者其他方式对信息的记录。\n数据处理，包括数据的收集、存储、使用、加工、传输、提供、公开等。\n数据安全，是指通过采取必要措施，确保数据处于有效保护和合法利用的状态，以及具备保障持续安全状态的能力。"},{"t":"a","x":"第四条 维护数据安全，应当坚持总体国家安全观，建立健全数据安全治理体系，提高数据安全保障能力。"},{"t":"a","x":"第五条 中央国家安全领导机构负责国家数据安全工作的决策和议事协调，研究制定、指导实施国家数据安全战略和有关重大方针政策，统筹协调国家数据安全的重大事项和重要工作，建立国家数据安全工作协调机制。"},{"t":"a","x":"第六条 各地区、各部门对本地区、本部门工作中收集和产生的数据及数据安全负责。\n工业、电信、交通、金融、自然资源、卫生健康、教育、科技等主管部门承担本行业、本领域数据安全监管职责。\n公安机关、国家安全机关等依照本法和有关法律、行政法规的规定，在各自职责范围内承担数据安全监管职责。\n国家网信部门依照本法和有关法律、行政法规的规定，负责统筹协调网络数据安全和相关监管工作。"},{"t":"a","x":"第七条 国家保护个人、组织与数据有关的权益，鼓励数据依法合理有效利用，保障数据依法有序自由流动，促进以数据为关键要素的数字经济发展。"},{"t":"a","x":"第八条 开展数据处理活动，应当遵守法律、法规，尊重社会公德和伦理，遵守商业道德和职业道德，诚实守信，履行数据安全保护义务，承担社会责任，不得危害国家安全、公共利益，不得损害个人、组织的合法权益。"},{"t":"a","x":"第九条 国家支持开展数据安全知识宣传普及，提高全社会的数据安全保护意识和水平，推动有关部门、行业组织、科研机构、企业、个人等共同参与数据安全保护工作，形成全社会共同维护数据安全和促进发展的良好环境。"},{"t":"a","x":"第十条 相关行业组织按照章程，依法制定数据安全行为规范和团体标准，加强行业自律，指导会员加强数据安全保护，提高数据安全保护水平，促进行业健康发展。"},{"t":"a","x":"第十一条 国家积极开展数据安全治理、数据开发利用等领域的国际交流与合作，参与数据安全相关国际规则和标准的制定，促进数据跨境安全、自由流动。"},{"t":"a","x":"第十二条 任何个人、组织都有权对违反本法规定的行为向有关主管部门投诉、举报。收到投诉、举报的部门应当及时依法处理。\n有关主管部门应当对投诉、举报人的相关信息予以保密，保护投诉、举报人的合法权益。"},{"t":"h","x":"第二章 数据安全与发展"},{"t":"a","x":"第十三条 国家统筹发展和安全，坚持以数据开发利用和产业发展促进数据安全，以数据安全保障数据开发利用和产业发展。"},{"t":"a","x":"第十四条 国家实施大数据战略，推进数据基础设施建设，鼓励和支持数据在各行业、各领域的创新应用。\n省级以上人民政府应当将数字经济发展纳入本级国民经济和社会发展规划，并根据需要制定数字经济发展规划。"},{"t":"a","x":"第十五条 国家支持开发利用数据提升公共服务的智能化水平。提供智能化公共服务，应当充分考虑老年人、残疾人的需求，避免对老年人、残疾人的日常生活造成障碍。"},{"t":"a","x":"第十六条 国家支持数据开发利用和数据安全技术研究，鼓励数据开发利用和数据安全等领域的技术推广和商业创新，培育、发展数据开发利用和数据安全产品、产业体系。"},{"t":"a","x":"第十七条 国家推进数据开发利用技术和数据安全标准体系建设。国务院标准化行政主管部门和国务院有关部门根据各自的职责，组织制定并适时修订有关数据开发利用技术、产品和数据安全相关标准。国家支持企业、社会团体和教育、科研机构等参与标准制定。"},{"t":"a","x":"第十八条 国家促进数据安全检测评估、认证等服务的发展，支持数据安全检测评估、认证等专业机构依法开展服务活动。\n国家支持有关部门、行业组织、企业、教育和科研机构、有关专业机构等在数据安全风险评估、防范、处置等方面开展协作。"},{"t":"a","x":"第十九条 国家建立健全数据交易管理制度，规范数据交易行为，培育数据交易市场。"},{"t":"a","x":"第二十条 国家支持教育、科研机构和企业等开展数据开发利用技术和数据安全相关教育和培训，采取多种方式培养数据开发利用技术和数据安全专业人才，促进人才交流。"},{"t":"h","x":"第三章 数据安全制度"},{"t":"a","x":"第二十一条 国家建立数据分类分级保护制度，根据数据在经济社会发展中的重要程度，以及一旦遭到篡改、破坏、泄露或者非法获取、非法利用，对国家安全、公共利益或者个人、组织合法权益造成的危害程度，对数据实行分类分级保护。国家数据安全工作协调机制统筹协调有关部门制定重要数据目录，加强对重要数据的保护。\n关系国家安全、国民经济命脉、重要民生、重大公共利益等数据属于国家核心数据，实行更加严格的管理制度。\n各地区、各部门应当按照数据分类分级保护制度，确定本地区、本部门以及相关行业、领域的重要数据具体目录，对列入目录的数据进行重点保护。"},{"t":"a","x":"第二十二条 国家建立集中统一、高效权威的数据安全风险评估、报告、信息共享、监测预警机制。国家数据安全工作协调机制统筹协调有关部门加强数据安全风险信息的获取、分析、研判、预警工作。"},{"t":"a","x":"第二十三条 国家建立数据安全应急处置机制。发生数据安全事件，有关主管部门应当依法启动应急预案，采取相应的应急处置措施，防止危害扩大，消除安全隐患，并及时向社会发布与公众有关的警示信息。"},{"t":"a","x":"第二十四条 国家建立数据安全审查制度，对影响或者可能影响国家安全的数据处理活动进行国家安全审查。\n依法作出的安全审查决定为最终决定。"},{"t":"a","x":"第二十五条 国家对与维护国家安全和利益、履行国际义务相关的属于管制物项的数据依法实施出口管制。"},{"t":"a","x":"第二十六条 任何国家或者地区在与数据和数据开发利用技术等有关的投资、贸易等方面对中华人民共和国采取歧视性的禁止、限制或者其他类似措施的，中华人民共和国可以根据实际情况对该国家或者地区对等采取措施。"},{"t":"h","x":"第四章 数据安全保护义务"},{"t":"a","x":"第二十七条 开展数据处理活动应当依照法律、法规的规定，建立健全全流程数据安全管理制度，组织开展数据安全教育培训，采取相应的技术措施和其他必要措施，保障数据安全。利用互联网等信息网络开展数据处理活动，应当在网络安全等级保护制度的基础上，履行上述数据安全保护义务。\n重要数据的处理者应当明确数据安全负责人和管理机构，落实数据安全保护责任。"},{"t":"a","x":"第二十八条 开展数据处理活动以及研究开发数据新技术，应当有利于促进经济社会发展，增进人民福祉，符合社会公德和伦理。"},{"t":"a","x":"第二十九条 开展数据处理活动应当加强风险监测，发现数据安全缺陷、漏洞等风险时，应当立即采取补救措施；发生数据安全事件时，应当立即采取处置措施，按照规定及时告知用户并向有关主管部门报告。"},{"t":"a","x":"第三十条 重要数据的处理者应当按照规定对其数据处理活动定期开展风险评估，并向有关主管部门报送风险评估报告。\n风险评估报告应当包括处理的重要数据的种类、数量，开展数据处理活动的情况，面临的数据安全风险及其应对措施等。"},{"t":"a","x":"第三十一条 关键信息基础设施的运营者在中华人民共和国境内运营中收集和产生的重要数据的出境安全管理，适用《中华人民共和国网络安全法》的规定；其他数据处理者在中华人民共和国境内运营中收集和产生的重要数据的出境安全管理办法，由国家网信部门会同国务院有关部门制定。"},{"t":"a","x":"第三十二条 任何组织、个人收集数据，应当采取合法、正当的方式，不得窃取或者以其他非法方式获取数据。\n法律、行政法规对收集、使用数据的目的、范围有规定的，应当在法律、行政法规规定的目的和范围内收集、使用数据。"},{"t":"a","x":"第三十三条 从事数据交易中介服务的机构提供服务，应当要求数据提供方说明数据来源，审核交易双方的身份，并留存审核、交易记录。"},{"t":"a","x":"第三十四条 法律、行政法规规定提供数据处理相关服务应当取得行政许可的，服务提供者应当依法取得许可。"},{"t":"a","x":"第三十五条 公安机关、国家安全机关因依法维护国家安全或者侦查犯罪的需要调取数据，应当按照国家有关规定，经过严格的批准手续，依法进行，有关组织、个人应当予以配合。"},{"t":"a","x":"第三十六条 中华人民共和国主管机关根据有关法律和中华人民共和国缔结或者参加的国际条约、协定，或者按照平等互惠原则，处理外国司法或者执法机构关于提供数据的请求。非经中华人民共和国主管机关批准，境内的组织、个人不得向外国司法或者执法机构提供存储于中华人民共和国境内的数据。"},{"t":"h","x":"第五章 政务数据安全与开放"},{"t":"a","x":"第三十七条 国家大力推进电子政务建设，提高政务数据的科学性、准确性、时效性，提升运用数据服务经济社会发展的能力。"},{"t":"a","x":"第三十八条 国家机关为履行法定职责的需要收集、使用数据，应当在其履行法定职责的范围内依照法律、行政法规规定的条件和程序进行；对在履行职责中知悉的个人隐私、个人信息、商业秘密、保密商务信息等数据应当依法予以保密，不得泄露或者非法向他人提供。"},{"t":"a","x":"第三十九条 国家机关应当依照法律、行政法规的规定，建立健全数据安全管理制度，落实数据安全保护责任，保障政务数据安全。"},{"t":"a","x":"第四十条 国家机关委托他人建设、维护电子政务系统，存储、加工政务数据，应当经过严格的批准程序，并应当监督受托方履行相应的数据安全保护义务。受托方应当依照法律、法规的规定和合同约定履行数据安全保护义务，不得擅自留存、使用、泄露或者向他人提供政务数据。"},{"t":"a","x":"第四十一条 国家机关应当遵循公正、公平、便民的原则，按照规定及时、准确地公开政务数据。依法不予公开的除外。"},{"t":"a","x":"第四十二条 国家制定政务数据开放目录，构建统一规范、互联互通、安全可控的政务数据开放平台，推动政务数据开放利用。"},{"t":"a","x":"第四十三条 法律、法规授权的具有管理公共事务职能的组织为履行法定职责开展数据处理活动，适用本章规定。"},{"t":"h","x":"第六章 法律责任"},{"t":"a","x":"第四十四条 有关主管部门在履行数据安全监管职责中，发现数据处理活动存在较大安全风险的，可以按照规定的权限和程序对有关组织、个人进行约谈，并要求有关组织、个人采取措施进行整改，消除隐患。"},{"t":"a","x":"第四十五条 开展数据处理活动的组织、个人不履行本法第二十七条、第二十九条、第三十条规定的数据安全保护义务的，由有关主管部门责令改正，给予警告，可以并处五万元以上五十万元以下罚款，对直接负责的主管人员和其他直接责任人员可以处一万元以上十万元以下罚款；拒不改正或者造成大量数据泄露等严重后果的，处五十万元以上二百万元以下罚款，并可以责令暂停相关业务、停业整顿、吊销相关业务许可证或者吊销营业执照，对直接负责的主管人员和其他直接责任人员处五万元以上二十万元以下罚款。\n违反国家核心数据管理制度，危害国家主权、安全和发展利益的，由有关主管部门处二百万元以上一千万元以下罚款，并根据情况责令暂停相关业务、停业整顿、吊销相关业务许可证或者吊销营业执照；构成犯罪的，依法追究刑事责任。"},{"t":"a","x":"第四十六条 违反本法第三十一条规定，向境外提供重要数据的，由有关主管部门责令改正，给予警告，可以并处十万元以上一百万元以下罚款，对直接负责的主管人员和其他直接责任人员可以处一万元以上十万元以下罚款；情节严重的，处一百万元以上一千万元以下罚款，并可以责令暂停相关业务、停业整顿、吊销相关业务许可证或者吊销营业执照，对直接负责的主管人员和其他直接责任人员处十万元以上一百万元以下罚款。"},{"t":"a","x":"第四十七条 从事数据交易中介服务的机构未履行本法第三十三条规定的义务的，由有关主管部门责令改正，没收违法所得，处违法所得一倍以上十倍以下罚款，没有违法所得或者违法所得不足十万元的，处十万元以上一百万元以下罚款，并可以责令暂停相关业务、停业整顿、吊销相关业务许可证或者吊销营业执照；对直接负责的主管人员和其他直接责任人员处一万元以上十万元以下罚款。"},{"t":"a","x":"第四十八条 违反本法第三十五条规定，拒不配合数据调取的，由有关主管部门责令改正，给予警告，并处五万元以上五十万元以下罚款，对直接负责的主管人员和其他直接责任人员处一万元以上十万元以下罚款。\n违反本法第三十六条规定，未经主管机关批准向外国司法或者执法机构提供数据的，由有关主管部门给予警告，可以并处十万元以上一百万元以下罚款，对直接负责的主管人员和其他直接责任人员可以处一万元以上十万元以下罚款；造成严重后果的，处一百万元以上五百万元以下罚款，并可以责令暂停相关业务、停业整顿、吊销相关业务许可证或者吊销营业执照，对直接负责的主管人员和其他直接责任人员处五万元以上五十万元以下罚款。"},{"t":"a","x":"第四十九条 国家机关不履行本法规定的数据安全保护义务的，对直接负责的主管人员和其他直接责任人员依法给予处分。"},{"t":"a","x":"第五十条 履行数据安全监管职责的国家工作人员玩忽职守、滥用职权、徇私舞弊的，依法给予处分。"},{"t":"a","x":"第五十一条 窃取或者以其他非法方式获取数据，开展数据处理活动排除、限制竞争，或者损害个人、组织合法权益的，依照有关法律、行政法规的规定处罚。"},{"t":"a","x":"第五十二条 违反本法规定，给他人造成损害的，依法承担民事责任。\n违反本法规定，构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。"},{"t":"h","x":"第七章 附 则"},{"t":"a","x":"第五十三条 开展涉及国家秘密的数据处理活动，适用《中华人民共和国保守国家秘密法》等法律、行政法规的规定。\n在统计、档案工作中开展数据处理活动，开展涉及个人信息的数据处理活动，还应当遵守有关法律、行政法规的规定。"},{"t":"a","x":"第五十四条 军事数据安全保护的办法，由中央军事委员会依据本法另行制定。"},{"t":"a","x":"第五十五条 本法自2021年9月1日起施行。"}]},{"title":"中华人民共和国电子签名法","source":"全国人大网","date":"2004年8月28日通过，2019年4月23日修正","url":"http://www.npc.gov.cn/npc/c2/c30834/201906/t20190608_298038.html","arts":[{"t":"a","x":"第一条 为了规范电子签名行为，确立电子签名的法律效力，维护有关各方的合法权益，制定本法。"},{"t":"a","x":"第二条 本法所称电子签名，是指数据电文中以电子形式所含、所附用于识别签名人身份并表明签名人认可其中内容的数据。\n本法所称数据电文，是指以电子、光学、磁或者类似手段生成、发送、接收或者储存的信息。"},{"t":"a","x":"第三条 民事活动中的合同或者其他文件、单证等文书，当事人可以约定使用或者不使用电子签名、数据电文。\n当事人约定使用电子签名、数据电文的文书，不得仅因为其采用电子签名、数据电文的形式而否定其法律效力。\n前款规定不适用下列文书：\n（一）涉及婚姻、收养、继承等人身关系的；\n（二）涉及停止供水、供热、供气等公用事业服务的；\n（三）法律、行政法规规定的不适用电子文书的其他情形。"},{"t":"h","x":"第二章 数据电文"},{"t":"a","x":"第四条 能够有形地表现所载内容，并可以随时调取查用的数据电文，视为符合法律、法规要求的书面形式。"},{"t":"a","x":"第五条 符合下列条件的数据电文，视为满足法律、法规规定的原件形式要求：\n（一）能够有效地表现所载内容并可供随时调取查用；\n（二）能够可靠地保证自最终形成时起，内容保持完整、未被更改。但是，在数据电文上增加背书以及数据交换、储存和显示过程中发生的形式变化不影响数据电文的完整性。"},{"t":"a","x":"第六条 符合下列条件的数据电文，视为满足法律、法规规定的文件保存要求：\n（一）能够有效地表现所载内容并可供随时调取查用；\n（二）数据电文的格式与其生成、发送或者接收时的格式相同，或者格式不相同但是能够准确表现原来生成、发送或者接收的内容；\n（三）能够识别数据电文的发件人、收件人以及发送、接收的时间。"},{"t":"a","x":"第七条 数据电文不得仅因为其是以电子、光学、磁或者类似手段生成、发送、接收或者储存的而被拒绝作为证据使用。"},{"t":"a","x":"第八条 审查数据电文作为证据的真实性，应当考虑以下因素：\n（一）生成、储存或者传递数据电文方法的可靠性；\n（二）保持内容完整性方法的可靠性；\n（三）用以鉴别发件人方法的可靠性；\n（四）其他相关因素。"},{"t":"a","x":"第九条 数据电文有下列情形之一的，视为发件人发送：\n（一）经发件人授权发送的；\n（二）发件人的信息系统自动发送的；\n（三）收件人按照发件人认可的方法对数据电文进行验证后结果相符的。\n当事人对前款规定的事项另有约定的，从其约定。"},{"t":"a","x":"第十条 法律、行政法规规定或者当事人约定数据电文需要确认收讫的，应当确认收讫。发件人收到收件人的收讫确认时，数据电文视为已经收到。"},{"t":"a","x":"第十一条 数据电文进入发件人控制之外的某个信息系统的时间，视为该数据电文的发送时间。\n收件人指定特定系统接收数据电文的，数据电文进入该特定系统的时间，视为该数据电文的接收时间；未指定特定系统的，数据电文进入收件人的任何系统的首次时间，视为该数据电文的接收时间。\n当事人对数据电文的发送时间、接收时间另有约定的，从其约定。"},{"t":"a","x":"第十二条 发件人的主营业地为数据电文的发送地点，收件人的主营业地为数据电文的接收地点。没有主营业地的，其经常居住地为发送或者接收地点。\n当事人对数据电文的发送地点、接收地点另有约定的，从其约定。"},{"t":"h","x":"第三章 电子签名与认证"},{"t":"a","x":"第十三条 电子签名同时符合下列条件的，视为可靠的电子签名：\n（一）电子签名制作数据用于电子签名时，属于电子签名人专有；\n（二）签署时电子签名制作数据仅由电子签名人控制；\n（三）签署后对电子签名的任何改动能够被发现；\n（四）签署后对数据电文内容和形式的任何改动能够被发现。\n当事人也可以选择使用符合其约定的可靠条件的电子签名。"},{"t":"a","x":"第十四条 可靠的电子签名与手写签名或者盖章具有同等的法律效力。"},{"t":"a","x":"第十五条 电子签名人应当妥善保管电子签名制作数据。电子签名人知悉电子签名制作数据已经失密或者可能已经失密时，应当及时告知有关各方，并终止使用该电子签名制作数据。"},{"t":"a","x":"第十六条 电子签名需要第三方认证的，由依法设立的电子认证服务提供者提供认证服务。"},{"t":"a","x":"第十七条 提供电子认证服务，应当具备下列条件：\n（一）取得企业法人资格；\n（二）具有与提供电子认证服务相适应的专业技术人员和管理人员；\n（三）具有与提供电子认证服务相适应的资金和经营场所；\n（四）具有符合国家安全标准的技术和设备；\n（五）具有国家密码管理机构同意使用密码的证明文件；\n（六）法律、行政法规规定的其他条件。"},{"t":"a","x":"第十八条 从事电子认证服务，应当向国务院信息产业主管部门提出申请，并提交符合本法第十七条规定条件的相关材料。国务院信息产业主管部门接到申请后经依法审查，征求国务院商务主管部门等有关部门的意见后，自接到申请之日起四十五日内作出许可或者不予许可的决定。予以许可的，颁发电子认证许可证书；不予许可的，应当书面通知申请人并告知理由。\n取得认证资格的电子认证服务提供者，应当按照国务院信息产业主管部门的规定在互联网上公布其名称、许可证号等信息。"},{"t":"a","x":"第十九条 电子认证服务提供者应当制定、公布符合国家有关规定的电子认证业务规则，并向国务院信息产业主管部门备案。\n电子认证业务规则应当包括责任范围、作业操作规范、信息安全保障措施等事项。"},{"t":"a","x":"第二十条 电子签名人向电子认证服务提供者申请电子签名认证证书，应当提供真实、完整和准确的信息。\n电子认证服务提供者收到电子签名认证证书申请后，应当对申请人的身份进行查验，并对有关材料进行审查。"},{"t":"a","x":"第二十一条 电子认证服务提供者签发的电子签名认证证书应当准确无误，并应当载明下列内容：\n（一）电子认证服务提供者名称；\n（二）证书持有人名称；\n（三）证书序列号；\n（四）证书有效期；\n（五）证书持有人的电子签名验证数据；\n（六）电子认证服务提供者的电子签名；\n（七）国务院信息产业主管部门规定的其他内容。"},{"t":"a","x":"第二十二条 电子认证服务提供者应当保证电子签名认证证书内容在有效期内完整、准确，并保证电子签名依赖方能够证实或者了解电子签名认证证书所载内容及其他有关事项。"},{"t":"a","x":"第二十三条 电子认证服务提供者拟暂停或者终止电子认证服务的，应当在暂停或者终止服务九十日前，就业务承接及其他有关事项通知有关各方。\n电子认证服务提供者拟暂停或者终止电子认证服务的，应当在暂停或者终止服务六十日前向国务院信息产业主管部门报告，并与其他电子认证服务提供者就业务承接进行协商，作出妥善安排。\n电子认证服务提供者未能就业务承接事项与其他电子认证服务提供者达成协议的，应当申请国务院信息产业主管部门安排其他电子认证服务提供者承接其业务。\n电子认证服务提供者被依法吊销电子认证许可证书的，其业务承接事项的处理按照国务院信息产业主管部门的规定执行。"},{"t":"a","x":"第二十四条 电子认证服务提供者应当妥善保存与认证相关的信息，信息保存期限至少为电子签名认证证书失效后五年。"},{"t":"a","x":"第二十五条 国务院信息产业主管部门依照本法制定电子认证服务业的具体管理办法，对电子认证服务提供者依法实施监督管理。"},{"t":"a","x":"第二十六条 经国务院信息产业主管部门根据有关协议或者对等原则核准后，中华人民共和国境外的电子认证服务提供者在境外签发的电子签名认证证书与依照本法设立的电子认证服务提供者签发的电子签名认证证书具有同等的法律效力。"},{"t":"h","x":"第四章 法律责任"},{"t":"a","x":"第二十七条 电子签名人知悉电子签名制作数据已经失密或者可能已经失密未及时告知有关各方、并终止使用电子签名制作数据，未向电子认证服务提供者提供真实、完整和准确的信息，或者有其他过错，给电子签名依赖方、电子认证服务提供者造成损失的，承担赔偿责任。"},{"t":"a","x":"第二十八条 电子签名人或者电子签名依赖方因依据电子认证服务提供者提供的电子签名认证服务从事民事活动遭受损失，电子认证服务提供者不能证明自己无过错的，承担赔偿责任。"},{"t":"a","x":"第二十九条 未经许可提供电子认证服务的，由国务院信息产业主管部门责令停止违法行为；有违法所得的，没收违法所得；违法所得三十万元以上的，处违法所得一倍以上三倍以下的罚款；没有违法所得或者违法所得不足三十万元的，处十万元以上三十万元以下的罚款。"},{"t":"a","x":"第三十条 电子认证服务提供者暂停或者终止电子认证服务，未在暂停或者终止服务六十日前向国务院信息产业主管部门报告的，由国务院信息产业主管部门对其直接负责的主管人员处一万元以上五万元以下的罚款。"},{"t":"a","x":"第三十一条 电子认证服务提供者不遵守认证业务规则、未妥善保存与认证相关的信息，或者有其他违法行为的，由国务院信息产业主管部门责令限期改正；逾期未改正的，吊销电子认证许可证书，其直接负责的主管人员和其他直接责任人员十年内不得从事电子认证服务。吊销电子认证许可证书的，应当予以公告并通知工商行政管理部门。"},{"t":"a","x":"第三十二条 伪造、冒用、盗用他人的电子签名，构成犯罪的，依法追究刑事责任；给他人造成损失的，依法承担民事责任。"},{"t":"a","x":"第三十三条 依照本法负责电子认证服务业监督管理工作的部门的工作人员，不依法履行行政许可、监督管理职责的，依法给予行政处分；构成犯罪的，依法追究刑事责任。"},{"t":"h","x":"第五章 附 则"},{"t":"a","x":"第三十四条 本法中下列用语的含义：\n（一）电子签名人，是指持有电子签名制作数据并以本人身份或者以其所代表的人的名义实施电子签名的人；\n（二）电子签名依赖方，是指基于对电子签名认证证书或者电子签名的信赖从事有关活动的人；\n（三）电子签名认证证书，是指可证实电子签名人与电子签名制作数据有联系的数据电文或者其他电子记录；\n（四）电子签名制作数据，是指在电子签名过程中使用的，将电子签名与电子签名人可靠地联系起来的字符、编码等数据；\n（五）电子签名验证数据，是指用于验证电子签名的数据，包括代码、口令、算法或者公钥等。"},{"t":"a","x":"第三十五条 国务院或者国务院规定的部门可以依据本法制定政务活动和其他社会活动中使用电子签名、数据电文的具体办法。"},{"t":"a","x":"第三十六条 本法自2005年4月1日起施行。"}]},{"title":"商用密码管理条例","source":"中国政府网","date":"国务院令第760号，2023年7月1日起施行","url":"https://www.gov.cn/zhengce/content/202305/content_6875927.htm","arts":[{"t":"a","x":"第一条 为了规范商用密码应用和管理，鼓励和促进商用密码产业发展，保障网络与信息安全，维护国家安全和社会公共利益，保护公民、法人和其他组织的合法权益，根据《中华人民共和国密码法》等法律，制定本条例。"},{"t":"a","x":"第二条 在中华人民共和国境内的商用密码科研、生产、销售、服务、检测、认证、进出口、应用等活动及监督管理，适用本条例。\n本条例所称商用密码，是指采用特定变换的方法对不属于国家秘密的信息等进行加密保护、安全认证的技术、产品和服务。"},{"t":"a","x":"第三条 坚持中国共产党对商用密码工作的领导，贯彻落实总体国家安全观。国家密码管理部门负责管理全国的商用密码工作。县级以上地方各级密码管理部门负责管理本行政区域的商用密码工作。\n网信、商务、海关、市场监督管理等有关部门在各自职责范围内负责商用密码有关管理工作。"},{"t":"a","x":"第四条 国家加强商用密码人才培养，建立健全商用密码人才发展体制机制和人才评价制度，鼓励和支持密码相关学科和专业建设，规范商用密码社会化培训，促进商用密码人才交流。"},{"t":"a","x":"第五条 各级人民政府及其有关部门应当采取多种形式加强商用密码宣传教育，增强公民、法人和其他组织的密码安全意识。"},{"t":"a","x":"第六条 商用密码领域的学会、行业协会等社会组织依照法律、行政法规及其章程的规定，开展学术交流、政策研究、公共服务等活动，加强学术和行业自律，推动诚信建设，促进行业健康发展。\n密码管理部门应当加强对商用密码领域社会组织的指导和支持。"},{"t":"h","x":"第二章 科技创新与标准化"},{"t":"a","x":"第七条 国家建立健全商用密码科学技术创新促进机制，支持商用密码科学技术自主创新，对作出突出贡献的组织和个人按照国家有关规定予以表彰和奖励。\n国家依法保护商用密码领域的知识产权。从事商用密码活动，应当增强知识产权意识，提高运用、保护和管理知识产权的能力。\n国家鼓励在外商投资过程中基于自愿原则和商业规则开展商用密码技术合作。行政机关及其工作人员不得利用行政手段强制转让商用密码技术。"},{"t":"a","x":"第八条 国家鼓励和支持商用密码科学技术成果转化和产业化应用，建立和完善商用密码科学技术成果信息汇交、发布和应用情况反馈机制。"},{"t":"a","x":"第九条 国家密码管理部门组织对法律、行政法规和国家有关规定要求使用商用密码进行保护的网络与信息系统所使用的密码算法、密码协议、密钥管理机制等商用密码技术进行审查鉴定。"},{"t":"a","x":"第十条 国务院标准化行政主管部门和国家密码管理部门依据各自职责，组织制定商用密码国家标准、行业标准，对商用密码团体标准的制定进行规范、引导和监督。国家密码管理部门依据职责，建立商用密码标准实施信息反馈和评估机制，对商用密码标准实施进行监督检查。\n国家推动参与商用密码国际标准化活动，参与制定商用密码国际标准，推进商用密码中国标准与国外标准之间的转化运用，鼓励企业、社会团体和教育、科研机构等参与商用密码国际标准化活动。\n其他领域的标准涉及商用密码的，应当与商用密码国家标准、行业标准保持协调。"},{"t":"a","x":"第十一条 从事商用密码活动，应当符合有关法律、行政法规、商用密码强制性国家标准，以及自我声明公开标准的技术要求。\n国家鼓励在商用密码活动中采用商用密码推荐性国家标准、行业标准，提升商用密码的防护能力，维护用户的合法权益。"},{"t":"h","x":"第三章 检测认证"},{"t":"a","x":"第十二条 国家推进商用密码检测认证体系建设，鼓励在商用密码活动中自愿接受商用密码检测认证。"},{"t":"a","x":"第十三条 从事商用密码产品检测、网络与信息系统商用密码应用安全性评估等商用密码检测活动，向社会出具具有证明作用的数据、结果的机构，应当经国家密码管理部门认定，依法取得商用密码检测机构资质。"},{"t":"a","x":"第十四条 取得商用密码检测机构资质，应当符合下列条件：\n（一）具有法人资格；\n（二）具有与从事商用密码检测活动相适应的资金、场所、设备设施、专业人员和专业能力；\n（三）具有保证商用密码检测活动有效运行的管理体系。"},{"t":"a","x":"第十五条 申请商用密码检测机构资质，应当向国家密码管理部门提出书面申请，并提交符合本条例第十四条规定条件的材料。\n国家密码管理部门应当自受理申请之日起20个工作日内，对申请进行审查，并依法作出是否准予认定的决定。\n需要对申请人进行技术评审的，技术评审所需时间不计算在本条规定的期限内。国家密码管理部门应当将所需时间书面告知申请人。"},{"t":"a","x":"第十六条 商用密码检测机构应当按照法律、行政法规和商用密码检测技术规范、规则，在批准范围内独立、公正、科学、诚信地开展商用密码检测，对出具的检测数据、结果负责，并定期向国家密码管理部门报送检测实施情况。\n商用密码检测技术规范、规则由国家密码管理部门制定并公布。"},{"t":"a","x":"第十七条 国务院市场监督管理部门会同国家密码管理部门建立国家统一推行的商用密码认证制度，实行商用密码产品、服务、管理体系认证，制定并公布认证目录和技术规范、规则。"},{"t":"a","x":"第十八条 从事商用密码认证活动的机构，应当依法取得商用密码认证机构资质。\n申请商用密码认证机构资质，应当向国务院市场监督管理部门提出书面申请。申请人除应当符合法律、行政法规和国家有关规定要求的认证机构基本条件外，还应当具有与从事商用密码认证活动相适应的检测、检查等技术能力。\n国务院市场监督管理部门在审查商用密码认证机构资质申请时，应当征求国家密码管理部门的意见。"},{"t":"a","x":"第十九条 商用密码认证机构应当按照法律、行政法规和商用密码认证技术规范、规则，在批准范围内独立、公正、科学、诚信地开展商用密码认证，对出具的认证结论负责。\n商用密码认证机构应当对其认证的商用密码产品、服务、管理体系实施有效的跟踪调查，以保证通过认证的商用密码产品、服务、管理体系持续符合认证要求。"},{"t":"a","x":"第二十条 涉及国家安全、国计民生、社会公共利益的商用密码产品，应当依法列入网络关键设备和网络安全专用产品目录，由具备资格的商用密码检测、认证机构检测认证合格后，方可销售或者提供。"},{"t":"a","x":"第二十一条 商用密码服务使用网络关键设备和网络安全专用产品的，应当经商用密码认证机构对该商用密码服务认证合格。"},{"t":"h","x":"第四章 电子认证"},{"t":"a","x":"第二十二条 采用商用密码技术提供电子认证服务，应当具有与使用密码相适应的场所、设备设施、专业人员、专业能力和管理体系，依法取得国家密码管理部门同意使用密码的证明文件。"},{"t":"a","x":"第二十三条 电子认证服务机构应当按照法律、行政法规和电子认证服务密码使用技术规范、规则，使用密码提供电子认证服务，保证其电子认证服务密码使用持续符合要求。\n电子认证服务密码使用技术规范、规则由国家密码管理部门制定并公布。"},{"t":"a","x":"第二十四条 采用商用密码技术从事电子政务电子认证服务的机构，应当经国家密码管理部门认定，依法取得电子政务电子认证服务机构资质。"},{"t":"a","x":"第二十五条 取得电子政务电子认证服务机构资质，应当符合下列条件：\n（一）具有企业法人或者事业单位法人资格；\n（二）具有与从事电子政务电子认证服务活动及其使用密码相适应的资金、场所、设备设施和专业人员；\n（三）具有为政务活动提供长期电子政务电子认证服务的能力；\n（四）具有保证电子政务电子认证服务活动及其使用密码安全运行的管理体系。"},{"t":"a","x":"第二十六条 申请电子政务电子认证服务机构资质，应当向国家密码管理部门提出书面申请，并提交符合本条例第二十五条规定条件的材料。\n国家密码管理部门应当自受理申请之日起20个工作日内，对申请进行审查，并依法作出是否准予认定的决定。\n需要对申请人进行技术评审的，技术评审所需时间不计算在本条规定的期限内。国家密码管理部门应当将所需时间书面告知申请人。"},{"t":"a","x":"第二十七条 外商投资电子政务电子认证服务，影响或者可能影响国家安全的，应当依法进行外商投资安全审查。"},{"t":"a","x":"第二十八条 电子政务电子认证服务机构应当按照法律、行政法规和电子政务电子认证服务技术规范、规则，在批准范围内提供电子政务电子认证服务，并定期向主要办事机构所在地省、自治区、直辖市密码管理部门报送服务实施情况。\n电子政务电子认证服务技术规范、规则由国家密码管理部门制定并公布。"},{"t":"a","x":"第二十九条 国家建立统一的电子认证信任机制。国家密码管理部门负责电子认证信任源的规划和管理，会同有关部门推动电子认证服务互信互认。"},{"t":"a","x":"第三十条 密码管理部门会同有关部门负责政务活动中使用电子签名、数据电文的管理。\n政务活动中电子签名、电子印章、电子证照等涉及的电子认证服务，应当由依法设立的电子政务电子认证服务机构提供。"},{"t":"h","x":"第五章 进出口"},{"t":"a","x":"第三十一条 涉及国家安全、社会公共利益且具有加密保护功能的商用密码，列入商用密码进口许可清单，实施进口许可。涉及国家安全、社会公共利益或者中国承担国际义务的商用密码，列入商用密码出口管制清单，实施出口管制。\n商用密码进口许可清单和商用密码出口管制清单由国务院商务主管部门会同国家密码管理部门和海关总署制定并公布。\n大众消费类产品所采用的商用密码不实行进口许可和出口管制制度。"},{"t":"a","x":"第三十二条 进口商用密码进口许可清单中的商用密码或者出口商用密码出口管制清单中的商用密码，应当向国务院商务主管部门申请领取进出口许可证。\n商用密码的过境、转运、通运、再出口，在境外与综合保税区等海关特殊监管区域之间进出，或者在境外与出口监管仓库、保税物流中心等保税监管场所之间进出的，适用前款规定。"},{"t":"a","x":"第三十三条 进口商用密码进口许可清单中的商用密码或者出口商用密码出口管制清单中的商用密码时，应当向海关交验进出口许可证，并按照国家有关规定办理报关手续。\n进出口经营者未向海关交验进出口许可证，海关有证据表明进出口产品可能属于商用密码进口许可清单或者出口管制清单范围的，应当向进出口经营者提出质疑；海关可以向国务院商务主管部门提出组织鉴别，并根据国务院商务主管部门会同国家密码管理部门作出的鉴别结论依法处置。在鉴别或者质疑期间，海关对进出口产品不予放行。"},{"t":"a","x":"第三十四条 申请商用密码进出口许可，应当向国务院商务主管部门提出书面申请，并提交下列材料：\n（一）申请人的法定代表人、主要经营管理人以及经办人的身份证明；\n（二）合同或者协议的副本；\n（三）商用密码的技术说明；\n（四）最终用户和最终用途证明；\n（五）国务院商务主管部门规定提交的其他文件。\n国务院商务主管部门应当自受理申请之日起45个工作日内，会同国家密码管理部门对申请进行审查，并依法作出是否准予许可的决定。\n对国家安全、社会公共利益或者外交政策有重大影响的商用密码出口，由国务院商务主管部门会同国家密码管理部门等有关部门报国务院批准。报国务院批准的，不受前款规定时限的限制。"},{"t":"h","x":"第六章 应用促进"},{"t":"a","x":"第三十五条 国家鼓励公民、法人和其他组织依法使用商用密码保护网络与信息安全，鼓励使用经检测认证合格的商用密码。\n任何组织或者个人不得窃取他人加密保护的信息或者非法侵入他人的商用密码保障系统，不得利用商用密码从事危害国家安全、社会公共利益、他人合法权益等违法犯罪活动。"},{"t":"a","x":"第三十六条 国家支持网络产品和服务使用商用密码提升安全性，支持并规范商用密码在信息领域新技术、新业态、新模式中的应用。"},{"t":"a","x":"第三十七条 国家建立商用密码应用促进协调机制，加强对商用密码应用的统筹指导。国家机关和涉及商用密码工作的单位在其职责范围内负责本机关、本单位或者本系统的商用密码应用和安全保障工作。\n密码管理部门会同有关部门加强商用密码应用信息收集、风险评估、信息通报和重大事项会商，并加强与网络安全监测预警和信息通报的衔接。"},{"t":"a","x":"第三十八条 法律、行政法规和国家有关规定要求使用商用密码进行保护的关键信息基础设施，其运营者应当使用商用密码进行保护，制定商用密码应用方案，配备必要的资金和专业人员，同步规划、同步建设、同步运行商用密码保障系统，自行或者委托商用密码检测机构开展商用密码应用安全性评估。\n前款所列关键信息基础设施通过商用密码应用安全性评估方可投入运行，运行后每年至少进行一次评估，评估情况按照国家有关规定报送国家密码管理部门或者关键信息基础设施所在地省、自治区、直辖市密码管理部门备案。"},{"t":"a","x":"第三十九条 法律、行政法规和国家有关规定要求使用商用密码进行保护的关键信息基础设施，使用的商用密码产品、服务应当经检测认证合格，使用的密码算法、密码协议、密钥管理机制等商用密码技术应当通过国家密码管理部门审查鉴定。"},{"t":"a","x":"第四十条 关键信息基础设施的运营者采购涉及商用密码的网络产品和服务，可能影响国家安全的，应当依法通过国家网信部门会同国家密码管理部门等有关部门组织的国家安全审查。"},{"t":"a","x":"第四十一条 网络运营者应当按照国家网络安全等级保护制度要求，使用商用密码保护网络安全。国家密码管理部门根据网络的安全保护等级，确定商用密码的使用、管理和应用安全性评估要求，制定网络安全等级保护密码标准规范。"},{"t":"a","x":"第四十二条 商用密码应用安全性评估、关键信息基础设施安全检测评估、网络安全等级测评应当加强衔接，避免重复评估、测评。"},{"t":"h","x":"第七章 监督管理"},{"t":"a","x":"第四十三条 密码管理部门依法组织对商用密码活动进行监督检查，对国家机关和涉及商用密码工作的单位的商用密码相关工作进行指导和监督。"},{"t":"a","x":"第四十四条 密码管理部门和有关部门建立商用密码监督管理协作机制，加强商用密码监督、检查、指导等工作的协调配合。"},{"t":"a","x":"第四十五条 密码管理部门和有关部门依法开展商用密码监督检查，可以行使下列职权：\n（一）进入商用密码活动场所实施现场检查；\n（二）向当事人的法定代表人、主要负责人和其他有关人员调查、了解有关情况；\n（三）查阅、复制有关合同、票据、账簿以及其他有关资料。"},{"t":"a","x":"第四十六条 密码管理部门和有关部门推进商用密码监督管理与社会信用体系相衔接，依法建立推行商用密码经营主体信用记录、信用分级分类监管、失信惩戒以及信用修复等机制。"},{"t":"a","x":"第四十七条 商用密码检测、认证机构和电子政务电子认证服务机构及其工作人员，应当对其在商用密码活动中所知悉的国家秘密和商业秘密承担保密义务。\n密码管理部门和有关部门及其工作人员不得要求商用密码科研、生产、销售、服务、进出口等单位和商用密码检测、认证机构向其披露源代码等密码相关专有信息，并对其在履行职责中知悉的商业秘密和个人隐私严格保密，不得泄露或者非法向他人提供。"},{"t":"a","x":"第四十八条 密码管理部门和有关部门依法开展商用密码监督管理，相关单位和人员应当予以配合，任何单位和个人不得非法干预和阻挠。"},{"t":"a","x":"第四十九条 任何单位或者个人有权向密码管理部门和有关部门举报违反本条例的行为。密码管理部门和有关部门接到举报，应当及时核实、处理，并为举报人保密。"},{"t":"h","x":"第八章 法律责任"},{"t":"a","x":"第五十条 违反本条例规定，未经认定向社会开展商用密码检测活动，或者未经认定从事电子政务电子认证服务的，由密码管理部门责令改正或者停止违法行为，给予警告，没收违法产品和违法所得；违法所得30万元以上的，可以并处违法所得1倍以上3倍以下罚款；没有违法所得或者违法所得不足30万元的，可以并处10万元以上30万元以下罚款。\n违反本条例规定，未经批准从事商用密码认证活动的，由市场监督管理部门会同密码管理部门依照前款规定予以处罚。"},{"t":"a","x":"第五十一条 商用密码检测机构开展商用密码检测，有下列情形之一的，由密码管理部门责令改正或者停止违法行为，给予警告，没收违法所得；违法所得30万元以上的，可以并处违法所得1倍以上3倍以下罚款；没有违法所得或者违法所得不足30万元的，可以并处10万元以上30万元以下罚款；情节严重的，依法吊销商用密码检测机构资质：\n（一）超出批准范围；\n（二）存在影响检测独立、公正、诚信的行为；\n（三）出具的检测数据、结果虚假或者失实；\n（四）拒不报送或者不如实报送实施情况；\n（五）未履行保密义务；\n（六）其他违反法律、行政法规和商用密码检测技术规范、规则开展商用密码检测的情形。"},{"t":"a","x":"第五十二条 商用密码认证机构开展商用密码认证，有下列情形之一的，由市场监督管理部门会同密码管理部门责令改正或者停止违法行为，给予警告，没收违法所得；违法所得30万元以上的，可以并处违法所得1倍以上3倍以下罚款；没有违法所得或者违法所得不足30万元的，可以并处10万元以上30万元以下罚款；情节严重的，依法吊销商用密码认证机构资质：\n（一）超出批准范围；\n（二）存在影响认证独立、公正、诚信的行为；\n（三）出具的认证结论虚假或者失实；\n（四）未对其认证的商用密码产品、服务、管理体系实施有效的跟踪调查；\n（五）未履行保密义务；\n（六）其他违反法律、行政法规和商用密码认证技术规范、规则开展商用密码认证的情形。"},{"t":"a","x":"第五十三条 违反本条例第二十条、第二十一条规定，销售或者提供未经检测认证或者检测认证不合格的商用密码产品，或者提供未经认证或者认证不合格的商用密码服务的，由市场监督管理部门会同密码管理部门责令改正或者停止违法行为，给予警告，没收违法产品和违法所得；违法所得10万元以上的，可以并处违法所得1倍以上3倍以下罚款；没有违法所得或者违法所得不足10万元的，可以并处3万元以上10万元以下罚款。"},{"t":"a","x":"第五十四条 电子认证服务机构违反法律、行政法规和电子认证服务密码使用技术规范、规则使用密码的，由密码管理部门责令改正或者停止违法行为，给予警告，没收违法所得；违法所得30万元以上的，可以并处违法所得1倍以上3倍以下罚款；没有违法所得或者违法所得不足30万元的，可以并处10万元以上30万元以下罚款；情节严重的，依法吊销电子认证服务使用密码的证明文件。"},{"t":"a","x":"第五十五条 电子政务电子认证服务机构开展电子政务电子认证服务，有下列情形之一的，由密码管理部门责令改正或者停止违法行为，给予警告，没收违法所得；违法所得30万元以上的，可以并处违法所得1倍以上3倍以下罚款；没有违法所得或者违法所得不足30万元的，可以并处10万元以上30万元以下罚款；情节严重的，责令停业整顿，直至吊销电子政务电子认证服务机构资质：\n（一）超出批准范围；\n（二）拒不报送或者不如实报送实施情况；\n（三）未履行保密义务；\n（四）其他违反法律、行政法规和电子政务电子认证服务技术规范、规则提供电子政务电子认证服务的情形。"},{"t":"a","x":"第五十六条 电子签名人或者电子签名依赖方因依据电子政务电子认证服务机构提供的电子签名认证服务在政务活动中遭受损失，电子政务电子认证服务机构不能证明自己无过错的，承担赔偿责任。"},{"t":"a","x":"第五十七条 政务活动中电子签名、电子印章、电子证照等涉及的电子认证服务，违反本条例第三十条规定，未由依法设立的电子政务电子认证服务机构提供的，由密码管理部门责令改正，给予警告；拒不改正或者有其他严重情节的，由密码管理部门建议有关国家机关、单位对直接负责的主管人员和其他直接责任人员依法给予处分或者处理。有关国家机关、单位应当将处分或者处理情况书面告知密码管理部门。"},{"t":"a","x":"第五十八条 违反本条例规定进出口商用密码的，由国务院商务主管部门或者海关依法予以处罚。"},{"t":"a","x":"第五十九条 窃取他人加密保护的信息，非法侵入他人的商用密码保障系统，或者利用商用密码从事危害国家安全、社会公共利益、他人合法权益等违法活动的，由有关部门依照《中华人民共和国网络安全法》和其他有关法律、行政法规的规定追究法律责任。"},{"t":"a","x":"第六十条 关键信息基础设施的运营者违反本条例第三十八条、第三十九条规定，未按照要求使用商用密码，或者未按照要求开展商用密码应用安全性评估的，由密码管理部门责令改正，给予警告；拒不改正或者有其他严重情节的，处10万元以上100万元以下罚款，对直接负责的主管人员处1万元以上10万元以下罚款。"},{"t":"a","x":"第六十一条 关键信息基础设施的运营者违反本条例第四十条规定，使用未经安全审查或者安全审查未通过的涉及商用密码的网络产品或者服务的，由有关主管部门责令停止使用，处采购金额1倍以上10倍以下罚款；对直接负责的主管人员和其他直接责任人员处1万元以上10万元以下罚款。"},{"t":"a","x":"第六十二条 网络运营者违反本条例第四十一条规定，未按照国家网络安全等级保护制度要求使用商用密码保护网络安全的，由密码管理部门责令改正，给予警告；拒不改正或者导致危害网络安全等后果的，处1万元以上10万元以下罚款，对直接负责的主管人员处5000元以上5万元以下罚款。"},{"t":"a","x":"第六十三条 无正当理由拒不接受、不配合或者干预、阻挠密码管理部门、有关部门的商用密码监督管理的，由密码管理部门、有关部门责令改正，给予警告；拒不改正或者有其他严重情节的，处5万元以上50万元以下罚款，对直接负责的主管人员和其他直接责任人员处1万元以上10万元以下罚款；情节特别严重的，责令停业整顿，直至吊销商用密码许可证件。"},{"t":"a","x":"第六十四条 国家机关有本条例第六十条、第六十一条、第六十二条、第六十三条所列违法情形的，由密码管理部门、有关部门责令改正，给予警告；拒不改正或者有其他严重情节的，由密码管理部门、有关部门建议有关国家机关对直接负责的主管人员和其他直接责任人员依法给予处分或者处理。有关国家机关应当将处分或者处理情况书面告知密码管理部门、有关部门。"},{"t":"a","x":"第六十五条 密码管理部门和有关部门的工作人员在商用密码工作中滥用职权、玩忽职守、徇私舞弊，或者泄露、非法向他人提供在履行职责中知悉的商业秘密、个人隐私、举报人信息的，依法给予处分。"},{"t":"a","x":"第六十六条 违反本条例规定，构成犯罪的，依法追究刑事责任；给他人造成损害的，依法承担民事责任。"},{"t":"h","x":"第九章 附 则"},{"t":"a","x":"第六十七条 本条例自2023年7月1日起施行。"}]},{"title":"网络安全审查办法","source":"国家密码管理局","date":"国家网信办等13部门令第8号，2022年2月15日起施行","url":"https://www.oscca.gov.cn/sca/xxgk/2022-01/04/content_1060954.shtml","arts":[{"t":"a","x":"第一条 为了确保关键信息基础设施供应链安全，保障网络安全和数据安全，维护国家安全，根据《中华人民共和国国家安全法》、《中华人民共和国网络安全法》、《中华人民共和国数据安全法》、《关键信息基础设施安全保护条例》，制定本办法。"},{"t":"a","x":"第二条 关键信息基础设施运营者采购网络产品和服务，网络平台运营者开展数据处理活动，影响或者可能影响国家安全的，应当按照本办法进行网络安全审查。\n前款规定的关键信息基础设施运营者、网络平台运营者统称为当事人。"},{"t":"a","x":"第三条 网络安全审查坚持防范网络安全风险与促进先进技术应用相结合、过程公正透明与知识产权保护相结合、事前审查与持续监管相结合、企业承诺与社会监督相结合，从产品和服务以及数据处理活动安全性、可能带来的国家安全风险等方面进行审查。"},{"t":"a","x":"第四条 在中央网络安全和信息化委员会领导下，国家互联网信息办公室会同中华人民共和国国家发展和改革委员会、中华人民共和国工业和信息化部、中华人民共和国公安部、中华人民共和国国家安全部、中华人民共和国财政部、中华人民共和国商务部、中国人民银行、国家市场监督管理总局、国家广播电视总局、中国证券监督管理委员会、国家保密局、国家密码管理局建立国家网络安全审查工作机制。\n网络安全审查办公室设在国家互联网信息办公室，负责制定网络安全审查相关制度规范，组织网络安全审查。"},{"t":"a","x":"第五条 关键信息基础设施运营者采购网络产品和服务的，应当预判该产品和服务投入使用后可能带来的国家安全风险。影响或者可能影响国家安全的，应当向网络安全审查办公室申报网络安全审查。\n关键信息基础设施安全保护工作部门可以制定本行业、本领域预判指南。"},{"t":"a","x":"第六条 对于申报网络安全审查的采购活动，关键信息基础设施运营者应当通过采购文件、协议等要求产品和服务提供者配合网络安全审查，包括承诺不利用提供产品和服务的便利条件非法获取用户数据、非法控制和操纵用户设备，无正当理由不中断产品供应或者必要的技术支持服务等。"},{"t":"a","x":"第七条 掌握超过100万用户个人信息的网络平台运营者赴国外上市，必须向网络安全审查办公室申报网络安全审查。"},{"t":"a","x":"第八条 当事人申报网络安全审查，应当提交以下材料：\n（一）申报书；\n（二）关于影响或者可能影响国家安全的分析报告；\n（三）采购文件、协议、拟签订的合同或者拟提交的首次公开募股（IPO）等上市申请文件；\n（四）网络安全审查工作需要的其他材料。"},{"t":"a","x":"第九条 网络安全审查办公室应当自收到符合本办法第八条规定的审查申报材料起10个工作日内，确定是否需要审查并书面通知当事人。"},{"t":"a","x":"第十条 网络安全审查重点评估相关对象或者情形的以下国家安全风险因素：\n（一）产品和服务使用后带来的关键信息基础设施被非法控制、遭受干扰或者破坏的风险；\n（二）产品和服务供应中断对关键信息基础设施业务连续性的危害；\n（三）产品和服务的安全性、开放性、透明性、来源的多样性，供应渠道的可靠性以及因为政治、外交、贸易等因素导致供应中断的风险；\n（四）产品和服务提供者遵守中国法律、行政法规、部门规章情况；\n（五）核心数据、重要数据或者大量个人信息被窃取、泄露、毁损以及非法利用、非法出境的风险；\n（六）上市存在关键信息基础设施、核心数据、重要数据或者大量个人信息被外国政府影响、控制、恶意利用的风险，以及网络信息安全风险；\n（七）其他可能危害关键信息基础设施安全、网络安全和数据安全的因素。"},{"t":"a","x":"第十一条 网络安全审查办公室认为需要开展网络安全审查的，应当自向当事人发出书面通知之日起30个工作日内完成初步审查，包括形成审查结论建议和将审查结论建议发送网络安全审查工作机制成员单位、相关部门征求意见；情况复杂的，可以延长15个工作日。"},{"t":"a","x":"第十二条 网络安全审查工作机制成员单位和相关部门应当自收到审查结论建议之日起15个工作日内书面回复意见。\n网络安全审查工作机制成员单位、相关部门意见一致的，网络安全审查办公室以书面形式将审查结论通知当事人；意见不一致的，按照特别审查程序处理，并通知当事人。"},{"t":"a","x":"第十三条 按照特别审查程序处理的，网络安全审查办公室应当听取相关单位和部门意见，进行深入分析评估，再次形成审查结论建议，并征求网络安全审查工作机制成员单位和相关部门意见，按程序报中央网络安全和信息化委员会批准后，形成审查结论并书面通知当事人。"},{"t":"a","x":"第十四条 特别审查程序一般应当在90个工作日内完成，情况复杂的可以延长。"},{"t":"a","x":"第十五条 网络安全审查办公室要求提供补充材料的，当事人、产品和服务提供者应当予以配合。提交补充材料的时间不计入审查时间。"},{"t":"a","x":"第十六条 网络安全审查工作机制成员单位认为影响或者可能影响国家安全的网络产品和服务以及数据处理活动，由网络安全审查办公室按程序报中央网络安全和信息化委员会批准后，依照本办法的规定进行审查。\n为了防范风险，当事人应当在审查期间按照网络安全审查要求采取预防和消减风险的措施。"},{"t":"a","x":"第十七条 参与网络安全审查的相关机构和人员应当严格保护知识产权，对在审查工作中知悉的商业秘密、个人信息，当事人、产品和服务提供者提交的未公开材料，以及其他未公开信息承担保密义务；未经信息提供方同意，不得向无关方披露或者用于审查以外的目的。"},{"t":"a","x":"第十八条 当事人或者网络产品和服务提供者认为审查人员有失客观公正，或者未能对审查工作中知悉的信息承担保密义务的，可以向网络安全审查办公室或者有关部门举报。"},{"t":"a","x":"第十九条 当事人应当督促产品和服务提供者履行网络安全审查中作出的承诺。\n网络安全审查办公室通过接受举报等形式加强事前事中事后监督。"},{"t":"a","x":"第二十条 当事人违反本办法规定的，依照《中华人民共和国网络安全法》、《中华人民共和国数据安全法》的规定处理。"},{"t":"a","x":"第二十一条 本办法所称网络产品和服务主要指核心网络设备、重要通信产品、高性能计算机和服务器、大容量存储设备、大型数据库和应用软件、网络安全设备、云计算服务，以及其他对关键信息基础设施安全、网络安全和数据安全有重要影响的网络产品和服务。"},{"t":"a","x":"第二十二条 涉及国家秘密信息的，依照国家有关保密规定执行。\n国家对数据安全审查、外商投资安全审查另有规定的，应当同时符合其规定。"},{"t":"a","x":"第二十三条 本办法自2022年2月15日起施行。2020年4月13日公布的《网络安全审查办法》（国家互联网信息办公室、国家发展和改革委员会、工业和信息化部、公安部、国家安全部、财政部、商务部、中国人民银行、国家市场监督管理总局、国家广播电视总局、国家保密局、国家密码管理局令第6号）同时废止。"}]},{"title":"商用密码检测机构管理办法","source":"国家密码管理局","date":"国家密码管理局令第2号，2023年11月1日起施行","url":"https://www.oscca.gov.cn/sca/xxgk/2023-10/07/content_1061108.shtml","arts":[{"t":"a","x":"第一条 为了加强商用密码检测机构管理，规范商用密码检测活动，根据《中华人民共和国密码法》、《商用密码管理条例》等有关法律法规，制定本办法。"},{"t":"a","x":"第二条 商用密码检测机构的资质认定和监督管理适用本办法。"},{"t":"a","x":"第三条 从事商用密码产品检测、网络与信息系统商用密码应用安全性评估等商用密码检测活动，向社会出具具有证明作用的数据、结果的机构，应当经国家密码管理局认定，依法取得商用密码检测机构资质。"},{"t":"a","x":"第四条 国家密码管理局负责全国商用密码检测机构的资质认定和监督管理。县级以上地方各级密码管理部门负责本行政区域内商用密码检测机构的监督管理。"},{"t":"a","x":"第五条 商用密码检测机构应当在资质认定业务范围内从事商用密码检测活动。国家密码管理局制定并公布商用密码检测机构资质认定基本规范和商用密码检测机构资质认定业务范围。"},{"t":"a","x":"第六条 取得商用密码检测机构资质，应当符合下列条件：\n（一）具有法人资格；\n（二）具有与从事商用密码检测活动相适应的资金；\n（三）成立2年以上，从事网络安全检测评估领域相关工作1年以上，无重大违法或者不良信用记录；\n（四）具有与从事商用密码检测活动相适应的场所；\n（五）具有与从事商用密码检测活动相适应的设备设施；\n（六）具有保证商用密码检测活动独立、公正、科学、诚信的管理体系；\n（七）具有与从事商用密码检测活动相适应的专业人员；\n（八）具有与从事商用密码检测活动相适应的专业能力。\n外商投资企业法人申请商用密码检测机构资质，除符合上述条件外，还应当符合我国外商投资有关法律法规的规定。"},{"t":"a","x":"第七条 申请商用密码检测机构资质，应当向国家密码管理局提出书面申请，向国家密码管理局委托进行受理的省、自治区、直辖市密码管理部门提交《商用密码检测机构资质申请表》及以下材料，并对其真实性负责：\n（一）法人资格证书；\n（二）资本结构和股权情况；\n（三）无重大违法或者不良信用记录、不从事可能影响商用密码检测公平公正性活动的承诺；\n（四）工作场所等固定资产产权证书或者租赁合同；\n（五）工作环境和设备设施配置情况；\n（六）项目管理、质量管理、人员管理、档案管理、安全保密管理等管理体系建立情况；\n（七）法定代表人、最高管理者、技术负责人、质量负责人、授权签字人以及专业人员情况；\n（八）申请人认为需要补充的其他材料。\n受国家密码管理局委托进行受理的省、自治区、直辖市密码管理部门自收到申请材料之日起5个工作日内，对申请材料进行形式审查，根据下列情况分别作出处理：申请材料内容齐全、符合规定形式的，应当受理行政许可申请并出具受理通知书；申请材料内容不齐全或者不符合规定形式的，应当当场或者在5个工作日内一次性告知申请人需要补正的全部材料；不予受理的，应当出具不予受理通知书并说明理由。"},{"t":"a","x":"第八条 国家密码管理局应当自行政许可申请受理之日起20个工作日内，依据商用密码检测机构资质认定基本规范的要求，对申请进行审查，并依法作出是否准予许可的书面决定。\n需要对申请人进行技术评审的，技术评审所需时间不计算在本条规定的期限内。国家密码管理局应当将所需时间书面告知申请人。"},{"t":"a","x":"第九条 国家密码管理局根据技术评审需要和专业要求，可以委托专业技术评价机构实施技术评审。\n技术评审包括专业人员能力考核，场所、设备设施、管理体系建设实地查勘，检测能力考核等。\n专业技术评价机构应当严格按照商用密码检测机构资质认定基本规范开展技术评审活动，对技术评审结论的真实性、符合性负责，并承担相应法律责任。国家密码管理局应当对技术评审活动进行监督，建立责任追究机制。"},{"t":"a","x":"第十条 申请人有下列情形之一的，国家密码管理局应当终止审查：\n（一）隐瞒有关情况或者提供虚假材料的；\n（二）采取贿赂、请托等不正当手段，影响审查工作公平公正进行的；\n（三）无正当理由拒绝接受审查的；\n（四）违反商用密码检测机构从业要求的。"},{"t":"a","x":"第十一条 准予许可的，国家密码管理局向申请人颁发《商用密码检测机构资质证书》，并公布取得资质证书的商用密码检测机构名录。\n有下列情形之一的，国家密码管理局应当出具不予行政许可决定书，说明理由并告知申请人相关权利：\n（一）终止审查的；\n（二）审查不合格的；\n（三）法律法规规定的不予许可的其他情形。"},{"t":"a","x":"第十二条 《商用密码检测机构资质证书》有效期5年，内容包括：获证机构名称、统一社会信用代码、注册地址、证书编号、有效期限、资质认定业务范围、发证机关和发证日期。\n《商用密码检测机构资质证书》有效期届满需要延续的，应当在有效期届满3个月前向国家密码管理局提出书面申请。国家密码管理局根据申请人的实际情况，采取书面或者现场形式开展审查，在《商用密码检测机构资质证书》有效期届满前作出是否准予延续的决定。\n禁止转让、出租、出借、伪造、变造、冒用、租借《商用密码检测机构资质证书》。"},{"t":"a","x":"第十三条 有下列情形之一的，商用密码检测机构应当自变更之日起30日内向国家密码管理局申请办理变更手续：\n（一）机构名称、注册地址、法人性质发生变更的；\n（二）法定代表人、最高管理者、技术负责人、质量负责人、授权签字人发生变更的；\n（三）资质认定业务范围发生变更的；\n（四）依法需要办理变更的其他事项。\n商用密码检测机构发生变更的事项影响其符合资质认定条件和要求的，国家密码管理局根据申请人的实际情况，采取书面或者现场形式开展审查。需要进行技术评审的，依照本办法第九条规定对其开展技术评审。"},{"t":"a","x":"第十四条 商用密码检测机构有下列情形之一的，国家密码管理局应当依法注销其商用密码检测机构资质：\n（一）《商用密码检测机构资质证书》有效期届满，未申请延续或者依法不予延续批准的；\n（二）申请注销商用密码检测机构资质的；\n（三）被依法撤销、吊销商用密码检测机构资质的；\n（四）依法终止的；\n（五）因法人性质变更、改制、分立或者合并等原因发生变化，或者发生其他影响其符合资质认定条件和要求的变更事项，经审查发现不符合资质认定条件和要求的；\n（六）资质认定业务范围被全部取消的；\n（七）法律法规规定的应当注销商用密码检测机构资质的其他情形。"},{"t":"a","x":"第十五条 商用密码检测机构及相关从业人员应当按照法律、行政法规和商用密码检测技术规范、规则，在批准范围内独立、公正、科学、诚信地开展商用密码检测，对出具的检测数据、结果负责，尊重知识产权，恪守职业道德，承担社会责任，保守在工作中知悉的国家秘密、商业秘密和个人隐私。"},{"t":"a","x":"第十六条 商用密码检测机构应当保证其基本条件和技术能力能够持续符合资质认定条件和要求，并确保管理体系有效运行。"},{"t":"a","x":"第十七条 商用密码检测机构应当遵守以下从业要求：\n（一）加强对本机构人员的监督管理，经常性组织开展安全保密教育和业务培训；本机构从事检测活动的专业人员每年接受商用密码教育培训的时长不得少于40学时，相关情况应当记录留存；\n（二）本机构及关联方不得从事商用密码产品生产、销售（检测工具除外），信息系统或者商用密码保障系统集成、运营，电子认证服务，电子政务电子认证服务，或者其他可能影响商用密码检测公平公正性的活动；\n（三）不得同时聘用正在其他商用密码检测机构从业的人员，或者存在其他恶意竞争、扰乱市场秩序的情形；\n（四）不得以单独出租设备设施或者委派人员等方式承担业务，所承担的业务不得分包、转包；\n（五）不得以任何方式推荐或者限定被检测单位购买使用特定主体生产或者提供的商用密码产品或者服务；\n（六）独立于出具的检测数据、结果、报告所涉及的利益相关各方，不受任何可能干扰技术判断因素的影响；\n（七）使用符合国家密码管理要求的设备设施；\n（八）法律法规和国家有关规定提出的其他从业要求。"},{"t":"a","x":"第十八条 商用密码检测机构出具的检测报告，应当符合相关国家标准、行业标准和有关规定的要求，保证内容真实、客观、准确、完整。商用密码检测机构对其出具的检测报告负责，并承担相应的法律责任。\n商用密码检测机构应当指定授权签字人在其业务能力范围内签字确认本机构出具的检测报告，并加盖机构公章或者专用章。授权签字人应当系统掌握商用密码管理政策和专业知识，具备密码或者网络安全领域高级技术职称或者同等专业水平。"},{"t":"a","x":"第十九条 商用密码检测机构应当对检测原始记录和检测报告归档留存，保证其具有可追溯性。检测原始记录和检测报告的保存期限不得少于6年。\n从事商用密码产品检测的商用密码检测机构应当按照相关标准规范的要求，对检测样品和相关数据信息进行妥善管理。商用密码检测机构资质被注销的，应当对检测样品和相关数据信息进行妥善处理。"},{"t":"a","x":"第二十条 商用密码检测机构应当于每年1月15日前通过所在地省、自治区、直辖市密码管理部门向国家密码管理局报送上一年度工作报告以及相关统计数据，包括持续符合资质认定条件和要求、遵守从业规范、开展检测活动、实施标准等情况。"},{"t":"a","x":"第二十一条 商用密码检测机构不得有以下出具虚假或者失实检测数据、结果、报告的行为：\n（一）未经检测，直接出具检测数据、结果、报告的；\n（二）篡改、编造原始数据、记录，出具检测数据、结果、报告的；\n（三）伪造检测报告和原始记录签名，或者非授权签字人签发检测报告的；\n（四）漏检关键项目、干扰检测过程或者改动关键项目的检测方法，造成检测数据、结果、报告失实的；\n（五）其他出具虚假或者失实检测数据、结果、报告的行为。"},{"t":"a","x":"第二十二条 密码管理部门对商用密码检测机构依法开展监督检查，可以行使下列职权：\n（一）进入检测活动场所实施现场检查；\n（二）向商用密码检测机构、委托人等有关单位及人员调查、了解有关情况或者验证相关检测活动；\n（三）查阅、复制有关合同、票据、账簿以及检测活动中形成的检测数据、结果、报告等有关材料。\n国家密码管理局根据工作需要，可以行使下列职权：\n（一）组织商用密码检测机构检测能力验证；\n（二）对商用密码检测机构出具的检测数据、结果、报告等有关材料进行抽样检查。\n密码管理部门和有关部门及其工作人员不得要求商用密码科研、生产、销售、服务、进出口等单位和商用密码检测、认证机构向其披露源代码等密码相关专有信息，并对其在履行职责中知悉的商业秘密和个人隐私严格保密，不得泄露或者非法向他人提供。"},{"t":"a","x":"第二十三条 商用密码检测机构应当积极配合密码管理部门的监督检查，按照要求参加检测能力验证和抽样检查，并如实提供相关材料和信息。检测能力验证或者抽样检查结果不合格的，应当开展为期不少于6个月的整改，整改期间不得开展相应业务范围的商用密码检测活动。商用密码检测机构整改结束后，应当经国家密码管理局组织验收合格，方可恢复开展相应业务范围的商用密码检测活动；经整改仍不能满足相应业务范围的资质认定条件和要求的，取消其相应业务范围的资质认定，直至注销其商用密码检测机构资质。"},{"t":"a","x":"第二十四条 以欺骗、贿赂等不正当手段取得商用密码检测机构资质的，国家密码管理局应当依法撤销商用密码检测机构资质。该机构在3年内不得再次申请商用密码检测机构资质。\n申请商用密码检测机构资质时隐瞒有关情况或者提供虚假材料的，国家密码管理局不予受理或者不予许可。该机构在1年内不得再次申请商用密码检测机构资质。"},{"t":"a","x":"第二十五条 商用密码检测机构违反《中华人民共和国密码法》、《商用密码管理条例》和本办法规定，有下列情形之一的，由密码管理部门责令改正或者停止违法行为，给予警告，没收违法所得；违法所得30万元以上的，可以并处违法所得1倍以上3倍以下罚款；没有违法所得或者违法所得不足30万元的，可以并处10万元以上30万元以下罚款；情节严重的，由国家密码管理局吊销其商用密码检测机构资质：\n（一）超出批准范围开展商用密码检测的；\n（二）转让、出租、出借、伪造、变造、冒用、租借《商用密码检测机构资质证书》的；\n（三）本机构及关联方从事商用密码产品生产、销售（检测工具除外），信息系统或者商用密码保障系统集成、运营，电子认证服务，电子政务电子认证服务，或者其他可能影响商用密码检测公平公正性的活动的；\n（四）同时聘用正在其他商用密码检测机构从业的人员或者存在其他恶意竞争、扰乱市场秩序情形的；\n（五）以单独出租设备设施或者委派人员等方式承担业务，或者分包、转包所承担业务的；\n（六）推荐或者限定被检测单位购买使用特定主体生产或者提供的商用密码产品或者服务的；\n（七）违反法律、行政法规和商用密码检测技术规范、规则要求开展检测活动或者存在其他影响检测独立、公正、科学、诚信的行为的；\n（八）出具的检测数据、结果、报告虚假或者失实的；\n（九）未按照要求如实报送年度工作报告以及相关统计数据的；\n（十）泄露在工作中知悉的商业秘密、个人隐私的。"},{"t":"a","x":"第二十六条 商用密码检测机构违反本办法规定，有下列情形之一的，由密码管理部门责令改正；逾期未改正或者改正后仍不符合要求的，处1万元以上10万元以下罚款：\n（一）未按照要求申请办理变更手续的；\n（二）未按照要求开展安全保密教育和业务培训的；\n（三）使用不符合国家密码管理要求的设备设施的；\n（四）出具未经授权签字人签字确认的检测报告，授权签字人超出其业务能力范围签发检测报告，或者未在检测报告上加盖机构公章或者专用章的；\n（五）未按照要求保存检测原始记录和检测报告，或者未按照要求妥善管理检测样品和相关数据信息的。"},{"t":"a","x":"第二十七条 县级以上地方各级密码管理部门应当依法公开监督检查结果，将商用密码检测机构受到的行政处罚等信息纳入国家企业信用信息公示系统等平台，并定期将年度商用密码检测机构监督检查结果等信息逐级报至国家密码管理局。"},{"t":"a","x":"第二十八条 从事商用密码检测机构监督管理工作的人员滥用职权、玩忽职守、徇私舞弊，或者泄露、非法向他人提供在履行职责中知悉的商业秘密、个人隐私、举报人信息的，依法给予处分。"},{"t":"a","x":"第二十九条 本办法自2023年11月1日起施行。"}]},{"title":"商用密码应用安全性评估管理办法","source":"国家密码管理局","date":"国家密码管理局令第3号，2023年11月1日起施行","url":"https://www.oscca.gov.cn/sca/xxgk/2023-10/07/content_1061109.shtml","arts":[{"t":"a","x":"第一条 为了规范商用密码应用安全性评估工作，保障网络与信息安全，维护国家安全和社会公共利益，保护公民、法人和其他组织的合法权益，根据《中华人民共和国密码法》、《商用密码管理条例》等有关法律法规，制定本办法。"},{"t":"a","x":"第二条 本办法所称商用密码应用安全性评估，是指按照有关法律法规和标准规范，对网络与信息系统使用商用密码技术、产品和服务的合规性、正确性、有效性进行检测分析和评估验证的活动。"},{"t":"a","x":"第三条 国家密码管理局负责管理全国的商用密码应用安全性评估工作。县级以上地方各级密码管理部门负责管理本行政区域的商用密码应用安全性评估工作。\n国家机关和涉及商用密码工作的单位在其职责范围内负责指导、监督本机关、本单位或者本系统的商用密码应用安全性评估工作。"},{"t":"a","x":"第四条 从事商用密码应用安全性评估活动，向社会出具具有证明作用的商用密码应用安全性评估数据、结果
